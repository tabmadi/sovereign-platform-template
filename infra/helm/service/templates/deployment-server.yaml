{{- if .Values.server.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "service.fullname" . }}-server
  labels: {{- include "service.labels" . | nindent 4 }}
    component: server
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels: {{- include "service.selector" . | nindent 6 }}
      component: server
  template:
    metadata:
      labels: {{- include "service.selector" . | nindent 8 }}
        component: server
    spec:
      {{- with .Values.imagePullSecrets }}
      # The registry authenticates every pull, per ADR-0105, and a kubelet holds no credential of its own.
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "service.fullname" . }}
      # ADR-0204 eviction order. It is set explicitly and not inherited, because the
      # PriorityClass globalDefault is platform-critical. Product workloads must sit BELOW
      # the platform they depend on, so this is the one place that opts down.
      priorityClassName: {{ .Values.priorityClassName }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.migrations.enabled }}
      initContainers:
        # dbmate runs from the service image itself. The image carries the static dbmate
        # binary and the baked `/db/migrations`: see the service Dockerfile. `migrate`,
        # not `up`, skips DB creation, because CNPG provisions the databases, per ADR-0300.
        - name: migrations
          image: {{ include "service.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command: ["/usr/local/bin/dbmate", "--no-dump-schema", "--migrations-dir", "/db/migrations", "migrate"]
          {{- with .Values.secrets.envFrom }}
          envFrom:
            {{- range . }}
            - secretRef: { name: {{ . }} }
            {{- end }}
          {{- end }}
      {{- end }}
      containers:
        - name: server
          image: {{ include "service.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - { name: http,  containerPort: {{ .Values.server.port }} }
            {{- if .Values.server.adminPort }}
            - { name: admin, containerPort: {{ .Values.server.adminPort }} }
            {{- end }}
          env:
            {{- include "service.otelEnv" . | nindent 12 }}
            {{- range $k, $v := .Values.env }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
          {{- with .Values.secrets.envFrom }}
          envFrom:
            {{- range . }}
            - secretRef: { name: {{ . }} }
            {{- end }}
          {{- end }}
          # Readiness is deep and pings the dependencies. It gates Service traffic without a restart. Liveness is shallow and
          # checks only that the process is alive. It never depends on dependencies, per ADR-0500.
          readinessProbe: {{- toYaml .Values.server.probes.readiness | nindent 12 }}
          livenessProbe: {{- toYaml .Values.server.probes.liveness | nindent 12 }}
          resources: {{- toYaml .Values.server.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- range .Values.secrets.files }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
              readOnly: true
            {{- end }}
      volumes:
        - { name: tmp, emptyDir: {} }
        {{- range .Values.secrets.files }}
        - name: {{ .name }}
          secret: { secretName: {{ .name }} }
        {{- end }}
{{- end }}
