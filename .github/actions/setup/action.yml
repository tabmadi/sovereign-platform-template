# The shared toolchain setup for every workflow: mise with its tool cache, and optionally the Go build and module cache.
#
# A composite action, not a `workflow_call` workflow. A called workflow runs as its own job, so the caller's later steps cannot see its toolchain.
# Checkout stays in the caller: the runner needs the repo on disk to resolve this action, and fetch-depth differs for each workflow.
name: setup
description: Install the mise toolchain, and optionally the Go build cache.

inputs:
  go-cache:
    description: Restore and save the shared Go build and module cache.
    default: "false"

runs:
  using: composite
  steps:
    # mise reads every other pin in the repo. An unpinned mise lets a cold runner fail on a commit that changed nothing.
    # Renovate's custom manager in .github/renovate.json bumps it, through the marker comment.
    - uses: jdx/mise-action@v2
      with:
        # renovate: datasource=github-releases depName=jdx/mise
        version: 2026.8.5
        install: true
        cache: true

    # One key for ci.yml's test and build jobs, so they share one cache entry of the same compiled packages.
    - if: inputs.go-cache == 'true'
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
