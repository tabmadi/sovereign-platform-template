# Values namespaced under `maddy:` so this chart shares the platform ApplicationSet's single per-env values
# overlay without key collisions.
maddy:
  # maddy — the outbound mail submission endpoint (ADR-0307).
  enabled: false

  image:
    repository: foxcpp/maddy
    tag: "0.9.5"
    pullPolicy: IfNotPresent

  # The identity platform mail authenticates as.
  hostname: mail.example.com

  dkim:
    # The selector published at `<selector>._domainkey.<hostname>`.
    selector: default
    # The Secret holding the DKIM private key (ADR-0202). Its `private.key` entry is mounted read-only at the path
    # maddy signs with.
    secretName: maddy-dkim

  # The OpenMetrics listener. Cluster-internal only: the network policy admits the
  # node-local collector and nothing else, and the Service does not publish it
  # outside the pod network.
  metrics:
    port: 9749

  submission:
    port: 587
    # The credential Kratos and the services authenticate with. One account, because
    # every sender is first-party and the sender identity that matters is the
    # envelope's, not the SMTP user's.
    secretName: maddy-submission
    username: platform

  persistence:
    # Undelivered mail lives here, and so does the MTA-STS policy cache. A queue on
    # an emptyDir is a queue that loses the messages a receiver asked us to retry.
    size: 2Gi
    storageClassName: ""

  # ADR-0204. Not measured: no environment runs this yet, so these are sized from
  # maddy's own documented footprint for a small deployment rather than derived, and
  # they are the first numbers to re-derive once one does.
  resources:
    requests: { cpu: "25m", memory: "64Mi" }
    limits: { memory: "256Mi" }
