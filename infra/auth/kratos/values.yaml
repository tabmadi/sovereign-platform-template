# The canonical Kratos config, per ADR-0304. It is the single source of truth. It goes into the Ory umbrella chart
# as a Helm values overlay: `-f` in `scripts/cluster.sh` locally, and Argo CD `valueFiles` per environment.
kratos:
  kratos:
    config:
      dsn: "postgres://kratos@postgres-rw.platform.svc.cluster.local:5432/kratos?sslmode=disable"
      identity:
        default_schema_id: user_v1
        schemas:
          - id: user_v1
            # The chart mounts the `identitySchemas` keys directly under `/etc/config`.
            url: file:///etc/config/user.v1.json
      selfservice:
        default_browser_return_url: https://dev.example.com/
        # Kratos rejects any post-flow `return_to` that does not start with an entry here.
        allowed_return_urls:
          - https://dev.example.com/
        flows:
          # There is no local error UI, so Kratos falls back to its hosted error page.
          # Keep the whole self-service flow set pointed at our own routes.
          error:        { ui_url: https://dev.example.com/auth/error }
          login:        { ui_url: https://dev.example.com/auth/login }
          registration:
            ui_url: https://dev.example.com/auth/register
            after:
              # After a registration succeeds, create the identity's personal org, per ADR-0304. This is an east-west call to the
              # `orgs` service inside the cluster, off the edge, per ADR-0306. The handler starts a Temporal dual-write workflow.
              hooks:
                - hook: web_hook
                  config:
                    url: http://orgs-server.platform.svc.cluster.local/identity-created
                    method: POST
                    body: base64://ZnVuY3Rpb24oY3R4KSB7CiAgaWRlbnRpdHlfaWQ6IGN0eC5pZGVudGl0eS5pZCwKICBlbWFpbDogY3R4LmlkZW50aXR5LnRyYWl0cy5lbWFpbCwKfQo=
                    response:
                      ignore: false
                      parse: false
          recovery:
            enabled: true
            use: code              # resists enumeration: it does not show whether an account exists
            ui_url: https://dev.example.com/auth/recovery
          verification:
            enabled: true
            use: code
            ui_url: https://dev.example.com/auth/verification
          settings:
            ui_url: https://dev.example.com/auth/settings
            # Step-up, per ADR-0304: a change to credentials or MFA requires a recent login.
            privileged_session_max_age: 15m
            required_aal: highest_available
        # Authentication methods, per ADR-0304. Password is the first factor. TOTP and WebAuthn passkeys are the operator
        # second factor. `services/authz` enforces AAL2 on the ops tier. It is not forced on B2C product users here.
        methods:
          password:
            enabled: true
            config:
              haveibeenpwned_enabled: false
              min_password_length: 12
              identifier_similarity_check_enabled: true
          totp:
            enabled: true
            config:
              issuer: dev.example.com
          webauthn:
            enabled: true
            config:
              passwordless: false       # second factor, not a passwordless login
              rp:
                id: dev.example.com
                display_name: Platform
                origins: ["https://dev.example.com"]
      session:
        # The absolute lifespan is 7 days. `whoami` returns the highest AAL the identity has configured. So an operator
        # who enrolled MFA must use it, and the ops edge requires `aal2`. B2C users with no second factor stay `aal1`.
        lifespan: 168h
        whoami:
          required_aal: highest_available
        # Scope the session cookie to the parent host, so subdomains share it. An example is `hubble.ops.<host>`, which
        # has its own origin.
        cookie:
          domain: dev.example.com
          same_site: Lax
      # Transactional mail for recovery and verification.
      courier:
        smtp:
          connection_uri: "smtps://smtp.example.com:465?skip_ssl_verify=false"
          # The platform's sender identity. It is a decision, not a default, per ADR-0307. Kratos configures none, so it
          # sends as its upstream default, `no-reply@ory.kratos.sh`. A live message in the sink confirmed this.
          from_address: no-reply@mail.example.com
          from_name: Platform
  # The cookie, cipher, and system secrets and the dsn come from a SOPS-managed Secret, never inline values, per
  # ADR-0202. `secret` is a top-level key of the kratos subchart, next to the `kratos:` config block above. So it
  # sits one level up.
  secret:
    enabled: false
    nameOverride: kratos-secrets
