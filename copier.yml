# The template's own interface, per ADR-0106.
#
# `copier copy` generates a project, and the answers file below tracks this repository after that.
# `copier update` renders a newer commit and 3-way merges it, so a file the project rewrote becomes a conflict.
# There is no compatibility promise. The project resolves the conflict.
#
# Only `*.jinja` files are rendered. Helm charts and Go templates use `{{ }}` too, and Jinja would corrupt them.
# scripts/project-rename.sh renames everything else once, at generation, as literal strings.
_min_copier_version: "9"
_templates_suffix: ".jinja"
_answers_file: .copier-answers.yml

_exclude:
  - ".git"
  - "node_modules"
  - "copier.yml"
  - "*.local.md" # each engineer's working files, per AGENTS.md. A project never inherits them
  - ".idea"
  - ".run"
  - "test-results"
  - "playwright-report"
  - ".rumdl_cache"
  # Only the forge-copy path uses these, per ADR-0106. Copier renames through `_tasks` below and writes the answers file.
  # So a Copier project needs neither the manual script nor the release stamp it reads.
  - "scripts/project-init.sh"
  - ".template-version"
  # The template's own machinery, per ADR-0106: its tasks, its workflow, and the scripts and fixtures they run.
  - "scripts/template-tasks.toml"
  - ".github/workflows/template.yml"
  - "scripts/test-template.sh"
  - "scripts/acceptance.sh"
  - "test/template"

_tasks:
  # Generation only. On an update the project already has its own names, and a second rename rewrites the merge result.
  - command: "bash scripts/project-rename.sh {{ project_slug }} {{ module_path }} {{ apex_host }} {{ image_registry }}"
    when: "{{ _copier_operation == 'copy' }}"
  # A product repository does not keep a script that runs once, because it can still rename the chosen name later.
  # The removal keeps this output identical to the output of `project:init`. The 3-way baseline of `copier update` depends on that.
  - command: "rm -f scripts/project-rename.sh"
    when: "{{ _copier_operation == 'copy' }}"

project_name:
  type: str
  help: "The product's name, as a person writes it"
  default: "Acme Platform"

project_slug:
  type: str
  help: "The project slug, per ADR-0003: 5 to 11 characters, globally unique, no org prefix"
  default: "acmeplat"
  # The ADR-0003 grammar, checked here at generation and later by `lint:naming`.
  # A name is cheapest to fix before it is in a provider console.
  validator: >-
    {% if not (project_slug | regex_search('^[a-z][a-z0-9]*(-[a-z0-9]+)*$')) %}
    a slug is lower-case alphanumeric with single hyphens
    {% elif project_slug | length < 5 or project_slug | length > 11 %}
    a project slug is 5 to 11 characters
    {% endif %}

module_path:
  type: str
  help: "The Go module path: the repository's own import path"
  default: "github.com/acme/{{ project_slug }}"

apex_host:
  type: str
  help: "The apex host that serves the product. The environments are dev., staging., and prod. below it"
  default: "{{ project_slug }}.example"

image_registry:
  type: str
  help: "The registry namespace for published images, per ADR-0105"
  default: "ghcr.io/acme/{{ project_slug }}"
