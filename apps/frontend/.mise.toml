# The Node island, per ADR-0100: `next` and the Turbopack workers are `#!/usr/bin/env node` binaries, and bun spawns node for them.
# It is pinned here and not in the root [tools], where every dev who runs lint or test would install it for nothing.
# The version comes from the root [env] NODE_VERSION.
[tools]
node = "{{env.NODE_VERSION}}"

[tasks.dev]
description = "The root dev:frontend task calls this with `mise run -C apps/frontend dev`, which activates this node."
run = "bun run next dev -H 0.0.0.0"

[tasks.run]
run = "bun run dev"

[tasks.build]
run = "bun run build"

[tasks.lint]
run = "biome ci ."

[tasks.test]
run = "bun run test"
