# A wrapper around the upstream traefik chart, per ADR-0305: the edge controller that every environment runs. kind
# ships no ingress controller, so both local tiers install this chart.
traefik:
  # Platform routes span namespaces. Middlewares live in `platform`, the Hubble UI
  # is in `kube-system`, and Argo CD is in `argocd`. See `infra/gateway`. The upstream
  # default denies cross-namespace IngressRoute references.
  providers:
    kubernetesCRD:
      allowCrossNamespace: true

  # The kube-system default CPU request is far below the edge's measured peak, and the edge is sized first, per ADR-0204.
  # Memory keeps the namespace default.
  resources:
    requests:
      cpu: 200m

  # Local tier: the host reaches the edge at :8443, then the node's 30443 through the extraPortMappings in
  # `infra/local/kind.yaml`, then this NodePort.
  service:
    spec:
      type: NodePort
  ports:
    web:
      nodePort: 30080
    websecure:
      nodePort: 30443
      # An image push is the longest request through this edge: one streamed layer, on one connection, for as long as
      # the client's link needs, per ADR-0105.
      transport:
        respondingTimeouts:
          readTimeout: 10m
          writeTimeout: 10m
          idleTimeout: 3m
