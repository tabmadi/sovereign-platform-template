# The template's own tasks, per ADR-0106. `.mise.toml` includes this file. Copier excludes it, and `project:init` deletes it.

["test:template"]
description = "The repository's own generation, per ADR-0106: a fixture matrix through `copier copy`, the refusals its validators must give, and the equality of the two adoption paths. The merge of `copier update` depends on that equality."
run = "bash scripts/test-template.sh"

[acceptance]
description = "Generate a project from the working tree and prove that it reaches a serving cluster, per ADR-0106. It needs Docker. It runs nightly and on the acceptance label, never in check."
run = "bash scripts/acceptance.sh"

["project:init"]
description = "Adopt this template as a project, in a repository that the forge created from it, per ADR-0106."
run = "bash scripts/project-init.sh"
