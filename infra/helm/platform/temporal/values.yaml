temporal:
  # `restricted`, per ADR-0200.
  shims:
    dockerize: false
    elasticsearchTool: false
  server:
    securityContext:
      runAsNonRoot: true
      seccompProfile: { type: RuntimeDefault }
    # No phone-home.
    additionalEnv:
      - name: TEMPORAL_VERSION_CHECK_DISABLED
        value: "true"
    # Per ADR-0204, sized from a measurement on 2026-07-26 with the ADR-0601 checkout load at 40 VUs. This is the
    # baseline for every role. The per-role blocks below override it where the roles differ, by an order of magnitude.
    resources:
      requests: { cpu: "100m", memory: "192Mi" }
      limits:   { memory: "512Mi" }
    frontend:
      # The container half of `restricted`. It is the same for all four server roles and for web, admintools, and schema
      # below. So it is written once as a YAML anchor and then aliased.
      containerSecurityContext: &restrictedContainer
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      # Every workflow start and query enters here. So the CPU use is bursty, and it
      # has no limit, on purpose, per ADR-0204.
      resources:
        requests: { cpu: "100m", memory: "192Mi" }
        limits:   { memory: "512Mi" }
    history:
      containerSecurityContext: *restrictedContainer
      # The heaviest CPU consumer in the cluster under load, and nearly idle at rest.
      resources:
        requests: { cpu: "500m", memory: "768Mi" }
        limits:   { memory: "1536Mi" }
    matching:
      containerSecurityContext: *restrictedContainer
      # Task-queue dispatch. It is bursty, like frontend.
      resources:
        requests: { cpu: "100m", memory: "192Mi" }
        limits:   { memory: "512Mi" }
    worker:
      containerSecurityContext: *restrictedContainer
      # Temporal's own internal worker, for archival and scanners. It is not a worker of our services.
      resources:
        requests: { cpu: "50m", memory: "192Mi" }
        limits:   { memory: "512Mi" }
    # Never overlap an old pod and a new pod of the same role.
    deploymentStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
    config:
      # The persistence schema of chart 1.x, per `UPGRADING.md`. Stores live under `persistence.datastores.<name>`, and
      # `defaultStore` and `visibilityStore` select them.
      persistence:
        defaultStore: default
        visibilityStore: visibility
        numHistoryShards: 512
        datastores:
          default:
            sql:
              pluginName: postgres12
              driverName: postgres12
              databaseName: temporal
              connectAddr: postgres-rw.platform.svc.cluster.local:5432
              connectProtocol: tcp
              user: dev
              existingSecret: temporal-db-creds
              # CNPG in `infra/helm/platform/postgres` already provisions the
              # `temporal` and `temporal_visibility` databases through
              # postInitApplicationSQL. So only the schema job runs here.
              createDatabase: false
              manageSchema: true
          visibility:
            sql:
              pluginName: postgres12
              driverName: postgres12
              databaseName: temporal_visibility
              connectAddr: postgres-rw.platform.svc.cluster.local:5432
              connectProtocol: tcp
              user: dev
              existingSecret: temporal-db-creds
              createDatabase: false
              manageSchema: true
      # Register the `default` namespace with the chart's setup job. The split production topology does not create it
      # the way `start-dev` does. So workers that target TEMPORAL_NAMESPACE=default fail without this.
      namespaces:
        create: true
        namespace:
          - name: default
            retention: 3d
  # Chart v1.0.0-rc.2 removed the Cassandra, Prometheus, Grafana, and Elasticsearch sub-charts. They are no longer
  # top-level keys.
  web:
    image:
      repository: temporalio/ui
      tag: "2.51.1"
    # The UI image runs as `temporal`, 1000. Unlike for `server`, the chart sets
    # nothing for it. So the pod block is written out in full here.
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      seccompProfile: { type: RuntimeDefault }
    containerSecurityContext: *restrictedContainer

  # admin-tools is the CLI image. It runs as a long-lived Deployment for break-glass
  # `temporal` commands, per ADR-0401. Both Jobs below also use its image.
  admintools:
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      seccompProfile: { type: RuntimeDefault }
    containerSecurityContext: *restrictedContainer

  # `schema` names the two Jobs, the schema setup and update job and the create-default-namespace job. It is not a
  # component.
  schema:
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      seccompProfile: { type: RuntimeDefault }
    containerSecurityContext: *restrictedContainer
