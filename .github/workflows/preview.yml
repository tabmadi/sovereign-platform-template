# The pull-request preview environment, per ADR-0205. A label gates it, because a preview starts the full platform.
# A maintainer adds the label, so a fork's code reaches the runner only after someone reads it.
# It is the full local tier at this PR's images, destroyed with the run. Nothing is promoted or released from it.
name: preview

on:
  pull_request:
    types: [labeled, synchronize, reopened]

# One preview for each pull request. A new push replaces the environment, so two starts never race on the same runner.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # renovate runs as the dependency bot, never in a job. Its install is the largest in the toolchain and warns on every runner.
  MISE_DISABLE_TOOLS: npm:renovate
  # Every checkout runs `git init`, which prints a hint on each job while git has no default branch name.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: master

jobs:
  preview:
    if: contains(github.event.pull_request.labels.*.name, 'preview')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PREVIEW_PR: ${{ github.event.pull_request.number }}
      PREVIEW_REVISION: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Provision the local SOPS age key
        run: mise run secrets:age
      - name: Bring up the preview
        run: mise run ci:preview -- up
      - name: Install Playwright in the Node island
        run: mise run e2e:install
      - name: Smoke the preview
        run: mise run e2e:smoke
      - name: Upload Playwright report
        if: always()
        # Workaround for forgejo 16.0.2 in infra/helm/platform/forgejo/values.yaml: its artifact service refuses v4 and later.
        # A report is a diagnostic, so the refusal must not fail a passing run. Retest: remove this line and upload a report.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-preview
          path: |
            test/e2e/playwright-report/
            test/e2e/test-results/
          retention-days: 7
      - name: Destroy the preview
        if: always()
        run: mise run ci:preview -- down
