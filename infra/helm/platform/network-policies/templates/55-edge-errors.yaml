{{- if .Values.edgeErrors.enabled }}
## The edge's error responder, per ADR-0305 and its problem+json contract. Traefik is the only client. It reaches
## this through a SUBREQUEST, and not by proxying. The original request never arrives here.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: edge-errors
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: edge-errors
  ingress:
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system }
      toPorts:
        # Enforced on the pod's real containerPort. The Service fronts it on 80.
        - ports: [{ port: "8080", protocol: TCP }]
{{- end }}
