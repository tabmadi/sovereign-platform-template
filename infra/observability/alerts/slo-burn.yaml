# Error-budget burn rules. ADR-0500 defines the SLIs, and ADR-0502 routes them.
groups:
  - name: slo.recording
    # Ratios, not raw counts, at the four windows that the burn alerts pair.
    rules:
      - record: service:request_errors:ratio_rate5m
        expr: |
          (
            sum by (service_name) (rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m]))
            or 0 * sum by (service_name) (rate(http_server_request_duration_seconds_count[5m]))
          )
            / (sum by (service_name) (rate(http_server_request_duration_seconds_count[5m])) > 0)
      - record: service:request_errors:ratio_rate30m
        expr: |
          (
            sum by (service_name) (rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[30m]))
            or 0 * sum by (service_name) (rate(http_server_request_duration_seconds_count[30m]))
          )
            / (sum by (service_name) (rate(http_server_request_duration_seconds_count[30m])) > 0)
      - record: service:request_errors:ratio_rate1h
        expr: |
          (
            sum by (service_name) (rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[1h]))
            or 0 * sum by (service_name) (rate(http_server_request_duration_seconds_count[1h]))
          )
            / (sum by (service_name) (rate(http_server_request_duration_seconds_count[1h])) > 0)
      - record: service:request_errors:ratio_rate6h
        expr: |
          (
            sum by (service_name) (rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[6h]))
            or 0 * sum by (service_name) (rate(http_server_request_duration_seconds_count[6h]))
          )
            / (sum by (service_name) (rate(http_server_request_duration_seconds_count[6h])) > 0)

  - name: slo.burn
    rules:
      # A 14.4x burn spends a 30-day budget in about two days. Paired 1h and 5m.
      - alert: SLOErrorBudgetFastBurn
        expr: |
          (
            service:request_errors:ratio_rate1h
              > on (service_name) group_left () (14.4 * (1 - service:slo_availability_target:ratio))
          )
          and on (service_name)
          (
            service:request_errors:ratio_rate5m
              > on (service_name) group_left () (14.4 * (1 - service:slo_availability_target:ratio))
          )
        for: 2m
        labels: { severity: ticket }
        annotations:
          summary: "{{ $labels.service_name }} is burning its error budget 14.4x"
          description: >-
            At this rate, the 30-day budget is gone in about two days. This rule
            becomes a page when a paging receiver exists, per ADR-0502. Until
            then it is a ticket, because nothing reaches a human within minutes.
      # A 6x burn spends the budget in about five days. Paired 6h and 30m.
      - alert: SLOErrorBudgetSlowBurn
        expr: |
          (
            service:request_errors:ratio_rate6h
              > on (service_name) group_left () (6 * (1 - service:slo_availability_target:ratio))
          )
          and on (service_name)
          (
            service:request_errors:ratio_rate30m
              > on (service_name) group_left () (6 * (1 - service:slo_availability_target:ratio))
          )
        for: 15m
        labels: { severity: ticket }
        annotations:
          summary: "{{ $labels.service_name }} is burning its error budget 6x"
          description: >-
            Slower than the fast-burn rule, and still ahead of budget. At this
            rate, the budget is spent before the 30-day window ends. Read it as a
            trend, and not as an incident.

  - name: slo.burn.latency
    # The latency half of the SLI pair that ADR-0500 declares.
    rules:
      - alert: SLOLatencyBudgetFastBurn
        expr: |
          (
            service:request_latency_errors:ratio_rate1h
              > on (service_name) group_left () (14.4 * (1 - service:slo_latency_target:ratio))
          )
          and on (service_name)
          (
            service:request_latency_errors:ratio_rate5m
              > on (service_name) group_left () (14.4 * (1 - service:slo_latency_target:ratio))
          )
        for: 2m
        labels: { severity: ticket }
        annotations:
          summary: "{{ $labels.service_name }} is burning its latency budget 14.4x"
          description: >-
            Requests go over the service's latency threshold fast enough to spend
            the 30-day budget in about two days. It is a `ticket` for the same
            reason as every other burn rule here: no receiver reaches a human
            within minutes, per ADR-0502.
      - alert: SLOLatencyBudgetSlowBurn
        expr: |
          (
            service:request_latency_errors:ratio_rate6h
              > on (service_name) group_left () (6 * (1 - service:slo_latency_target:ratio))
          )
          and on (service_name)
          (
            service:request_latency_errors:ratio_rate30m
              > on (service_name) group_left () (6 * (1 - service:slo_latency_target:ratio))
          )
        for: 15m
        labels: { severity: ticket }
        annotations:
          summary: "{{ $labels.service_name }} is burning its latency budget 6x"
          description: >-
            Slower than the fast-burn rule, and still ahead of budget. Read it as
            a trend, and not as an incident.
