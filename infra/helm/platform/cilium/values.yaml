cilium:
  # kube-proxy is not installed, per ADR-0206. So the agent addresses the API server directly, and not through a
  # Service.
  kubeProxyReplacement: true
  k8sServiceHost: localhost
  k8sServicePort: 7445

  # ADR-0200's third invariant: a pod gets no more kernel surface than it needs, and the agent is a pod.
  securityContext:
    capabilities:
      ciliumAgent:
        - CHOWN
        - KILL
        - NET_ADMIN
        - NET_RAW
        - IPC_LOCK
        - SYS_ADMIN
        - SYS_RESOURCE
        - PERFMON
        - BPF
        - DAC_OVERRIDE
        - FOWNER
        - SETGID
        - SETUID
      cleanCiliumState:
        - NET_ADMIN
        - SYS_ADMIN
        - SYS_RESOURCE

  ipam:
    mode: kubernetes

  # WireGuard transparent encryption for all east-west pod traffic, per ADR-0206.
  # It is a config flag, not a sidecar. With multi-tenant PII and audit needs, no plaintext
  # goes east-west. It covers node-to-node traffic only. Host-level traffic is out of scope.
  encryption:
    enabled: true
    type: wireguard

  # Hubble gives per-flow network visibility without a sidecar, per ADR-0206. It is the audit surface for internal
  # header trust, per ADR-0305. It is also the source of the network-flow metrics in Grafana.
  hubble:
    enabled: true
    relay:
      enabled: true
    ui:
      enabled: true
      # Served at the ROOT of the `hubble.ops.<host>` subdomain, not under a path prefix. The gateway IngressRoute
      # matches HostRegexp `^hubble\.ops\.`.
      baseUrl: /
    # Flow metrics on the agent at :9965. The node-local OTel collector scrapes them, and Grafana shows them, per
    # ADR-0500 and ADR-0501.
    metrics:
      enabled:
        - "drop:sourceContext=workload;destinationContext=workload"
