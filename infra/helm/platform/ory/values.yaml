# Ory umbrella chart values, per ADR-0305 and ADR-0304.

oathkeeper:
  enabled: true
  deployment:
    # Per ADR-0204. It is the busiest component on the `/api` path, more than the services
    # themselves, because every request makes a forward-auth hop here, per ADR-0305.
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits:   { memory: "384Mi" }
    extraEnv:
      - name: SQA_OPT_OUT
        value: "true"

# No phone-home. Ory's SQA telemetry dials sqa.ory.sh on 443. The default-deny egress drops it correctly, and that
# only adds noise to PolicyDropsDetected.
kratos:
  # Migrations run as an init container before the service container, in every environment.
  # See `docs/guide/database-migrations.md`.
  kratos:
    automigration:
      enabled: true
      type: initContainer
  deployment:
    # Per ADR-0204. Set explicitly, because it needs much more than the default request
    # of the namespace LimitRange.
    resources:
      requests: { cpu: "100m", memory: "192Mi" }
      limits:   { memory: "512Mi" }
    extraEnv:
      - name: SQA_OPT_OUT
        value: "true"

# Hydra is a public-API add-on, per ADR-0305. It is off by default. Internal-only
# projects run Kratos, Oathkeeper, and OpenFGA. The `hydra_thirdparty` flag turns
# `hydra.enabled` on in the per-environment GitOps values.
hydra:
  enabled: false
  hydra:
    # Migrations run as an init container before the service container, in every environment,
    # as in `docs/guide/database-migrations.md`. This is the same shape as Kratos above.
    automigration:
      enabled: true
      type: initContainer
    config:
      # A placeholder, not the connection that Hydra uses. `secret.nameOverride` below sends every pod to the key of the
      # same name in `hydra-secrets`.
      dsn: "postgres://hydra@postgres-rw.platform.svc.cluster.local:5432/hydra?sslmode=disable"
      urls:
        self:
          issuer: https://dev.example.com/oauth2/
        login:   https://dev.example.com/auth/login
        consent: https://dev.example.com/auth/consent
        logout:  https://dev.example.com/auth/logout
  # The system and cookie secrets and the dsn come from a SOPS-managed Secret, never inline values, per ADR-0202.
  # Kratos uses the same wiring.
  secret:
    enabled: false
    nameOverride: hydra-secrets

# The first operator of an environment, per ADR-0304. A Job creates the identity in the `first-operator` Secret
# when the environment has no operator. The Secret is in the environment's SOPS bundle. Without it, the Job does nothing.
firstOperator:
  enabled: true
  # curl and jq, the same image as the OpenFGA seed.
  image: alpine/k8s:1.31.1
  secret: first-operator
  openfgaSecret: openfga-creds
  # How long the Job waits for the sops-operator to render the Secret before it decides that there is none.
  secretWaitSeconds: 120
