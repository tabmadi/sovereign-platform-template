# Deferral triggers, as rules (ADR-0000, docs/reference/deferral-register.md).
groups:
  - name: deferral.storage
    rules:
      # ADR-0207's Longhorn trigger, capacity half. 85% is where kubelet starts deleting images, and 14 days is the
      # notice a Longhorn move needs: it rebuilds the node image and reprovisions every node. A local-path volume is a
      # directory on the node disk, so the node's filesystem is the one measure of what the volumes use.
      - alert: NodeDiskFullWithinTwoWeeks
        expr: |
          predict_linear(k8s_node_filesystem_usage_bytes[3d], 14 * 86400) / k8s_node_filesystem_capacity_bytes > 0.85
        for: 6h
        labels: { severity: ticket }
        annotations:
          summary: "A node disk reaches 85% within two weeks — ADR-0207's Longhorn trigger"
          description: >-
            At the last three days' growth this node's disk passes the point where
            kubelet starts deleting images within two weeks. This is the documented
            trigger for replicated block storage; read the Longhorn row in
            docs/reference/deferral-register.md before adding disk instead.

  - name: deferral.load
    rules:
      # ADR-0601's k6-operator trigger: dropped_iterations above 0 means the load generator could not keep up, so the
      # run measured the generator rather than the platform and its numbers are not a capacity result.
      - alert: LoadGeneratorDroppingIterations
        expr: |
          increase(k6_dropped_iterations_total[5m]) > 0
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: "k6 dropped iterations — the load run measured the generator"
          description: >-
            The generator could not schedule its target rate, so this run's
            numbers describe the generator's limit rather than the platform's.
            This is the documented trigger for moving load generation in-cluster
            with k6-operator (docs/reference/deferral-register.md).

  - name: deferral.registry
    rules:
      # ADR-0105's mirroring trigger: an upstream registry rate-limits or removes a pinned digest the cluster depends
      # on.
      - alert: ImagePullsFailing
        expr: |
          increase(kubelet_runtime_operations_errors_total{operation_type="pull_image"}[1h]) > 0
        for: 15m
        labels: { severity: ticket }
        annotations:
          summary: "The kubelet is failing to pull images — ADR-0105's mirroring trigger"
          description: >-
            Image pulls are failing on at least one node. If the cause is an
            upstream registry rate-limiting or having removed a pinned digest,
            this is the documented trigger for enabling pull-through mirroring in
            the registry's config (docs/reference/deferral-register.md). Check
            which image before reaching for the seam: a failing pull of a
            first-party image is a different problem entirely.

  - name: deferral.analytics
    rules:
      # ADR-0700's storage-growth trigger: the events table sustaining more than about 10M rows per month is the point
      # at which a column store earns its place and Postgres stops being the obvious answer.
      - alert: AnalyticsStorageGrowthTrigger
        expr: |
          max(analytics_events_rows_current_month) > 10000000
        for: 24h
        labels: { severity: ticket }
        annotations:
          summary: "The analytics store has passed ADR-0700's column-store trigger"
          description: >-
            The events table is holding more than 10M rows this month, which is the
            volume ADR-0700 names as the point to reconsider Postgres. This is a
            capacity review, not an outage — read the deferral register's ClickHouse
            row before changing anything.
