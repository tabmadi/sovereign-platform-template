# Lowdefy's CLI stops without pnpm and calls `next start`, so these host tasks run under Node. This is the second Node exception that ADR-0100 allows.
# The tasks are optional: nothing depends on them, and both important paths build the image instead.
# The version comes from the root [env] NODE_VERSION. Do not repeat the number.
[tools]
node = "{{env.NODE_VERSION}}"

[env]
LOWDEFY_VERSION = "5.4.0"

[tasks.setup]
run = "corepack enable && pnpm config set dangerously-allow-all-builds true"

[tasks.build]
depends = ["setup"]
run = "npx lowdefy@{{env.LOWDEFY_VERSION}} build"

[tasks.run]
depends = ["setup"]
run = "npx lowdefy@{{env.LOWDEFY_VERSION}} dev"

[tasks.lint]
depends = ["setup"]
run = "npx lowdefy@{{env.LOWDEFY_VERSION}} validate"

[tasks.test]
run = "echo 'no tests'"
