{{- if .Values.policies.allowedImageSources }}
# The only places an image can come from, per ADR-0113. The other policies check OUR images.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: allowed-image-sources
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    policies.kyverno.io/title: Images come from known registries
    policies.kyverno.io/category: Supply chain
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Every image must come from a repository this platform has declared it pulls
      from (ADR-0113). The list is generated from the platform's own charts, so a
      new entry is a registry that has never been used here before.
spec:
  validationActions: [{{ include "policies.action" . }}]
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    # The Talos release pins the control plane's own images, per ADR-0200, not this list.
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system]
  variables:
    - name: images
      expression: {{ include "policies.podImages" . | quote }}
    # First-party images are built after the list is generated, so the prefix admits them. The other policies still
    # require a digest and a signature.
    - name: prefix
      expression: {{ include "policies.prefix" . | quote }}
    - name: sources
      expression: {{ .Values.policies.allowedImageSources | toJson | quote }}
  validations:
    # A repository is followed by a tag or a digest. Both start with a character that no repository contains.
    - expression: >-
        variables.images.all(image,
          (variables.prefix != "" && image.startsWith(variables.prefix)) ||
          variables.sources.exists(source, image.startsWith(source + ":") || image.startsWith(source + "@")))
      message: >-
        This image comes from a repository that is not in the allow-list,
        per ADR-0113. If the repository is valid, add it. To do this, run
        `just gen-image-allowlist`.
{{- end }}
