argo-cd:
  global:
    domain: argocd.example.com
  configs:
    params:
      server.insecure: "true"          # TLS terminates upstream at Traefik
      # Diff against the API SERVER's dry-run rather than against the manifest alone.
      controller.diff.server.side: "true"
      # A wave gated on an ApplicationSet is gated on the health check below, which reads .status.resources — written by
      # the ApplicationSet controller on its own requeue, default 3 minutes.
      applicationsetcontroller.requeue.after: 20s
    cm:
      timeout.reconciliation: "60s"
      # The ops edge is the authentication gate (Oathkeeper: an AAL2 operator holding dashboard:argocd#view, ADR-0306).
      users.anonymous.enabled: "true"
      # ArgoCD's built-in health for ApplicationSet only reflects successful templating ("all Applications generated"),
      # not whether the Applications it spawned actually synced and became healthy.
      resource.customizations.health.argoproj.io_ApplicationSet: |
        hs = {}
        if obj.status ~= nil and obj.status.resources ~= nil and #obj.status.resources > 0 then
          hs.status = "Healthy"
          hs.message = "All generated Applications are Synced and Healthy"
          for i, r in ipairs(obj.status.resources) do
            if r.status ~= "Synced" or r.health == nil or r.health.status ~= "Healthy" then
              hs.status = "Progressing"
              hs.message = "Waiting for " .. r.name .. " (sync=" .. tostring(r.status) .. ", health=" .. tostring(r.health and r.health.status) .. ")"
              return hs
            end
          end
          return hs
        end
        hs.status = "Progressing"
        hs.message = "Waiting for ApplicationSet to generate Applications"
        return hs
      # CNPG Cluster health.
      resource.customizations.health.postgresql.cnpg.io_Cluster: |
        hs = {}
        if obj.status ~= nil then
          local ready = obj.status.readyInstances
          local want = obj.status.instances
          if obj.status.phase == "Cluster in healthy state"
             and ready ~= nil and want ~= nil and ready == want and ready > 0 then
            hs.status = "Healthy"
            hs.message = obj.status.phase
            return hs
          end
          hs.status = "Progressing"
          hs.message = tostring(obj.status.phase)
                       .. " (" .. tostring(ready) .. "/" .. tostring(want) .. " ready)"
          return hs
        end
        hs.status = "Progressing"
        hs.message = "Waiting for CNPG cluster status"
        return hs
      # Helm-rendered CRDs carry explicit empty maps (`labels: {}`, `annotations: {}`) that ArgoCD's normalizer strips
      # from the DESIRED object but not from the LIVE one — so a chart shipping CRDs (kyverno) drifts `labels: {}`
      # forever and sits OutOfSync.
      resource.customizations.ignoreDifferences.apiextensions.k8s.io_CustomResourceDefinition: |
        {
          "jsonPointers": ["/metadata/labels", "/metadata/annotations"]
        }
      # Kyverno's CRD schema defaults four fields the chart never sets (`spec.admission`, `spec.emitWarning`, and per
      # rule `skipBackgroundRequests` and `validate.allowExistingViolations`).
      resource.customizations.ignoreDifferences.kyverno.io_ClusterPolicy: |
        {
          "jsonPointers": ["/spec/admission", "/spec/emitWarning"],
          "jqPathExpressions": [
            ".spec.rules[].skipBackgroundRequests",
            ".spec.rules[].validate.allowExistingViolations"
          ]
        }
    rbac:
      # Anonymous (edge-authenticated operator, see users.anonymous above) gets
      # admin — mirroring Grafana's anonymous org_role:Admin. The edge already
      # proved AAL2 + the dashboard:argocd grant; full UI access is the point.
      policy.default: role:admin
  server:
    service: { type: ClusterIP }
  redis-ha: { enabled: false }         # 3-node embedded etcd; HA Redis is overkill (ADR-0200)
  redis:
    # Chart defaults to the ecr-public.aws.com vanity host, which only publishes
    # AAAA records; pin the canonical public.ecr.aws mirror (identical image,
    # IPv4-reachable) so redis doesn't wedge on IPv6-less networks.
    image:
      repository: public.ecr.aws/docker/library/redis
  # ADR-0204.
  controller:
    replicas: 1
    resources:
      requests: { memory: "512Mi" }
      limits: { memory: "2Gi" }
  # The repo server renders every chart in the fleet, each render holding a
  # dependency tree in memory.
  repoServer:
    resources:
      requests: { memory: "256Mi" }
      limits: { memory: "1Gi" }
  applicationSet:
    replicas: 1
    resources:
      requests: { memory: "128Mi" }
      limits: { memory: "512Mi" }
