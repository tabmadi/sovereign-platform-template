# When true, allow the log and trace backends, loki and tempo, egress to external HTTPS. Prod needs this, because
# its object storage is a real off-cluster S3 bucket, per ADR-0206. Local uses the in-cluster store, which
# intra-namespace egress covers. So it stays false there, and no pod reaches the internet.
externalObjectStorage: false

# The namespace of the node-level OTel collector, per ADR-0200. It needs hostPath and hostPorts, and PSA's
# exception unit is the namespace.
otelAgentNamespace: otel-agent

# The cluster's pod CIDR: kind's kubeadm default, 10.244.0.0/16, per ADR-0206.
podCIDR: "10.244.0.0/16"

# The same gate as in the mailpit chart, `infra/helm/platform/mailpit`.
mailpit:
  enabled: true

# Alertmanager's policy in `45-alertmanager.yaml` renders only where Alertmanager runs.
alertmanager:
  enabled: true

# maddy is production-only, per ADR-0307, and its policy follows the chart. A rule
# that selects a workload that does not exist does nothing. Rules that do nothing
# make people stop reading a policy file.
maddyEnabled: false

# The same gate as in the edge-errors chart, `infra/helm/platform/edge-errors`.
edgeErrors:
  enabled: true

# The same gate as in the forgejo chart, `infra/helm/platform/forgejo`. It is off by
# default, like the chart. A policy that selects an endpoint that does not exist
# makes a false claim about the platform.
forgejo:
  enabled: false

# Whether zot mirrors the upstream registries, per ADR-0105. This decides whether it can reach them.
registryMirror: true

# Whether this environment issues PUBLIC certificates, per ADR-0205. This decides whether cert-manager can reach the
# CA and the DNS provider.
publicTls:
  enabled: false
