openapi: 3.1.0
info: {title: catalog, version: 0.1.0, description: Product catalog service., x-audience: public}
servers: [{url: /api}] # flat resource namespace, per ADR-0306. Paths are globally unique
# `x-admin: crud` marks the resource group for the admin generator in tools/admin-gen, per ADR-0401. It
# scaffolds list, detail, create, and edit pages from the operations below.
tags: [{name: products, x-admin: crud}]
paths:
  /products:
    get:
      operationId: listProducts
      description: List all products.
      tags: [products]
      responses:
        "200":
          description: The product list
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Product"}
                # List examples matter, per ADR-0600. The API mock serves them exactly as
                # written. An unconstrained array schema generates an empty list, and a UI
                # built against it has no rows, no pagination, and no truncation.
                example:
                  - {id: product_01kztmx9e0fq1r13w5d1aerqw6, name: Aeron chair, price: {amount: "1299.00", currency: EUR}}
                  - {id: product_01kztn1f78evjtsk2gbgjk5hs3, name: Standing desk, price: {amount: "899.00", currency: EUR}}
                  - {id: product_01kztn5n0gfphac1fsep3b64nj, name: Monitor arm, price: {amount: "149.00", currency: EUR}}
        default: {$ref: "#/components/responses/Error"}
    post:
      operationId: createProduct
      # First-party edge op. A catalog write is an internal admin action, so the edge
      # can reach it but the public docs leave it out. It overrides the service's
      # `public` default, per the ADR-0303 audience ladder. The public catalog is read-only.
      x-audience: internal
      description: Create a product.
      tags: [products]
      requestBody:
        required: true
        description: The product to create.
        content: {application/json: {schema: {$ref: "#/components/schemas/ProductInput"}}}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/Product"}}}}
        default: {$ref: "#/components/responses/Error"}
  /products/{id}:
    get:
      operationId: getProduct
      description: Fetch a product by id.
      tags: [products]
      parameters: [{name: id, in: path, required: true, description: Product id., schema: {$ref: "#/components/schemas/ProductId"}}]
      responses:
        "200": {description: The requested product, content: {application/json: {schema: {$ref: "#/components/schemas/Product"}}}}
        default: {$ref: "#/components/responses/Error"}
    put:
      operationId: updateProduct
      # First-party edit action. The public docs leave it out, per the ADR-0303 audience ladder.
      x-audience: internal
      description: Update a product.
      tags: [products]
      parameters: [{name: id, in: path, required: true, description: Id of the product to update., schema: {$ref: "#/components/schemas/ProductId"}}]
      requestBody:
        required: true
        description: The new product fields.
        content: {application/json: {schema: {$ref: "#/components/schemas/ProductInput"}}}
      responses:
        "200": {description: The updated product, content: {application/json: {schema: {$ref: "#/components/schemas/Product"}}}}
        default: {$ref: "#/components/responses/Error"}
    delete:
      operationId: deleteProduct
      x-audience: internal
      description: Delete a product.
      tags: [products]
      parameters: [{name: id, in: path, required: true, description: Id of the product to delete., schema: {$ref: "#/components/schemas/ProductId"}}]
      responses:
        "204": {description: Deleted}
        default: {$ref: "#/components/responses/Error"}
components:
  responses:
    # >>> shared-components: responses. Generated from tools/codegen/shared-components.yaml. Do not edit
    Error:
      description: An error, as RFC 9457 problem details.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
          # <<< shared-components
  schemas:
    # >>> shared-components: schemas. Generated from tools/codegen/shared-components.yaml. Do not edit
    # RFC 9457 problem details. `instance` is absent on purpose: `trace_id` identifies the occurrence and leads to the trace.
    # An instance URL leads nowhere.
    Problem:
      type: object
      description: |
        RFC 9457 problem details. Services and the edge both serve it as
        `application/problem+json`, so a generated client has one error branch, not two.
      required: [type, title, status]
      properties:
        type:
          type: string
          description: |
            `about:blank`, except where two errors share a status code and a client
            handles them differently. That case uses a `urn:problem-type:<service>:<slug>`
            URN. It is never a dereferenceable URL, which would put an error taxonomy into
            the flat public URL namespace.
          default: "about:blank"
          example: "about:blank"
        title:
          type: string
          description: A stable, human-readable summary. It does not change with the instance.
          example: Not Found
        status:
          type: integer
          description: The HTTP status, repeated in the body.
          minimum: 100
          maximum: 599
          example: 404
        detail:
          type: string
          description: |
            Specific to the instance and safe to show a user. Never a stack trace, a query,
            or an internal hostname.
          example: No product with that identifier.
        trace_id:
          type: string
          description: |
            The W3C Trace Context trace-id of the failing request, so an error that a user
            reports leads to its trace. The active span supplies it, not the handler.
          pattern: "^[0-9a-f]{32}$"
          example: 4bf92f3577b34da6a3ce929d0e0e4736
        errors:
          type: array
          description: |
            Field-level validation failures, filled from the generated validator.
            Absent when the failure is not a validation failure.
          items:
            type: object
            required: [pointer, message]
            properties:
              pointer:
                type: string
                description: RFC 6901 JSON Pointer to the member that failed.
                example: /price/amount
              message:
                type: string
                example: must be a decimal amount
      example:
        type: "about:blank"
        title: Not Found
        status: 404
        detail: No product with that identifier.
        trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
    # A monetary amount. `string`, never `number`: every TypeScript client parses a JSON number as an IEEE-754 double.
    # A double cannot hold a decimal amount exactly. A `type: number` monetary field is a contract defect.
    Money:
      type: object
      description: |
        A monetary amount. The amount is a decimal string, because a JSON number becomes
        a double in the TypeScript client, and a double cannot hold a decimal amount
        exactly. The currency goes with the amount, because an amount without one is
        not a quantity of anything.
      required: [amount, currency]
      properties:
        amount:
          type: string
          description: Decimal amount, with a leading sign when negative. No thousands separators.
          pattern: '^-?[0-9]+(\.[0-9]+)?$'
          example: "1299.00"
        currency:
          type: string
          description: ISO 4217 alphabetic code, uppercase.
          pattern: "^[A-Z]{3}$"
          example: EUR
      example:
        amount: "1299.00"
        currency: EUR
    # <<< shared-components
    # A wire identifier, per ADR-0003. The stored column stays a bare `uuid`. This form
    # exists so that a value in a log line, a ticket, or a URL names its type.
    ProductId:
      type: string
      description: |
        A product identifier: `product_` and the UUIDv7 in 26 characters of Crockford
        base32. The first character is at most 7, because 26 characters hold 130 bits and
        a UUID has 128. It is opaque to a consumer: nothing parses, orders, or builds one.
      pattern: '^product_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$'
      example: product_01kztmx9e0fq1r13w5d1aerqw6
    Product:
      type: object
      description: A catalog product.
      required: [id, name, price]
      properties:
        id: {$ref: "#/components/schemas/ProductId"}
        name: {type: string}
        # The shared money type, per ADR-0300: a decimal STRING with its currency. It is
        # never a JSON number, because a double cannot hold a decimal amount exactly. It is
        # never an integer of minor units, because then every reader must know the scale.
        price: {$ref: "#/components/schemas/Money"}
      # One example on the schema serves every response that references it: the detail
      # page, the create and update response, the developer portal, and the API mock,
      # per ADR-0303 and ADR-0600. It is code-reviewed data, not generated noise.
      example: {id: product_01kztmx9e0fq1r13w5d1aerqw6, name: Aeron chair, price: {amount: "1299.00", currency: EUR}}
    ProductInput:
      type: object
      description: Request body to create a product.
      required: [name, price]
      properties:
        name: {type: string, minLength: 1}
        price: {$ref: "#/components/schemas/Money"}
