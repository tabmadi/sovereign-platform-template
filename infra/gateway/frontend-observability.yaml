# Browser telemetry ingest (ADR-0500, ADR-0400).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: frontend-observability
  namespace: platform
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: PathPrefix(`/api/rum`)
      middlewares:
        - name: security-headers
      services:
        - name: otel-collector
          # The collector runs apart from the rest of the platform (ADR-0200), so this is a cross-namespace service
          # reference and needs Traefik's `allowCrossNamespace` — already on, for the Hubble and Argo CD routes in
          # ingressroutes.yaml.
          namespace: otel-agent
          port: 8027
  tls:
    secretName: wildcard-tls
