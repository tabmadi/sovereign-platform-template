# Platform ApplicationSets (ADR-0201), one per dependency layer so Argo CD can order them.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-admission
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/component: admission
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  # A manual pause of auto-sync has to survive this ApplicationSet's own reconcile.
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/syncPolicy
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - { env: dev,     server: "https://kubernetes.default.svc" }
                - { env: staging, server: "https://kubernetes.default.svc" }
                - { env: prod,    server: "https://kubernetes.default.svc" }
          - git:
              repoURL: https://github.com/tabmadi/sovereign-platform-template.git
              revision: master
              directories:
                  # Namespaces + their Pod Security Admission profile (ADR-0200). First in the base tier and sync-wave -1 inside it:
                  # a namespace labelled after its pods are admitted governs nothing, because PSA is an admission check.
                - { path: "infra/helm/platform/namespaces" }
                  # The default StorageClass (ADR-0200). Base tier, and ahead of the data tier by construction: a PVC created before
                  # a default StorageClass exists stays Pending with no class to resolve, and nothing re-binds it when one appears.
                - { path: "infra/helm/platform/local-path" }
                  # Admission control (ADR-0104). In the BASE tier because a
                  # policy that arrives after the workloads it gates has already
                  # missed them: admission is evaluated once, at creation.
                - { path: "infra/helm/platform/kyverno" }
                - { path: "infra/helm/platform/sops-operator" }
                - { path: "infra/helm/platform/cert-manager" }
                - { path: "infra/helm/platform/network-policies" }
                - { path: "infra/helm/platform/resource-governance" }
                - { path: "infra/helm/platform/temporal-worker-controller-crds" }
                # CILIUM AND ARGO CD ARE DELIBERATELY NOT HERE, in any tier. Neither can be installed by the thing it is a
                # prerequisite of: no pod schedules before the CNI exists, and Argo cannot apply its own first install.
  template:
    metadata:
      name: "{{ .env }}-platform-{{ .path.basename }}"
      labels:
        env: "{{ .env }}"
        app.kubernetes.io/part-of: platform
        app.kubernetes.io/component: "{{ .path.basename }}"
    spec:
      project: "{{ .env }}"
      source:
        repoURL: https://github.com/tabmadi/sovereign-platform-template.git
        targetRevision: master
        path: "{{ .path.path }}"
        helm:
          # Stable Helm release name = chart basename, so resources are named the same under ArgoCD as under a direct `helm
          # install <chart>` (a bare release name would prefix every resource with the app name and break in-cluster DNS /
          # cross-component refs).
          releaseName: "{{ .path.basename }}"
          valueFiles:
            # First, so anything below can still override it: the deletions of
            # upstream defaults that a wrapper chart's own values.yaml cannot
            # express (see the file's header).
            - "../../../gitops/platform/shared-values.yaml"
            # Generated: the repositories the platform's charts pull from, which
            # Kyverno's allow-list policy reads (ADR-0104).
            - "../../../gitops/platform/image-allowlist.yaml"
            - "../../../auth/kratos/values.yaml"
            - "../../../auth/oathkeeper/values.yaml"
            - "../../../gitops/platform/{{ .env }}/values.yaml"
          fileParameters:
            - name: 'kratos.kratos.identitySchemas.user\.v1\.json'
              path: "../../../auth/kratos/identity-schemas/user.v1.json"
            - name: oathkeeper.oathkeeper.accessRules
              path: "../../../auth/oathkeeper/access-rules.json"
            - name: seed.model
              path: "../../../auth/openfga/model.json"
            # The platform's signing public key (ADR-0104), see infra/auth/cosign.
            - name: policies.publicKey
              path: "../../../auth/cosign/cosign.pub"
      destination: { server: "{{ .server }}", namespace: platform }
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
        retry:
          limit: 20
          backoff: { duration: 10s, maxDuration: 2m, factor: 2 }
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-stores
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/component: stores
  annotations:
    # Wave 2: after base (operator up) and the secrets tier (wave 1, local) so
    # Postgres finds its superuser Secret instead of CreateContainerConfigError.
    argocd.argoproj.io/sync-wave: "2"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/syncPolicy
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - { env: dev,     server: "https://kubernetes.default.svc" }
                - { env: staging, server: "https://kubernetes.default.svc" }
                - { env: prod,    server: "https://kubernetes.default.svc" }
          - git:
              repoURL: https://github.com/tabmadi/sovereign-platform-template.git
              revision: master
              directories:
                - { path: "infra/helm/platform/postgres" }
                - { path: "infra/helm/platform/seaweedfs" }
  template:
    metadata:
      name: "{{ .env }}-platform-{{ .path.basename }}"
      labels:
        env: "{{ .env }}"
        app.kubernetes.io/part-of: platform
        app.kubernetes.io/component: "{{ .path.basename }}"
    spec:
      project: "{{ .env }}"
      source:
        repoURL: https://github.com/tabmadi/sovereign-platform-template.git
        targetRevision: master
        path: "{{ .path.path }}"
        helm:
          releaseName: "{{ .path.basename }}"
          valueFiles:
            - "../../../gitops/platform/shared-values.yaml"
            - "../../../gitops/platform/image-allowlist.yaml"
            - "../../../auth/kratos/values.yaml"
            - "../../../auth/oathkeeper/values.yaml"
            - "../../../gitops/platform/{{ .env }}/values.yaml"
          fileParameters:
            - name: 'kratos.kratos.identitySchemas.user\.v1\.json'
              path: "../../../auth/kratos/identity-schemas/user.v1.json"
            - name: oathkeeper.oathkeeper.accessRules
              path: "../../../auth/oathkeeper/access-rules.json"
            - name: seed.model
              path: "../../../auth/openfga/model.json"
            - name: policies.publicKey
              path: "../../../auth/cosign/cosign.pub"
      destination: { server: "{{ .server }}", namespace: platform }
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
        retry:
          limit: 20
          backoff: { duration: 10s, maxDuration: 2m, factor: 2 }
