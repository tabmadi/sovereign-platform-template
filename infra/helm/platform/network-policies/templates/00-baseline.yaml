## Namespace-wide default-deny, plus the egress that every pod needs.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: platform-baseline
spec:
  endpointSelector: {}
  enableDefaultDeny:
    ingress: true
    egress: true
  # No ingress allows here. Each backend grants its own callers in the other
  # templates. The demo app services grant theirs through the service chart.
  egress:
    # CoreDNS: every pod resolves service names.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
    # Inside the namespace: allow reaching other platform pods. The ingress rules of
    # the destination decide what connects. Egress is not the gate here.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: platform
    # The Kubernetes API server. Operators such as cert-manager, CNPG, and sops, the OTel collector, and the CNPG
    # instance manager watch and patch resources.
    - toEntities:
        - kube-apiserver
        - host
        - remote-node
