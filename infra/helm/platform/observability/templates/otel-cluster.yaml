# Cluster-state metrics collector, an ADR-0501 follow-up. It is a 1-replica Deployment that runs ONLY the k8s_cluster
# receiver. The receiver watches the Kubernetes API and emits desired and observed state as OTLP metrics.
{{- $oc := .Values.otelCluster }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-cluster
  labels: { app.kubernetes.io/name: otel-cluster, app.kubernetes.io/part-of: observability }
---
# A cluster-scoped read-only watch on the objects that the k8s_cluster receiver reports on. It also covers what the
# k8sattributes processor needs to resolve pods to workloads: pods, namespaces, and replicasets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: observability-otel-cluster
  labels: { app.kubernetes.io/name: otel-cluster, app.kubernetes.io/part-of: observability }
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - nodes
      - pods
      - pods/status
      - replicationcontrollers
      - replicationcontrollers/status
      - resourcequotas
      - services
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: observability-otel-cluster
  labels: { app.kubernetes.io/name: otel-cluster, app.kubernetes.io/part-of: observability }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: observability-otel-cluster
subjects:
  - kind: ServiceAccount
    name: otel-cluster
    namespace: {{ .Release.Namespace }}
---
{{/* Config in a define, so the Deployment stamps checksum/config and rolls on
     config edits. This is the same pattern as prometheus.yaml, for the same reason. */}}
{{- define "observability.otelCluster.config" }}
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      k8s_cluster:
        auth_type: serviceAccount
        collection_interval: 30s
        # Node allocatable: the denominator for how close the cluster is to full.
        allocatable_types_to_report: [cpu, memory, ephemeral-storage, storage, pods]
      # Platform-component exporters, an ADR-0501 follow-up. Postgres, through the built-in exporter of the CNPG instance
      # manager on :9187, and the Temporal server roles on :9090 already publish Prometheus metrics. This scrapes what
      # exists, and does not add instrumentation.
      prometheus/exporters:
        config:
          scrape_configs:
            - job_name: postgres
              scrape_interval: 30s
              kubernetes_sd_configs:
                - role: pod
                  namespaces: { names: [{{ .Release.Namespace }}] }
                  selectors:
                    - role: pod
                      label: "cnpg.io/cluster=postgres"
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_container_port_name]
                  action: keep
                  regex: metrics
            # maddy's delivery counters, per ADR-0307. The chart's own flag gates it. maddy is production-only. In every other
            # environment, a job that discovers nothing is a scrape error each interval, and not a no-op.
{{- if .Values.maddy.enabled }}
            - job_name: maddy
              scrape_interval: 30s
              kubernetes_sd_configs:
                - role: pod
                  namespaces: { names: [{{ .Release.Namespace }}] }
                  selectors:
                    - role: pod
                      label: "app=maddy"
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_container_port_name]
                  action: keep
                  regex: metrics
{{- end }}
            # Prometheus's own TSDB metrics: defence 2 against cardinality in ADR-0500.
            - job_name: prometheus
              scrape_interval: 60s
              kubernetes_sd_configs:
                - role: pod
                  namespaces: { names: [{{ .Release.Namespace }}] }
                  selectors:
                    - role: pod
                      label: "app.kubernetes.io/name=prometheus"
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_container_port_name]
                  action: keep
                  regex: http
              metric_relabel_configs:
                - source_labels: [__name__]
                  action: keep
                  regex: "prometheus_tsdb_head_series|prometheus_rule_evaluation_failures_total|prometheus_notifications_sent_total|prometheus_notifications_errors_total"
            - job_name: temporal
              scrape_interval: 30s
              kubernetes_sd_configs:
                - role: pod
                  namespaces: { names: [{{ .Release.Namespace }}] }
                  selectors:
                    - role: pod
                      label: "app.kubernetes.io/name=temporal"
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_container_port_name]
                  action: keep
                  regex: metrics
            # Kyverno, per ADR-0104, in its OWN namespace. It excludes its own namespace from every policy, so it cannot
            # share `platform`.
            - job_name: kyverno
              scrape_interval: 30s
              kubernetes_sd_configs:
                - role: pod
                  namespaces: { names: [kyverno] }
                  selectors:
                    - role: pod
                      label: "app.kubernetes.io/part-of=kyverno"
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_container_port_name]
                  action: keep
                  regex: "metrics(-port)?"
    processors:
      # The same workload-identity mapping as the DaemonSet's kubernetesAttributes preset. It associates pod-scoped
      # resources by k8s.pod.uid, and derives service.name and service.namespace from the pod's app.kubernetes.io/*
      # labels. So these series land in Prometheus with the SAME promoted service_name and service_namespace labels as every dashboard.
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        pod_association:
          - sources:
              - { from: resource_attribute, name: k8s.pod.uid }
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.deployment.name
            - service.namespace
            - service.name
            - service.instance.id
      # Deployment and statefulset resources, such as k8s.deployment.desired and available, have no pod for k8sattributes
      # to associate. So fill service.name and namespace from the workload identity itself.
      transform/workload_identity:
        metric_statements:
          - context: resource
            statements:
              - set(attributes["service.name"], attributes["k8s.deployment.name"]) where attributes["service.name"] == nil and attributes["k8s.deployment.name"] != nil
              - set(attributes["service.name"], attributes["k8s.statefulset.name"]) where attributes["service.name"] == nil and attributes["k8s.statefulset.name"] != nil
              - set(attributes["service.namespace"], attributes["k8s.namespace.name"]) where attributes["service.namespace"] == nil and attributes["k8s.namespace.name"] != nil
              # Deployment names carry a ROLE suffix that the pod-label identity does not. Repo services deploy as
              # <service>-server and <service>-worker, and both pods have the label app.kubernetes.io/name=<service>. The
              # roles of the Temporal chart all have the label name=temporal.
              - replace_pattern(attributes["service.name"], "-(server|worker|frontend|history|matching|web|admintools)$$", "") where attributes["k8s.deployment.name"] != nil or attributes["k8s.statefulset.name"] != nil
              # CNPG's pooler Deployment, postgres-pgbouncer-rw, joins the
              # postgres identity that its pods already resolve to through
              # app.kubernetes.io/instance.
              - replace_pattern(attributes["service.name"], "^postgres-pgbouncer-.*$$", "postgres") where attributes["k8s.deployment.name"] != nil
      # Fixes for scraped exporters. service.namespace: the prometheus receiver sets only service.name, from the job. So
      # fill the namespace half of the identity pair that the dashboards filter on.
      transform/exporters:
        metric_statements:
          - context: resource
            statements:
              - set(attributes["service.namespace"], "{{ .Release.Namespace }}") where attributes["service.namespace"] == nil
          - context: datapoint
            statements:
              - delete_key(attributes, "service_name")
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
      batch: {}
    exporters:
      # The same Prometheus OTLP push as the DaemonSet. It keeps the rule that everything
      # reaches Prometheus as an OTLP push, and `scrape_configs` stays [].
      otlphttp/prometheus:
        endpoint: http://prometheus.platform.svc.cluster.local:9090/api/v1/otlp
    service:
      extensions: [health_check]
      pipelines:
        metrics:
          receivers: [k8s_cluster]
          processors: [memory_limiter, k8sattributes, transform/workload_identity, batch]
          exporters: [otlphttp/prometheus]
        # A separate pipeline. Scraped series must NOT pass k8sattributes or transform/workload_identity, because their
        # identity comes from the scrape job, not from pod association. And the k8s_cluster series must not lose their
        # datapoint attributes to delete_key.
        metrics/exporters:
          receivers: [prometheus/exporters]
          processors: [memory_limiter, transform/exporters, batch]
          exporters: [otlphttp/prometheus]
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-cluster
  labels: { app.kubernetes.io/name: otel-cluster, app.kubernetes.io/part-of: observability }
data:
  config.yaml: |
    {{- include "observability.otelCluster.config" . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-cluster
  labels: { app.kubernetes.io/name: otel-cluster, app.kubernetes.io/part-of: observability }
spec:
  # MUST stay 1. The receiver is a cluster-wide watch, so a second replica would
  # double every series. For HA, the receiver supports leader election. Raise the
  # replicas only together with that config.
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: otel-cluster }
  template:
    metadata:
      labels: { app.kubernetes.io/name: otel-cluster }
      # Roll on config change, because the collector reads config only at startup.
      annotations:
        checksum/config: {{ include "observability.otelCluster.config" . | sha256sum }}
    spec:
      serviceAccountName: otel-cluster
      # `restricted`, per ADR-0200. 10001 is the user that the collector image ships with.
      # This one reads the API server and writes nothing. So there is no fsGroup to
      # match, and the only mount is a read-only ConfigMap.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: otel-collector
          securityContext: {{- include "observability.containerSecurityContext" . | nindent 12 }}
          image: {{ $oc.image }}
          args:
            - --config=/etc/otelcol/config.yaml
          ports:
            - { name: health, containerPort: 13133 }
          readinessProbe: { httpGet: { path: /, port: health }, initialDelaySeconds: 10 }
          livenessProbe:  { httpGet: { path: /, port: health }, initialDelaySeconds: 30, periodSeconds: 30 }
          resources: {{- toYaml $oc.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/otelcol }
      volumes:
        - name: config
          configMap: { name: otel-cluster }
