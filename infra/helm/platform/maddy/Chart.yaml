apiVersion: v2
name: maddy
description: |
  Outbound mail submission and DKIM signing, per ADR-0307. Production only.
  Non-production environments deliver to Mailpit, which has no outbound path. So
  there, the never-deliver rule is a property of the component, not a setting.

  Submission and signing, and nothing else. There is no inbound listener, no
  mailbox store, and no IMAP surface. The platform sends mail and does not receive
  it. A mailbox system is separate infrastructure, with its own egress IP and its
  own DKIM selector.
type: application
version: "2026.9.3"
appVersion: "0.9.5"
