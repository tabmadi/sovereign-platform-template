apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: platform
  labels: { app.kubernetes.io/name: admin }
spec:
  replicas: {{ .Values.admin.replicas }}
  selector: { matchLabels: { app.kubernetes.io/name: admin } }
  template:
    metadata: { labels: { app.kubernetes.io/name: admin } }
    spec:
      {{- with .Values.admin.imagePullSecrets }}
      # The registry authenticates every pull, per ADR-0114, and a kubelet holds no credential of its own.
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # `restricted`, per ADR-0200.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: admin
          image: {{ include "admin.image" . | quote }}
          imagePullPolicy: {{ .Values.admin.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports: [{ name: http, containerPort: 3000 }]
          env:
            {{- range $k, $v := .Values.admin.env }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
          readinessProbe: { tcpSocket: { port: http } }
          resources: {{- toYaml .Values.admin.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata: { name: admin, namespace: platform }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: admin }
  ports: [{ name: http, port: 80, targetPort: http }]
