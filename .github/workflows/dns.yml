# DNS drift, per ADR-0206. The repository declares the zone, and this job fails when the provider holds something else.
# It changes nothing. A person runs `mise run dns:apply` to reconcile.
name: dns

on:
  schedule:
    - cron: "0 6 * * *" # after the nightly suites
  push:
    branches: [master]
    paths: ["infra/dns/**", "scripts/dns.sh"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # renovate runs as the dependency bot, never in a job. Its install is the largest in the toolchain and warns on every runner.
  MISE_DISABLE_TOOLS: npm:renovate
  # Every checkout runs `git init`, which prints a hint on each job while git has no default branch name.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: master

jobs:
  drift:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Compare the zone with the provider
        env:
          # CI's age key, which is a recipient of the provider credential, per ADR-0202. It is unset on a fork.
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY_CI }}
        run: mise run dns:check
