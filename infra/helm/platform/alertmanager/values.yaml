# Values are under `alertmanager:`, so this chart shares the platform overlay with the other charts, per ADR-0205.

# The hygiene report runs promtool, which ships in the Prometheus image. It is
# pinned here and not read from the observability chart, because a chart renders
# from its own values only.
prometheusImage: prom/prometheus:v3.1.0

alertmanager:
  enabled: true
  image:
    repository: prom/alertmanager
    tag: v0.28.1
    pullPolicy: IfNotPresent
  replicas: 1
  httpPort: 9093

  # Alertmanager keeps notification state on disk: what has fired and what is silenced. One replica on an emptyDir.
  # The state is a de-duplication cache. If it is lost, Alertmanager notifies again, and no alert is lost.
  resources:
    requests: { cpu: "20m", memory: "64Mi" }
    limits:   { memory: "256Mi" }

  # The `ticket` path. ADR-0307 makes every sender use SMTP. So this is a host,
  # a port, and a credential, like any other relay target: mailpit below the
  # production tier, and maddy in it.
  email:
    to: platform-alerts@localtest.me
    from: alertmanager@localtest.me
    smarthost: mailpit.platform.svc.cluster.local:1025
    # The sink uses plaintext and authenticates nobody. A deployed environment
    # sets this to true and points `smarthost` at maddy.
    requireTLS: false

  # The `page` path. ADR-0502 puts the on-call rotation behind this seam, for later.
  # It goes nowhere until a paging service is attached. That needs a URL and a
  # credential. No rule and no severity changes when it is attached.
  webhook:
    url: ""

  # The heartbeat path. It is a SEPARATE seam from the webhook above.
  watchdogWebhook:
    url: ""

  # Reconciles live silences to `infra/observability/alertmanager/silences.yaml`.
  # Ten minutes is the longest time that a silence created in the UI survives.
  # This makes the runbook's statement true: the silence goes away on the next reconcile.
  silenceSync:
    schedule: "*/10 * * * *"

  # Checks that the Watchdog still arrives. Five minutes matches its repeat interval
  # in the routing tree. So one cycle catches a missed heartbeat, and it does not
  # get lost in an average.
  watchdogCheck:
    schedule: "*/5 * * * *"

  # The page and ticket hygiene report. It is weekly, because it is a trend and not
  # an event. A daily copy of the same list is itself alert fatigue.
  hygieneReport:
    schedule: "0 6 * * 1"
    prometheusURL: http://prometheus.platform.svc.cluster.local:9090
    # Minutes that a `page` rule can fire in 30 days before the report proposes to
    # demote it. Six hours: a severity that says a human acts within minutes must not
    # fire for a working day each month.
    firingMinutesThreshold: 360

  # How long Alertmanager waits to batch an alert group, and how long it waits before
  # it notifies again about a group that still fires.
  groupWait: 30s
  groupInterval: 5m
  repeatInterval: 12h
