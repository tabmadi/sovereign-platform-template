apiVersion: v2
name: service
description: |
  The single Helm chart that every backend service in the monorepo uses, per
  ADR-0201. The difference per service is one values file per environment, at
  infra/gitops/services/<env>/values/<svc>.yaml.
  The chart sets these parameters: image, ports, replicas, env vars, ingress
  paths, resources, the Temporal worker, the migration init container, and
  references to Kubernetes Secrets backed by SOPS.
type: application
version: "2026.9.3"
appVersion: "2026.9.3"
