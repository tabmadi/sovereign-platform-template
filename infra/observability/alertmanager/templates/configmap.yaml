{{/*
The committed silences, as JSON. They are converted at render time, because the sync job runs in the
Alertmanager image, which has amtool and no YAML parser.
`fromYamlArray` on an empty file gives an empty list. That means no silences, and not an error.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-silences
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/component: observability
data:
  silences.json: |
    {{ .Files.Get "silences.yaml" | fromYamlArray | toJson }}
