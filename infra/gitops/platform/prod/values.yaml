# The in-cluster object store is non-prod only (ADR-0207): production runs the same implementation OUTSIDE the
# cluster, because a store that runs on the cluster it backs shares the failure domain it exists to survive. Gated
# off here, the same values-only way every other per-env delta is expressed.
seaweedfs:
  enabled: false

# Mailpit is the NON-production sink (ADR-0307). Production submits through maddy
# on a dedicated IP, so the sink is gated off here for the same reason the store is —
# and this flag drops its network policy with it (network-policies 35-mailpit).
mailpit:
  enabled: false

# Alertmanager routes `ticket` to email (ADR-0502), and production's relay is maddy rather than the sink
# (ADR-0307).
alertmanager:
  email:
    to: platform-alerts@example.com
    from: alertmanager@mail.example.com
    smarthost: maddy.platform.svc.cluster.local:587
    # False, and it is the same posture as every other east-west hop here rather than an exception: Postgres, OpenFGA
    # and Temporal are all reached in the clear inside the namespace, because ADR-0305 defers per-workload certificate
    # identity and the network policy is what admits a caller.
    requireTLS: false

# ...which is exactly why this is on. With no store in the cluster, every write leaves it: Loki, Tempo and
# postgres' `backup.s3.endpointURL` address the off-cluster store.
externalObjectStorage: true

# maddy is the production mail path (ADR-0307), and production is the only environment that has one: every other
# sinks to Mailpit, which cannot deliver.
maddy:
  enabled: true
  hostname: mail.example.com

# The policy follows the chart. network-policies renders maddy's rules only when
# the workload exists, and its egress is this platform's only allow to an
# arbitrary host on port 25.
maddyEnabled: true

# Top-level `cluster:` — the postgres chart's own values schema has no
# `postgres:` namespace wrapper (unlike the dependency subcharts below).
cluster:
  instances: 3
  storage: { size: 200Gi }
  backup:
    retentionPolicy: "30d"
    s3: { destinationPath: "s3://platform-prod-backups/postgres" }

# Observability backends run 2 replicas in prod for availability (ADR-0500);
# dev/staging keep the single-replica chart defaults.
loki:
  singleBinary: { replicas: 2 }
tempo:
  replicas: 2
grafana:
  replicas: 2

# ── Resource governance, sized for a multi-node production tier (ADR-0204) ── The chart's caps are computed
# against the single-node local tier, where the whole platform shares one machine.
resourceQuotas:
  platform:
    enabled: true
    requestsCPU: "16"
    requestsMemory: 32Gi
    limitsMemory: 96Gi
  argocd:
    enabled: true
    requestsCPU: "4"
    requestsMemory: 8Gi
    limitsMemory: 16Gi

# ── PodDisruptionBudgets, for the components this tier actually scales out ── Enabled ONLY where this file sets
# two replicas above.
podDisruptionBudgets:
  loki:
    enabled: true
  tempo:
    enabled: true

# Lowdefy admin console (ADR-0401): the one repo-built platform image. Pinned to
# the release commit by digest on a CalVer release (promote-on-release), the same
# immutable-identity guarantee every prod service gets.
lowdefy:
  # The registry this environment pulls from authenticates every pull (ADR-0105).
  imagePullSecrets:
    - name: registry-pull
  image:
    repository: ghcr.io/tabmadi/sovereign-platform-template/admin
    tag: "0000000000000000000000000000000000000000"   # pinned + digested by promote-on-release

# Talos ships no storage provisioner and nothing else claims the default
# StorageClass here (ADR-0200), so this is what an unannotated PVC resolves to.
# The laptop tier leaves it off — kind brings its own.
localPath:
  enabled: true

# The wildcard host this environment serves, and the ACME account that certifies it (ADR-0205).
envHost: prod.example.com
publicTls:
  enabled: true
  envHost: prod.example.com
  acme:
    email: ops@example.com

# Identity, at this environment's host.
kratos:
  kratos:
    config:
      serve:
        public:
          base_url: "https://prod.example.com/auth/"
      selfservice:
        default_browser_return_url: https://prod.example.com/
        # The apex, and every ops origin. The ops entry is what makes a denied
        # panel request return to that panel after login: Oathkeeper puts the
        # origin in `return_to`, and Kratos follows it only if it is listed here.
        allowed_return_urls:
          - https://prod.example.com/
          - https://*.ops.prod.example.com/
        flows:
          error:        { ui_url: https://prod.example.com/auth/error }
          login:        { ui_url: https://prod.example.com/auth/login }
          registration: { ui_url: https://prod.example.com/auth/register }
          recovery:     { ui_url: https://prod.example.com/auth/recovery }
          verification: { ui_url: https://prod.example.com/auth/verification }
          settings:     { ui_url: https://prod.example.com/auth/settings }
        methods:
          totp:
            config:
              issuer: prod.example.com
          webauthn:
            config:
              rp:
                id: prod.example.com
                display_name: Platform
                origins: ["https://prod.example.com"]
      # The ops tools are served at their own origins under `ops.<host>`
      # (ADR-0306), so the session cookie has to cover the whole host rather than
      # the apex alone.
      session:
        cookie:
          domain: prod.example.com

# Where Oathkeeper sends an unauthenticated browser request (ADR-0305).
oathkeeper:
  oathkeeper:
    config:
      errors:
        handlers:
          redirect:
            config:
              to: https://prod.example.com/auth/login
