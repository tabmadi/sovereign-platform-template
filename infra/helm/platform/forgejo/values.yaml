# Values are under `forgejo:`, so this chart shares the single per-environment values overlay of the platform
# ApplicationSet with no key collisions.
forgejo:
  # Off everywhere by default.
  enabled: false

  image:
    repository: codeberg.org/forgejo/forgejo
    # v16.0.2 and not the v15 line. Both got patch releases on the same day, so both are maintained. v16 has had
    # weeks of use in the field, and not days.
    tag: "16.0.2"
    digest: sha256:2fdfe28b5c68f82f49580e227b84e2afb43af0250e0631a54a386ef3b1d9b759
    pullPolicy: IfNotPresent

  # One replica. This is not a placeholder for two.
  replicas: 1

  # Repository storage. It is not object storage. git's own format is many small files
  # with hard links between them. A filesystem handles that well, and an S3 gateway
  # handles it worst.
  storage:
    size: 20Gi
    storageClass: ""   # the cluster's default, per ADR-0207

  # The database, on the existing CNPG cluster, per ADR-0102 and ADR-0300. The DSN
  # comes from a Secret and not from values. It carries a password, and ADR-0202
  # keeps passwords out of committed files.
  database:
    secretName: forgejo-db-creds

  # The admin account is NOT created here. Forgejo's `INSTALL_LOCK` closes the web installer. `forgejo admin user create`
  # creates the first account separately.
  config:
    # The externally reachable root. Every clone URL, webhook target, and OAuth
    # redirect is built from it. A wrong value gives a forge that works in the
    # browser but hands out URLs that nobody can reach.
    rootURL: https://forge.example.com/
    # This pod serves SSH on a non-privileged port. The edge is HTTP-only, because
    # ADR-0305 routes HTTP. So git over SSH needs a Service of type LoadBalancer or a
    # node port. That is per environment, so it is not decided here.
    sshPort: 2222
    # Off: this forge hosts one organisation's code. Open registration on a
    # self-hosted forge turns it into a file host for other people.
    disableRegistration: true
    requireSignin: true

  resources:
    requests: { cpu: "200m", memory: "512Mi" }
    limits:   { memory: "2Gi" }
