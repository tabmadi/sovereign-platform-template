# Prod promotion from a tag, per ADR-0201 and ADR-0112. The CalVer tag that `just release` cuts starts it.
# It pins every prod service to the release commit by digest and labels the images.
# It opens the pin as a PR that merges on green, and it gates on the rollout.
name: promote-on-release

on:
  push:
    tags: ["v[0-9][0-9][0-9][0-9].[0-9][0-9].*"]

permissions:
  contents: write
  pull-requests: write
  packages: write

env:
  # The binary cache of ADR-0101, read by the setup action. Without the variables both are empty.
  NIX_CACHE_URL: ${{ vars.NIX_CACHE_URL }}
  NIX_CACHE_PUBLIC_KEY: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
  # Every checkout runs `git init`, which prints a hint on each job while git has no default branch name.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: master

jobs:
  promote:
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-26.04
    steps:
      # The machine user that branch protection lets merge, in infra/forge/branch-protection.yaml. It pushes the prod pin branch.
      - uses: actions/checkout@v7
        with: {
          fetch-depth: 0,
          token: "${{ secrets.PROMOTE_TOKEN || secrets.GITHUB_TOKEN }}",
        }
      - uses: ./.github/actions/setup
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          # The same three settings as publish.yml. The registry is configuration.
          # A deployment with its own registry, per ADR-0114, sets them as forge variables and does not edit this file.
          registry: ${{ vars.IMAGE_REGISTRY || 'ghcr.io' }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Resolve release
        id: rel
        run: nix develop --command just ci-release-info >> "$GITHUB_OUTPUT"

      - name: Pin prod to digests and label images with the CalVer
        env:
          SHA: ${{ steps.rel.outputs.sha }}
          VER: ${{ steps.rel.outputs.version }}
        run: nix develop --command just promote-prod

      - name: Open the prod pin and merge it on green
        env:
          VER: ${{ steps.rel.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.PROMOTE_TOKEN || secrets.GITHUB_TOKEN }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY_CI }}
        run: nix develop --command just ci-release-pr

      # Argo `Healthy` already means the new ReplicaSet is available.
      # A release still reports success only after prod converges on the release commit, per ADR-0201 and ADR-0112.
      - name: Verify prod rollout
        env:
          SHA: ${{ steps.rel.outputs.sha }}
        run: nix develop --command just promote-verify

      - name: Publish the release
        env:
          VER: ${{ steps.rel.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: nix develop --command just ci-release-publish
