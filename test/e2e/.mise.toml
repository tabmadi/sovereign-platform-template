# The Node island (ADR-0100, ADR-0601): Bun cannot drive the Playwright runner — the extra-fd pipe transport and worker IPC corners of `child_process` are a Node-ecosystem-wide gap.
# The version resolves from the root [env] NODE_VERSION; the root `e2e*` tasks delegate with `mise run -C test/e2e`, which auto-installs node on first use.
[tools]
node = "{{env.NODE_VERSION}}"

# Tasks live here rather than at the root because mise tools flow DOWN a config
# tree, never up — a root task cannot see this node. The root keeps thin `e2e*`
# delegates so `mise run e2e` and the CI workflow are unchanged.
[tasks.install]
# Workspace deps plus the Chromium binary. `--with-deps` is omitted: it shells out to apt-get and breaks on Arch, Fedora and macOS.
run = """
npm ci || npm install
npm run install:browsers
"""

# The edge (*.localtest.me) must be hit directly, never through a dev HTTPS_PROXY;
# the in-cluster port-forwards are loopback. Belt-and-suspenders for both cases.
[tasks.test]
# Full browser acceptance + visual suite against a running cluster:up full (ADR-0601).
# Nightly + pre-release in CI; never part of ci:affected.
env = { NO_PROXY = "localhost,127.0.0.1,.localtest.me", no_proxy = "localhost,127.0.0.1,.localtest.me" }
run = "npm run test"

[tasks."test:smoke"]
# Label-gated per-PR subset: one product golden path + a key dashboard render.
env = { NO_PROXY = "localhost,127.0.0.1,.localtest.me", no_proxy = "localhost,127.0.0.1,.localtest.me" }
run = "npm run test:smoke"

[tasks."test:visual"]
# The screenshot baselines alone, for updating one after an intentional UI change:
# add `-- --update-snapshots`, and commit the result with the change that caused it.
env = { NO_PROXY = "localhost,127.0.0.1,.localtest.me", no_proxy = "localhost,127.0.0.1,.localtest.me" }
run = "npm run test:visual"

[tasks.lighthouse]
# Web vitals + bundle budgets against the running edge (ADR-0400). Same NO_PROXY
# reasoning as the suites above: the edge is hit directly, never through a proxy.
env = { NO_PROXY = "localhost,127.0.0.1,.localtest.me", no_proxy = "localhost,127.0.0.1,.localtest.me" }
run = "npm run lighthouse"

[tasks."test:a11y"]
# The axe scan alone, for iterating on an accessibility fix without the full suite.
env = { NO_PROXY = "localhost,127.0.0.1,.localtest.me", no_proxy = "localhost,127.0.0.1,.localtest.me" }
run = "npm run test:a11y"
