{{- if .Values.forgejo.enabled }}
{{- $f := .Values.forgejo }}
{{- /*
A stable `forgejo` name for any release name. Under Argo CD, the release is
`<env>-platform-forgejo`. The edge route and every clone URL address the forge by
this name.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: forgejo
  labels:
    app.kubernetes.io/name: forgejo
    app.kubernetes.io/part-of: platform
spec:
  selector:
    app.kubernetes.io/name: forgejo
  ports:
    - { name: http, port: 3000, targetPort: http }
    # Reachable only inside the cluster. Git over SSH from outside needs an address that
    # the edge cannot give, because the edge routes HTTP, per ADR-0305. So exposing this
    # is a per-environment decision about a LoadBalancer or a node port.
    - { name: ssh, port: {{ $f.config.sshPort | int }}, targetPort: ssh }
{{- end }}
