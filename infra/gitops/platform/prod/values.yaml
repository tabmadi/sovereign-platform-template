# The in-cluster object store is non-prod only, per ADR-0207. Production runs the same implementation OUTSIDE the
# cluster. A store on the cluster that it backs shares the failure domain that it must survive. It is turned off
# here with values only, like every other per-environment difference.
seaweedfs:
  enabled: false

# Mailpit is the NON-production sink, per ADR-0307. Production submits through maddy
# on a dedicated IP. So the sink is off here, for the same reason as the store.
# This flag also drops its network policy, in network-policies `35-mailpit`.
mailpit:
  enabled: false

# Alertmanager routes `ticket` to email, per ADR-0502. Production's relay is maddy and not the sink, per
# ADR-0307.
alertmanager:
  email:
    to: platform-alerts@example.com
    from: alertmanager@mail.example.com
    smarthost: maddy.platform.svc.cluster.local:587
    # False. This is the same posture as every other east-west hop here, not an exception. Postgres, OpenFGA, and
    # Temporal are all reached in the clear inside the namespace. ADR-0305 defers per-workload certificate identity,
    # and the network policy decides which callers get in.
    requireTLS: false

# This is on because of the store above. With no store in the cluster, every write leaves it. Loki, Tempo, and
# postgres' `backup.s3.endpointURL` address the off-cluster store.
externalObjectStorage: true

# maddy is the production mail path, per ADR-0307. Production is the only environment that has one. Every other
# environment sinks to Mailpit, which cannot deliver.
maddy:
  enabled: true
  hostname: mail.example.com

# The policy follows the chart. network-policies renders maddy's rules only when
# the workload exists. Its egress is this platform's only allow rule to any
# host on port 25.
maddyEnabled: true

# Top-level `cluster:`. The postgres chart's own values schema has no
# `postgres:` namespace wrapper, unlike the dependency subcharts below.
cluster:
  instances: 3
  storage: { size: 200Gi }
  backup:
    retentionPolicy: "30d"
    s3: { destinationPath: "s3://platform-prod-backups/postgres" }

# Observability backends run 2 replicas in prod for availability, per ADR-0500.
# Dev and staging keep the single-replica chart defaults.
loki:
  singleBinary: { replicas: 2 }
tempo:
  replicas: 2
grafana:
  replicas: 2

# Resource governance, sized for a multi-node production tier, per ADR-0204. The chart's caps are computed
# for the single-node local tier, where the whole platform shares one machine.
resourceQuotas:
  platform:
    enabled: true
    requestsCPU: "16"
    requestsMemory: 32Gi
    limitsMemory: 96Gi
  argocd:
    enabled: true
    requestsCPU: "4"
    requestsMemory: 8Gi
    limitsMemory: 16Gi

# PodDisruptionBudgets for the components that this tier scales out. They are on ONLY where this file sets
# two replicas above.
podDisruptionBudgets:
  loki:
    enabled: true
  tempo:
    enabled: true

# Lowdefy admin console, per ADR-0401. It is the one platform image built in this repo. On a CalVer
# release, promote-on-release pins it to the release commit by digest. Every prod service gets the same
# immutable identity.
lowdefy:
  # The registry that this environment pulls from authenticates every pull, per ADR-0105.
  imagePullSecrets:
    - name: registry-pull
  image:
    repository: ghcr.io/tabmadi/sovereign-platform-template/admin
    tag: "0000000000000000000000000000000000000000"   # promote-on-release pins it and adds the digest

# Talos ships no storage provisioner, and nothing else claims the default
# StorageClass here, per ADR-0200. So an unannotated PVC resolves to this one.
# The laptop tier leaves it off, because kind brings its own.
localPath:
  enabled: true

# The wildcard host that this environment serves, and the ACME account that certifies it, per ADR-0205.
envHost: prod.example.com
publicTls:
  enabled: true
  envHost: prod.example.com
  acme:
    email: ops@example.com

# Identity, at this environment's host.
kratos:
  kratos:
    config:
      serve:
        public:
          base_url: "https://prod.example.com/auth/"
      selfservice:
        default_browser_return_url: https://prod.example.com/
        # The apex, and every ops origin. The ops entry lets a denied panel request
        # return to that panel after login. Oathkeeper puts the origin in `return_to`,
        # and Kratos follows it only if it is listed here.
        allowed_return_urls:
          - https://prod.example.com/
          - https://*.ops.prod.example.com/
        flows:
          error:        { ui_url: https://prod.example.com/auth/error }
          login:        { ui_url: https://prod.example.com/auth/login }
          registration: { ui_url: https://prod.example.com/auth/register }
          recovery:     { ui_url: https://prod.example.com/auth/recovery }
          verification: { ui_url: https://prod.example.com/auth/verification }
          settings:     { ui_url: https://prod.example.com/auth/settings }
        methods:
          totp:
            config:
              issuer: prod.example.com
          webauthn:
            config:
              rp:
                id: prod.example.com
                display_name: Platform
                origins: ["https://prod.example.com"]
      # Each ops tool has its own origin under `ops.<host>`, per ADR-0306. So the
      # session cookie must cover the whole host and not only the apex.
      session:
        cookie:
          domain: prod.example.com

# Where Oathkeeper sends an unauthenticated browser request, per ADR-0305.
oathkeeper:
  oathkeeper:
    config:
      errors:
        handlers:
          redirect:
            config:
              to: https://prod.example.com/auth/login

# Admission control, per ADR-0104. A first-party image comes from this prefix, pinned by digest and signed with the platform key.
policies:
  imagePrefix: "ghcr.io/tabmadi/sovereign-platform-template/*"
  registrySecret: registry-pull
