# Values namespaced under `lowdefy:` (not top-level) so this chart can share the platform ApplicationSet's single
# per-env values overlay without its `image` key colliding with the openfga chart, which also reads a top-level
# `.Values.image`.
lowdefy:
  # ADR-0204.
  resources:
    requests: { cpu: "100m", memory: "320Mi" }
    limits:   { memory: "768Mi" }
  image:
    repository: ""        # per-env overlay: local → local registry, prod → ghcr
    tag: ""               # local → "local"; prod → git SHA
    pullPolicy: IfNotPresent

  # Empty where the registry needs no credential (the local tier's registry is
  # anonymous). A deployed environment names the Secret its SopsSecret carries.
  imagePullSecrets: []

  replicas: 2
  service:
    port: 3000

  env:
    LOWDEFY_BUILD_OUT_DIR: /app/build
    # The gateway forwards an authenticated identity header (ADR-0401).
    LOWDEFY_REQ_HEADER_USER: x-user-email
