## Explicit deny of the cloud metadata endpoint (ADR-0206). A deny takes precedence over any allow, so even a
## future broad `world` egress grant cannot become an SSRF path to instance credentials.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: deny-cloud-metadata
spec:
  endpointSelector: {}
  # CRITICAL: this policy selects every pod cluster-wide ({} selector) and carries an egressDeny rule. In Cilium, an
  # endpoint selected by ANY egress rule — including a deny — flips to egress DEFAULT-DENY.
  enableDefaultDeny:
    egress: false
  egressDeny:
    - toCIDR:
        - 169.254.169.254/32
