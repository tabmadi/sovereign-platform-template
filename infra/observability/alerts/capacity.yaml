# Capacity + saturation alerts (ADR-0500). Native Prometheus rule-file format — mounted into Prometheus via the
# `prometheus-alerts` ConfigMap (see service-availability.yaml for the delivery path).
groups:
  - name: capacity.disk
    rules:
      # Threshold: the condition that has actually bitten this project (a full host disk).
      - alert: NodeDiskSpaceLow
        expr: |
          100 * k8s_node_filesystem_available_bytes / k8s_node_filesystem_capacity_bytes < 15
        for: 15m
        labels: { severity: page }
        annotations:
          summary: "Node filesystem below 15% free"
          description: >-
            The node disk is filling. Below the eviction floor kubelet starts
            evicting pods with almost no warning (eviction-hard is pinned at 2%).
            Reclaim with `docker builder prune -af`, `docker image prune -a`, and
            `crictl rmi --prune` inside the node; a local registry also never
            garbage-collects on its own (`registry garbage-collect`).
      # Predictive: catches steady growth that a threshold only reports once it is already an incident.
      - alert: NodeDiskSpaceFillingUp
        expr: |
          predict_linear(k8s_node_filesystem_available_bytes[6h], 24 * 3600) < 0
        for: 1h
        labels: { severity: ticket }
        annotations:
          summary: "Node filesystem predicted to fill within 24h"
          description: >-
            Extrapolating the last 6h of free space, this filesystem runs out
            inside a day. Usually retention or image churn rather than a leak —
            check Prometheus/Loki/Tempo retention and image GC before adding disk.

  - name: capacity.saturation
    rules:
      - alert: NodeMemoryPressure
        expr: |
          100 * (1 - k8s_node_memory_available_bytes / (k8s_node_memory_available_bytes + k8s_node_memory_usage_bytes)) > 90
        for: 15m
        labels: { severity: page }
        annotations:
          summary: "Node memory above 90% used"
          description: >-
            Real memory saturation, not a requests problem. The next allocation
            spike OOM-kills whichever container is over its request — check the
            Applications dashboard for a workload whose usage has diverged from
            its limit.

  - name: capacity.scheduler
    rules:
      # requests > allocatable means the NEXT pod cannot be scheduled, regardless
      # of how idle the hardware looks. Named separately from saturation because
      # the remedy is different: lower requests or add a node, not tune the app.
      - alert: ClusterCPURequestsCommitted
        expr: |
          100 * sum(k8s_container_cpu_request) / sum(k8s_node_allocatable_cpu) > 85
        for: 30m
        labels: { severity: ticket }
        annotations:
          summary: "CPU requests at {{ $value | printf \"%.0f\" }}% of cluster allocatable"
          description: >-
            The scheduler is close to refusing new pods even if real CPU use is
            low. Adding a replica or a service will start failing to place before
            anything looks busy.
      - alert: ClusterMemoryRequestsCommitted
        expr: |
          100 * sum(k8s_container_memory_request_bytes) / sum(k8s_node_allocatable_memory_bytes) > 85
        for: 30m
        labels: { severity: ticket }
        annotations:
          summary: "Memory requests at {{ $value | printf \"%.0f\" }}% of cluster allocatable"
          description: >-
            As above, for memory. This is the number to size the next node
            against — not current usage, which understates what the scheduler
            has already promised.
