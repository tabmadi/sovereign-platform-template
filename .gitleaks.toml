# Plaintext-secret scanning. It checks the ADR-0202 rule that no committed file holds a plaintext secret value.
#
# This extends the default rule set and does not replace it. The gitleaks provider patterns are the list to use.

title = "platform secret scan"

[extend]
useDefault = true

[allowlist]
description = """
Encrypted and generated content. In each path here, high-entropy strings are the
correct state of the file, not a finding. An entry for any other path hides the
defect that this scan looks for.
"""

paths = [
  # SOPS output. These values are ciphertext, and the age recipients and MAC in the sops block are public.
  '''.*\.enc\.ya?ml$''',
  '''^\.sops\.yaml$''',

  # Lockfiles: integrity hashes, not credentials.
  '''^bun\.lock$''',
  '''.*/package-lock\.json$''',
  '''^go\.sum$''',

  # `mise run gen` rewrites the generated trees, so a secret cannot start here.
  '''^libs/(go|ts)/sdks/.*''',
  '''^apps/admin/_generated/.*''',

  # Committed public halves. A public key in a repository is the intended state.
  '''.*\.pub$''',

  # Untracked build output and dependencies. The rule covers committed files only.
  # A scan of these paths reads 1.6 GB of files that git does not track.
  '''.*node_modules/.*''',
  '''.*\.next/.*''',
  '''^test-results/.*''',
  '''^\.rumdl_cache/.*''',
  '''^\.idea/.*''',

  # The local secret store. .gitignore ignores `.env` and `.env.*`, so these are never committed files.
  # The second pattern skips `.env.<name>` only when the name does not start with `e`.
  # This keeps the tracked `.env.example` templates in the scan.
  '''(^|/)\.env$''',
  '''(^|/)\.env\.[^e].*''',

  # The local tier's age private key, committed under the ADR-0202 exemption. It decrypts only throwaway local values.
  # .sops.yaml limits it to one creation rule, and that limits the exemption.
  # Do not widen this pattern, and never encrypt a real credential to this key.
  '''^infra/gitops/platform/local/age\.key$''',
]

regexes = [
  # The all-zero image tag placeholder that the promotion workflow rewrites.
  '''0{40}''',
]

[[rules]]
id = "age-secret-key"
description = "age private key. It must never be committed, per ADR-0202"
regex = '''AGE-SECRET-KEY-1[0-9A-Z]{58}'''
keywords = ["age-secret-key"]
