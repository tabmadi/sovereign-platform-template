# The node-level OTel Collector (ADR-0500), alone in its own namespace (ADR-0200).

# The namespace every resource this chart renders lands in.
namespace: otel-agent

# The namespace holding the telemetry backends and the workloads that emit to this
# agent. Used by the network policies below.
backendNamespace: platform

opentelemetry-collector:
  namespaceOverride: otel-agent
  # One tier: a DaemonSet on every node. Services send OTLP to the ClusterIP Service; the agent batches, enriches
  # with k8s attributes, head-samples, and exports directly to Loki/Prometheus/Tempo.
  mode: daemonset
  fullnameOverride: otel-collector
  # Measured 2026-07-26: 345Mi working set, 110m CPU — the third-heaviest pod in the cluster, because every
  # service's OTLP, the Faro browser beacons, the Hubble scrape and the kubeletstats receiver all land in this one
  # process.
  resources:
    requests: { cpu: "100m", memory: "384Mi" }
    limits:   { memory: "768Mi" }
  # contrib distro: required by the kubernetesAttributes preset (k8sattributes processor) and the `faro` receiver
  # below (faroreceiver landed in contrib 0.128.0).
  image: { repository: otel/opentelemetry-collector-contrib, tag: "0.154.0" }
  # logsCollection is the ADR-0500 filelog path: the agent tails /var/log/pods via the chart's filelog receiver
  # (container parser, collector's own logs excluded) so PLATFORM workloads that only write stdout — postgres,
  # temporal, grafana, lowdefy, … — land in Loki too.
  presets:
    kubernetesAttributes: { enabled: true }
    logsCollection: { enabled: true }
  # RBAC for the kubeletstats receiver (added to the metrics pipeline below): the kubelet's /stats/summary endpoint
  # authorizes against the nodes/stats subresource.
  clusterRole:
    # Named for the RELEASE, not for the workload, which is the one place the split needs a rename.
    name: otel-agent
    clusterRoleBinding:
      name: otel-agent
    rules:
      - apiGroups: [""]
        resources: ["nodes/stats", "nodes/proxy"]
        verbs: ["get", "list", "watch"]
      # kubelet's own /metrics endpoint authorizes against a THIRD subresource,
      # separate from the two above: without it the scrape below gets a 403 and
      # the collector reports a target down rather than a permission problem.
      - apiGroups: [""]
        resources: ["nodes/metrics"]
        verbs: ["get"]
      # PVC/PV reads for the kubeletstats `volume` metric group's k8s_api_config,
      # which turns per-volume series keyed by the in-pod name ("data", shared by
      # every StatefulSet) into series keyed by the actual claim.
      - apiGroups: [""]
        resources: ["persistentvolumeclaims", "persistentvolumes"]
        verbs: ["get", "list", "watch"]
  # Browser beacons reach the collector through a ClusterIP Service (Traefik →
  # otel-collector.otel-agent:8027). Services emit to this Service too, at 4317.
  # In daemonset mode the chart omits the Service unless explicitly enabled.
  service: { enabled: true }
  # Expose the Faro receiver port on that Service so Traefik can route to it
  # (infra/gateway/frontend-observability.yaml, ADR-0400).
  ports:
    faro: { enabled: true, containerPort: 8027, servicePort: 8027, protocol: TCP }
    # The chart declares Jaeger and Zipkin receiver ports by default and this collector runs none of them — no
    # `jaeger` or `zipkin` receiver appears in the config below.
    jaeger-compact: { enabled: false }
    jaeger-thrift:  { enabled: false }
    jaeger-grpc:    { enabled: false }
    zipkin:         { enabled: false }
  config:
    receivers:
      otlp: { protocols: { grpc: { endpoint: 0.0.0.0:4317 }, http: { endpoint: 0.0.0.0:4318 } } }
      # Browser RUM from the frontend's Grafana Faro agent (ADR-0400). Emits
      # web traces and RUM logs/events; fed into the traces + logs pipelines
      # below so browser signals land in the same Tempo/Loki as services.
      faro: { endpoint: 0.0.0.0:8027 }
      # Hubble flow metrics off the cilium-agent (ADR-0500) — the ONE scrape in this repo.
      prometheus/hubble:
        config:
          scrape_configs:
            - job_name: hubble
              scrape_interval: 30s
              static_configs:
                - targets: ["${env:K8S_NODE_IP}:9965"]
      # Image-pull outcomes from the local kubelet's own /metrics endpoint.
      prometheus/kubelet:
        config:
          scrape_configs:
            - job_name: kubelet
              scrape_interval: 60s
              scheme: https
              tls_config:
                insecure_skip_verify: true
              authorization:
                type: Bearer
                credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              static_configs:
                - targets: ["${env:K8S_NODE_IP}:10250"]
              metric_relabel_configs:
                - source_labels: [__name__]
                  regex: "kubelet_image_pull_duration_seconds.*|kubelet_runtime_operations_errors_total"
                  action: keep
      # Per-pod/container/node CPU & memory from the local kubelet's Summary API (ADR-0501 POC — the resource panels on
      # the service-detail dashboard).
      kubeletstats:
        collection_interval: 20s
        auth_type: serviceAccount
        endpoint: "https://${env:K8S_NODE_IP}:10250"
        insecure_skip_verify: true
        # `volume` is the one that protects the data tier. Postgres, Loki, Tempo, Prometheus and the object store all
        # write to PVCs, and a full PVC does not evict a pod or fail a probe — Postgres simply starts refusing writes.
        metric_groups: [pod, container, node, volume]
        # Resolve volumes to their PersistentVolumeClaim / PV names.
        k8s_api_config:
          auth_type: serviceAccount
        # Usage-vs-limit ratios (off by default). Computed from the pod spec the receiver reads via the kubelet's /pods
        # endpoint (nodes/proxy, granted above).
        metrics:
          k8s.pod.memory_limit_utilization: { enabled: true }
          k8s.pod.cpu_limit_utilization: { enabled: true }
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
      # A batch small enough that the request carrying it fits the receiver's frame.
      batch:
        send_batch_size: 1000
        send_batch_max_size: 1000
      # Head sampling at the agent (ADR-0500). Error traces are kept at 100% by the services' parentbased SDK sampler
      # (OTEL_TRACES_SAMPLER_ARG); this caps healthy-trace volume.
      probabilistic_sampler:
        sampling_percentage: 5
    connectors:
      # The marketing split (ADR-0700). `marketing.*` events arrive on the Faro receiver like every other browser
      # signal, and this diverts them out of the logs pipeline before they reach Loki.
      routing:
        default_pipelines: [logs/ops]
        error_mode: ignore
        table:
          - context: log
            condition: 'IsMatch(attributes["faro.name"], "^marketing[.]")'
            pipelines: [logs/marketing]
    exporters:
      otlphttp/tempo:      { endpoint: http://tempo.platform.svc.cluster.local:4318 }
      # The analytics service (ADR-0700). A first-party service rather than a
      # platform component, so this is an ordinary in-cluster endpoint.
      otlphttp/analytics:  { endpoint: http://analytics-server.platform.svc.cluster.local/api/analytics/events }
      # Prometheus native OTLP receiver (--web.enable-otlp-receiver). The otlphttp
      # exporter appends /v1/metrics to this base path.
      otlphttp/prometheus: { endpoint: http://prometheus.platform.svc.cluster.local:9090/api/v1/otlp }
      # Loki's native OTLP endpoint — the standalone `loki` exporter was removed
      # from the Collector (≤ v0.112), so push logs over OTLP instead.
      otlphttp/loki:       { endpoint: http://loki.platform.svc.cluster.local:3100/otlp }
    service:
      pipelines:
        traces:  { receivers: [otlp, faro], processors: [memory_limiter, probabilistic_sampler, batch], exporters: [otlphttp/tempo] }
        metrics: { receivers: [otlp, prometheus/hubble, prometheus/kubelet, kubeletstats], processors: [memory_limiter, batch], exporters: [otlphttp/prometheus] }
        # Every log and browser signal enters here and is split by the routing
        # connector below; nothing else changes about the ops path.
        logs:            { receivers: [otlp, faro], processors: [memory_limiter, batch], exporters: [routing] }
        logs/ops:        { receivers: [routing], exporters: [otlphttp/loki] }
        logs/marketing:  { receivers: [routing], exporters: [otlphttp/analytics] }
