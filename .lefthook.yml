# Git hooks, per ADR-0101 and ADR-0103. `mise run setup` installs them.
#
# Every command runs through `mise exec --`. The pinned tools are not on PATH otherwise,
# and an IDE commit dialog or an agent does not run the user's shell profile.
# A bare name then fails with exit 127, or finds an unpinned distro version that CI does not use.
#
# Nothing checks that `mise` itself is on PATH: `mise: command not found` already names the cause.
# `mise exec` installs a missing pinned tool, so a fresh clone needs no check.
#
# Do not set PATH in an `rc:` file: lefthook 2.1.9 accepts the key and never sources the file.

commit-msg:
  commands:
    cog:
      run: mise exec -- cog verify --ignore-merge-commits --file {1}

pre-commit:
  # This matches `mise run lint` and the formatters. A glob limits each check to the staged files it reads.
  # Keep it in step with the `lint` and `format` tasks in .mise.toml. A check that only CI runs lets a commit pass locally.
  #
  # The hooks run in sequence. Each analyser takes under two seconds, and `gen-drift` takes minutes.
  # In parallel, `gen-drift` regenerates the tree while the analysers read it.
  # Biome and golangci-lint then fail at random on files that exist.
  piped: true
  commands:
    go-fmt:
      glob: "*.go"
      # `golangci-lint fmt` applies the formatters from .golangci.yml.
      # It skips generated files through `formatters.exclusions.generated`. A bare gofumpt does not.
      run: mise exec -- golangci-lint fmt {staged_files}
      stage_fixed: true
    golangci-lint:
      glob: "*.go"
      # Pass packages, not the staged files: golangci-lint rejects file arguments from more than one directory.
      # `--new-from-rev` still reports only the issues that the staged changes add.
      run: mise exec -- golangci-lint run --new-from-rev HEAD ./...
    gostyle:
      # The custom Go layout analyzers of `lint:gostyle`. They check packages, like golangci-lint.
      glob: "*.go"
      run: mise run lint:gostyle
    sqruff:
      glob: "{services/**/migrations/*.sql,services/**/internal/store/queries/*.sql}"
      run: mise exec -- sqruff lint {staged_files}
    vacuum:
      glob: "services/**/openapi.yaml"
      run: mise exec -- vacuum lint --ruleset tools/codegen/openapi-ruleset.yaml --fail-severity error {staged_files}
    api-audience:
      # The audience and exposure gate of `lint:api-audience`. It reads the specs and the routes.
      glob: "services/**/openapi.yaml"
      run: mise run lint:api-audience
    secrets:
      # A plaintext-secret scan over the working tree, per ADR-0202. It checks that the new change is clean.
      # CI scans the history, which is a different check.
      run: mise run lint:secrets
    floating-tags:
      run: mise run lint:floating-tags
    gen-drift:
      # Every input that `mise run gen` reads into a committed artifact: specs and SQL for the SDKs,
      # `docs/adr/` for the rules index and the security baseline, `infra/helm/` for the image allow-list,
      # and `tools/codegen/` for the shared components and retention.
      glob: "{services/**/openapi.yaml,services/**/internal/store/queries/*.sql,services/**/migrations/*.sql,sqlc.yaml,docs/adr/*.md,infra/helm/**,tools/codegen/*.yaml}"
      run: mise run ci:gen
    biome:
      # This matches the repo-wide scope of biome.jsonc. Biome checks these extensions in every directory,
      # including the infra/ JSON of the Grafana dashboards. A narrower glob lets a file pass here and fail CI.
      #
      # `exclude` matches the negated includes of biome.jsonc, and it is needed.
      # A file named on the command line overrides the config's include list.
      # Without `exclude`, Biome checks and can rewrite generated files that CI drift-checks.
      glob: "**/*.{ts,tsx,js,jsx,json,jsonc,css}"
      exclude:
        - "libs/ts/sdks/**"
        - "apps/admin/_generated/**"
        - "apps/frontend/public/devportal/**"
        - "test/e2e/**"
      run: mise exec -- biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    rumdl:
      glob: "*.md"
      run: mise exec -- rumdl check --fix {staged_files}
      stage_fixed: true
    shfmt:
      # The shell formatter of `format:shell`. `-i 2` matches the 2-space indent of the scripts.
      glob: "*.sh"
      run: mise exec -- shfmt -w -i 2 {staged_files}
      stage_fixed: true
    shellcheck:
      # The shell lint of `lint:shell`. It runs the repo-wide script, so it also finds cross-file problems.
      glob: "*.sh"
      run: mise run lint:shell
    comments:
      # The comment rules of ADR-0001, through `lint:comments`, over every file type with comments.
      glob: "*.{go,ts,tsx,sh,yaml,yml,toml}"
      run: mise run lint:comments
    log-vocab:
      # The vocabulary gate for human output, `lint:log-vocab`.
      glob: "scripts/**/*.sh"
      run: mise run lint:log-vocab
    node-scope:
      # The Node confinement guard, `lint:node-scope`. It fails when a lockfile appears outside its scope.
      glob: "{**/package.json,**/package-lock.json,**/bun.lock}"
      run: mise run lint:node-scope
    auth-inline:
      # The guard that keeps one source for auth config, `lint:auth-inline`.
      glob: "infra/{auth/**,helm/platform/ory/values.yaml}"
      run: mise run lint:auth-inline
    authz:
      glob: "infra/{auth/openfga/**,auth/oathkeeper/access-rules.json,gateway/**,helm/service/**}"
      run: mise run lint:authz
pre-push:
  commands:
    cog-check:
      run: mise exec -- cog check --ignore-merge-commits
