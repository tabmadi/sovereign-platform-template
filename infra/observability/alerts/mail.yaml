# Mail delivery, watched from both ends, per ADR-0307. ADR-0502 routes it.
groups:
  - name: mail.submission
    rules:
      # maddy refuses or fails submissions. The senders are Kratos, the services, and
      # Alertmanager. A submission failure means the message never entered the queue.
      # So no retry is pending, and nothing will deliver it later.
      - alert: MailSubmissionFailing
        expr: |
          sum(rate(errors_total{kind="dependency", service_name="kratos"}[10m])) > 0
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: "Mail submission is failing"
          description: >-
            The courier cannot give messages to the submission endpoint. No
            verification or recovery mail goes out. This happens before
            deliverability, so do not look at DNS and DKIM first.
      # Transactions that start and do not finish. maddy exposes no queue-depth
      # series, so this counts the gap between accepted and delivered.
      - alert: MailTransactionsAborting
        expr: |
          sum(rate(maddy_smtp_aborted_transactions[30m]))
            / clamp_min(sum(rate(maddy_smtp_started_transactions[30m])), 0.001)
            > 0.1
        for: 30m
        labels: { severity: ticket }
        annotations:
          summary: "Outbound mail transactions are aborting"
          description: >-
            More than a tenth of submission transactions do not complete. A
            receiver defers or refuses them. Before you change configuration, check
            the DMARC aggregate reports, and check whether the egress IP is on a list.
      # Permanent rejections. No retry fixes them.
      - alert: MailPermanentlyRejected
        expr: |
          sum(rate(maddy_smtp_failed_commands{smtp_code=~"5.."}[30m])) > 0
        for: 30m
        labels: { severity: ticket }
        annotations:
          summary: "Receivers permanently reject outbound mail"
          description: >-
            A receiver refuses messages completely, and does not defer them.
            Check the `smtp_enchcode` label. `5.7.x` is a policy rejection, which
            points at DKIM, SPF, or the egress IP's reputation.

  - name: mail.identity-flow
    rules:
      # ADR-0307's named signal. It still works when the agent is configured correctly.
      - alert: IdentityVerificationCompletionDropped
        expr: |
          (
            sum(increase(http_server_request_duration_seconds_count{http_route="/self-service/verification", http_response_status_code=~"2.."}[6h]))
            / (sum(increase(http_server_request_duration_seconds_count{http_route="/self-service/registration", http_response_status_code=~"2.."}[6h])) > 10)
          ) < 0.5
        for: 1h
        labels: { severity: ticket }
        annotations:
          summary: "Fewer than half of new identities are completing verification"
          description: >-
            The signal that ADR-0307 names for a lost verification mail. The mail
            path can be healthy from this side: accepted, signed, queued, and sent.
            The mail can still arrive nowhere. So check the receiver's
            authentication results and the DMARC reports, and not the agent's logs.
            The denominator guard stops a quiet period from firing this.
