cilium:
  # kube-proxy is not installed (ADR-0206), so the agent addresses the API server directly rather than through a
  # Service.
  kubeProxyReplacement: true
  k8sServiceHost: localhost
  k8sServicePort: 7445

  # ADR-0200's third invariant: a pod gets no more kernel surface than it needs, and the agent is a pod.
  securityContext:
    capabilities:
      ciliumAgent:
        - CHOWN
        - KILL
        - NET_ADMIN
        - NET_RAW
        - IPC_LOCK
        - SYS_ADMIN
        - SYS_RESOURCE
        - PERFMON
        - BPF
        - DAC_OVERRIDE
        - FOWNER
        - SETGID
        - SETUID
      cleanCiliumState:
        - NET_ADMIN
        - SYS_ADMIN
        - SYS_RESOURCE

  ipam:
    mode: kubernetes

  # WireGuard transparent encryption for all east-west pod traffic (ADR-0206).
  # A config flag, not a sidecar: multi-tenant PII and audit posture do not ship
  # plaintext east-west. Node-to-node only; host-level traffic is out of scope.
  encryption:
    enabled: true
    type: wireguard

  # Hubble gives per-flow network visibility without a sidecar (ADR-0206). It is the audit surface for internal
  # header-trust (ADR-0305) and the source for the network-flow metrics scraped into Grafana.
  hubble:
    enabled: true
    relay:
      enabled: true
    ui:
      enabled: true
      # Served at the ROOT of the `hubble.ops.<host>` subdomain (gateway IngressRoute matches HostRegexp
      # `^hubble\.ops\.`), not under a path prefix.
      baseUrl: /
    # Flow metrics on the agent at :9965, scraped by the node-local OTel collector and surfaced in Grafana (ADR-0500,
    # ADR-0501).
    metrics:
      enabled:
        - "drop:sourceContext=workload;destinationContext=workload"
