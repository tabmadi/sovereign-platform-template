name: orgs
image:
  repository: ghcr.io/tabmadi/sovereign-platform-template/orgs-server
  tag: "0000000000000000000000000000000000000000"
  digest: ""   # promote-on-release pins prod by digest, per ADR-0103
worker:
  enabled: true            # RegisterUser dual-write, per ADR-0302
  image:
    repository: ghcr.io/tabmadi/sovereign-platform-template/orgs-worker
    tag: "0000000000000000000000000000000000000000"
    digest: ""   # promote-on-release pins prod by digest, per ADR-0103
server:  { replicas: 1 }
ingress: { enabled: true, host: prod.example.com, resources: [orgs] }
# Kratos calls `/identity-created` east-west on the server port, per ADR-0304. The first-operator Job makes the same call.
# The edge rule `allowFromGateway` covers only Traefik to `/api/orgs`, so allow both.
# The Lowdefy admin console in `apps/admin` also calls orgs from its server, per ADR-0401.
networkPolicy: { allowFrom: [kratos, lowdefy, first-operator] }
secrets: { envFrom: [orgs-db, openfga-creds] }
env:
  # Write authz, per ADR-0304: the worker grants org admin through the shared OpenFGA
  # Granter. A blank preshared key falls back to `openfga-creds.preshared_key` from `envFrom`.
  OPENFGA_API_URL: "http://openfga.platform.svc.cluster.local:8080"
  OPENFGA_PRESHARED_KEY: ""
