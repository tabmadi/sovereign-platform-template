# Root App-of-Apps, per ADR-0201. One manual `kubectl apply` of this file happens at cluster bootstrap. Argo CD
# reconciles everything else from git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: bootstrap
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  # The hand-applied bootstrap seed stays in `default`. It creates the per-environment
  # AppProjects in `appproject.yaml`, so it cannot live in one of them.
  project: default
  source:
    repoURL: https://github.com/tabmadi/sovereign-platform-template.git
    targetRevision: master
    path: infra/gitops/dev-bootstrap
    directory:
      recurse: true
      exclude: root-application.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
    # Retry the sync operation on failure. Automated sync with selfHeal does NOT run a sync again after it failed on the
    # same commit. Without a retry, a short repo-server or network outage during bootstrap parks this keystone app
    # until a manual `argocd app sync`.
    retry:
      limit: 20
      backoff: { duration: 10s, maxDuration: 2m, factor: 2 }
