apiVersion: v2
name: observability
description: |
  Grafana + Loki/Tempo (monolithic single-binary mode) + Prometheus (Core metrics,
  local TSDB, OTLP ingest) + the cluster-state collector (ADR-0500). Self-hosted via
  official charts; log/trace long-term storage is the external S3 bucket from
  ADR-0207. Mimir (metrics Scale swap), Pyroscope (profile storage), and the OTel
  Collector gateway tier are per-project add-ons (`profiling` / tail-sampling flags /
  Scale seam), not in the default release.

  The single-tier collector DaemonSet everything pushes to is the `otel-agent`
  chart. It is separate because it needs hostPath and hostPorts, and Pod Security
  Admission's unit is the namespace (ADR-0200): keeping it here would set this
  namespace's floor at `privileged` for every backend beside it.
type: application
version: "2026.9.0"
appVersion: "1.0.0"

# Subcharts are vendored under charts/ and rendered directly — there is no `dependencies:` block on purpose.

# Prometheus runs as a hand-written Deployment (templates/prometheus.yaml), not a subchart: the Core metrics floor
# is one prom/prometheus process with a local TSDB and native OTLP ingest — no Helm dependency, no object storage.
