version: "2"
run:
  tests: true
linters:
  default: all
  disable:
    # --- deprecated ---
    - gomodguard          # replaced by gomodguard_v2
    - wsl                 # replaced by wsl_v5
    # --- conflict with the gofumpt formatter in a blank-line loop that never ends ---
    - wsl_v5
    - nlreturn
    # --- conflict with idiomatic Go or the ADRs ---
    - exhaustruct         # requires every zero-value field to be written out
    - varnamelen          # bans idiomatic short names such as i, tx, db, r, and w
    - err113              # ADR-0100 has no custom error DSL and no sentinel for each error
    - ireturn             # ADRs require interface returns for otel, temporal, and authz
    - gochecknoglobals    # ADR-0500 metrics and CLI flags are idiomatic globals
    - mnd                 # magic-number noise for timeouts and pool sizes
    - tagliatelle         # the ADR-0303 API uses snake_case json tags
    - testpackage         # white-box tests of unexported funcs are intended
    # --- repeat a check in the complexity family: cyclop, gocognit, and funlen stay ---
    - gocyclo             # cyclomatic, the same as cyclop
    - nestif              # a subset of gocognit
    - maintidx            # a composite of cyclop, gocognit, and funlen
  settings:
    cyclop:
      max-complexity: 15
    errcheck:
      disable-default-exclusions: true
    errorlint:
      comparison: false
    wrapcheck:
      # tools/internal/* is this repo's own code, not a boundary that an error crosses.
      ignore-package-globs:
        - github.com/tabmadi/sovereign-platform-template/tools/internal/*
    gocritic:
      enabled-checks:
        - ruleguard
      settings:
        ruleguard:
          rules: '${base-path}/tools/gorules/rules.go'
    depguard:
      rules:
        no-deep-imports:
          list-mode: lax
          files:
            - '**/apps/**'
            - '**/tools/**'
          deny:
            - pkg: github.com/tabmadi/sovereign-platform-template/services
              desc: apps/ and tools/ must not import services/<X>/internal/. Use the generated client.
        pgx-transaction-mode:
          list-mode: lax
          files:
            - '**/services/**'
            - '**/libs/go/dbmw/**'
          deny:
            - pkg: github.com/jackc/pgx/v5/stdlib
              desc: Use *pgxpool.Pool, not the stdlib database/sql, per ADR-0300.
        # One rule for each service, because services/X must not import services/Y. A depguard rule is one file pattern with a deny list.
        # A new service adds its own block. `lint:service-contract` fails when one is missing.
        # Services that share a Go package share a deploy and a failure. The boundary is the generated HTTP client, per ADR-0101.
        service-isolation-platform:
          list-mode: lax
          files:
            - '**/services/platform/**'
          deny:
            - pkg: github.com/tabmadi/sovereign-platform-template/services/analytics
              desc: services/platform must not import services/analytics. Cross-service access is HTTP through the generated client, per ADR-0101 and ADR-0300.
            - pkg: github.com/tabmadi/sovereign-platform-template/services/authz
              desc: services/platform must not import services/authz. Cross-service access is HTTP through the generated client, per ADR-0101 and ADR-0300.
            - pkg: github.com/tabmadi/sovereign-platform-template/services/catalog
              desc: services/platform must not import services/catalog. Cross-service access is HTTP through the generated client, per ADR-0101 and ADR-0300.
            - pkg: github.com/tabmadi/sovereign-platform-template/services/orders
              desc: services/platform must not import services/orders. Cross-service access is HTTP through the generated client, per ADR-0101 and ADR-0300.
            - pkg: github.com/tabmadi/sovereign-platform-template/services/orgs
              desc: services/platform must not import services/orgs. Cross-service access is HTTP through the generated client, per ADR-0101 and ADR-0300.
            - pkg: github.com/tabmadi/sovereign-platform-template/services/payment
              desc: services/platform must not import services/payment. Cross-service access is HTTP through the generated client, per ADR-0101 and ADR-0300.
        service-isolation-analytics:
          list-mode: lax
          files:
            - '**/services/analytics/**'
          deny:
            - pkg: github.com/tabmadi/sovereign-platform-template/services/authz
              desc: services/analytics must not import services/authz. Cross-service access is HTTP through the generated client, per ADR-0101 and ADR-0300.
            - pkg: github.com/tabmadi/sovereign-platform-template/services/catalog
              desc: services/analytics must not import services/catalog. Cross-service access is HTTP through the generated client, per ADR-0101 and ADR-0300.
            - pkg: github.com/tabmadi/sovereign-platform-template/services/orders
              desc: services/analytics must not import services/orders. Cross-service access is HTTP through the generated client, per ADR-0101 and ADR-0300.
            - pkg: github.com/tabmadi/sovereign-platform-template/services/orgs
              desc: services/analytics must not import services/orgs. Cross-service access is HTTP through the generated client, per ADR-0101 and ADR-0300.
            - pkg: github.com/tabmadi/sovereign-platform-template/services/payment
              desc: services/analytics must not import services/payment. Cross-service access is HTTP through the generated client, per ADR-0101 and ADR-0300.
            - pkg: github.com/tabmadi/sovereign-platform-template/services/platform
              desc: services/analytics must not import services/platform. Cross-service access is HTTP through the generated client, per ADR-0101 and ADR-0300.
        service-isolation-authz:
          list-mode: lax
          files:
            - '**/services/authz/**'
          deny:
            - pkg: github.com/tabmadi/sovereign-platform-template/services/catalog
              desc: services/authz must not import services/catalog. Cross-service access is HTTP through the generated client, per ADR-0101 and ADR-0300.
            - pkg: github.com/tabmadi/sovereign-platform-template/services/orders
              desc: services/authz must not import services/orders. Cross-service access is HTTP through the generated client, per ADR-0101 and ADR-0300.
            - pkg: github.com/tabmadi/sovereign-platform-template/services/orgs
              desc: services/authz must not import services/orgs. Cross-service access is HTTP through the generated client, per ADR-0101 and ADR-0300.
            - pkg: github.com/tabmadi/sovereign-platform-template/services/payment
              desc: services/authz must not import services/payment. Cross-service access is HTTP through the generated client, per ADR-0101 and ADR-0300.
            - pkg: github.com/tabmadi/sovereign-platform-template/services/_template
              desc: services/authz must not import services/_template. Cross-service access is HTTP through the generated client, per ADR-0101 and ADR-0300.
            - pkg: github.com/tabmadi/sovereign-platform-template/services/analytics
              desc: services/authz must not import services/analytics. Cross-service access is HTTP through the generated client, per ADR-0101 and ADR-0300.
            - pkg: github.com/tabmadi/sovereign-platform-template/services/platform
              desc: services/authz must not import services/platform. Cross-service access is HTTP through the generated client, per ADR-0101 and ADR-0300.
        service-isolation-catalog:
          list-mode: lax
          files:
            - '**/services/catalog/**'
          deny:
            - pkg: github.com/tabmadi/sovereign-platform-template/services/authz
              desc: services/catalog must not import services/authz. Cross-service access is HTTP through the generated client, per ADR-0101 and ADR-0300.
            - pkg: github.com/tabmadi/sovereign-platform-template/services/orders
              desc: services/catalog must not import services/orders. Cross-service access is HTTP through the generated client, per ADR-0101 and ADR-0300.
            - pkg: github.com/tabmadi/sovereign-platform-template/services/orgs
              desc: services/catalog must not import services/orgs. Cross-service access is HTTP through the generated client, per ADR-0101 and ADR-0300.
            - pkg: github.com/tabmadi/sovereign-platform-template/services/payment
              desc: services/catalog must not import services/payment. Cross-service access is HTTP through the generated client, per ADR-0101 and ADR-0300.
            - pkg: github.com/tabmadi/sovereign-platform-template/services/_template
              desc: services/catalog must not import services/_template. Cross-service access is HTTP through the generated client, per ADR-0101 and ADR-0300.
            - pkg: github.com/tabmadi/sovereign-platform-template/services/analytics
              desc: services/catalog must not import services/analytics. Cross-service access is HTTP through the generated client, per ADR-0101 and ADR-0300.
            - pkg: github.com/tabmadi/sovereign-platform-template/services/platform
              desc: services/catalog must not import services/platform. Cross-service access is HTTP through the generated client, per ADR-0101 and ADR-0300.
        service-isolation-orders:
          list-mode: lax
          files:
            - '**/services/orders/**'
          deny:
            - pkg: github.com/tabmadi/sovereign-platform-template/services/authz
              desc: services/orders must not import services/authz. Cross-service access is HTTP through the generated client, per ADR-0101 and ADR-0300.
            - pkg: github.com/tabmadi/sovereign-platform-template/services/catalog
              desc: services/orders must not import services/catalog. Cross-service access is HTTP through the generated client, per ADR-0101 and ADR-0300.
            - pkg: github.com/tabmadi/sovereign-platform-template/services/orgs
              desc: services/orders must not import services/orgs. Cross-service access is HTTP through the generated client, per ADR-0101 and ADR-0300.
            - pkg: github.com/tabmadi/sovereign-platform-template/services/payment
              desc: services/orders must not import services/payment. Cross-service access is HTTP through the generated client, per ADR-0101 and ADR-0300.
            - pkg: github.com/tabmadi/sovereign-platform-template/services/_template
              desc: services/orders must not import services/_template. Cross-service access is HTTP through the generated client, per ADR-0101 and ADR-0300.
            - pkg: github.com/tabmadi/sovereign-platform-template/services/analytics
              desc: services/orders must not import services/analytics. Cross-service access is HTTP through the generated client, per ADR-0101 and ADR-0300.
            - pkg: github.com/tabmadi/sovereign-platform-template/services/platform
              desc: services/orders must not import services/platform. Cross-service access is HTTP through the generated client, per ADR-0101 and ADR-0300.
        service-isolation-orgs:
          list-mode: lax
          files:
            - '**/services/orgs/**'
          deny:
            - pkg: github.com/tabmadi/sovereign-platform-template/services/authz
              desc: services/orgs must not import services/authz. Cross-service access is HTTP through the generated client, per ADR-0101 and ADR-0300.
            - pkg: github.com/tabmadi/sovereign-platform-template/services/catalog
              desc: services/orgs must not import services/catalog. Cross-service access is HTTP through the generated client, per ADR-0101 and ADR-0300.
            - pkg: github.com/tabmadi/sovereign-platform-template/services/orders
              desc: services/orgs must not import services/orders. Cross-service access is HTTP through the generated client, per ADR-0101 and ADR-0300.
            - pkg: github.com/tabmadi/sovereign-platform-template/services/payment
              desc: services/orgs must not import services/payment. Cross-service access is HTTP through the generated client, per ADR-0101 and ADR-0300.
            - pkg: github.com/tabmadi/sovereign-platform-template/services/_template
              desc: services/orgs must not import services/_template. Cross-service access is HTTP through the generated client, per ADR-0101 and ADR-0300.
            - pkg: github.com/tabmadi/sovereign-platform-template/services/analytics
              desc: services/orgs must not import services/analytics. Cross-service access is HTTP through the generated client, per ADR-0101 and ADR-0300.
            - pkg: github.com/tabmadi/sovereign-platform-template/services/platform
              desc: services/orgs must not import services/platform. Cross-service access is HTTP through the generated client, per ADR-0101 and ADR-0300.
        service-isolation-payment:
          list-mode: lax
          files:
            - '**/services/payment/**'
          deny:
            - pkg: github.com/tabmadi/sovereign-platform-template/services/authz
              desc: services/payment must not import services/authz. Cross-service access is HTTP through the generated client, per ADR-0101 and ADR-0300.
            - pkg: github.com/tabmadi/sovereign-platform-template/services/catalog
              desc: services/payment must not import services/catalog. Cross-service access is HTTP through the generated client, per ADR-0101 and ADR-0300.
            - pkg: github.com/tabmadi/sovereign-platform-template/services/orders
              desc: services/payment must not import services/orders. Cross-service access is HTTP through the generated client, per ADR-0101 and ADR-0300.
            - pkg: github.com/tabmadi/sovereign-platform-template/services/orgs
              desc: services/payment must not import services/orgs. Cross-service access is HTTP through the generated client, per ADR-0101 and ADR-0300.
            - pkg: github.com/tabmadi/sovereign-platform-template/services/_template
              desc: services/payment must not import services/_template. Cross-service access is HTTP through the generated client, per ADR-0101 and ADR-0300.
            - pkg: github.com/tabmadi/sovereign-platform-template/services/analytics
              desc: services/payment must not import services/analytics. Cross-service access is HTTP through the generated client, per ADR-0101 and ADR-0300.
            - pkg: github.com/tabmadi/sovereign-platform-template/services/platform
              desc: services/payment must not import services/platform. Cross-service access is HTTP through the generated client, per ADR-0101 and ADR-0300.
        service-isolation-template:
          list-mode: lax
          files:
            - '**/services/_template/**'
          deny:
            - pkg: github.com/tabmadi/sovereign-platform-template/services/authz
              desc: services/_template must not import services/authz. Cross-service access is HTTP through the generated client, per ADR-0101 and ADR-0300.
            - pkg: github.com/tabmadi/sovereign-platform-template/services/catalog
              desc: services/_template must not import services/catalog. Cross-service access is HTTP through the generated client, per ADR-0101 and ADR-0300.
            - pkg: github.com/tabmadi/sovereign-platform-template/services/orders
              desc: services/_template must not import services/orders. Cross-service access is HTTP through the generated client, per ADR-0101 and ADR-0300.
