# The Temporal subchart names its frontend service `<release>-frontend`, but the service contract is
# TEMPORAL_HOST_PORT=temporal:7233 (ADR-0205 — the same name the inner-loop `deps.yaml` stand-in uses).
apiVersion: v1
kind: Service
metadata:
  name: temporal
spec:
  type: ExternalName
  externalName: {{ .Release.Name }}-frontend.{{ .Release.Namespace }}.svc.cluster.local
