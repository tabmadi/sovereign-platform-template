        authz-sdk-confinement:
          list-mode: lax
          files:
            # Every package except the authz wrapper.
            - '!**/libs/go/authz/**'
          deny:
            - pkg: github.com/openfga/go-sdk
              desc: Authorization is OpenFGA, and code reaches it only through libs/go/authz/, per ADR-0304.
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
    rules:
      - linters:
          - errcheck
          - funlen
          - gocritic
          - prealloc
        path: _test\.go
      - linters:
          - revive
        path: tools/
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/tabmadi/sovereign-platform-template
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
