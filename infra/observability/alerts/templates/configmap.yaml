{{/*
The Prometheus rule files in the chart root, as one ConfigMap. `AsConfig` renders each as a
`<basename>: <content>` entry. Helm keeps Chart.yaml out of `.Files`, so the glob sees only rule files.
The name is fixed, and not derived from the release. With a changing name, Prometheus would start with no rules and no error.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alerts
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/component: observability
data:
{{ (.Files.Glob "*.yaml").AsConfig | indent 2 }}
