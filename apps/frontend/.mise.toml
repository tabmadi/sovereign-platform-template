# The Node island (ADR-0100): `next` and Turbopack's workers are `#!/usr/bin/env node` binaries, and bun spawns node for them.
# Pinned here, not in the root [tools], where every dev running lint/test would install it for nothing.
# The version resolves from the root [env] NODE_VERSION.
[tools]
node = "{{env.NODE_VERSION}}"

[tasks.dev]
description = "Root's dev:frontend delegates here with `mise run -C apps/frontend dev`, which activates this node."
run = "bun run next dev -H 0.0.0.0"

[tasks.run]
run = "bun run dev"

[tasks.build]
run = "bun run build"

[tasks.lint]
run = "biome ci ."

[tasks.test]
run = "bun run test"
