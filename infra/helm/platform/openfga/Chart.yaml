apiVersion: v2
name: openfga
description: |
  OpenFGA authorization engine, per ADR-0304, backed by Postgres. It is deployed
  directly as a Deployment and a Service with an `openfga migrate` initContainer.
  There is no operator and no CRD. A seed Job creates the `platform` store, writes
  the model, and applies the ops-tier grants. ADR-0304 explains why we skip an
  operator.
type: application
version: "2026.9.3"
appVersion: "1.14.2"
