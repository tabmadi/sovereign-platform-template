# Grafana dashboards Application, per ADR-0500. It makes dashboards-as-code flow through GitOps. The chart at
# `infra/observability/dashboards` generates the `grafana-dashboards` ConfigMap from the `*.json` files next to
# it. The observability Helm chart mounts it as `dashboardsConfigMaps.default`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-dashboards
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: platform
  annotations:
    # Wave 2: one wave before the telemetry tier that MOUNTS this ConfigMap. A pod
    # cannot start when a volume is missing. So the config arrives one wave early,
    # and not together with the workload it configures.
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/tabmadi/sovereign-platform-template.git
    targetRevision: master
    path: infra/observability/dashboards
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry:
      limit: 20
      backoff: { duration: 10s, maxDuration: 2m, factor: 2 }
