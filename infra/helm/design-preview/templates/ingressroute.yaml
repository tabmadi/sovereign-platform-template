# The route lives in `platform`, next to the `*.ops` certificate and the edge middlewares.
# It reaches across to the preview's Service, like the Hubble route, per ADR-0306.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "design-preview.namespace" . }}
  namespace: platform
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`{{ required "host is required" .Values.host }}`)
      middlewares:
        - name: problem-json-errors
        - name: strip-identity-headers
        - name: oathkeeper-forward-auth
        # After forward-auth, which needs the session cookie. This one removes it before the pod.
        - name: design-preview-sandbox
      services:
        - name: {{ .Values.service.name }}
          namespace: {{ include "design-preview.namespace" . }}
          port: {{ .Values.service.port }}
  tls:
    secretName: wildcard-ops-tls
