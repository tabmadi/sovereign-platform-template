# Browser telemetry ingest, per ADR-0500 and ADR-0400.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: frontend-observability
  namespace: platform
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: PathPrefix(`/api/rum`)
      # Traefik ranks a route by the length of its rule. The frontend's `Host(<env>) && PathPrefix(`/`)` is longer than
      # this rule, so without a set priority the frontend answers every beacon with a page.
      priority: 10000
      middlewares:
        - name: security-headers
      services:
        - name: otel-collector
          # The collector runs apart from the rest of the platform, per ADR-0200. So this is a cross-namespace service
          # reference, and it needs Traefik's `allowCrossNamespace`. That setting is already on for the Hubble and Argo CD
          # routes in `ingressroutes.yaml`.
          namespace: otel-agent
          port: 8027
  tls:
    secretName: wildcard-tls
