{{- if .Values.server.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "service.fullname" . }}-server
  labels: {{- include "service.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "service.selector" . | nindent 4 }}
    component: server
  ports:
    - { name: http,  port: 80,   targetPort: http }
    {{- /* Only when the workload has an admin port. A service with
           server.adminPort null declares no `admin` container port. The frontend
           is one: a Next standalone server serves everything on one port. This
           entry would then target a name that resolves to nothing. */}}
    {{- if .Values.server.adminPort }}
    - { name: admin, port: 9090, targetPort: admin }
    {{- end }}
{{- end }}
