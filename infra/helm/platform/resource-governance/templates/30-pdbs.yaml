{{/*
PodDisruptionBudgets for the multi-replica and stateful Core, per ADR-0204. A PDB limits only voluntary
disruption. So it keeps a drain safe, and it does not guarantee availability. With a single replica,
`minAvailable: 1` allows zero disruptions, so each entry is turned on explicitly.
*/}}
{{- range $name, $cfg := .Values.podDisruptionBudgets }}
{{- if $cfg.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  namespace: {{ $cfg.namespace | default "platform" }}
  labels:
    app.kubernetes.io/name: resource-governance
    app.kubernetes.io/part-of: platform
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
    resource-governance/rationale: {{ $cfg.rationale | quote }}
spec:
  minAvailable: {{ $cfg.minAvailable | default 1 }}
  selector:
    matchLabels: {{- toYaml $cfg.selector | nindent 6 }}
{{- end }}
{{- end }}
