{{- if .Values.issuers.enabled }}
{{- if .Values.selfSigned.enabled }}
# Local and non-public TLS, per ADR-0205. cert-manager IS the mechanism in every environment. Only the issuer differs.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
  annotations: { argocd.argoproj.io/sync-wave: "1" }
spec:
  selfSigned: {}
---
# The local root. It is self-signed, but it is a CA. That is the only difference.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: local-ca
  namespace: platform
  annotations: { argocd.argoproj.io/sync-wave: "1" }
spec:
  isCA: true
  commonName: "{{ .Values.envHost }} local CA"
  secretName: local-ca-tls
  duration: 87600h    # 10y. Nobody wants to rotate a laptop CA in the middle of a sprint
  privateKey: { algorithm: ECDSA, size: 256 }
  issuerRef: { name: selfsigned, kind: ClusterIssuer }
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: local-ca
  annotations: { argocd.argoproj.io/sync-wave: "2" }
spec:
  ca:
    secretName: local-ca-tls
---
# Product tier `*.<host>` and the apex. Locally, both wildcard secrets carry the same
# multi-SAN self-signed cert. Deployed environments split them into two `Let's Encrypt` certs.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard
  namespace: platform
  annotations: { argocd.argoproj.io/sync-wave: "2" }
spec:
  secretName: wildcard-tls
  issuerRef: { name: local-ca, kind: ClusterIssuer }
  dnsNames:
    - "*.{{ .Values.envHost }}"
    - "{{ .Values.envHost }}"
    - "*.ops.{{ .Values.envHost }}"
---
# Ops tier `*.ops.<host>`. It is two labels deep, so a single-label wildcard does not
# cover it. Locally it is the same multi-SAN cert. Routes in `infra/gateway` read this secret.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-ops
  namespace: platform
  annotations: { argocd.argoproj.io/sync-wave: "2" }
spec:
  secretName: wildcard-ops-tls
  issuerRef: { name: local-ca, kind: ClusterIssuer }
  dnsNames:
    - "*.{{ .Values.envHost }}"
    - "{{ .Values.envHost }}"
    - "*.ops.{{ .Values.envHost }}"
{{- end }}
{{- end }}
