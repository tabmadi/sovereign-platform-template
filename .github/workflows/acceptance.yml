name: acceptance

# Generate a project from the working tree and prove it reaches a serving cluster
# (ADR-0106): the only job that runs what a project actually gets, so it is what
# "ready to use" means. Nightly, or on demand by labelling a pull request.
on:
  schedule:
    - cron: "0 5 * * *" # after the e2e suite (03:00) and perf (04:00)
  workflow_dispatch:
  pull_request:
    types: [labeled]

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  acceptance:
    if: ${{ github.event_name != 'pull_request' || github.event.label.name == 'template-acceptance' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          go-cache: "true"

      - name: Generate a project and prove it serves
        run: mise run acceptance
