# The platform worker answers no requests, so it has no `server` task and no registered port.
# platform/not-deployed: local
# It is not on the inner-loop tier. It deploys to dev and higher environments, where a Schedule has a reason to remind someone.

[env]
_.file = ".env"

[tasks.env]
hide = true
run = "bash ../../scripts/env-ensure.sh"

[tasks.worker]
description = "Run the Temporal worker. It needs only Temporal."
depends = ["env", "dep:temporal"]
run = "go run ./cmd/worker"

[tasks.test]
run = "go test ./..."

[tasks.lint]
run = "golangci-lint run ./..."

[tasks.build]
run = "go build ./..."
