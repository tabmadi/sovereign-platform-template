# Admission control for image provenance (ADR-0104).
kyverno:
  # Its OWN namespace, and this is not tidiness.
  namespaceOverride: kyverno

  # The CRDs are the policies' API. Installed by the chart rather than separately:
  # unlike cert-manager, nothing in this chart renders a CR at install time, so the
  # single-pass problem that forced cert-manager's two-pass install does not arise.
  crds:
    install: true

  # Sized for the local tier and dev (ADR-0204); a deployed environment raises the
  # replica counts in its own values overlay. Kyverno's four controllers do
  # different work: only the admission controller is in the request path.
  admissionController:
    replicas: 1
    resources:
      requests: { cpu: "50m", memory: "192Mi" }
      limits: { memory: "384Mi" }
    # The CPU limits the upstream chart puts on this init container and on its hook Jobs are removed in
    # infra/gitops/platform/shared-values.yaml, not here: Helm only honours a `null` deletion in a values file passed
    # with `-f`, and a wrapper chart's own values.yaml is coalesced instead — where a nil reads as "not set" and the
  backgroundController:
    replicas: 1
    resources:
      requests: { cpu: "25m", memory: "96Mi" }
      limits: { memory: "192Mi" }
  cleanupController:
    replicas: 1
    resources:
      requests: { cpu: "10m", memory: "64Mi" }
      limits: { memory: "128Mi" }
  reportsController:
    replicas: 1
    resources:
      requests: { cpu: "25m", memory: "128Mi" }
      limits: { memory: "256Mi" }


#  The policies

policies:
  # `Enforce` rejects; `Audit` records a PolicyReport and admits. Deployed environments enforce.
  validationFailureAction: Enforce

  # The registry prefix that identifies a FIRST-PARTY image.
  imagePrefix: ""

  # Where an image may come from at all: the repositories the platform's own charts pull from, GENERATED by `mise
  # run gen:image-allowlist` into infra/gitops/platform/image-allowlist.yaml and passed to every chart in the tier
  # by the ApplicationSet.
  allowedImageSources: []

  # The committed public half of the platform signing key (ADR-0104), inlined into the ClusterPolicy as a `keys`
  # attestor.
  publicKey: ""
