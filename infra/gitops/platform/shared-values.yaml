# Overrides that must be supplied as a values FILE, for every platform chart and every environment. Why this file
# exists at all.
kyverno:
  # ADR-0204: a CPU limit is throttling, and these are an init container and two hook Jobs — throttling a migration
  # or a startup task turns a slow one into a failed one.
  admissionController:
    initContainer:
      resources:
        limits:
          cpu: null
  webhooksCleanup:
    resources:
      limits:
        cpu: null
  # NOT the CRD-migration hook (`crds.migration.podResources`). A `null` there is applied but not deleted — it
  # renders as an explicit `cpu: null`, which the API server reads as a limit of zero and rejects the Job outright.

opentelemetry-collector:
  # The node agent's OTLP receivers, with their hostPorts DELETED (ADR-0200, ADR-0500).
  ports:
    otlp:
      hostPort: null
    otlp-http:
      hostPort: null

temporal-worker-controller:
  # The same deletion, and the reason this file exists in the first place: the allow-list in
  # tools/lint-resource-governance carried this container with the note "inherited, unremovable — a parent
  # values.yaml cannot delete a subchart key".
  resources:
    limits:
      cpu: null
