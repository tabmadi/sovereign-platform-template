## Egress to the node-level OTel collector, which runs in its own namespace (ADR-0200: hostPath and hostPorts).
# so PSA keeps it apart).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: otlp-egress
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: {{ .Values.otelAgentNamespace }} }
      toPorts:
        - ports:
            - { port: "4317", protocol: TCP }
            - { port: "4318", protocol: TCP }
---
## Loki — writes come from the OTel collector, reads from Grafana.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: loki
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: loki
  ingress:
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: {{ .Values.otelAgentNamespace }}, app.kubernetes.io/name: opentelemetry-collector }
        - matchLabels: { k8s:io.kubernetes.pod.namespace: platform, app.kubernetes.io/name: grafana }
      toPorts:
        - ports: [{ port: "3100", protocol: TCP }]
---
## Prometheus — OTLP metrics push from BOTH collectors (the DaemonSet agent and the otel-cluster singleton),
## queries from Grafana (all 9090).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: prometheus
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  ingress:
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: {{ .Values.otelAgentNamespace }}, app.kubernetes.io/name: opentelemetry-collector }
        - matchLabels: { k8s:io.kubernetes.pod.namespace: platform, app.kubernetes.io/name: otel-cluster }
        - matchLabels: { k8s:io.kubernetes.pod.namespace: platform, app.kubernetes.io/name: grafana }
        # The alert-hygiene report reads the ALERTS series (ADR-0502). Named here
        # rather than left to the baseline: what may query the metrics store is a
        # list, and a reader absent from it is a reader nobody decided on.
        - matchLabels: { k8s:io.kubernetes.pod.namespace: platform, app.kubernetes.io/name: alertmanager-hygiene-report }
      toPorts:
        - ports: [{ port: "9090", protocol: TCP }]
---
## otel-cluster → Kyverno's metrics (ADR-0104, ADR-0500).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: otel-cluster-kyverno-scrape
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: otel-cluster
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kyverno
      toPorts:
        - ports: [{ port: "8000", protocol: TCP }]
---
## Tempo — trace push (OTLP 4317/4318) from OTel, queries (3200) from Grafana.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tempo
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: tempo
  ingress:
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: {{ .Values.otelAgentNamespace }}, app.kubernetes.io/name: opentelemetry-collector }
      toPorts:
        - ports:
            - { port: "4317", protocol: TCP }
            - { port: "4318", protocol: TCP }
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: platform, app.kubernetes.io/name: grafana }
      toPorts:
        - ports: [{ port: "3200", protocol: TCP }]
---
## Pyroscope — profile pushes from the Alloy agent, queries from Grafana (4040).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: pyroscope
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: pyroscope
  ingress:
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: platform, app.kubernetes.io/name: alloy }
        - matchLabels: { k8s:io.kubernetes.pod.namespace: platform, app.kubernetes.io/name: grafana }
      toPorts:
        - ports: [{ port: "4040", protocol: TCP }]
---
## Alloy — the pprof scraper (ADR-0501).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: alloy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: alloy
  egress:
    - toCIDR: [{{ .Values.podCIDR | quote }}]
      toPorts:
        - ports: [{ port: "9090", protocol: TCP }]
---
## Grafana — the ops UI, reached only through the edge gateway (3000).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  ingress:
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system }
      toPorts:
        - ports: [{ port: "3000", protocol: TCP }]
