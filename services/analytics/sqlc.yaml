# sqlc config for the template service, per ADR-0300. Copy it with the rest of the
# template when you scaffold a new service.
version: "2"
sql:
  - engine: postgresql
    schema:      "migrations/"
    queries:     "internal/store/queries/"
    gen:
      go:
        package: "store"
        out:     "internal/store"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_json_tags: true
