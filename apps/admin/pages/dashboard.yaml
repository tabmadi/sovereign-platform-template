properties:
  title: Platform admin
blocks:
  - id: welcome
    type: Markdown
    properties:
      content: |
        # Platform admin

        Use the left navigation to manage the resources of each service. Every resource
        opens a **changelist** like the Django admin: a table of records with an **Add**
        button. Click a row to open its **edit** page, where you can save or delete.

        `tools/admin-gen` generates the pages of each service from the service OpenAPI
        specs, per ADR-0401. This landing page is hand-written. The generator does not
        make cross-service views like this one.

        **Resources**

        - [Products](/products): full CRUD
        - [Organizations](/orgs): full CRUD
        - [Orders](/orders): list only, because checkout is an async workflow
        - [Charges](/charges): list only, because charging is an async workflow

        **Actions**

        - [Refund charge](/refundCharge)
        - [Cancel order](/cancelOrder)
