# Admission-control alerts (ADR-0104, ADR-0500). Native Prometheus rule-file format — mounted into Prometheus via
# the `prometheus-alerts` ConfigMap (see service-availability.yaml for the delivery path).
groups:
  - name: admission.availability
    rules:
      # `absent()` rather than a threshold on a counter: a controller that is gone exports nothing, so every rate() over
      # its series is empty and every comparison silently evaluates to no data.
      - alert: KyvernoAdmissionControllerAbsent
        expr: |
          absent(kyverno_controller_reconcile_total{service_name="kyverno"})
        for: 10m
        labels: { severity: page }
        annotations:
          summary: "Kyverno is not reporting — image admission control is not running"
          description: >-
            No metrics from Kyverno for 10 minutes. Every image-provenance check
            (ADR-0104) runs in its webhooks, so the cluster is either rejecting all
            pod creations (the fail-closed policy) or admitting images with no
            signature check at all. Check `kubectl -n kyverno get pods` and the
            ValidatingWebhookConfigurations; a webhook whose service is gone is the
            failure this alert exists for.

      # The webhook has a 30s timeout and the API server gives up on it; a request that reaches the timeout is admitted
      # or rejected by the failurePolicy rather than by the policy.
      - alert: KyvernoAdmissionSlow
        expr: |
          histogram_quantile(
            0.99,
            sum by (le) (rate(kyverno_admission_review_duration_seconds_bucket[10m]))
          ) > 10
        for: 15m
        labels: { severity: ticket }
        annotations:
          summary: "Kyverno admission reviews are approaching the webhook timeout"
          description: >-
            p99 admission review latency is over 10s against a 30s webhook timeout.
            Signature verification reaches the registry, so this is usually the
            registry being slow or unreachable rather than Kyverno itself — and a
            review that times out is decided by the failurePolicy, not by the
            policy.

  - name: admission.enforcement
    rules:
      # A rejection is not an incident: it is the control working, and one arrives every time someone deploys something
      # unsigned.
      - alert: KyvernoRejectionsSustained
        expr: |
          sum(rate(kyverno_policy_results_total{rule_result="fail"}[15m])) > 0.05
        for: 30m
        labels: { severity: ticket }
        annotations:
          summary: "Admission is rejecting workloads continuously"
          description: >-
            Kyverno has been failing policy checks for 30 minutes. Either a
            deployment is retrying against a policy it cannot satisfy — an unsigned
            image, a floating tag, an unlisted registry — or a policy has become
            wrong. `kubectl get clusterpolicyreport -A` names the resources.
