# Lightweight local dependencies for the inner dev loop, per ADR-0200.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb
  namespace: platform
  labels: { local.platform/component: postgres }
data:
  init.sql: |
    CREATE DATABASE orders;
    CREATE DATABASE catalog;
    CREATE DATABASE orgs;
    CREATE DATABASE payment;
    CREATE DATABASE kratos;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: platform
  labels: { local.platform/component: postgres }
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      # `restricted`, per ADR-0200, so the one namespace-wide warning of the inner loop
      # is not one of ours. uid 70 is `postgres` in the alpine image. It is 999 in
      # the Debian variants. The number comes from the image, not from a convention.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - { name: POSTGRES_USER,     value: dev }
            - { name: POSTGRES_PASSWORD, value: dev }
            - { name: POSTGRES_DB,       value: dev }
            # A SUBDIRECTORY of the mount. This makes a non-root Postgres work on a volume. The entrypoint runs chmod on
            # PGDATA, and chmod needs ownership, not the group write bit that fsGroup grants.
            - { name: PGDATA,            value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "dev"] }
            initialDelaySeconds: 3
          # readOnlyRootFilesystem is false, because initdb writes its socket and the
          # cluster under /var/lib/postgresql. Both are emptyDir mounts, and not the
          # image's own layers. That is the shape that ADR-0200 asks for.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: false
          volumeMounts:
            - { name: initdb, mountPath: /docker-entrypoint-initdb.d }
            - { name: data,   mountPath: /var/lib/postgresql/data }
            - { name: run,    mountPath: /var/run/postgresql }
      volumes:
        - name: initdb
          configMap: { name: postgres-initdb }
        - { name: data, emptyDir: {} }
        - { name: run,  emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: platform
  labels: { local.platform/component: postgres }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
# Temporal dev server: in memory, with the Web UI on 8233.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: platform
  labels: { local.platform/component: temporal }
spec:
  replicas: 1
  selector: { matchLabels: { app: temporal } }
  template:
    metadata: { labels: { app: temporal } }
    spec:
      # `restricted`, per ADR-0200. The dev server image runs as uid 1000.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: temporal
          # A concrete tag, not `latest`. This is the version that an inner-loop run gets.
          # With a moving tag, two engineers debug different Temporals, per ADR-0101.
          # Renovate bumps it with the other local stand-ins.
          image: temporalio/temporal:1.8.2
          args: ["server", "start-dev", "--ip", "0.0.0.0"]
          ports:
            - { name: grpc, containerPort: 7233 }
            - { name: ui,   containerPort: 8233 }
          # readOnlyRootFilesystem holds, because `start-dev` with no --db-filename keeps
          # its SQLite in memory. It writes only scratch files to disk, under /tmp. That
          # is the emptyDir below, and not the image layer.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            tcpSocket: { port: 7233 }
            initialDelaySeconds: 3
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: temporal
  namespace: platform
  labels: { local.platform/component: temporal }
spec:
  selector: { app: temporal }
  ports:
    - { name: grpc, port: 7233, targetPort: 7233 }
    - { name: ui,   port: 8233, targetPort: 8233 }
---
# OpenFGA: in-memory datastore, with a fixed dev preshared key.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openfga
  namespace: platform
  labels: { local.platform/component: openfga }
spec:
  replicas: 1
  selector: { matchLabels: { app: openfga } }
  template:
    metadata: { labels: { app: openfga } }
    spec:
      # `restricted`, per ADR-0200. The image is distroless and already non-root. This
      # states it, and does not rely on what the next tag ships.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: openfga
          image: openfga/openfga:v1.14.2
          args: ["run", "--datastore-engine", "memory", "--authn-method", "preshared", "--authn-preshared-keys", "dev"]
          ports: [{ name: http, containerPort: 8080 }]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: openfga
  namespace: platform
  labels: { local.platform/component: openfga }
spec:
  selector: { app: openfga }
  ports: [{ port: 8080, targetPort: 8080 }]
---
# Per-service DATABASE_URL secrets, consumed through secrets.envFrom.
apiVersion: v1
kind: Secret
metadata:
  name: orders-db
  namespace: platform
  labels: { local.platform/component: db-secrets }
stringData: { DATABASE_URL: "postgres://dev:dev@postgres:5432/orders?sslmode=disable" }
---
