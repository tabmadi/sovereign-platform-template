## The one Temporal endpoint every service's WorkerDeployment points at.
apiVersion: temporal.io/v1alpha1
kind: Connection
metadata:
  name: {{ .Values.connection.name }}
  labels:
    app.kubernetes.io/name: temporal-worker-controller
    app.kubernetes.io/part-of: platform
spec:
  hostPort: {{ .Values.connection.hostPort | quote }}
