# Pyroscope, the ADR-0501 POC for continuous profiling. A single-binary monolith with `-target=all`, and filesystem
# storage on an emptyDir for the POC. A real deployment uses the off-cluster bucket, like Loki and Tempo.
{{- $py := .Values.pyroscope }}
{{/* Config in a define, so the Deployment stamps checksum/config and rolls on config edits. Without it, the
     analytics opt-out is in the ConfigMap, but the running pod still sends usage data. */}}
{{- define "observability.pyroscope.config" }}
    server:
      http_listen_port: 4040
    # No phone-home, as in grafana.ini analytics. Without this, Pyroscope dials the
    # usage-stats endpoint of Grafana Labs on 443. The default-deny egress drops it
    # correctly, and that only adds noise to PolicyDropsDetected.
    analytics:
      reporting_enabled: false
    # Local profile store: an emptyDir at /data for the POC. Use a bucket to persist it.
    pyroscopedb:
      data_path: /data
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: pyroscope
  labels: { app.kubernetes.io/name: pyroscope, app.kubernetes.io/part-of: observability }
data:
  config.yaml: |
    {{- include "observability.pyroscope.config" . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pyroscope
  labels: { app.kubernetes.io/name: pyroscope, app.kubernetes.io/part-of: observability }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: pyroscope }
  template:
    metadata:
      labels: { app.kubernetes.io/name: pyroscope }
      # Roll the pod when the config changes. Pyroscope reads its config only
      # at startup.
      annotations:
        checksum/config: {{ include "observability.pyroscope.config" . | sha256sum }}
    spec:
      # `restricted`, per ADR-0200.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: pyroscope
          securityContext: {{- include "observability.containerSecurityContext" . | nindent 12 }}
          image: {{ $py.image }}
          args: ["-config.file=/etc/pyroscope/config.yaml"]
          ports:
            - { name: http, containerPort: 4040 }
          readinessProbe: { httpGet: { path: /ready, port: http }, initialDelaySeconds: 15 }
          livenessProbe:  { httpGet: { path: /ready, port: http }, initialDelaySeconds: 30, periodSeconds: 30 }
          resources: {{- toYaml $py.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/pyroscope }
            - { name: data,   mountPath: /data }
      volumes:
        - name: config
          configMap: { name: pyroscope }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pyroscope
  labels: { app.kubernetes.io/name: pyroscope, app.kubernetes.io/part-of: observability }
spec:
  selector: { app.kubernetes.io/name: pyroscope }
  ports:
    - { name: http, port: 4040, targetPort: http }
