{{- if .Values.externalObjectStorage }}
## `externalObjectStorage` gates every allow in this file. It means that the buckets this platform writes to are
## OUTSIDE the cluster.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: lgtm-object-storage-egress
spec:
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [loki, tempo]
  egress:
    - toEntities: [world]
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]
---
## Postgres continuous backup with CNPG. It has the same off-cluster-bucket condition as the LGTM rule above. It is
## the one workload where a silent failure cannot be recovered.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: postgres-backup-egress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/component: database
  egress:
    - toEntities: [world]
      toPorts:
        - ports:
            - { port: "443", protocol: TCP }
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
{{- end }}
{{- if .Values.publicTls.enabled }}
---
## cert-manager, when the environment issues PUBLIC certificates, per ADR-0205.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cert-manager-acme-egress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: cert-manager
  egress:
    - toEntities: [world]
      toPorts:
        - ports:
            - { port: "443", protocol: TCP }
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
{{- end }}
