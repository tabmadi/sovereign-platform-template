argo-cd:
  global:
    domain: argocd.example.com
  configs:
    params:
      server.insecure: "true"          # TLS ends upstream, at Traefik
      # Diff against the API SERVER's dry-run, not against the manifest alone.
      controller.diff.server.side: "true"
      # A wave that waits on an ApplicationSet waits on the health check below. It reads `.status.resources`. The
      # ApplicationSet controller writes that field on its own requeue, which is 3 minutes by default.
      applicationsetcontroller.requeue.after: 20s
    cm:
      timeout.reconciliation: "60s"
      # The ops edge is the authentication gate. Oathkeeper requires an AAL2 operator with `dashboard:argocd#view`, per ADR-0306.
      users.anonymous.enabled: "true"
      # Argo CD's built-in health for an ApplicationSet shows only that templating succeeded: all Applications generated.
      # It does not show whether the Applications it created synced and became healthy.
      resource.customizations.health.argoproj.io_ApplicationSet: |
        hs = {}
        if obj.status ~= nil and obj.status.resources ~= nil and #obj.status.resources > 0 then
          hs.status = "Healthy"
          hs.message = "All generated Applications are Synced and Healthy"
          for i, r in ipairs(obj.status.resources) do
            if r.status ~= "Synced" or r.health == nil or r.health.status ~= "Healthy" then
              hs.status = "Progressing"
              hs.message = "Waiting for " .. r.name .. " (sync=" .. tostring(r.status) .. ", health=" .. tostring(r.health and r.health.status) .. ")"
              return hs
            end
          end
          return hs
        end
        hs.status = "Progressing"
        hs.message = "Waiting for ApplicationSet to generate Applications"
        return hs
      resource.customizations.health.postgresql.cnpg.io_Cluster: |
        hs = {}
        if obj.status ~= nil then
          local ready = obj.status.readyInstances
          local want = obj.status.instances
          if obj.status.phase == "Cluster in healthy state"
             and ready ~= nil and want ~= nil and ready == want and ready > 0 then
            hs.status = "Healthy"
            hs.message = obj.status.phase
            return hs
          end
          hs.status = "Progressing"
          hs.message = tostring(obj.status.phase)
                       .. " (" .. tostring(ready) .. "/" .. tostring(want) .. " ready)"
          return hs
        end
        hs.status = "Progressing"
        hs.message = "Waiting for CNPG cluster status"
        return hs
      # Helm-rendered CRDs carry explicit empty maps, `labels: {}` and `annotations: {}`. Argo CD's normalizer strips them
      # from the DESIRED object but not from the LIVE one. So a chart that ships CRDs, such as kyverno, drifts on `labels: {}`
      # forever and stays OutOfSync.
      resource.customizations.ignoreDifferences.apiextensions.k8s.io_CustomResourceDefinition: |
        {
          "jsonPointers": ["/metadata/labels", "/metadata/annotations"]
        }
      # Kyverno's CRD schema gives defaults to four fields that the chart never sets: `spec.admission`, `spec.emitWarning`,
      # and, per rule, `skipBackgroundRequests` and `validate.allowExistingViolations`.
      resource.customizations.ignoreDifferences.kyverno.io_ClusterPolicy: |
        {
          "jsonPointers": ["/spec/admission", "/spec/emitWarning"],
          "jqPathExpressions": [
            ".spec.rules[].skipBackgroundRequests",
            ".spec.rules[].validate.allowExistingViolations"
          ]
        }
    rbac:
      # The anonymous user is the operator that the edge authenticated. See `users.anonymous` above. It gets
      # admin, like Grafana's anonymous `org_role:Admin`. The edge already checked AAL2 and the
      # `dashboard:argocd` grant. Full UI access is the goal.
      policy.default: role:admin
  server:
    service: { type: ClusterIP }
  redis-ha: { enabled: false }         # 3-node embedded etcd, so HA Redis is more than needed, per ADR-0200
  redis:
    # The chart default is the ecr-public.aws.com vanity host, which publishes only
    # AAAA records. Pin the canonical public.ecr.aws mirror. It has the same image and
    # is reachable over IPv4, so redis does not hang on networks without IPv6.
    image:
      repository: public.ecr.aws/docker/library/redis
  # Per ADR-0204.
  controller:
    replicas: 1
    resources:
      requests: { memory: "512Mi" }
      limits: { memory: "2Gi" }
  # The repo server renders every chart in the fleet. Each render holds a
  # dependency tree in memory.
  repoServer:
    resources:
      requests: { memory: "256Mi" }
      limits: { memory: "1Gi" }
  applicationSet:
    replicas: 1
    resources:
      requests: { memory: "128Mi" }
      limits: { memory: "512Mi" }
