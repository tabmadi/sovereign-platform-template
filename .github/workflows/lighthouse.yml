# Web vitals and bundle budgets are merge gates, per ADR-0400. So this runs on every PR, not behind a label.
# The origin is the production frontend image with the API mock and a Kratos stub, from scripts/lighthouse-stack.sh. No cluster starts.
# `/devportal` is not measured: proxy.ts redirects an unauthenticated request to login, so it measures login twice.
name: lighthouse

on:
  pull_request:
    branches: [master]
  # On master the run gates nothing, so publish.yml measures it after the promotion, and a change reaches dev first.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A cancelled job skips its teardown and leaves its containers on a self-hosted runner. So a newer run waits in the queue.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # The stack pulls Traefik and Prism from Docker Hub. Anonymous pulls have a limit for each source IP, and the whole forge shares this IP.
      - name: Log in to Docker Hub
        # Unset on a fork, where the secrets do not resolve.
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The production container, not `next dev`, behind Traefik with the API mock and a Kratos stub. A development server serves unminified output, so its bundle budget means nothing.
      - name: Start the Lighthouse stack
        run: mise run lighthouse:up
        env:
          GIT_SHA: ${{ github.sha }}

      - name: Install the Node island
        run: mise run e2e:install

      # Advisory until B6a1 is done: the app misses the LCP budget by about 340ms on every page.
      # This finding has an owner, and a PR author cannot fix it. Delete this line when it passes.
      - name: Web vitals and bundle budgets
        continue-on-error: true
        run: mise run lighthouse

      - name: Upload the Lighthouse report
        if: always()
        # Workaround for forgejo 16.0.2 in infra/helm/platform/forgejo/values.yaml: its artifact service refuses v4.
        # A report is a diagnostic, so the refusal must not fail a passing run. Retest: remove this line and upload a report.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: test/e2e/.lighthouseci/
          retention-days: 7

      - name: Tear down
        if: always()
        run: mise run lighthouse:down
