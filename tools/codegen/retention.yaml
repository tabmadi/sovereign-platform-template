# Retention for each data class, per ADR-0301. `period` is how long the class is kept, and `disposal` is `delete` or `anonymise`.
# ADR-0301 decides disposal for each category, never for each request.
classes:
  none:
    period: not applicable
    disposal: not applicable
    note: Checked, and holds no personal data. The tag shows that someone decided, so it differs from a column nobody checked.
  contact:
    period: life of the account, then 30 days
    disposal: delete
    note: Email, phone, postal address. It identifies a person directly, so an erasure request removes it and does not anonymise it.
  name:
    period: life of the account, then 30 days
    disposal: delete
    note: A person's name.
  identifier:
    period: life of the account, then 30 days
    disposal: anonymise
    note: A pseudonymous subject or account identifier. It is anonymised, not deleted, because rows keyed by it, such as orders and charges, have their own retention obligation. That obligation outlives the account.
  government_id:
    period: only while a legal obligation requires it
    disposal: delete
    note: National identifier, passport, tax number. The shortest period of any class, because the risk is to hold one with no current obligation.
  financial:
    period: 7 years
    disposal: anonymise
    note: Payment instrument details. The period is a bookkeeping obligation, not a product decision. It overrides an erasure request for the row's financial fields.
  location:
    period: 90 days
    disposal: delete
    note: Coordinates and precise geolocation.
  device:
    period: 90 days
    disposal: delete
    note: IP address, user agent, device identifier. Raw IP addresses are never stored, per ADR-0700. This class covers what is left after reduction.
  special_category:
    period: only while a legal obligation requires it
    disposal: delete
    note: GDPR Art. 9 data, such as health and biometrics. The platform stores none. The class exists so that adding one is a deliberate act against a stated rule.
  free_text:
    period: life of the account, then 30 days
    disposal: delete
    note: A field that a user types into, which can hold anything. It gets the strictest likely class, because its contents cannot be predicted.
