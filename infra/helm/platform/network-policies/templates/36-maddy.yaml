{{- if .Values.maddyEnabled }}
{{- /*
maddy, outbound mail submission, per ADR-0307. The same flag as the chart gates
it, because nobody reads a policy for a workload that does not exist.

The egress half makes this different from every other component here. Mail
delivery is a connection to an unknown server on port 25, chosen by an MX lookup
at send time. So this is the one workload whose egress cannot be an allow-list of
known peers. `toEntities: [world]` on 25 states that correctly.

Port 25 outbound, and NOT 587. Senders use 587, submission, to reach maddy.
Delivery between mail servers uses 25. A policy that opened 587 outbound would
admit no mail and still look correct.
*/}}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: maddy
spec:
  endpointSelector:
    matchLabels:
      app: maddy
  ingress:
    # Kratos sends verification and recovery mail, and the services send their own
    # mail. Both use SMTP submission. No sender embeds a provider SDK, so the relay
    # target stays a configuration value.
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: platform, app.kubernetes.io/name: kratos }
        - matchLabels: { k8s:io.kubernetes.pod.namespace: platform, app.kubernetes.io/name: ory-kratos-courier }
        - matchLabels: { k8s:io.kubernetes.pod.namespace: platform, app.kubernetes.io/part-of: service }
        # Alertmanager's `ticket` receiver relays through here, per ADR-0502.
        - matchLabels: { k8s:io.kubernetes.pod.namespace: platform, app.kubernetes.io/name: alertmanager }
      toPorts:
        - ports: [{ port: "587", protocol: TCP }]
    # The cluster collector scrapes maddy's delivery counters, per ADR-0500. Without
    # this, every scrape fails, and the mail alerts evaluate against no data. That
    # looks like no failures, and not like no signal.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: platform
            app.kubernetes.io/name: otel-cluster
      toPorts:
        - ports: [{ port: "9749", protocol: TCP }]
  egress:
    - toEntities: [world]
      toPorts:
        - ports: [{ port: "25", protocol: TCP }]
    # MX, DANE `TLSA`, and MTA-STS records are all DNS lookups. Delivery cannot start without them.
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns }
      toPorts:
        - ports: [{ port: "53", protocol: UDP }, { port: "53", protocol: TCP }]
    # MTA-STS policies come over HTTPS from the receiver's `mta-sts` subdomain, per RFC 8461.
    - toEntities: [world]
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]
{{- end }}
