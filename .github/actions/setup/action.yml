# The toolchain setup of every workflow but the shared check gate: Nix with flakes, per ADR-0100.
#
# A composite action, not a `workflow_call` workflow. A called workflow runs as its own job, so the later steps of the caller cannot see its toolchain.
# Checkout stays in the caller: the runner needs the repo on disk to resolve this action, and fetch-depth differs for each workflow.
name: setup
description: Install Nix with flakes. Each later step runs a recipe with `nix develop --command just <recipe>`.

runs:
  using: composite
  steps:
    # A self-hosted runner keeps Nix and its store between jobs. Only a fresh hosted machine installs it.
    # The binary cache of ADR-0101 comes from the env of the caller. Without its variables, both settings are empty.
    - if: runner.environment == 'github-hosted'
      uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          extra-substituters = ${{ env.NIX_CACHE_URL }}
          extra-trusted-public-keys = ${{ env.NIX_CACHE_PUBLIC_KEY }}
