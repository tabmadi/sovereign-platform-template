## Explicit deny of the cloud metadata endpoint, per ADR-0206. A deny wins over any allow. So even a future broad
## `world` egress grant cannot become an SSRF path to instance credentials.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: deny-cloud-metadata
spec:
  endpointSelector: {}
  # CRITICAL: this policy selects every pod in the cluster with a `{}` selector, and it has an egressDeny rule. In
  # Cilium, an endpoint that ANY egress rule selects, also a deny, changes to egress DEFAULT-DENY.
  enableDefaultDeny:
    egress: false
  egressDeny:
    - toCIDR:
        - 169.254.169.254/32
