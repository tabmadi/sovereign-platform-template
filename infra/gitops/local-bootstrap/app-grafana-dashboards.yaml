# Local Grafana dashboards Application (ADR-0500, ADR-0205).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-grafana-dashboards
  namespace: argocd
  labels:
    env: local
    app.kubernetes.io/part-of: platform
  annotations:
    # Wave 2: one before the telemetry tier that MOUNTS this ConfigMap. A volume
    # its pod cannot find leaves that pod unstartable, so the config is delivered
    # a wave early rather than beside the workload it configures.
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: local
  source:
    repoURL: https://github.com/tabmadi/sovereign-platform-template.git
    targetRevision: master
    path: infra/observability/dashboards
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry:
      limit: 20
      backoff: { duration: 10s, maxDuration: 2m, factor: 2 }
