{{/*
The dashboard JSON in the chart root, as one ConfigMap. `AsConfig` renders each as a
`<basename>: <content>` entry.
The name is fixed, not release-derived: the Grafana chart references `grafana-dashboards` by name.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/component: observability
data:
{{ (.Files.Glob "*.json").AsConfig | indent 2 }}
