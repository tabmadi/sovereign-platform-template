apiVersion: apps/v1
kind: Deployment
metadata:
  name: lowdefy
  namespace: platform
  labels: { app.kubernetes.io/name: lowdefy }
spec:
  replicas: {{ .Values.lowdefy.replicas }}
  selector: { matchLabels: { app.kubernetes.io/name: lowdefy } }
  template:
    metadata: { labels: { app.kubernetes.io/name: lowdefy } }
    spec:
      {{- with .Values.lowdefy.imagePullSecrets }}
      # The registry authenticates every pull (ADR-0105), and a kubelet holds no credential of its own.
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # `restricted` (ADR-0200).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: lowdefy
          image: {{ include "lowdefy.image" . | quote }}
          imagePullPolicy: {{ .Values.lowdefy.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports: [{ name: http, containerPort: 3000 }]
          env:
            {{- range $k, $v := .Values.lowdefy.env }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
          readinessProbe: { tcpSocket: { port: http } }
          resources: {{- toYaml .Values.lowdefy.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata: { name: lowdefy, namespace: platform }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: lowdefy }
  ports: [{ name: http, port: 80, targetPort: http }]
