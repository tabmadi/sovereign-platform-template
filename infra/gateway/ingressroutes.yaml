      middlewares:
        - name: problem-json-errors
        - name: strip-identity-headers
        - name: oathkeeper-forward-auth
        - name: security-headers
      services:
        - name: grafana
          port: 80
  tls:
    secretName: wildcard-ops-tls
---
# Lowdefy internal-admin console, per ADR-0401. Oathkeeper injects `X-User-Email`,
# and Lowdefy keys on it. See the `ops-lowdefy` access rule.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ops-lowdefy
  namespace: platform
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: HostRegexp(`^lowdefy\.ops\..+`)
      middlewares:
        - name: problem-json-errors
        - name: strip-identity-headers
        - name: oathkeeper-forward-auth
        - name: security-headers
      services:
        - name: lowdefy
          port: 80
  tls:
    secretName: wildcard-ops-tls
---
# Argo CD, per ADR-0201. `server.insecure` is on, so TLS ends at Traefik, and `argocd-server` serves http on :80.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ops-argocd
  namespace: platform
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
