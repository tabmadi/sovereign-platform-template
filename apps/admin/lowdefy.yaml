# Lowdefy admin, per ADR-0401. The pages are YAML only.
name: platform-admin
# `local`, not a pinned semver, skips Lowdefy's startup version check. That check makes a raw request to registry.npmjs.org on every boot. The image pins LOWDEFY_VERSION.
lowdefy: local

# Lowdefy 5 needs every block and connection declared as a plugin, pinned to the core version.
# The pages use antd UI blocks, basic layout, markdown, an AgGrid table, and the Axios HTTP connection.
plugins:
  - { name: "@lowdefy/blocks-antd", version: 5.4.0 }
  - { name: "@lowdefy/blocks-basic", version: 5.4.0 }
  - { name: "@lowdefy/blocks-markdown", version: 5.4.0 }
  - { name: "@lowdefy/blocks-aggrid", version: 5.4.0 }
  - { name: "@lowdefy/connection-axios-http", version: 5.4.0 }

config:
  homePageId: dashboard
  # Served at the root of its own ops origin, per ADR-0306. basePath is omitted: Lowdefy needs it to start with `/`,
  # and Next.js rejects exactly `/`, so unset is the only valid root setting.
  # No Lowdefy auth store: the ops edge gates access, per ADR-0401.

# One REST connection per service, with the service name as the id, so the generated pages resolve connectionId directly, per ADR-0401.
# Writes need an operator identity, and Lowdefy has no server operator to pass one. So the console sends a fixed `user:admin-console`,
# and the OpenFGA seed grants it group:operator. Only the console can reach these ports, per ADR-0305.
connections:
  - id: catalog
    type: AxiosHttp
    properties:
      baseURL: http://catalog-server.platform.svc.cluster.local
      headers: { X-User-Id: admin-console }
  - id: orders
    type: AxiosHttp
    properties:
      baseURL: http://orders-server.platform.svc.cluster.local
      headers: { X-User-Id: admin-console }
  - id: orgs
    type: AxiosHttp
    properties:
      baseURL: http://orgs-server.platform.svc.cluster.local
      headers: { X-User-Id: admin-console }
  - id: payment
    type: AxiosHttp
    properties:
      baseURL: http://payment-server.platform.svc.cluster.local
      headers: { X-User-Id: admin-console }
  - id: authz
    type: AxiosHttp
    properties:
      baseURL: http://authz-server.platform.svc.cluster.local
      headers: { X-User-Id: admin-console }

# The nav is generated: _generated/menu.yaml is one `default` menu that groups every resource and action page by service.
# The PageSiderMenu left sider shows it on every console page, per tools/admin-gen and ADR-0401.
menus:
  _ref: _generated/menu.yaml

# The page index is generated: _generated/pages.yaml lists the hand-written pages in pages/ and custom/ first,
# then every page that tools/admin-gen makes from the specs.
pages:
  _ref: _generated/pages.yaml
