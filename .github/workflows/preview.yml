# The pull-request preview environment, per ADR-0205. A label gates it, because a preview starts the full platform.
# A maintainer adds the label, so a fork's code reaches the runner only after someone reads it.
# It is the full local tier at this PR's images, destroyed with the run. Nothing is promoted or released from it.
name: preview

on:
  pull_request:
    types: [labeled, synchronize, reopened]

# One preview for each pull request. A new push replaces the environment, so two starts never race on the same runner.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    if: contains(github.event.pull_request.labels.*.name, 'preview')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PREVIEW_PR: ${{ github.event.pull_request.number }}
      PREVIEW_REVISION: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Provision the local SOPS age key
        run: mise run secrets:age
      - name: Bring up the preview
        run: mise run ci:preview -- up
      - name: Install Playwright in the Node island
        run: mise run e2e:install
      - name: Smoke the preview
        run: mise run e2e:smoke
      - name: Upload Playwright report
        if: always()
        # A report is a diagnostic. Forgejo's artifact service refuses v4, and that must not fail a passing run.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-preview
          path: |
            test/e2e/playwright-report/
            test/e2e/test-results/
          retention-days: 7
      - name: Destroy the preview
        if: always()
        run: mise run ci:preview -- down
