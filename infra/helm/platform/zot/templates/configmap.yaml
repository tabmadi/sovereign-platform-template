{{- if .Values.zot.enabled }}
{{- /*
The registry's configuration. ADR-0105 makes it a committed file, and not API
state. It is rendered from values, so the per-environment deltas, bucket and
endpoint, stay in the environment's values file. Everything that is NOT a
per-environment delta is written literally here, where people can read it.

Three settings in the JSON below are not obvious. Each one was measured against
2.1.20, and not taken from the documentation:

  - `compat: ["docker2s2"]` accepts Docker's manifest media types. Without it, a
    push uploads every blob, and then the registry rejects the manifest with
    `manifest invalid`. The failure comes at the last step of a long upload, and
    it looks like a registry defect. `docker buildx` emits those media types by
    default, so this is the default path, not a legacy one.
  - `defaultPolicy` and `anonymousPolicy` are both empty. An empty list does not
    mean unset. It means no permission at all. So an unauthenticated request fails
    at authentication, and not at a repository rule. Deleting either line opens
    the registry.
  - `dedupe` is off. It rewrites blobs as hard links, and an object store has no
    hard links. On S3, it costs a full scan of the bucket at startup and gives
    nothing.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: zot
  labels: &labels
    app: zot
    app.kubernetes.io/name: zot
    app.kubernetes.io/part-of: platform
data:
  config.json: |
    {
      "distSpecVersion": "1.1.1",
      "storage": {
        "rootDirectory": "/var/lib/zot",
        "dedupe": false,
        "gc": {{ .Values.zot.storage.gc }},
        "gcDelay": "{{ .Values.zot.storage.gcDelay }}",
        "gcInterval": "{{ .Values.zot.storage.gcInterval }}",
        "storageDriver": {
          "name": "s3",
          "region": "{{ .Values.zot.storage.region }}",
          "bucket": "{{ .Values.zot.storage.bucket }}",
          {{- /*
          A URL, with the scheme. zot's storage driver is the one from
          docker/distribution. The AWS SDK parses its `regionendpoint` as an endpoint
          URL. A bare `host:port` reads as a URI with no scheme. The driver then stops
          during `parseStorage`, with an exit code and NO message after
          `parsing storage and initializing`. Loki and Tempo take the same address
          as `host:port`, because their clients accept that form. The value here is
          the same host with a different contract.
          */}}
          "regionendpoint": "{{ if .Values.zot.storage.secure }}https{{ else }}http{{ end }}://{{ .Values.zot.storage.endpoint }}",
          "secure": {{ .Values.zot.storage.secure }},
          "forcepathstyle": true
        }
      },
      "http": {
        {{- /*
        An image push is a LONG request. A layer arrives as one streamed PATCH, and
        zot writes it to object storage as it arrives. So the request lasts as long
        as the slower of the client link and the store. Upstream's 60-second default
        cuts a large layer in the middle. The client sees `unexpected EOF` and a
        retry loop that never ends. The registry logs an i/o timeout while it reads
        from its own peer. That looks like a network fault, and not like its own
        deadline.

        A DURATION STRING, never a bare number. These are Go durations, so a JSON
        number is nanoseconds. `600` is 600ns: every request past the first byte
        fails at once. The edge in front reports 502, while the registry's own log
        shows it answering. A larger number is not safer here. `600` is six hundred
        millionths of a second.
        */}}
        "readTimeout": "{{ .Values.zot.http.readTimeout }}",
        "writeTimeout": "{{ .Values.zot.http.writeTimeout }}",
        "address": "0.0.0.0",
        "port": "{{ .Values.zot.service.port }}",
        "auth": { "htpasswd": { "path": "/etc/zot-auth/htpasswd" } },
        "accessControl": {
          "repositories": {
            "**": {
              "policies": [
                { "users": ["{{ .Values.zot.auth.pushUser }}"], "actions": ["read", "create", "update", "delete"] },
                { "users": ["{{ .Values.zot.auth.pullUser }}"], "actions": ["read"] }
              ],
              "defaultPolicy": [],
              "anonymousPolicy": []
            }
          },
          "adminPolicy": { "users": [], "actions": [] }
        },
        "compat": ["docker2s2"]
      },
      "log": { "level": "info" }{{ if or .Values.zot.console.enabled .Values.zot.sync.enabled }},
      "extensions": {
        {{- if .Values.zot.console.enabled }}
        {{- /*
        The console, per ADR-0306, and the search extension that it is a client of.
        Both or neither. `ui` alone renders a page where every query gets a 404. That
        looks like an empty registry, and not like a missing extension.

        This does not change the accessControl above, and that is the goal. The same
        authenticated endpoint as the API serves the UI. So a browser that passed the
        edge still presents the registry's own pull credential. No anonymousPolicy is
        added to make the console easier. That would open every pull on
        `registry.<host>` at the same time.
        */}}
        "ui": { "enable": true },
        "search": { "enable": true }{{ if .Values.zot.sync.enabled }},{{ end }}
        {{- end }}
        {{- if .Values.zot.sync.enabled }}
        {{- /*
        The sync extension, which makes zot a pull-through cache for the upstreams,
        per ADR-0105. Anonymous pulls of a MIRRORED image still pass through the
        accessControl above. So the pull identity is the same one that the cluster
        already uses. Mirroring does not open a second, unauthenticated door into the
        registry.
        */}}
        "sync": {
          "enable": true,
          {{- /*
          No `credentialsFile`. Every upstream here is PUBLIC. If this names a file
          that does not exist, zot fails to start. A registry that does not start is
          worse than one that pulls anonymously. A private upstream would add the
          file and this key together, never one without the other. Docker Hub's
          anonymous rate limit applies, and it is the accepted cost. It is also why
          that upstream must stay onDemand, and not polled.
          */}}
          {{- /*
          Where a synced image lands before it is committed to the store. zot
          REFUSES TO START without it when both sync and a remote storage driver
          are configured, with the error `using both sync and remote storage features
          needs config.Extensions.Sync.DownloadDir to be specified`. So on S3 this
          key is not a tuning option. It decides between a registry and a
          CrashLoopBackOff. It shares the emptyDir that holds the metadata cache.
          The contents are a staging area that is rebuilt on demand.
          */}}
          "downloadDir": "{{ .Values.zot.sync.downloadDir }}",
          "registries": {{ toJson .Values.zot.sync.registries }}
        }
        {{- end }}
      }{{ end }}
    }
{{- end }}
