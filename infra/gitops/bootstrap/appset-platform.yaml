apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-telemetry
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/component: telemetry
  annotations:
    # Wave 3: BEFORE the collector, because otel-agent exports to tempo and loki by
    # name (otel-agent/values.yaml). After the stores, because Loki and Tempo write to
    # the buckets, and Prometheus mounts the rule ConfigMap wave 2 delivers.
    argocd.argoproj.io/sync-wave: "3"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/syncPolicy
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - { env: dev,     server: "https://kubernetes.default.svc" }
                - { env: staging, server: "https://kubernetes.default.svc" }
                - { env: prod,    server: "https://kubernetes.default.svc" }
          - git:
              repoURL: https://github.com/tabmadi/sovereign-platform-template.git
              revision: master
              directories:
                - { path: "infra/helm/platform/observability" }
                - { path: "infra/helm/platform/alertmanager" }
  template:
    metadata:
      name: "{{ .env }}-platform-{{ .path.basename }}"
