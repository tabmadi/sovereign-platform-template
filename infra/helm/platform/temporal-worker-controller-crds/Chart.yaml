apiVersion: v2
name: temporal-worker-controller-crds
description: |
  CRDs for the Temporal Worker Controller, per ADR-0302: WorkerDeployment,
  Connection, and WorkerResourceTemplate.

  They are split from the controller chart on purpose, and upstream ships them the
  same way. A CustomResourceDefinition and a custom resource OF that definition
  cannot be in one Helm release. Helm validates every manifest against the API
  server before it applies any of them. So on a first install, the `Connection`
  CR fails with `no matches for kind Connection`. With the split, the CRDs are in
  the base tier at wave 0. The controller and its Connection are in core at wave 3.
  This makes the order explicit, and it does not depend on Argo CD applying CRDs
  first. It also keeps `mise run cluster:add` working for it, because that path is
  a plain `helm upgrade --install` with no special case for CRDs.
type: application
version: "2026.9.3"
appVersion: "1.8.0"

dependencies:
  - name: temporal-worker-controller-crds
    version: "0.27.0"
    repository: oci://docker.io/temporalio
