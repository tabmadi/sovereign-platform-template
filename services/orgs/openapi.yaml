openapi: 3.1.0
info: { title: orgs, version: 0.1.0, description: Organization and membership service., x-audience: public }
servers: [{ url: /api }]   # flat resource namespace, per ADR-0306. Paths are globally unique
# `x-admin: crud` marks the resource group for the admin generator in tools/admin-gen, per ADR-0401. It
# scaffolds list, detail, create, and edit pages from the operations below.
tags: [{ name: orgs, x-admin: crud }, { name: cluster }]
paths:
  /orgs:
    get:
      operationId: listOrgs
      # Listing every org is a back-office view. The public docs leave it out, per ADR-0303.
      x-audience: internal
      description: List all organizations.
      tags: [orgs]
      responses:
        "200":
          description: The organization list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Org" }
                # The API mock serves this exactly as written, per ADR-0600.
                example:
                  - { id: org_01kztn9tsrea7b1597q3yjdeav, name: Northwind Trading }
                  - { id: org_01kztne0k0e96sgmrw4bd27ydx, name: Contoso Rail }
        default: { $ref: "#/components/responses/Error" }
    # There is no POST. The registration flow creates an org. Its webhook writes the org, the membership, and the
    # OpenFGA admin tuple as one dual write, per ADR-0304. A bare insert would produce an org with no admin.
  /orgs/{id}:
    get:
      operationId: getOrg
      description: Fetch an organization by id.
      tags: [orgs]
      parameters: [{ name: id, in: path, required: true, description: Organization id., schema: { $ref: "#/components/schemas/OrgId" } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Org" } } } }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: updateOrg
      x-audience: internal
      description: Rename an organization.
      tags: [orgs]
      parameters: [{ name: id, in: path, required: true, description: Id of the organization to update., schema: { $ref: "#/components/schemas/OrgId" } }]
      requestBody:
        required: true
        description: The new organization fields.
        content: { application/json: { schema: { $ref: "#/components/schemas/OrgInput" } } }
      responses:
        "200": { description: The updated organization, content: { application/json: { schema: { $ref: "#/components/schemas/Org" } } } }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteOrg
      x-audience: internal
      description: Delete an organization.
      tags: [orgs]
      parameters: [{ name: id, in: path, required: true, description: Id of the organization to delete., schema: { $ref: "#/components/schemas/OrgId" } }]
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }
  /identity-created:
    post:
      operationId: onIdentityCreated
      # East-west webhook from Kratos to orgs in the cluster. It skips the edge, and a
      # NetworkPolicy gates it. `x-audience: cluster` keeps it off both docs portals, per ADR-0303.
      x-audience: cluster
      tags: [cluster]
      description: Kratos post-registration webhook. Creates a personal org for the new identity.
      requestBody:
        required: true
        description: The newly created identity.
        content:
          application/json:
            schema:
              type: object
              description: Kratos identity-created payload.
              properties:
                identity_id: { type: string }
                email:       { type: string }
      responses:
        "204": { description: Ack }
        default: { $ref: "#/components/responses/Error" }
  /subject-data/orgs:
    get:
      operationId: listMemberSubjects
      # East-west, from the platform worker's retention sweep, per ADR-0301. Like `/identity-created`, it skips the
      # edge, and a NetworkPolicy gates it.
      x-audience: cluster
      tags: [cluster]
      description: One page of the identities that hold memberships, in identity order.
      parameters:
        - { name: after, in: query, required: false, description: The last identity of the previous page., schema: { type: string } }
        - { name: limit, in: query, required: false, description: The page size., schema: { type: integer, minimum: 1, maximum: 1000, default: 500 } }
      responses:
        "200":
          description: The page.
          content: { application/json: { schema: { $ref: "#/components/schemas/SubjectPage" } } }
        default: { $ref: "#/components/responses/Error" }
  /subject-data/orgs/{identity_id}:
    get:
      operationId: exportOrgsSubject
      # East-west, from the platform worker's ExportSubject, per ADR-0301 and GDPR Art. 15 and 20.
      x-audience: cluster
      tags: [cluster]
      description: Every org that the subject is a member of, with the role.
      parameters:
        - { name: identity_id, in: path, required: true, description: The Kratos identity., schema: { type: string, minLength: 1 } }
      responses:
        "200":
          description: The subject's memberships.
          content: { application/json: { schema: { $ref: "#/components/schemas/SubjectMemberships" } } }
        default: { $ref: "#/components/responses/Error" }
  /subject-data/orgs/{identity_id}/erase:
    post:
      operationId: eraseOrgsSubject
      # East-west, from the platform worker's EraseSubject, per ADR-0301 and GDPR Art. 17.
      x-audience: cluster
      tags: [cluster]
      description: Anonymise the subject's memberships. The orgs stay. Safe to run again.
      parameters:
        - { name: identity_id, in: path, required: true, description: The Kratos identity., schema: { type: string, minLength: 1 } }
      requestBody:
        required: true
        description: The replacement for the identity.
        content: { application/json: { schema: { $ref: "#/components/schemas/ErasureRequest" } } }
      responses:
        "200":
          description: The rows that changed.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErasureResult" } } }
        default: { $ref: "#/components/responses/Error" }
components:
  responses:
    # >>> shared-components: responses. Generated from tools/codegen/shared-components.yaml. Do not edit
    Error:
      description: An error, as RFC 9457 problem details.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    # <<< shared-components
  schemas:
    # >>> shared-components: schemas. Generated from tools/codegen/shared-components.yaml. Do not edit
    # RFC 9457 problem details. `instance` is absent on purpose: `trace_id` identifies the occurrence and leads to the trace.
    # An instance URL leads nowhere.
    Problem:
      type: object
      description: |
        RFC 9457 problem details. Services and the edge both serve it as
        `application/problem+json`, so a generated client has one error branch, not two.
      required: [type, title, status]
      properties:
        type:
          type: string
          description: |
            `about:blank`, except where two errors share a status code and a client
            handles them differently. That case uses a `urn:problem-type:<service>:<slug>`
            URN. It is never a dereferenceable URL, which would put an error taxonomy into
            the flat public URL namespace.
          default: "about:blank"
          example: "about:blank"
        title:
          type: string
          description: A stable, human-readable summary. It does not change with the instance.
          example: Not Found
        status:
          type: integer
          description: The HTTP status, repeated in the body.
          minimum: 100
          maximum: 599
          example: 404
        detail:
          type: string
          description: |
            Specific to the instance and safe to show a user. Never a stack trace, a query,
            or an internal hostname.
          example: No product with that identifier.
        trace_id:
          type: string
          description: |
            The W3C Trace Context trace-id of the failing request, so an error that a user
            reports leads to its trace. The active span supplies it, not the handler.
          pattern: "^[0-9a-f]{32}$"
          example: 4bf92f3577b34da6a3ce929d0e0e4736
        errors:
          type: array
          description: |
            Field-level validation failures, filled from the generated validator.
            Absent when the failure is not a validation failure.
          items:
            type: object
            required: [pointer, message]
            properties:
              pointer:
                type: string
                description: RFC 6901 JSON Pointer to the member that failed.
                example: /price/amount
              message:
                type: string
                example: must be a decimal amount
      example:
        type: "about:blank"
        title: Not Found
        status: 404
        detail: No product with that identifier.
        trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
    # <<< shared-components
    # A wire identifier, per ADR-0003. The stored column stays a bare `uuid`. This form
    # exists so that a value in a log line, a ticket, or a URL names its type.
    OrgId:
      type: string
      description: |
        An organization identifier: `org_` and the UUIDv7 in 26 characters of Crockford
        base32. The first character is at most 7, because 26 characters hold 130 bits and
        a UUID has 128. It is opaque to a consumer: nothing parses, orders, or builds one.
      pattern: '^org_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$'
      example: org_01kztn9tsrea7b1597q3yjdeav
    SubjectPage:
      type: object
      description: One page of subjects. `next` is absent on the last page.
      required: [subjects]
      properties:
        subjects: { type: array, items: { type: string } }
        next: { type: string, description: The cursor for the next page. }
      example: { subjects: [0b6f6f2e-5d3b-4f39-9a5e-3c7a1d1e2f40], next: 0b6f6f2e-5d3b-4f39-9a5e-3c7a1d1e2f40 }
    ErasureRequest:
      type: object
      description: The value that replaces the identity in every row. The workflow chooses one per erasure.
      required: [pseudonym]
      properties:
        pseudonym: { type: string, pattern: "^erased-[0-9a-f-]{36}$" }
    ErasureResult:
      type: object
      description: The rows that the erasure changed.
      required: [rows]
      properties:
        rows: { type: integer }
      example: { rows: 1 }
    SubjectMembership:
      type: object
      description: One membership of the subject.
      required: [org_id, org_name, role]
      properties:
        org_id: { $ref: "#/components/schemas/OrgId" }
        org_name: { type: string }
        role: { type: string, enum: [admin, member] }
    SubjectMemberships:
      type: object
      description: A subject's memberships.
      required: [memberships]
      properties:
        memberships: { type: array, items: { $ref: "#/components/schemas/SubjectMembership" } }
      example:
        memberships:
          - { org_id: org_01kztnj6c8e0jt7vzw0cn1wxvd, org_name: Personal, role: admin }
    Org:
      type: object
      description: An organization.
      required: [id, name]
      properties:
        id:   { $ref: "#/components/schemas/OrgId" }
        name: { type: string }
      example: { id: org_01kztn9tsrea7b1597q3yjdeav, name: Northwind Trading }
    OrgInput:
      type: object
      description: Request body to create an organization.
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
