# Values are under `edgeErrors:`, so this chart shares the single per-environment values overlay of the platform
# ApplicationSet with no key collisions.
edgeErrors:
  enabled: true

  # busybox httpd, which serves static files and maps an extension to a MIME type. That is all that is needed. There
  # is no templating, no request handling, and no state.
  image:
    repository: docker.io/library/busybox
    tag: "1.37.0"
    digest: sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
    pullPolicy: IfNotPresent

  # Two replicas. Every intercepted response makes a subrequest here. So this is in
  # the path of every denial from the edge. With a single replica, a normal rollout
  # is a window where denials fall back to Oathkeeper's format.
  replicas: 2

  port: 8080

  resources:
    requests: { cpu: 5m, memory: 16Mi }
    limits: { memory: 32Mi }

  # The statuses that Traefik intercepts, and the title of each one. `title` is stable and does not change with the
  # instance, as RFC 9457 requires.
  problems:
    - status: 401
      title: Unauthorized
    - status: 403
      title: Forbidden
    - status: 429
      title: Too Many Requests
    - status: 502
      title: Bad Gateway
    - status: 503
      title: Service Unavailable
    - status: 504
      title: Gateway Timeout
