apiVersion: v2
name: alertmanager-silences
description: |
  The committed maintenance silences, per ADR-0502. A silence is configuration,
  so it lives here and not in Alertmanager's UI. In the UI, review cannot see it,
  and it outlives the person who created it.

  It is a chart and not a plain directory source, for the same reason as the
  dashboards and alerts charts. The file is not a Kubernetes manifest, so it must
  be generated into a ConfigMap. It cannot be applied directly.
type: application
version: 0.1.0
