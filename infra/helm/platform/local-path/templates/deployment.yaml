{{- if .Values.localPath.enabled }}
{{- $lp := .Values.localPath }}
{{- /*
One replica. The provisioner is a controller, not a data path. It creates the
directory and then does nothing more. The volume stays mounted whether this pod
runs or not. A second replica would race the first for the same PVC.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-path-provisioner
  namespace: local-path
  labels:
    app.kubernetes.io/name: local-path-provisioner
    app.kubernetes.io/part-of: platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: local-path-provisioner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: local-path-provisioner
        app.kubernetes.io/part-of: platform
      annotations:
        # Roll the pod when the config changes. The provisioner reads the ConfigMap
        # again, but it reads the helper-pod template only at startup.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: local-path-provisioner
      # The provisioner must write into the node's own directory tree, which is the hostPath below. It writes only on
      # the node where it is scheduled.
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      containers:
        - name: local-path-provisioner
          image: {{ $lp.image.repository }}:{{ $lp.image.tag }}@{{ $lp.image.digest }}
          imagePullPolicy: {{ $lp.image.pullPolicy }}
          command:
            - local-path-provisioner
            - --debug
            - start
            - --config=/etc/config/config.json
            - --service-account-name=local-path-provisioner
            - --provisioner-name=rancher.io/local-path
            - --helper-pod-file=/etc/config/helperPod.yaml
            - --configmap-name=local-path-config
          env:
            # The namespace for the helper Pod. The RoleBinding limits the
            # pod-create grant to this namespace.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CONFIG_MOUNT_PATH
              value: /etc/config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /etc/config
            - name: data
              mountPath: {{ $lp.path }}
          resources:
            {{- toYaml $lp.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: local-path-config
        - name: data
          hostPath:
            path: {{ $lp.path }}
            # `DirectoryOrCreate`, not `Directory`. On a new node, nothing has created
            # this path yet. With `Directory`, the pod fails to start on the node that
            # needs a provisioner most.
            type: DirectoryOrCreate
{{- end }}
