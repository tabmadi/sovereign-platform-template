# Local full-tier values for the orders service (ADR-0205). Read by the local services ApplicationSet
# (infra/gitops/local-bootstrap/appset-services.yaml).
name: orders
image:
  repository: registry.localhost:5000/orders-server
  tag: local            # local registry (CI stand-in); prod uses a git SHA (ADR-0101)
  pullPolicy: Always    # re-pull the rebuilt :local on a cluster:up full re-run
worker:
  enabled: true
  image:
    repository: registry.localhost:5000/orders-worker
    tag: local
server:  { replicas: 1 }
ingress: { enabled: true, host: dev.localtest.me, resources: [orders] }
# Keep every trace the service starts (ADR-0500: local overrides healthy traces to 100%).
otel:    { deployEnv: local, sampling: "parentbased_traceidratio=1.0" }
# The Lowdefy admin console (apps/admin) calls orders server-side, east-west on
# the server port, bypassing the /api edge (ADR-0401).
networkPolicy: { allowFrom: [lowdefy] }
secrets: { envFrom: [orders-db, openfga-creds] }
env:
  CATALOG_URL: http://catalog-server.platform.svc.cluster.local
  PAYMENT_URL: http://payment-server.platform.svc.cluster.local
  # Write authz (ADR-0304): the server gates the operator-only cancel via the shared
  # Checker. Blank preshared key falls back to openfga-creds.preshared_key (envFrom),
  # as catalog and the authz service do.
  OPENFGA_API_URL: "http://openfga.platform.svc.cluster.local:8080"
  OPENFGA_PRESHARED_KEY: ""
