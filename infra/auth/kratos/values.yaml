# Canonical Kratos config (ADR-0304), the single source of truth — injected into the Ory umbrella chart as a Helm
# values overlay (`-f` locally via scripts/cluster.sh; ArgoCD `valueFiles` per env).
kratos:
  kratos:
    config:
      dsn: "postgres://kratos@postgres-rw.platform.svc.cluster.local:5432/kratos?sslmode=disable"
      identity:
        default_schema_id: user_v1
        schemas:
          - id: user_v1
            # Chart mounts identitySchemas keys directly under /etc/config.
            url: file:///etc/config/user.v1.json
      selfservice:
        default_browser_return_url: https://dev.example.com/
        # Kratos forbids any post-flow `return_to` not prefixed by an entry here.
        allowed_return_urls:
          - https://dev.example.com/
        flows:
          # No local error UI ⇒ Kratos falls back to its hosted error page; keep
          # the whole self-service flow set pointed at our own routes.
          error:        { ui_url: https://dev.example.com/auth/error }
          login:        { ui_url: https://dev.example.com/auth/login }
          registration:
            ui_url: https://dev.example.com/auth/register
            after:
              # After a successful registration, create the identity's personal org (ADR-0304). East-west call to the orgs
              # service (in-cluster, off the edge — ADR-0306); the handler starts a Temporal dual-write workflow.
              hooks:
                - hook: web_hook
                  config:
                    url: http://orgs-server.platform.svc.cluster.local/identity-created
                    method: POST
                    body: base64://ZnVuY3Rpb24oY3R4KSB7CiAgaWRlbnRpdHlfaWQ6IGN0eC5pZGVudGl0eS5pZCwKICBlbWFpbDogY3R4LmlkZW50aXR5LnRyYWl0cy5lbWFpbCwKfQo=
                    response:
                      ignore: false
                      parse: false
          recovery:
            enabled: true
            use: code              # enumeration-resistant; no account-existence leak
            ui_url: https://dev.example.com/auth/recovery
          verification:
            enabled: true
            use: code
            ui_url: https://dev.example.com/auth/verification
          settings:
            ui_url: https://dev.example.com/auth/settings
            # Step-up (ADR-0304): mutating credentials/MFA requires a recent login.
            privileged_session_max_age: 15m
            required_aal: highest_available
        # Authentication methods (ADR-0304). password is the first factor; TOTP and WebAuthn/passkeys are the operator
        # second factor (AAL2 is enforced on the ops tier by services/authz, not forced on B2C product users here).
        methods:
          password:
            enabled: true
            config:
              haveibeenpwned_enabled: false
              min_password_length: 12
              identifier_similarity_check_enabled: true
          totp:
            enabled: true
            config:
              issuer: dev.example.com
          webauthn:
            enabled: true
            config:
              passwordless: false       # second factor, not passwordless login
              rp:
                id: dev.example.com
                display_name: Platform
                origins: ["https://dev.example.com"]
      session:
        # 7-day absolute lifespan; whoami returns the highest AAL the identity has
        # configured, so an operator who enrolled MFA must use it (and the ops edge
        # requires aal2). B2C users with no second factor stay aal1.
        lifespan: 168h
        whoami:
          required_aal: highest_available
        # Scope the session cookie to the parent host so it is shared with subdomains (e.g. hubble.ops.<host>, served at
        # its own origin).
        cookie:
          domain: dev.example.com
          same_site: Lax
      # Transactional mail (recovery/verification).
      courier:
        smtp:
          connection_uri: "smtps://smtp.example.com:465?skip_ssl_verify=false"
          # The platform's sender identity, and it is a decision rather than a default (ADR-0307). Kratos configures none,
          # so it sends as its own upstream default — `no-reply@ory.kratos.sh`, confirmed on a live message in the sink.
          from_address: no-reply@mail.example.com
          from_name: Platform
  # Cookie/cipher/system secrets + dsn come from a SOPS-managed Secret, never inline values (ADR-0202, Phase 5).
  # `secret` is a top-level kratos-subchart key (sibling of the `kratos:` config block above), so it sits one level
  # up.
  secret:
    enabled: false
    nameOverride: kratos-secrets
