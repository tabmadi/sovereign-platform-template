apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-core
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/component: core
  annotations:
    # Wave 4: everything a service resolves by name — its identity provider, its authorization store, its workflow
    # engine, the collector it ships telemetry to, and the mail sink the courier submits to.
    argocd.argoproj.io/sync-wave: "4"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/syncPolicy
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - { env: dev,     server: "https://kubernetes.default.svc" }
                - { env: staging, server: "https://kubernetes.default.svc" }
                - { env: prod,    server: "https://kubernetes.default.svc" }
          - git:
              repoURL: https://github.com/tabmadi/sovereign-platform-template.git
              revision: master
              directories:
                # The registry (ADR-0105). Wave 3 rather than beside the store: it
                # reads the bucket, so it starts after the data tier is Healthy.
                - { path: "infra/helm/platform/zot" }
                  # The forge (ADR-0102).
                - { path: "infra/helm/platform/forgejo" }
                  # The public ACME issuer and the edge's wildcard certificates (ADR-0205).
                - { path: "infra/helm/platform/public-tls" }
                  # The node-level collector, in a namespace of its own because it
                  # is the one platform workload needing hostPath and hostPorts
                  # (ADR-0200). Same tier as the backends it exports to.
                - { path: "infra/helm/platform/otel-agent" }
                - { path: "infra/helm/platform/ory" }
                  # The edge's RFC 9457 error bodies (ADR-0305). Beside ory because Oathkeeper is what raises most of the responses
                  # it rewrites, and every denial the edge issues makes a subrequest here.
                - { path: "infra/helm/platform/edge-errors" }
                  # The non-production mail sink Kratos's courier submits to
                  # (ADR-0307). Beside ory because it is only useful to it, and
                  # dropped by `mailpit.enabled: false` where a real relay exists.
                - { path: "infra/helm/platform/mailpit" }
                # Production mail (ADR-0307). Renders nothing unless the
                # environment enables it, which only production does.
                - { path: "infra/helm/platform/maddy" }
                - { path: "infra/helm/platform/temporal" }
                - { path: "infra/helm/platform/temporal-worker-controller" }
                - { path: "infra/helm/platform/openfga" }
  template:
    metadata:
      name: "{{ .env }}-platform-{{ .path.basename }}"
      labels:
        env: "{{ .env }}"
        app.kubernetes.io/part-of: platform
        app.kubernetes.io/component: "{{ .path.basename }}"
    spec:
      project: "{{ .env }}"
      source:
        repoURL: https://github.com/tabmadi/sovereign-platform-template.git
        targetRevision: master
        path: "{{ .path.path }}"
        helm:
          releaseName: "{{ .path.basename }}"
          valueFiles:
            - "../../../gitops/platform/shared-values.yaml"
            - "../../../gitops/platform/image-allowlist.yaml"
            - "../../../auth/kratos/values.yaml"
            - "../../../auth/oathkeeper/values.yaml"
            - "../../../gitops/platform/{{ .env }}/values.yaml"
          fileParameters:
            - name: 'kratos.kratos.identitySchemas.user\.v1\.json'
              path: "../../../auth/kratos/identity-schemas/user.v1.json"
            - name: oathkeeper.oathkeeper.accessRules
              path: "../../../auth/oathkeeper/access-rules.json"
            - name: seed.model
              path: "../../../auth/openfga/model.json"
            - name: policies.publicKey
              path: "../../../auth/cosign/cosign.pub"
      destination: { server: "{{ .server }}", namespace: platform }
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
        retry:
          limit: 20
          backoff: { duration: 10s, maxDuration: 2m, factor: 2 }
