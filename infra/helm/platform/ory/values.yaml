# Ory umbrella chart values (ADR-0305, ADR-0304).

oathkeeper:
  enabled: true
  deployment:
    # ADR-0204. The busiest component on the /api path, ahead of the services
    # themselves, because every request pays a forward-auth hop here (ADR-0305).
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits:   { memory: "384Mi" }
    extraEnv:
      - name: SQA_OPT_OUT
        value: "true"

# No phone-home: Ory's SQA telemetry dials sqa.ory.sh on 443, which the default-deny egress correctly drops — pure
# PolicyDropsDetected noise.
kratos:
  # Migrations run as an init container before the service container, in every environment
  # (docs/guide/database-migrations.md).
  kratos:
    automigration:
      enabled: true
      type: initContainer
  deployment:
    # ADR-0204. Explicit because it needs well above the namespace LimitRange's
    # default request.
    resources:
      requests: { cpu: "100m", memory: "192Mi" }
      limits:   { memory: "512Mi" }
    extraEnv:
      - name: SQA_OPT_OUT
        value: "true"

# Hydra is a public-API add-on (ADR-0305). Off by default — internal-only
# projects run Kratos + Oathkeeper + OpenFGA. The `hydra_thirdparty` flag flips
# `hydra.enabled` on in the per-env GitOps values.
hydra:
  enabled: false
  hydra:
    # Migrations run as an init container before the service container, in every environment
    # (docs/guide/database-migrations.md) — the same shape Kratos runs above.
    automigration:
      enabled: true
      type: initContainer
    config:
      # A placeholder, not the connection Hydra uses: `secret.nameOverride` below sends every pod to the `hydra-secrets`
      # key of the same name.
      dsn: "postgres://hydra@postgres-rw.platform.svc.cluster.local:5432/hydra?sslmode=disable"
      urls:
        self:
          issuer: https://dev.example.com/oauth2/
        login:   https://dev.example.com/auth/login
        consent: https://dev.example.com/auth/consent
        logout:  https://dev.example.com/auth/logout
  # System/cookie secrets + dsn come from a SOPS-managed Secret, never inline values (ADR-0202) — the same wiring
  # Kratos uses.
  secret:
    enabled: false
    nameOverride: hydra-secrets
