apiVersion: v2
name: alertmanager
description: |
  Alertmanager, the routing tier for the rule files that Prometheus evaluates,
  per ADR-0502. Its routing tree, receivers, and inhibitions are committed here,
  and Argo CD reconciles them. They are never UI state.

  Two receivers ship. `ticket` routes to email through the mail path that ADR-0307
  decides. `page` routes to a generic webhook that goes nowhere, because no
  escalation layer ships. To attach a paging service, set that receiver's URL and
  a credential. No rule changes when it arrives.
type: application
version: "2026.9.3"
appVersion: "0.28.1"
