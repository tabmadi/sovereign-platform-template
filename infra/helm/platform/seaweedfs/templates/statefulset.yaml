{{- if .Values.seaweedfs.enabled }}
{{- /*
`weed mini`: master, volume, filer, S3 gateway, and admin UI in one process, per
ADR-0207. It is a StatefulSet and not a Deployment, because the identity and the
volume are the same thing here. The volume holds the only copy of every object.
A second pod on a fresh PVC would be an empty store that answers requests, and
not a replica.

Replicas is not a value. One process IS the shape that ADR-0207 chose for the
in-cluster tiers. A second replica of `mini` is two separate stores that share a
Service. The failure is data that is only there some of the time.
*/}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
  labels: &labels
    app: seaweedfs
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/part-of: platform
spec:
  serviceName: seaweedfs
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels: *labels
    spec:
      securityContext:
        # The image's own `seaweed` user, which owns /data in the image.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: seaweedfs
          image: "{{ .Values.seaweedfs.image.repository }}:{{ .Values.seaweedfs.image.tag }}"
          imagePullPolicy: {{ .Values.seaweedfs.image.pullPolicy }}
          args:
            - mini
            - -dir=/data
            - -master.telemetry={{ .Values.seaweedfs.telemetry }}
            - -bucket={{ join "," .Values.seaweedfs.buckets }}
            {{- if .Values.seaweedfs.adminAuth.enabled }}
            # Kubernetes expands `$(VAR)` in args from the container's own env. So the password reaches the flag, and it does
            # not appear in the pod spec.
            - -admin.password=$(ADMIN_PASSWORD)
            {{- end }}
          env:
            # `weed mini` turns this pair into the S3 identity on first start.
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: {{ .Values.seaweedfs.credentialsSecret }}, key: AWS_ACCESS_KEY_ID }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.seaweedfs.credentialsSecret }}, key: AWS_SECRET_ACCESS_KEY }
            {{- if .Values.seaweedfs.adminAuth.enabled }}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.seaweedfs.credentialsSecret }}, key: ADMIN_PASSWORD }
            {{- end }}
          ports:
            - { name: s3, containerPort: {{ .Values.seaweedfs.service.s3Port }} }
            - { name: admin, containerPort: {{ .Values.seaweedfs.service.adminPort }} }
          # `restricted`, per ADR-0200.
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
          # The S3 endpoint, not the master or the filer. If the S3 layer does not answer,
          # the store is down for every consumer on this platform. That is true even when
          # the components behind it are healthy.
          readinessProbe:
            httpGet: { path: /status, port: s3 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /status, port: s3 }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources: {{ toYaml .Values.seaweedfs.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.seaweedfs.persistence.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.seaweedfs.persistence.size }}
{{- end }}
