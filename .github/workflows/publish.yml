# Build and push container images on every merge to master, then pin dev and staging to them, per ADR-0101 and ADR-0201.
# Images are tagged <service>:<git-sha>. promote-on-release.yml pins prod.
name: publish

on:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

# ghcr.io and the forge's own path are the defaults, because a generated project has a GitHub origin and no cluster yet, per ADR-0102.
# A deployment with its own registry sets these as forge variables.
env:
  IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY || 'ghcr.io' }}
  IMAGE_REPOSITORY: ${{ vars.IMAGE_REPOSITORY || github.repository }}

jobs:
  affected:
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.affected.outputs.services }}
      apps: ${{ steps.affected.outputs.apps }}
      images: ${{ steps.affected.outputs.images }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
      - id: affected
        env:
          BEFORE: ${{ github.event.before }}
        run: mise run ci:affected-matrix >> "$GITHUB_OUTPUT"

  images:
    needs: affected
    # An affected set of `[]` is normal, but GitHub rejects an empty `include`.
    # A job that GitHub cannot create fails the run, and it does not appear in the job list.
    if: ${{ needs.affected.outputs.images != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Explicit {service, cmd} pairs, not a cross product. Not every service has a worker.
        # A build for a missing `cmd/worker` fails one cell for each service with no worker.
        include: ${{ fromJSON(needs.affected.outputs.images) }}
    steps:
      - uses: actions/checkout@v4
      # The toolchain for the signing step. cosign, syft, sops, and yq are pinned in .mise.toml, per ADR-0101.
      # So CI signs with the same binaries that a developer verifies with.
      - uses: ./.github/actions/setup
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          # The forge's own token works for the forge's own registry, which is the default.
          # A separate registry component such as zot has its own push identity, per ADR-0105. These two secrets hold it.
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.service }}-${{ matrix.cmd }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          # Bake the build identity, per ADR-0103: the commit SHA that the pod reports through /version and the X-App-Version header.
          # BUILD_VERSION stays `dev` for master builds. The release stamps prod's CalVer.
          build-args: |
            APP_CMD=${{ matrix.cmd }}
            GIT_SHA=${{ github.sha }}
            BUILD_VERSION=dev
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          push: true
          tags: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}/${{ matrix.service }}-${{ matrix.cmd }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # By digest, not by the new tag, per ADR-0104. cosign resolves a tag itself, and a tag can move between two resolves.
      - name: Sign, SBOM, provenance
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY_CI }}
          # ci:sign records the supply chain, where the signature and both attestations exist.
          # Unset until a project has a Loki to push to. The build is signed in both cases.
          LOKI_PUSH_URL: ${{ vars.LOKI_PUSH_URL }}
          LOKI_PUSH_AUTH: ${{ secrets.LOKI_PUSH_AUTH }}
          LOKI_PUSH_TENANT: ${{ vars.LOKI_PUSH_TENANT }}
        run: mise run ci:sign -- "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}/${{ matrix.service }}-${{ matrix.cmd }}@${{ steps.build.outputs.digest }}"

  # Apps are single images, so they have their own matrix from the same ci:affected manifest.
  # Each app has its own Dockerfile and build context, so the context is resolved below. The build SHA is baked as SERVICE_VERSION, per ADR-0103.
  apps:
    needs: affected
    if: ${{ needs.affected.outputs.apps != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.affected.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
      - id: ctx
        run: mise run ci:build-context -- "${{ matrix.app }}" >> "$GITHUB_OUTPUT"
      - name: Build and push ${{ matrix.app }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.ctx.outputs.context }}
          file: apps/${{ matrix.app }}/Dockerfile
          build-args: SERVICE_VERSION=${{ github.sha }}
          push: true
          tags: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}/${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Sign, SBOM, provenance
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY_CI }}
          LOKI_PUSH_URL: ${{ vars.LOKI_PUSH_URL }}
          LOKI_PUSH_AUTH: ${{ secrets.LOKI_PUSH_AUTH }}
          LOKI_PUSH_TENANT: ${{ vars.LOKI_PUSH_TENANT }}
        run: mise run ci:sign -- "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}/${{ matrix.app }}@${{ steps.build.outputs.digest }}"

  # One job after every image, not a workflow that this one triggers. The forge of ADR-0102 does not raise a completed-run event.
  promote:
    needs: [affected, images, apps]
    # A skipped matrix is empty. A failed cell means a values file would name an image that the registry does not hold.
    if: ${{ !failure() && !cancelled() && (needs.affected.outputs.services != '[]' || needs.affected.outputs.apps != '[]') }}
    runs-on: ubuntu-latest
    concurrency: { group: promote, cancel-in-progress: false }
    permissions:
      contents: write
    steps:
      # The machine user that branch protection lets push, in infra/forge/branch-protection.yaml.
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}", fetch-depth: 0, token: "${{ secrets.PROMOTE_TOKEN || secrets.GITHUB_TOKEN }}" }
      - uses: ./.github/actions/setup
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
      - name: Pin dev and staging by digest
        env:
          SHA: ${{ github.sha }}
          SERVICES: ${{ needs.affected.outputs.services }}
          APPS: ${{ needs.affected.outputs.apps }}
        run: mise run promote:dev-staging
      - name: Push the promotion
        env:
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: mise run ci:push-promotion
      # After the push, because the values just committed decide what is kept.
      - name: Prune the registry
        env:
          IMAGE_PREFIX: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
        run: mise run ci:prune-registry
