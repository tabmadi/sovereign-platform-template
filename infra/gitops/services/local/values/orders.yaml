# Local full-tier values for the orders service, per ADR-0205. The local services ApplicationSet in
# `infra/gitops/local-bootstrap/appset-services.yaml` reads it.
name: orders
image:
  repository: registry.localhost:5000/orders-server
  tag: local            # the local registry stands in for CI. Prod uses a git SHA, per ADR-0101
  pullPolicy: Always    # pull the rebuilt :local again on each cluster:up full run
worker:
  enabled: true
  image:
    repository: registry.localhost:5000/orders-worker
    tag: local
server:  { replicas: 1 }
ingress: { enabled: true, host: dev.localtest.me, resources: [orders] }
# Keep every trace that the service starts. Per ADR-0500, local keeps 100% of healthy traces.
otel:    { deployEnv: local, sampling: "parentbased_traceidratio=1.0" }
# The Lowdefy admin console in `apps/admin` calls orders from its server, east-west on
# the server port. It does not go through the `/api` edge, per ADR-0401.
networkPolicy: { allowFrom: [lowdefy, platform] }
secrets: { envFrom: [orders-db, openfga-creds] }
env:
  CATALOG_URL: http://catalog-server.platform.svc.cluster.local
  PAYMENT_URL: http://payment-server.platform.svc.cluster.local
  # Write authz, per ADR-0304: the server gates the operator-only cancel through the shared
  # Checker. A blank preshared key falls back to `openfga-creds.preshared_key` from `envFrom`,
  # as in catalog and the authz service.
  OPENFGA_API_URL: "http://openfga.platform.svc.cluster.local:8080"
  OPENFGA_PRESHARED_KEY: ""
