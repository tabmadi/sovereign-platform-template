# Secrets ApplicationSet (ADR-0201, ADR-0202). One Application per environment, each syncing that env's encrypted
# SopsSecret CR from infra/gitops/platform/<env>/secrets/.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: secrets
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: secrets
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - { env: dev,     server: "https://kubernetes.default.svc" }
          - { env: staging, server: "https://kubernetes.default.svc" }
          - { env: prod,    server: "https://kubernetes.default.svc" }
  template:
    metadata:
      name: "{{ .env }}-secrets"
      labels:
        env: "{{ .env }}"
        app.kubernetes.io/part-of: secrets
    spec:
      project: "{{ .env }}"
      source:
        repoURL: https://github.com/tabmadi/sovereign-platform-template.git
        targetRevision: master
        path: "infra/gitops/platform/{{ .env }}/secrets"
      destination: { server: "{{ .server }}", namespace: platform }
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true]
        retry:
          limit: 20
          backoff: { duration: 10s, maxDuration: 2m, factor: 2 }
