# Admission control for image provenance, per ADR-0104.
kyverno:
  # Its OWN namespace. This is not for tidiness.
  namespaceOverride: kyverno

  # The CRDs are the policies' API. The chart installs them, not a separate step.
  # Unlike cert-manager, nothing in this chart renders a CR at install time. So the
  # single-pass problem that forced the two-pass install of cert-manager does not happen.
  crds:
    install: true

  # Sized for the local tier and dev, per ADR-0204. A deployed environment raises the
  # replica counts in its own values overlay. Kyverno's four controllers do
  # different work. Only the admission controller is in the request path.
  admissionController:
    replicas: 1
    resources:
      requests: { cpu: "50m", memory: "192Mi" }
      limits: { memory: "384Mi" }
    # The CPU limits that the upstream chart puts on this init container and its hook Jobs are removed in
    # `infra/gitops/platform/shared-values.yaml`, not here. Helm honours a `null` deletion only in a values file passed
    # with `-f`. A wrapper chart's own `values.yaml` is coalesced, and there a nil means not set.
  backgroundController:
    replicas: 1
    # `templates/restart-on-secret-change.yaml` rolls these by patching their pod template.
    rbac:
      clusterRole:
        extraResources:
          - apiGroups: [apps]
            resources: [deployments, statefulsets]
            verbs: [get, list, watch, update, patch]
          - apiGroups: [temporal.io]
            resources: [workerdeployments]
            verbs: [get, list, watch, update, patch]
    resources:
      requests: { cpu: "25m", memory: "96Mi" }
      limits: { memory: "192Mi" }
  cleanupController:
    replicas: 1
    resources:
      requests: { cpu: "10m", memory: "64Mi" }
      limits: { memory: "128Mi" }
  reportsController:
    replicas: 1
    resources:
      requests: { cpu: "25m", memory: "128Mi" }
      limits: { memory: "256Mi" }



policies:
  # `Enforce` rejects. `Audit` records a PolicyReport and admits. Deployed environments enforce.
  validationFailureAction: Enforce

  # The registry prefix that marks a FIRST-PARTY image.
  imagePrefix: ""

  # A Secret in Kyverno's own namespace that holds the pull credential for that registry. Empty for a registry that
  # serves signatures anonymously.
  registrySecret: ""

  # The only places an image can come from: the repositories that the platform's own charts pull from. `mise run
  # gen:image-allowlist` GENERATES them into `infra/gitops/platform/image-allowlist.yaml`. The ApplicationSet passes
  # the file to every chart in the tier.
  allowedImageSources: []

  # The committed public half of the platform signing key, per ADR-0104. It is inlined into the ClusterPolicy as a
  # `keys` attestor.
  publicKey: ""
