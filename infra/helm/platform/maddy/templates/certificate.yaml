{{- if .Values.maddy.enabled }}
{{- /* The senders' Go SMTP clients refuse to send a password without TLS, per ADR-0307. Self-signed, because senders are
in the cluster and skip verification. Ten years, because maddy reads the file only at startup and would miss a renewal. */}}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: maddy-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: maddy-tls
spec:
  secretName: maddy-tls
  duration: 87600h
  commonName: maddy.{{ .Release.Namespace }}.svc.cluster.local
  dnsNames:
    - maddy
    - maddy.{{ .Release.Namespace }}.svc
    - maddy.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef: { name: maddy-selfsigned, kind: Issuer }
{{- end }}
