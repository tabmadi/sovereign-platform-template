{{- if .Values.mailpit.enabled }}
## Mailpit — the non-production mail sink (ADR-0307).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mailpit
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: mailpit
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: platform
            app.kubernetes.io/name: ory-kratos-courier
      toPorts:
        - ports: [{ port: "1025", protocol: TCP }]
{{- if .Values.alertmanager.enabled }}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: platform
            app.kubernetes.io/name: alertmanager
      toPorts:
        - ports: [{ port: "1025", protocol: TCP }]
{{- end }}
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system }
      toPorts:
        # Enforced on the pod's real containerPort 8025, which the Service fronts
        # on the same number.
        - ports: [{ port: "8025", protocol: TCP }]
{{- end }}
