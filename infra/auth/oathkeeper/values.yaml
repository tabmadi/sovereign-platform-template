# The canonical Oathkeeper config, per ADR-0305. It is the single source of truth. It goes into the Ory umbrella
# chart as a Helm values overlay: `-f` in `scripts/cluster.sh` locally, and Argo CD `valueFiles` per environment.
oathkeeper:
  oathkeeper:
    config:
      serve:
        proxy: { port: 4455 }
        api: { port: 4456 }
      access_rules:
        matching_strategy: glob
        repositories:
          - file:///etc/rules/access-rules.json
      authenticators:
        cookie_session:
          enabled: true
          config:
            check_session_url: http://ory-kratos-public.platform.svc.cluster.local/sessions/whoami
            preserve_path: true
            preserve_query: true
            only: [ory_kratos_session]
            # Kratos `whoami` has no top-level `subject` or `extra`. Map them explicitly: `.Subject` is the identity id, and
            # `.Extra` is the whole session body.
            subject_from: identity.id
            extra_from: "@this"
        jwt:
          enabled: true
          config:
            jwks_urls:
              - http://hydra-public.platform.svc.cluster.local/.well-known/jwks.json
        anonymous:
          enabled: true
          config: { subject: guest }
      authorizers:
        # `allow` is for the product `/api` edge. Services authorize in-process with
        # `libs/go/authz`. Ops dashboards use `remote_json` to call the authz service. It checks
        # `group:operator`, `dashboard:<tool>#view`, and AAL2, per ADR-0306.
        allow: { enabled: true }
        remote_json:
          enabled: true
          # The Oathkeeper schema requires both `remote` and `payload` in the global config.
          # Each access rule overrides `payload` with its own tool slug.
          config:
            remote: http://authz-server.platform.svc.cluster.local/authorize
            payload: '{"subject":"{{ print .Subject }}","aal":"{{ print .Extra.authenticator_assurance_level }}"}'
      mutators:
        header:
          enabled: true
          config:
            headers:
              X-User-Id: "{{ print .Subject }}"
              # Guard every hop. The anonymous `guest` authenticator has no `.Extra.identity`. An authenticated identity can
              # have a null `.metadata_public`.
              X-Org-Id: "{{ with .Extra.identity }}{{ with .metadata_public }}{{ print .org_id }}{{ end }}{{ end }}"
              X-Roles: "{{ with .Extra.identity }}{{ with .metadata_public }}{{ print .roles }}{{ end }}{{ end }}"
        noop: { enabled: true }
      errors:
        fallback: [json]
        handlers:
          json: { enabled: true, config: { verbose: false } }
          redirect:
            enabled: true
            config:
              to: https://dev.example.com/auth/login
              # Keep the page the operator wanted to reach.
              return_to_query_param: return_to
              when:
                - error: [unauthorized, forbidden]
                  request: { header: { accept: ["text/html"] } }
