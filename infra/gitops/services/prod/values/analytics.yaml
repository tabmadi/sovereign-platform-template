# Prod values for the analytics service, per ADR-0700 and ADR-0205.
name: analytics
image:
  repository: ghcr.io/tabmadi/sovereign-platform-template/analytics-server
  tag: "0000000000000000000000000000000000000000"
  digest: ""   # promote-on-release pins prod by digest, per ADR-0103
worker: { enabled: false }
server:  { replicas: 1 }
# No `/api` edge route. Nothing in a browser calls this service. The browser emits
# through Faro, and the collector's routing connector delivers here east-west, per
# ADR-0700. An edge route would be a public surface for an internal write path.
ingress: { enabled: false }
otel:    { deployEnv: prod }
secrets: { envFrom: [analytics-db] }
networkPolicy:
  allowFromGateway: false
  # The node-level OTel collector is the only caller. It splits `marketing.*` out of the logs pipeline and
  # delivers the batch here.
  allowFrom: [otel-agent, frontend, platform]
