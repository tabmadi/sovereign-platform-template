[tools]
go = "1.26.4"
bun = "1.4.2"
# node is NOT pinned here — it is an island tool (ADR-0100/ADR-0601). Its consumers
# are test/e2e/ (the Playwright runner) and apps/admin (Lowdefy's optional local dev
# loop), so each pins it in its own config against NODE_VERSION below. See [env].

dbmate = "2.33.0"
sqlc = "1.31.1"
"github:quarylabs/sqruff" = "0.38.0"

# Workflow determinism (ADR-0302): a workflow function that reads the clock, the map iteration order, or the network replays into a different history than it recorded.
"go:go.temporal.io/sdk/contrib/tools/workflowcheck" = "0.5.0"

"go:github.com/ogen-go/ogen/cmd/ogen" = "1.22.0"
vacuum = "0.29.2"
"ubi:oasdiff/oasdiff" = "1.28.0"

biome = "2.5.0"

helm = "4.2.2"
kubectl = "1.36.2"
# CLI pinned to the server appVersion (infra/helm/platform/argocd). cluster:up full
# drives convergence with `argocd app wait --core` (talks to the Application CRDs
# via kubeconfig, no argocd-server login).
argocd = "3.4.4"
cilium-cli = "0.19.4"
terraform = "1.15.6"
kind = "0.32.0"
# talosctl configures every node in a provisioned environment (ADR-0200); no local tier applies a machine config. The version tracks the Talos release infra/talos/ is written against.
talosctl = "1.13.5"

# Dependency updates and template propagation (ADR-0106). renovate is an npm package, so it resolves Node — the one place outside the three islands where Node appears.
"pipx:copier" = "9.17.1"
# A reviewed supply-chain exception, not a bypass: each pin below is a package mise's npm backend reports as a
# trust downgrade, verified against the registry and explained upstream. Scoped to the exact package@version,
# so any other downgrade still fails the install. Git holds each review; delete an entry rather than widening it.
"npm:renovate" = { version = "44.26.0", trust_policy_excludes = [
  "@yarnpkg/libzip@3.2.2",
  "@smithy/core@3.33.0",
  "@smithy/node-http-handler@4.11.0",
] }

age = "1.3.1"
sops = "3.13.1"
gitleaks = "8.30.1"

# Supply chain (ADR-0104), covering OS packages, language dependencies and IaC. Its secret scanner stays off: gitleaks owns that question.
trivy = "0.73.0"
# Image signing and verification (ADR-0104); CI signs with the same binary a developer verifies with.
# 2.x deliberately: cosign 3 makes the Sigstore bundle format mandatory, and the Kyverno path that reads one
# initialises the public TUF root, which is the third-party trust root ADR-0104 refused.
cosign = "2.6.5"
# Pushes the frontend's source-map archive to the registry as an OCI artefact (ADR-0503, ADR-0105).
oras = "1.3.3"
# The SBOM half of the same rule: an SPDX bill of materials attached to each image
# as a cosign attestation, so it travels with the image rather than beside it.
syft = "1.51.0"

# JSON wrangling for runtime glue scripts (ops:grant). Static policy checks use
# Go tools/ instead; this is the one reproducible binary for shell-side JSON.
jq = "1.8.1"
# YAML counterpart of jq, for the prod-promotion glue (promote-on-release writes
# image digests into the prod values files — ADR-0103). Same rationale as jq.
"aqua:mikefarah/yq" = "4.47.1"

# Authorization (OpenFGA model validation + ops-grant tuple writes)
"github:openfga/cli" = "0.7.13"

lefthook = "2.1.9"
cocogitto = "7.0.0"
act = "0.2.89"
golangci-lint = "2.12.2"
rumdl = "0.2.18"
# Shell scripts are first-class here (all glue is bash, ADR-0101) — shellcheck
# lints, shfmt (mvdan/sh) formats. Wired into lint:shell / format:shell and the
# pre-commit hook so a scripts/ edit gets the same gate as Go/TS/Markdown.
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:mvdan/sh" = "3.13.1"

[env]
GOFLAGS = "-mod=readonly"
CGO_ENABLED = "0"
# Single source for the island Node version. Islands pin `node = "{{env.NODE_VERSION}}"`
# in their own config rather than repeating the number — root [env] resolves into a
# nested config's [tools], so there is exactly one place to bump.
NODE_VERSION = "22"


# Task naming: `group:member`, group = the axis you list/run together (ADR-0101).
# `activity:target` for fan-out families with an umbrella (gen, lint, format);
# `resource:operation` for lifecycles (cluster, service, db).

[tasks.setup]
depends = ["setup:node"]
run = "lefthook install"

[tasks."setup:node"]
description = "The workspace's node_modules."
run = "bun install --frozen-lockfile"

# One entrypoint, one verb per task (scripts/cluster.sh). The tier is an argument,
# not a separate command: both are kind, one node each, and what separates them is
# which workloads run and what drives them (ADR-0600, ADR-0205).
[tasks."cluster:up"]
description = "Create, resume or repair a tier."
run = "bash scripts/cluster.sh up"

# One task per label slice of infra/local/deps.yaml. mise dedupes the shared cluster:up edge, and each fast-exits when already Ready.
[tasks."dep:postgres"]
description = "In the floor already (Kratos needs a store); declared anyway so a service's dependencies read as its own, not as something base happens to provide."
depends = ["cluster:up"]
run = "bash scripts/dep-apply.sh postgres"

[tasks."dep:temporal"]
depends = ["cluster:up"]
run = "bash scripts/dep-apply.sh temporal"

[tasks."dep:openfga"]
depends = ["cluster:up"]
run = "bash scripts/dep-apply.sh openfga"

[tasks."dep:db-secrets"]
description = "The per-service DB secrets the service chart mounts via envFrom."
depends = ["cluster:up"]
run = "bash scripts/dep-apply.sh db-secrets"

# `dep:*` covers the infrastructure a service needs; these cover the other services it calls (ADR-0205, ADR-0600).
# Each makes the callee answer on its registered local port. Deploying is the default; run a callee natively and svc:* stays out of the way.
[tasks."svc:authz"]
depends = ["cluster:up"]
run = "bash scripts/svc-apply.sh authz"

[tasks."svc:catalog"]
depends = ["cluster:up"]
run = "bash scripts/svc-apply.sh catalog"

[tasks."svc:orders"]
depends = ["cluster:up"]
run = "bash scripts/svc-apply.sh orders"

[tasks."svc:orgs"]
depends = ["cluster:up"]
run = "bash scripts/svc-apply.sh orgs"

[tasks."svc:payment"]
depends = ["cluster:up"]
run = "bash scripts/svc-apply.sh payment"

[tasks."cluster:glue"]
description = "Re-stamp the host-only edge glue: the catch-all `/` → host `next dev` :3000 and the docker-bridge EndpointSlice behind it."
hide = true
run = "bash scripts/cluster.sh glue"

[tasks."cluster:stop"]
description = "Halt the tier's nodes but KEEP them: the image cache and volumes survive, so the next cluster:up resumes without re-pulling."
run = "bash scripts/cluster.sh stop"

[tasks."cluster:down"]
description = "Delete the tier's cluster and its image cache."
run = "bash scripts/cluster.sh down"

[tasks."cluster:heal"]
description = "Recover a cluster wedged by a host reboot: Docker replays the node raw, which can leave Cilium's datapath half-restored (pods cannot reach the API) and the docker-bridge address stale under."
run = "bash scripts/cluster.sh heal"

[tasks."cluster:status"]
description = "What is running in the active tier and where to reach it: nodes, the registry, the Argo applications or helm releases, and anything not Running."
run = "bash scripts/cluster.sh status"

[tasks."cluster:populate-zot"]
description = "Mirror the first-party images into the full tier's in-cluster zot so its zot.ops console is not empty (ADR-0105)."
run = "bash scripts/populate-zot.sh"

# OPT-IN and separate from every command above: nothing in scripts/cluster.sh knows
# a proxy exists, so a direct network never runs this.
[tasks."proxy:setup"]
description = "Converge this machine for a proxied network, once, before the first cluster:up (docs/guide/http-proxy.md)."
run = "bash scripts/proxy-setup.sh"


[tasks."argo:pause"]
description = "Open a live-patch window: ArgoCD selfHeal reverts any direct edit to a synced resource within seconds, so scale the application-controller to 0 before kubectl-patching / helm-upgrading the c."
run = "bash scripts/argo.sh pause"

[tasks."argo:resume"]
description = "Close the live-patch window and hand the cluster back to GitOps."
run = "bash scripts/argo.sh resume"

[tasks."dev:forward"]
description = "Port-forward the inner-loop deps so a natively-run service can reach them."
run = "bash scripts/dev-forward.sh"

[tasks."dev:frontend"]
description = "The host-run `next dev` the local edge routes `/` to (ADR-0400/0016)."
env = { EDGE_PUBLIC_ORIGIN = "https://dev.localtest.me:8443" }
run = "bash scripts/dev-frontend.sh"

[tasks."mock:start"]
description = "The API mock for UI work (ADR-0600): Prism serving the committed `internal.json` projection, behind the real edge and its real middleware chain."
run = "bash scripts/mock.sh start"

[tasks."mock:stop"]
run = "bash scripts/mock.sh stop"

[tasks."mock:logs"]
description = "The interesting output: a request that matched no operation, and a body that failed the spec's own validation."
run = "bash scripts/mock.sh logs"

[tasks."db:migrate"]
run = "bash scripts/db-migrate.sh"

[tasks."auth:seed"]
description = "Seed the committed deterministic test identities (ADR-0601) into a running Kratos."
run = "bash scripts/identity-seed.sh"

[tasks.gen]
description = "No gateway codegen — the edge (Traefik + Oathkeeper) does not consume the OpenAPI spec (ADR-0305)."
depends = ["gen:shared-components", "gen:openapi", "gen:openapi-public", "gen:zod", "gen:sqlc", "gen:admin", "gen:adr-rules", "gen:data-classes", "gen:image-allowlist", "gen:comment-budget"]

[tasks."gen:adr-rules"]
description = "Two documents are views over the ADR set's Rules sections: the rules index and the security baseline (ADR-0203)."
run = "go run ./tools/adr-rules"

[tasks."gen:comment-budget"]
description = "Lower the committed comment-line ceiling to what the tree now carries (ADR-0001)."
run = "go run ./tools/lint-comments -ratchet"

[tasks."gen:data-classes"]
description = "The data-class and retention registry (ADR-0301) — the checklist a new service is reviewed against."
run = "go run ./tools/data-classes"

[tasks."gen:zod"]
depends = ["gen:shared-components"]
# Request bodies only: response shapes are already TypeScript types from openapi-typescript, and a zod schema is for something a form must validate (ADR-0400).
run = "go run ./tools/zod-gen"

[tasks."gen:shared-components"]
description = "Writes the canonical error envelope, money, and timestamp components into every spec from tools/codegen/shared-components.yaml (ADR-0303)."
run = "go run ./tools/shared-components"

[tasks."gen:openapi"]
depends = ["gen:shared-components"]
run = "bash scripts/gen-openapi.sh"

[tasks."gen:admin"]
description = "Scaffold the Lowdefy admin pages from the OpenAPI specs (ADR-0401)."
depends = ["gen:openapi"]
run = "bash scripts/gen-admin.sh"

[tasks."gen:openapi-public"]
description = "Filtered OpenAPI projections for the Scalar developer portals (ADR-0303/0009/0014)."
run = "bash scripts/gen-openapi-public.sh"

[tasks."gen:authz-model"]
description = "Regenerate infra/auth/openfga/model.json from the canonical model.fga DSL (ADR-0304)."
run = "fga model transform --file infra/auth/openfga/model.fga --output-format json | jq -S . > infra/auth/openfga/model.json"

[tasks."gen:sqlc"]
run = "bash scripts/gen-sqlc.sh"

[tasks."gen:clean"]
description = "Wipe generated SDKs and regenerate, pruning orphans."
run = """
rm -rf libs/go/sdks/* libs/ts/sdks/*
mise run gen
"""

[tasks.format]
depends = ["format:go", "format:ts", "format:md", "format:shell"]

[tasks."format:go"]
run = "golangci-lint fmt ./... ./tools/..."

[tasks."format:ts"]
run = "biome format --write ."

[tasks."format:md"]
description = "rumdl is the only Markdown formatter — never the IDE's."
run = "rumdl fmt ."

[tasks."format:shell"]
description = "shfmt (mvdan/sh) is the shell formatter, over the same file set lint:shell reads (scripts/lib/sh-files.sh)."
run = "bash scripts/format-shell.sh"

[tasks.lint]
depends = ["lint:go", "lint:gostyle", "lint:template-build", "lint:determinism", "lint:ts", "lint:sql", "lint:service-deps", "lint:activity-register", "lint:authz-dual-write", "lint:money", "lint:naming", "lint:helm-deps", "lint:openapi", "lint:api-audience", "lint:floating-tags", "lint:md", "lint:shell", "lint:node-scope", "lint:auth-inline", "lint:authz", "lint:log-vocab", "lint:resource-governance", "lint:ports", "lint:service-databases", "lint:workspace-copies", "lint:service-contract", "lint:prose", "lint:comments", "lint:adr-xref", "lint:readme-drift", "lint:rules-index", "lint:data-classes", "lint:image-allowlist", "lint:thin-workflows", "lint:contrast", "lint:i18n", "lint:secrets", "lint:tool-register", "lint:alert-severity", "lint:project-identity"]

[tasks."lint:go"]
run = "golangci-lint run ./... ./tools/..."

[tasks."lint:gostyle"]
description = "Custom layout-based Go style analyzers."
run = "go run ./tools/gostyle ./..."

[tasks."lint:ts"]
run = "biome ci --error-on-warnings ."

[tasks."lint:template-build"]
description = "`go build ./...` cannot see services/_template: every hand-written file there carries a //go:build _template constraint, which scripts/new-service.sh strips when it copies the tree."
run = "go vet -tags _template ./services/_template/cmd/... ./services/_template/internal/..."

[tasks."lint:helm-deps"]
description = "`helm dependency build` needs the repo registered in the caller's helm config; `update` resolves it from Chart.yaml."
run = "bash scripts/lint-helm-deps.sh"

[tasks."lint:sql"]
run = "bash scripts/lint-sql.sh"

[tasks."lint:openapi"]
run = "bash scripts/lint-openapi.sh"

[tasks."lint:service-contract"]
description = "ADR-0205 gate: every service provides the same artifacts, because the platform DISCOVERS services through those artifacts."
run = "bash scripts/lint-service-contract.sh"

[tasks."lint:workspace-copies"]
description = "A TS workspace member missing from the frontend image build fails `bun install` with \"Workspace not found\" — and only when the image is BUILT, which on the full tier is minutes into a cluste."
run = "bash scripts/lint-workspace-copies.sh"

[tasks."lint:service-databases"]
description = "ADR-0300: a service that ships migrations has a database to run them against."
run = "bash scripts/lint-service-databases.sh"

[tasks."lint:ports"]
description = "Local port registry gate (ADR-0205): ports unique, every service registered, and each service's .mise.toml binding what the registry assigns it."
run = "bash scripts/lint-ports.sh"

[tasks."lint:api-audience"]
description = "Audience↔exposure gate (ADR-0303): a spec's info.x-audience must match whether the service is edge-exposed (public ⇔ has an /api route)."
run = "go run ./tools/lint-api-audience"

[tasks."lint:service-deps"]
description = "The inner loop's dependency graph, checked against the code (ADR-0600, ADR-0205)."
run = "go run ./tools/lint-service-deps"

[tasks."lint:activity-register"]
description = "Temporal registration gate (ADR-0302): every activity a workflow names as a string is registered on its service's worker."
run = "go run ./tools/lint-activity-register"

[tasks."lint:authz-dual-write"]
description = "ADR-0304's dual-write rule, statically: a tuple is written from an activity, never from a handler."
run = "go run ./tools/lint-authz-dual-write"

[tasks."lint:alert-severity"]
description = "The alert-severity gate (ADR-0502)."
run = "go run ./tools/lint-alert-severity"

[tasks."lint:money"]
description = "The monetary-value gate (ADR-0100, ADR-0300): a money-ish OpenAPI property is the shared `Money` component, no Go field or variable with a money-ish name is a float, and no TypeScript money."
run = "go run ./tools/lint-money"

[tasks."lint:naming"]
description = "The resource-name grammar (ADR-0003): `{project}-{env}-{role}[-{n}]` across the Talos inventory, the sops recipients, and the GitOps overlays, with the role vocabulary read from the ADR's ow."
run = "go run ./tools/lint-naming"

[tasks."lint:resource-governance"]
description = "ADR-0204 gate: renders every chart (each service separately) and checks the declared resources against the guardrails in infra/helm/platform/resource-governance BEFORE they reach a cluster."
run = "go run ./tools/lint-resource-governance"

[tasks."lint:floating-tags"]
run = "bash scripts/lint-floating-tags.sh"

[tasks."project:init"]
description = "Adopt this template as a project, for a repository the forge created from it (ADR-0106)."
run = "bash scripts/project-init.sh"

[tasks."lint:project-identity"]
description = "ADR-0106 gate: a project created from this template must own its own name before it pushes."
run = "bash scripts/lint-project-identity.sh"

[tasks."image:digest"]
description = "Resolve a tag to the index digest a Dockerfile or values file pins to, so the pin is read from the registry rather than copied by hand (ADR-0101, ADR-0104)."
run = "bash scripts/image-digest.sh"

[tasks."lint:prose"]
description = "ADR-0001's banned-constructs table, enforced."
run = "go run ./tools/lint-prose"

[tasks."lint:comments"]
description = "The half of ADR-0001's comment table a machine can read, over the Go and TypeScript this repository owns."
run = "go run ./tools/lint-comments"

[tasks."lint:adr-xref"]
description = "The ADR set's internal wiring: references resolve, Related names documents that exist, every ADR carries a Decides line and an index row, the two adoption documents name the same components."
run = "go run ./tools/lint-adr-xref"

[tasks."lint:readme-drift"]
description = "Principle 9 applied to the one document that is not generated."
run = "go run ./tools/lint-readme-drift"

[tasks."gen:image-allowlist"]
description = "The third-party image allow-list (ADR-0104), derived from the charts themselves: every repository the platform's own charts pull from."
run = "bash scripts/gen-image-allowlist.sh"

[tasks."lint:image-allowlist"]
description = "Drift check for it."
run = "bash scripts/gen-image-allowlist.sh --check"

[tasks."lint:data-classes"]
description = "Drift check for it."
run = "go run ./tools/data-classes --check"

[tasks."lint:rules-index"]
description = "Drift check for the generated rule documents."
run = "go run ./tools/adr-rules -check"

[tasks."lint:md"]
run = "rumdl check ."

[tasks."lint:shell"]
description = "shellcheck over every tracked *.sh (ADR-0101)."
run = "bash scripts/lint-shell.sh"

[tasks."lint:log-vocab"]
description = "Human-output vocabulary gate (ADR-0001): scripts use →/✓/✗/⚠ via scripts/lib/log.sh, not bare WARN/ERROR/FAIL prose."
run = "bash scripts/lint-log-vocab.sh"

[tasks."lint:node-scope"]
description = "Node confinement guard (ADR-0100/ADR-0601): Node/npm may appear ONLY in the repo-root test/e2e/ workspace."
run = "bash scripts/lint-node-scope.sh"

[tasks."lint:auth-inline"]
description = "Auth single-source guard (ADR-0305/0010/0029): fails if kratos/oathkeeper config is re-inlined into the Ory chart values instead of living in infra/auth/*, or if the frontend grows developme."
run = "bash scripts/lint-auth-inline.sh"

[tasks."lint:authz"]
description = "Edge-auth policy gates (ADR-0304/0305/0306): - OpenFGA model + assertions (fga model test) + model.json in-sync check - ops dashboards authorize via remote_json → Checker, never `allow` - th."
run = """
bash scripts/validate-openfga.sh
go run ./tools/lint-authorizer infra/auth/oathkeeper/access-rules.json
go run ./tools/lint-api-wildcard infra/auth/oathkeeper/access-rules.json
bash scripts/lint-strip-headers.sh
"""

[tasks.test]
depends = ["test:go", "test:ts"]

[tasks."test:go"]
run = "go test ./... ./tools/..."

[tasks."test:ts"]
description = "The shared TypeScript libraries under libs/ts/ — not the frontend, whose browser behaviour is covered by the e2e suite (ADR-0601)."
depends = ["setup:node"]
run = "bun test libs/ts/"

[tasks."test:template"]
description = "The repository's own generation (ADR-0106): a fixture matrix through `copier copy`, the refusals its validators owe, and the equality between the two adoption paths that `copier update`'s me."
run = "bash scripts/test-template.sh"

[tasks.build]
run = "go build ./... ./tools/..."

[tasks.pre-commit]
depends = ["format", "lint"]

[tasks.check]
depends = ["format", "lint", "test"]

[tasks."ci:affected"]
run = "go run ./tools/affected"

[tasks."lint:secrets"]
description = "ADR-0202: plaintext secret values do not appear in any committed file."
run = "bash scripts/lint-secrets.sh"

[tasks."lint:tool-register"]
description = "ADR-0002's four register Rules: every Tier 1/2 row names an owning ADR that exists, that ADR carries the comparison its tier owes, a Tier 1 row names a runner-up, and every alternative a row."
run = "go run ./tools/lint-tool-register"

[tasks."lint:i18n"]
description = "Localisation, enforced rather than intended (ADR-0400)."
run = "go run ./tools/lint-i18n"

[tasks."lint:contrast"]
description = "Colour contrast against the design-token file rather than per component (ADR-0400): a token change moves every surface at once, so the token file is where a regression is introduced."
run = "go run ./tools/lint-contrast"

[tasks."lint:determinism"]
description = "Temporal workflow determinism (ADR-0302)."
run = "workflowcheck ./services/..."

[tasks."lint:thin-workflows"]
description = "ADR-0102: workflow YAML checks out, sets up the toolchain, and calls a mise task."
run = "go run ./tools/lint-thin-workflows"

[tasks."lint:commits"]
description = "Conventional Commits over the pull request's commit RANGE (ADR-0103)."
run = "bash scripts/lint-commits.sh"

[tasks."lint:api-breaking"]
description = "oasdiff labels breaking contract changes for review; it is NOT a version gate (ADR-0303)."
run = "bash scripts/lint-api-breaking.sh"

[tasks."lint:secrets-history"]
description = "The history scope of lint:secrets."
env = { GITLEAKS_HISTORY = "1" }
run = "bash scripts/lint-secrets.sh"

[tasks."ci:lint"]
depends = ["lint", "lint:commits", "lint:secrets-history", "lint:api-breaking"]

[tasks."ci:scan"]
description = "The vulnerability merge gate (ADR-0104)."
run = "bash scripts/scan.sh"

[tasks."scan:report"]
description = "Triage, not a gate: every dependency finding at every severity, including the ones with no fix published."
run = "bash scripts/scan.sh report"

[tasks."ci:test"]
depends = ["test"]

[tasks."ci:affected-matrix"]
description = "The affected manifest split into the two arrays publish.yml's matrices need, as forge step-output assignments (ADR-0102)."
run = "bash scripts/ci-affected-matrix.sh"

[tasks."ci:sign"]
description = "Sign a published image and attach its SBOM and provenance (ADR-0104)."
run = "bash scripts/ci-sign.sh"

[tasks."supply-chain:inventory"]
description = "Verify the SBOM attestation of every image pinned in committed values and file what is in it (ADR-0104)."
run = "bash scripts/supply-chain-inventory.sh"

[tasks."ci:affected-adversarial"]
description = "Test affected-detection from the other side (ADR-0101, ADR-0601): break each service in a scratch worktree and assert the manifest names it."
run = "bash scripts/ci-affected-adversarial.sh"

[tasks."ci:e2e-gate"]
description = "Whether a pull request pays for the smoke suite, as a forge step-output assignment (ADR-0102, ADR-0601)."
run = "bash scripts/ci-e2e-gate.sh"

[tasks."ci:nightly-gate"]
description = "Whether tonight's cluster:up full suite should run, as a forge step-output assignment (ADR-0102, ADR-0601)."
run = "bash scripts/ci-nightly-gate.sh"

[tasks."ci:build-context"]
description = "An app's Docker build context, as a forge step-output assignment (ADR-0102)."
run = "bash scripts/ci-build-context.sh"

[tasks.release]
description = "Cut a repo-wide CalVer release: compute the version, stamp the fields a build tool requires, regenerate CHANGELOG.md, commit, tag, and push (ADR-0103)."
run = "bash scripts/release.sh"

[tasks."ci:release-info"]
description = "A CalVer release tag resolved to version + commit, as forge step-output assignments (ADR-0102, ADR-0103)."
run = "bash scripts/ci-release-info.sh"

[tasks."promote:dev-staging"]
description = "Bump dev + staging values for every affected component to $SHA."
run = "bash scripts/promote-dev-staging.sh"

[tasks."promote:prod"]
description = "Pin every prod values file to $SHA by digest and label the images $VER."
run = "bash scripts/promote-prod.sh"

[tasks."promote:verify"]
description = "Gate a release on prod converging on $SHA."
run = "bash scripts/promote-verify.sh"

[tasks."ci:build"]
depends = ["build"]

[tasks."ci:preview"]
description = "The pull-request preview environment (ADR-0205): the full tier at one pull request's images and manifests, destroyed with the run that made it."
run = "bash scripts/ci-preview.sh"

[tasks."forge:apply"]
description = "Reconcile the committed branch protection and required checks into the forge (ADR-0102)."
run = "bash scripts/forge-apply.sh"

[tasks."temporal:schedules"]
description = "The platform's periodic obligations, from infra/temporal/schedules.yaml (ADR-0302)."
run = "bash scripts/temporal-schedules.sh"

[tasks."ci:gen"]
description = "The single definition behind ci-drift.yml and the lefthook gen-drift hook: run it locally to reproduce that CI job exactly."
run = "bash scripts/ci-gen.sh"

[tasks."cluster:add"]
description = "One verb for \"put this in the cluster\" (ADR-0600)."
run = "bash scripts/cluster.sh add"

[tasks."cluster:remove"]
description = "The counterpart."
run = "bash scripts/cluster.sh remove"

[tasks."service:deploy"]
description = "One-shot in-cluster deploy of a service from the working tree (no watch)."
run = "bash scripts/service-deploy.sh"

[tasks."service:undeploy"]
description = "Prefer cluster:remove, which also restores GitOps."
run = "bash scripts/cluster.sh remove"

[tasks."service:dev"]
description = "Run a service NATIVELY behind the real edge: stamps the per-service edge glue (an IngressRoute + an EndpointSlice at the docker-bridge gateway) so Traefik routes to the host process, then ha."
run = "bash scripts/service-dev.sh"

[tasks."platform:deploy"]
description = "One-shot working-tree overlay of a platform chart (rare infra iteration)."
run = "bash scripts/platform-deploy.sh"

[tasks."auth:token"]
description = "Mint a Kratos session token for local authenticated calls (needs the full tier)."
run = "bash scripts/auth-token.sh"

[tasks."ops:grant"]
description = "Operator onboarding (ADR-0304/0017): add/revoke a human's group:operator membership by email."
run = "bash scripts/ops-grant.sh"

[tasks."secrets:cosign"]
description = "Generate the platform's image-signing key pair (ADR-0104): public half committed where every environment's Kyverno policy reads it, private half encrypted for CI alone."
run = "bash scripts/secrets-cosign.sh"

[tasks."secrets:age"]
description = "Idempotent; also writes .sops.yaml (ADR-0202)."
run = "bash scripts/secrets-age.sh"

[tasks."secrets:updatekeys"]
description = "Re-encrypt every SOPS file to .sops.yaml's current recipients (ADR-0202). Run after adding or removing an engineer, then commit the diff."
run = "bash scripts/secrets-updatekeys.sh"

[tasks."secrets:age:local"]
description = "Mint this project's own LOCAL-tier age key and re-encrypt the local bundle to it (ADR-0202, ADR-0205)."
run = "bash scripts/rotate-local-age-key.sh"

# Thin delegates into the Node island: the real tasks and the node pin live in test/e2e/.mise.toml, and mise tools flow down a config tree, never up.
[tasks."e2e:install"]
run = "mise run -C test/e2e install"

[tasks.e2e]
run = "mise run -C test/e2e test"

[tasks."e2e:smoke"]
run = "mise run -C test/e2e test:smoke"

# Thin delegates into the k6 island: the pin lives in test/perf/.mise.toml and mise tools flow down a config tree, never up.
# Not part of `test`, `check` or `ci:affected` (ADR-0601), and they need a running full tier.
[tasks.perf]
description = "The steady baseline: nightly + pre-release."
run = "mise run -C test/perf load"

[tasks."frontend:sourcemaps"]
description = "Collect the production build's browser source maps for a release and strip them from the served output (ADR-0503)."
run = "bash scripts/frontend-sourcemaps.sh"

[tasks."perf:re-derive"]
description = "The measured numbers the ADR set asserts, recomputed and printed beside what is committed (ADR-0001)."
run = "bash scripts/perf-rederive.sh"

[tasks."perf:smoke"]
description = "~30s."
run = "mise run -C test/perf smoke"

[tasks."perf:stress"]
description = "Ramp to saturation."
run = "mise run -C test/perf stress"

[tasks."perf:soak"]
description = "~30min sustained, for leak detection."
run = "mise run -C test/perf soak"

[tasks."e2e:a11y"]
description = "The axe scan alone (ADR-0400), for iterating on an accessibility fix."
run = "mise run -C test/e2e test:a11y"

[tasks."e2e:visual"]
description = "The committed screenshot baselines alone (ADR-0601), for iterating on an intentional UI change without a full acceptance run."
run = "mise run -C test/e2e test:visual"

[tasks."lighthouse"]
description = "Web vitals and the per-route bundle budgets, as merge gates (ADR-0400): LCP < 2.5s, CLS < 0.1, and Total Blocking Time < 200ms on the mobile profile."
run = "mise run -C test/e2e lighthouse"

[tasks."perf:seed"]
description = "Bulk catalog data so the read path is measured against a realistic table."
run = "mise run -C test/perf seed"

[tasks.upgrade]
depends = ["upgrade:tools", "upgrade:js", "upgrade:go"]

[tasks."upgrade:tools"]
run = "bash scripts/upgrade-tools.sh"

[tasks."upgrade:js"]
run = "bun update --latest --recursive"

[tasks."upgrade:go"]
description = "GOFLAGS override: go get must write go.mod (env pins -mod=readonly)."
run = """
GOFLAGS= go get -u ./libs/... ./services/...
GOFLAGS= go mod tidy
GOFLAGS= go -C tools get -u ./...
GOFLAGS= go -C tools mod tidy
"""

[tasks.act]
run = "act pull_request --secret-file .env -e .github/act/pull_request.json"

[tasks."act:local"]
description = "act with a pre-baked toolchain image (scripts/act-local.sh): bakes the full mise toolchain once, so the parallel jobs share it instead of each re-installing it."
run = "bash scripts/act-local.sh"
