apiVersion: v2
name: temporal-worker-controller
description: |
  Rainbow deploys for Temporal workers, per ADR-0302. It reconciles one Kubernetes
  Deployment per Worker Deployment Version. So a version's pods outlive the
  rollout that replaced it. This makes Pinned versioning a real guarantee, and
  not a best effort.
type: application
version: "2026.9.3"
appVersion: "1.8.0"

dependencies:
  # The CRDs are NOT here. They have their own base-tier chart,
  # `infra/helm/platform/temporal-worker-controller-crds`. This chart renders a `Connection` custom resource, and
  # Helm cannot validate a CR against a CRD that is installed in the same release.
  - name: temporal-worker-controller
    version: "0.27.0"
    repository: oci://docker.io/temporalio
