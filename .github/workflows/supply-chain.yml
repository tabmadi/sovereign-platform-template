# Nightly supply-chain inventory, per ADR-0104 and ADR-0501. It verifies each pinned image's SBOM attestation and records its contents.
# It runs nightly, not for each build, because it reports what an environment runs. That changes on a promotion and with new CVEs.
# It can fail and pages nobody. It is a research surface.
name: supply-chain

on:
  schedule:
    # 03:00 UTC: after the day's merges are promoted, and before working hours in the westernmost likely timezone.
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  # renovate runs as the dependency bot, never in a job. Its install is the largest in the toolchain and warns on every runner.
  MISE_DISABLE_TOOLS: npm:renovate
  # Every checkout runs `git init`, which prints a hint on each job while git has no default branch name.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: master

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # cosign, jq, and yq are pinned in .mise.toml, per ADR-0101. So this verifies with the same binaries that signed.
      - uses: ./.github/actions/setup
      # The attestations are in the registry that holds the images. `packages: read` above gives the token that access.
      - uses: docker/login-action@v4
        with:
          # The same three settings as publish.yml. The registry is configuration.
          # A deployment with its own registry, per ADR-0105, sets them as forge variables and does not edit this file.
          registry: ${{ vars.IMAGE_REGISTRY || 'ghcr.io' }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
      - name: Verify SBOMs and file the inventory
        env:
          # Unset until a project has a place to push to. The script reports this and continues.
          # The verification is the goal. The record only makes the result readable later.
          LOKI_PUSH_URL: ${{ vars.LOKI_PUSH_URL }}
          LOKI_PUSH_AUTH: ${{ secrets.LOKI_PUSH_AUTH }}
          LOKI_PUSH_TENANT: ${{ vars.LOKI_PUSH_TENANT }}
        run: mise run supply-chain:inventory
