{{- if .Values.policies.imagePrefix }}
{{- $design := printf "%sdesign/" (trimSuffix "*" .Values.policies.imagePrefix) }}
# A design image runs only in a design namespace, per ADR-0701 and ADR-0113. It is a production build with fixtures
# on, built from a pull request, and signed with the platform key. So the signature alone does not keep it out of dev or prod.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: design-images-stay-in-design-namespaces
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    policies.kyverno.io/title: Design images stay in design namespaces
    policies.kyverno.io/category: Supply chain
    policies.kyverno.io/severity: critical
    policies.kyverno.io/description: >-
      An image under the design/ path of the platform registry serves fixtures
      as if they were data (ADR-0701). It runs only in a design-pr-<n> namespace.
spec:
  validationActions: [{{ include "policies.action" . }}]
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchConditions:
    - name: outside-design-namespaces
      expression: "!namespaceObject.metadata.name.startsWith('design-pr-')"
  variables:
    - name: images
      expression: {{ include "policies.podImages" . | quote }}
    - name: design
      expression: {{ $design | toJson | quote }}
  validations:
    - expression: "!variables.images.exists(image, image.startsWith(variables.design))"
      message: >-
        A design image runs only in a design-pr-<n> namespace, per ADR-0701.
        It is a build with fixtures on, and it must never serve a real environment.
{{- if .Values.policies.publicKey }}
---
# The signature check of a design namespace, per ADR-0113. The ApplicationSet names the commit tag, because the pull
# request generator knows no digest. So this policy pins the pod to the digest that it verified. It does not rewrite
# the Deployment, because Argo CD would then see drift on every sync, so it sets no autogen.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-design-signatures
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    policies.kyverno.io/title: Design images are signed and pinned at admission
    policies.kyverno.io/category: Supply chain
    policies.kyverno.io/severity: critical
    policies.kyverno.io/description: >-
      A pod in a design-pr-<n> namespace runs only images that carry the platform
      signature, pinned to the digest that admission verified (ADR-0113, ADR-0701).
spec:
  validationActions: [{{ include "policies.action" . }}]
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 30
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchConditions:
    - name: in-design-namespaces
      expression: "namespaceObject.metadata.name.startsWith('design-pr-')"
  matchImageReferences:
    - glob: {{ .Values.policies.imagePrefix | quote }}
  {{- include "policies.signature" . | nindent 2 }}
{{- end }}
{{- with .Values.policies.registrySecret }}
---
# The registry pull credential of each design namespace, per ADR-0203 and ADR-0114. A design namespace comes and goes
# with a pull request, so no committed Secret can name it. Kyverno copies the credential that it pulls signatures with.
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: design-namespace-pull-secret
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    policies.kyverno.io/title: Design namespaces get the registry pull credential
    policies.kyverno.io/category: Supply chain
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Copies the registry pull credential into each design-pr-<n> namespace, so
      its pod can pull the design image (ADR-0701).
spec:
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [namespaces]
  matchConditions:
    - name: design-namespaces
      expression: "object.metadata.name.startsWith('design-pr-')"
  variables:
    - name: source
      expression: {{ printf "resource.Get(%q, %q, %q, %q)" "v1" "secrets" $.Values.kyverno.namespaceOverride . | quote }}
  generate:
    - expression: generator.Apply(object.metadata.name, [variables.source])
{{- end }}
{{- end }}
