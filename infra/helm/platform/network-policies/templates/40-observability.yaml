## Egress to the node-level OTel collector. It runs in its own namespace, per ADR-0200, because it needs hostPath
## and hostPorts, so PSA keeps it apart.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: otlp-egress
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: {{ .Values.otelAgentNamespace }} }
      toPorts:
        - ports:
            - { port: "4317", protocol: TCP }
            - { port: "4318", protocol: TCP }
---
## Loki: writes come from the OTel collector, and reads come from Grafana.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: loki
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: loki
  ingress:
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: {{ .Values.otelAgentNamespace }}, app.kubernetes.io/name: opentelemetry-collector }
        - matchLabels: { k8s:io.kubernetes.pod.namespace: platform, app.kubernetes.io/name: grafana }
      toPorts:
        - ports: [{ port: "3100", protocol: TCP }]
---
## Prometheus: OTLP metrics push from BOTH collectors, the DaemonSet agent and the otel-cluster singleton, and
## queries from Grafana, all on 9090.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: prometheus
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  ingress:
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: {{ .Values.otelAgentNamespace }}, app.kubernetes.io/name: opentelemetry-collector }
        - matchLabels: { k8s:io.kubernetes.pod.namespace: platform, app.kubernetes.io/name: otel-cluster }
        - matchLabels: { k8s:io.kubernetes.pod.namespace: platform, app.kubernetes.io/name: grafana }
        # The alert-hygiene report reads the ALERTS series, per ADR-0502. It is named
        # here, and not left to the baseline. The readers of the metrics store are a
        # list, and a reader not on it is a reader that nobody decided on.
        - matchLabels: { k8s:io.kubernetes.pod.namespace: platform, app.kubernetes.io/name: alertmanager-hygiene-report }
        # The platform worker's monthly cardinality audit, per ADR-0500.
        - matchLabels: { k8s:io.kubernetes.pod.namespace: platform, app.kubernetes.io/name: platform, component: worker }
      toPorts:
        - ports: [{ port: "9090", protocol: TCP }]
---
## otel-cluster to Kyverno's metrics, per ADR-0113 and ADR-0500.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: otel-cluster-kyverno-scrape
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: otel-cluster
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kyverno
      toPorts:
        - ports: [{ port: "8000", protocol: TCP }]
{{- if .Values.etcdMetrics.addresses }}
---
## otel-cluster to the etcd metrics port of the nodes, per ADR-0500.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: otel-cluster-etcd-scrape
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: otel-cluster
  egress:
    - toEntities: [host, remote-node]
      toPorts:
        - ports: [{ port: {{ .Values.etcdMetrics.port | quote }}, protocol: TCP }]
---
## The baseline lets a pod reach the nodes, so a deny keeps the etcd metrics port for otel-cluster, per ADR-0500.
## One selector cannot exclude a name and a namespace together, so each policy covers one half.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: deny-etcd-metrics-other-names
spec:
  endpointSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: NotIn, values: [otel-cluster] }
  # A deny rule otherwise turns every selected pod to egress default-deny, per `80-metadata-egress-deny.yaml`.
  enableDefaultDeny:
    egress: false
  egressDeny:
    - toEntities: [host, remote-node, kube-apiserver]
      toPorts:
        - ports: [{ port: {{ .Values.etcdMetrics.port | quote }}, protocol: TCP }]
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: deny-etcd-metrics-other-namespaces
spec:
  endpointSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [otel-cluster] }
      - { key: k8s:io.kubernetes.pod.namespace, operator: NotIn, values: [platform] }
  enableDefaultDeny:
    egress: false
  egressDeny:
    - toEntities: [host, remote-node, kube-apiserver]
      toPorts:
        - ports: [{ port: {{ .Values.etcdMetrics.port | quote }}, protocol: TCP }]
{{- end }}
{{- if .Values.hostMetrics.address }}
---
## otel-cluster to the node exporter of the hypervisor host, per ADR-0208.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: otel-cluster-host-metrics
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: otel-cluster
  egress:
    - toCIDR: [{{ printf "%s/32" .Values.hostMetrics.address | quote }}]
      toPorts:
        - ports: [{ port: {{ .Values.hostMetrics.port | quote }}, protocol: TCP }]
{{- end }}
{{- if .Values.externalProbe.enabled }}
---
## otel-cluster to the blackbox exporter outside the cluster, per ADR-0500.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: otel-cluster-external-probe
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: otel-cluster
  egress:
    - toCIDR: [{{ required "externalProbe.cidr is required" .Values.externalProbe.cidr | quote }}]
      toPorts:
        - ports: [{ port: {{ .Values.externalProbe.port | quote }}, protocol: TCP }]
{{- end }}
---
## Tempo: trace push on OTLP 4317 and 4318 from OTel, and queries on 3200 from Grafana.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tempo
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: tempo
  ingress:
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: {{ .Values.otelAgentNamespace }}, app.kubernetes.io/name: opentelemetry-collector }
      toPorts:
        - ports:
            - { port: "4317", protocol: TCP }
            - { port: "4318", protocol: TCP }
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: platform, app.kubernetes.io/name: grafana }
      toPorts:
        - ports: [{ port: "3200", protocol: TCP }]
---
## Pyroscope: profile pushes from the Alloy agent, and queries from Grafana, on 4040.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: pyroscope
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: pyroscope
  ingress:
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: platform, app.kubernetes.io/name: alloy }
        - matchLabels: { k8s:io.kubernetes.pod.namespace: platform, app.kubernetes.io/name: grafana }
      toPorts:
        - ports: [{ port: "4040", protocol: TCP }]
---
## Alloy, the pprof scraper, per ADR-0501.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: alloy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: alloy
  egress:
    - toCIDR: [{{ .Values.podCIDR | quote }}]
      toPorts:
        - ports: [{ port: "9090", protocol: TCP }]
---
## Grafana, the ops UI, reached only through the edge gateway, on 3000.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  ingress:
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system }
      toPorts:
        - ports: [{ port: "3000", protocol: TCP }]
