# Local full-tier values for the catalog service (ADR-0205). See orders.yaml for the secret-naming note
# (catalog-db = local SopsSecret resource).
name: catalog
image:
  repository: registry.localhost:5000/catalog-server
  tag: local            # local registry (CI stand-in); prod uses a git SHA (ADR-0101)
  pullPolicy: Always    # re-pull the rebuilt :local on a cluster:up full re-run
worker:  { enabled: false }
server:  { replicas: 1 }
ingress: { enabled: true, host: dev.localtest.me, resources: [products] }
# The Lowdefy admin console (apps/admin) calls catalog server-side, east-west on the server port, bypassing the
# /api edge (ADR-0401).
networkPolicy: { allowFrom: [lowdefy, orders] }
# Keep every trace the service starts (ADR-0500: local overrides healthy traces to 100%).
otel:    { deployEnv: local, sampling: "parentbased_traceidratio=1.0" }
secrets: { envFrom: [catalog-db, openfga-creds] }
env:
  # Write authz (ADR-0304): dial OpenFGA via the shared Checker. Blank preshared key
  # falls back to openfga-creds.preshared_key (envFrom), as the authz service does.
  OPENFGA_API_URL: "http://openfga.platform.svc.cluster.local:8080"
  OPENFGA_PRESHARED_KEY: ""
