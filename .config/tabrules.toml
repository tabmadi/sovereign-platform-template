[rules."gen/rules-index"]
rules-path = "docs/reference/rules-index.md"
baseline-path = "docs/security-baseline.md"
rules-intro = "This document lists every normative rule in the ADR set, with the mechanism that enforces it. The owning ADR carries the reasoning. This document carries only the rule, so a reviewer can read the whole law without reading the whole set.\n\nReview enforces a rule with no annotation. That rule binds in the same way as an annotated one. The annotation states where the gate is, not how strong the rule is, per [ADR-0001](../adr/0001-documentation-conventions.md).\n\n"
rules-outro = "The ratio is a fact about the set, not a target. A rule moves into the first row when someone writes a check for it. A count that moves the wrong way is the signal to read.\n"
baseline-intro = "These are the security controls that every instance of this platform holds. Each one is a rule from the ADR that owns it, with the mechanism that enforces it. This document is generated from those Rules sections, so a control cannot be described here and decided differently there.\n\n**Scope.** These controls hold for every instance. A particular project turns on more controls for its own risk profile or compliance framework. Those are in [`per-instance-hardening.md`](reference/per-instance-hardening.md). That file is written by hand, because it is a property of the instance, not of the baseline.\n\n**Review enforces a control with no annotation.** Review is a weaker gate, but the rule binds in both cases. The difference is visible here for the same reason it is visible in the ADRs.\n"

[rules."gen/data-classes"]
output = "docs/reference/data-classes.md"
retention = ".config/retention.yaml"
header = ".config/data-classes/header.tmpl"
footer = ".config/data-classes/footer.tmpl"

[rules."gen/shared-components"]
source = ".config/shared-components.yaml"

[rules."gen/zod"]
out-dir = "libs/ts/schemas"
header = "// GENERATED by `just gen-zod`. Do not edit.\n//\n// Zod schemas for the request bodies in {service}/openapi.yaml, per ADR-0400. Forms\n// validate with these through the shared <Form> primitive, so a field in the\n// browser enforces the same rule that the spec states.\nimport { z } from \"zod\";\n"

[rules."gen/admin"]
out-dir = "apps/admin/_generated"
header = "# GENERATED by tabrules, per ADR-0401. Do not edit. Run `just gen-admin`.\n"

[rules."gen/build-path"]
doc = "docs/reference/build-path.md"

