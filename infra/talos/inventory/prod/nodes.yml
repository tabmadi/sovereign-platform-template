# The committed inventory of pre-provided Talos nodes, per ADR-0200.
nodes:
  example-prod-cp-1: { address: 203.0.113.31, role: controlplane }
  example-prod-cp-2: { address: 203.0.113.32, role: controlplane }
  example-prod-cp-3: { address: 203.0.113.33, role: controlplane }

# The address that `talosctl` and the Kubernetes clients dial. Use a load balancer over
# all three, or DNS round-robin. Never use the address of one member. That makes the
# member a single point of failure for a cluster that has none.
endpoint: https://kube.example.com:6443
