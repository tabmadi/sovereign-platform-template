# The machine config of the control-plane role, per ADR-0200, applied on top of `common.yaml`.
cluster:
  # Cilium is the CNI, and there is no kube-proxy, per ADR-0206. Both settings must be in place BEFORE the cluster
  # bootstraps.
  network:
    cni:
      name: none
  proxy:
    disabled: true

  # On day one there is no separate worker set, so the control plane runs the workloads.
  # ADR-0200's scaling trigger adds workers under sustained pressure. This stays
  # true when they arrive, because nothing is pinned to a node.
  allowSchedulingOnControlPlanes: true

  # Talos's own node-discovery service talks to a registry that Sidero hosts. The
  # cluster is discoverable from its own inventory in `infra/talos/inventory/`. So
  # this is a third-party dependency in the bootstrap path that gives nothing.
  discovery:
    enabled: false

  apiServer:
    # ADR-0300's audit trail starts at the API server. Without a policy, it records
    # metadata for nothing. Then the first time someone asks who deleted a resource
    # is after the resource is gone.
    auditPolicy:
      apiVersion: audit.k8s.io/v1
      kind: Policy
      rules:
        # Secret and ConfigMap bodies carry the values that they protect. So the
        # request is recorded, and its contents are not.
        - level: Metadata
          resources:
            - group: ""
              resources: [secrets, configmaps]
        - level: RequestResponse
          verbs: [create, update, patch, delete]
        - level: Metadata

  etcd:
    # etcd listens only on the private network. By default, it binds the first
    # address it finds. On a host with a public interface, that is the public one.
    advertisedSubnets: [10.0.0.0/8]
