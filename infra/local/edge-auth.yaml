# Local-only edge wiring for the Kratos login flow, per ADR-0305. Unlike in prod, the frontend is NOT deployed
# in the cluster locally. It runs on the host with `next dev`.
---
# A Service with no selector, for the host `next dev`. There is no host-alias record for
# the host. So `scripts/cluster.sh` attaches an EndpointSlice that points at the docker
# bridge gateway, the host, on :3000. It is the only host IP that pods can route to.
apiVersion: v1
kind: Service
metadata:
  name: frontend-dev
  namespace: platform
spec:
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
# Catch-all to the host `next dev`. This is the LAST RESORT. An explicit low priority guarantees that, and not
# Traefik's default order by rule length.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: frontend
  namespace: platform
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: PathPrefix(`/`)
      priority: 1
      services:
        - name: frontend-dev
          port: 3000
  tls:
    secretName: wildcard-tls
