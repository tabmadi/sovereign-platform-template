# Values are under `publicTls:`, so this chart shares the single per-environment
# values overlay of the platform ApplicationSet with no key collisions.
publicTls:
  # Off in the local tiers. There, cert-manager's own self-signed CA issues the
  # same wildcard secret names, per ADR-0205. The deployed overlays turn it on.
  enabled: false

  # The wildcard host that this environment serves, such as `dev.example.com`. Every
  # certificate below comes from it. A certificate for `*.` is worse than a render
  # that fails, so it is required and has no default.
  envHost: ""

  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    # Where expiry warnings and account recovery go. `Let's Encrypt` sends nothing
    # else here. It is required for the same reason as the host: nobody can recover
    # an account with a placeholder address.
    email: ""
    # DNS-01 and not HTTP-01, because the certificates are WILDCARDS, and
    # `Let's Encrypt` issues those only over DNS-01. The token comes from the
    # secrets tier as `cloudflare-api-token`, per ADR-0202.
    cloudflare:
      tokenSecret: cloudflare-api-token
      tokenKey: token
