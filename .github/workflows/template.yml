name: template

# The template's own gates. Generated projects exclude them, per ADR-0106. Acceptance is this repository's nightly e2e.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "0 5 * * *" # after perf at 04:00
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generation:
    if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'labeled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Generate every fixture and compare the adoption paths
        run: mise run test:template

  acceptance:
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'template-acceptance')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: acceptance-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          go-cache: "true"
      # Restore only, like e2e.yml: the lighthouse job is the one writer of the mirror.
      - name: Restore the registry mirror
        # A self-hosted runner keeps the store in its home between jobs. Only a fresh hosted machine needs the cache.
        if: runner.environment == 'github-hosted'
        uses: actions/cache/restore@v4
        with:
          # A literal path: this string versions the cache, and runner.temp differs for each job on a self-hosted runner.
          path: ~/.cache/zot/registry.localhost
          key: zot-all-${{ runner.os }}-${{ hashFiles('infra/local/image-refs.txt') }}
      - name: Generate a project and prove it serves
        run: mise run acceptance
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
