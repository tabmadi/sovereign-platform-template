{{- if and .Values.policies.imagePrefix .Values.policies.publicKey }}
# Every first-party image carries a signature that this platform made, per ADR-0113. On success, Kyverno rewrites the
# image reference of the pod to the digest it verified.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-first-party-signatures
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    policies.kyverno.io/title: First-party images are signed
    policies.kyverno.io/category: Supply chain
    policies.kyverno.io/severity: critical
    policies.kyverno.io/description: >-
      Every image from this platform's own registry must carry a cosign signature
      made with the platform key pair (ADR-0113). Third-party images are out of
      scope: they are pinned by digest and allow-listed instead, and a signature
      rule that matched them would reject every upstream component in the cluster.
spec:
  validationActions: [{{ include "policies.action" . }}]
  # A signature check calls the registry, so it cannot fail open. If a policy admits on timeout, an attacker only has
  # to make the registry slow.
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 30
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  # `design-images.yaml` verifies a design namespace without rewriting its Deployment, per ADR-0701.
  matchConditions:
    - name: outside-design-namespaces
      expression: "!namespaceObject.metadata.name.startsWith('design-pr-')"
  matchImageReferences:
    - glob: {{ .Values.policies.imagePrefix | quote }}
  {{- include "policies.signature" . | nindent 2 }}
{{- end }}
