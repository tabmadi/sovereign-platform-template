apiVersion: v2
name: sops-operator
description: |
  In-cluster controller that decrypts the SOPS files that CRDs reference, and
  creates native Kubernetes Secrets, per ADR-0202. It uses
  isindir/sops-secrets-operator as the upstream implementation.
type: application
version: "2026.9.3"
appVersion: "0.21.0"

dependencies:
  - name: sops-secrets-operator
    version: "0.27.1"
    repository: https://isindir.github.io/sops-secrets-operator/
