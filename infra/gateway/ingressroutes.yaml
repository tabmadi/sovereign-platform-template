# exists in every environment. If a project sets `headlamp.enabled=false`, the
# route resolves to no endpoints.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ops-headlamp
  namespace: platform
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: HostRegexp(`^headlamp\.ops\..+`)
