{{- if .Values.mailpit.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: platform
  labels: { app.kubernetes.io/name: mailpit }
spec:
  replicas: {{ .Values.mailpit.replicas }}
  selector: { matchLabels: { app.kubernetes.io/name: mailpit } }
  template:
    metadata: { labels: { app.kubernetes.io/name: mailpit } }
    spec:
      # `restricted`, per ADR-0200.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mailpit
          image: "{{ .Values.mailpit.image.repository }}:{{ .Values.mailpit.image.tag }}"
          imagePullPolicy: {{ .Values.mailpit.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            # No MP_DATABASE: messages stay in memory and are lost with the pod. That is the
            # purpose of a sink. A mail that nobody read is not state worth keeping, and this
            # keeps the component off the storage tier.
            - { name: MP_SMTP_BIND_ADDR, value: "0.0.0.0:{{ .Values.mailpit.service.smtpPort }}" }
            - { name: MP_UI_BIND_ADDR, value: "0.0.0.0:{{ .Values.mailpit.service.httpPort }}" }
            # The sink accepts anything. Kratos's connection_uri carries no credentials and
            # no TLS. If this required either, it would reject every message. The error
            # would show only in the courier's retry log.
            - { name: MP_SMTP_AUTH_ACCEPT_ANY, value: "true" }
            - { name: MP_SMTP_AUTH_ALLOW_INSECURE, value: "true" }
          ports:
            - { name: smtp, containerPort: {{ .Values.mailpit.service.smtpPort }} }
            - { name: http, containerPort: {{ .Values.mailpit.service.httpPort }} }
          # SMTP readiness, not HTTP. The courier is the only consumer that must work. A
          # running viewer says nothing about the listener.
          readinessProbe: { tcpSocket: { port: smtp } }
          livenessProbe: { tcpSocket: { port: smtp } }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      # readOnlyRootFilesystem leaves no place to write. Mailpit holds messages in
      # memory, but it still needs a scratch path.
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: mailpit, namespace: platform }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: mailpit }
  ports:
    - { name: smtp, port: {{ .Values.mailpit.service.smtpPort }}, targetPort: smtp }
    - { name: http, port: {{ .Values.mailpit.service.httpPort }}, targetPort: http }
{{- end }}
