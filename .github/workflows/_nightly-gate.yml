# Shared activity gate for the nightly full-tier suites. Re-running them against a commit that already passed
# buys nothing: a red is flake or upstream drift, and a green is a result already held.
# A reusable `workflow_call` rather than a composite action: it is a whole job with an output two workflows gate on.
name: nightly-gate

on:
  workflow_call:
    inputs:
      workflow_file:
        description: "The caller's own workflow file, whose run history decides the skip."
        required: true
        type: string
    outputs:
      run:
        description: "'true' when the nightly suite should proceed."
        value: ${{ jobs.gate.outputs.run }}

permissions:
  contents: read
  # Reading the caller's own run history: the skip is only safe when the last run PASSED, and that fact lives in
  # the forge. A caller grants this on the calling job, or the workflow is rejected before it starts.
  actions: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      # Full history: --since needs commits to look at, and a shallow clone has one.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - id: check
        env:
          EVENT: ${{ github.event_name }}
          WORKFLOW_FILE: ${{ inputs.workflow_file }}
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run ci:nightly-gate >> "$GITHUB_OUTPUT"
