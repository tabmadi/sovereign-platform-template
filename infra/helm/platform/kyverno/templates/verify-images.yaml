{{- if and .Values.policies.imagePrefix .Values.policies.publicKey }}
# Every first-party image carries a signature that this platform made, per ADR-0104. `verifyImages` is a MUTATING
# rule and also a validating one. On success, Kyverno rewrites the image reference to the digest it verified.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-first-party-signatures
  annotations:
    # After the CRDs. They are TEMPLATES of the subchart, not files in a `crds/` directory. So a single Helm
    # pass renders this CR against an API server that does not know `kyverno.io/v1`.
    argocd.argoproj.io/sync-wave: "1"
    policies.kyverno.io/title: First-party images are signed
    policies.kyverno.io/category: Supply chain
    policies.kyverno.io/severity: critical
    policies.kyverno.io/description: >-
      Every image from this platform's own registry must carry a cosign signature
      made with the platform key pair, plus an SBOM and provenance attestation
      (ADR-0104). Third-party images are out of scope: they are pinned by digest
      and allow-listed instead, and a signature rule that matched them would reject
      every upstream component in the cluster.
spec:
  validationFailureAction: {{ .Values.policies.validationFailureAction }}
  background: false
  webhookTimeoutSeconds: 30
  # A signature check calls the registry, so it cannot fail open. If a policy
  # admits on timeout, an attacker only has to make the registry slow.
  failurePolicy: Fail
  rules:
    - name: signed-by-the-platform-key
      match:
        any:
          - resources:
              kinds: [Pod]
      verifyImages:
        # `type` keeps its default, Cosign. That is the classic simple-signing layout, which `scripts/ci-sign.sh`
        # produces with `--new-bundle-format=false`.
        - imageReferences:
            - {{ .Values.policies.imagePrefix | quote }}
          # Kyverno writes the digest that it verified back into the pod spec.
          mutateDigest: true
          # A reference that already carries a digest is left as it is, and not
          # resolved again.
          required: true
          {{- with .Values.policies.registrySecret }}
          # The signature is a referrer in the same private registry that the image comes from. Kyverno reads it with the same credential.
          imageRegistryCredentials:
            secrets: [{{ . | quote }}]
          {{- end }}
          attestors:
            - count: 1
              entries:
                - keys:
                    publicKeys: |-
{{ .Values.policies.publicKey | trim | indent 22 }}
                    # The signature algorithm is pinned. cosign's default is ECDSA-P256-SHA256,
                    # and the key above is one. But a policy that accepts any algorithm that
                    # the signature claims accepts a downgrade.
                    signatureAlgorithm: sha256
                    # No transparency log, on purpose, in both directions. ADR-0104 chose a key pair over keyless, because the only
                    # verifier here is our own admission controller. Keyless gives the trust root to an outside party.
                    rekor:
                      ignoreTlog: true
                    ctlog:
                      ignoreSCT: true
{{- end }}
