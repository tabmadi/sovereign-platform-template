# Prometheus (ADR-0500): the Core-tier metrics store — a single prom/prometheus process with a local TSDB and
# native OTLP ingest, no object-storage dependency. One Deployment, mirroring Loki (SingleBinary) and Tempo.
{{- $p := .Values.prometheus }}
{{/* The config lives in a define so the Deployment can stamp its sha256 as a pod-template annotation.
     Without that checksum a config edit updates the ConfigMap but never rolls the pod, and Prometheus keeps
     running the old config indefinitely. */}}
{{- define "observability.prometheus.config" }}
    global:
      scrape_interval: 30s
    # OTLP metrics arrive from the OTel collector (--web.enable-otlp-receiver).
    otlp:
      translation_strategy: UnderscoreEscapingWithSuffixes
      # Resource attributes are otherwise dropped from series.
      promote_resource_attributes:
        [
          "service.name",
          "service.namespace",
          "k8s.deployment.name",
          "k8s.statefulset.name",
          "k8s.node.name",
          "k8s.persistentvolumeclaim.name",
          "k8s.volume.name",
          "k8s.volume.type",
        ]
    # OTLP pushes can land slightly out of order across collector batches.
    storage:
      tsdb:
        out_of_order_time_window: 30m
    # Services push via OTLP; nothing is scraped by default.
    scrape_configs: []
    # Alerts-as-code (ADR-0500): rule files from infra/observability/alerts/, delivered as the `prometheus-alerts`
    # ConfigMap by the prometheus-alerts ArgoCD Application (same pattern as the Grafana dashboards ConfigMap) and
    # mounted below.
    rule_files:
      - /etc/prometheus/rules/*.yaml
    # Alertmanager routes every alert (ADR-0502). Evaluation stays here and routing happens there — one primitive per
    # concern.
    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - {{ .Values.prometheus.alertmanagerTarget }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus
  labels: { app.kubernetes.io/name: prometheus, app.kubernetes.io/part-of: observability }
data:
  prometheus.yml: |
    {{- include "observability.prometheus.config" . }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  labels: { app.kubernetes.io/name: prometheus, app.kubernetes.io/part-of: observability }
spec:
  # A StatefulSet, because the TSDB below is a ReadWriteOnce volume. A Deployment
  # carrying one deadlocks its own rolling update: the replacement pod waits for a
  # volume the outgoing pod still holds, and the rollout never completes.
  serviceName: prometheus
  replicas: {{ $p.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: prometheus }
  template:
    metadata:
      labels: { app.kubernetes.io/name: prometheus }
      # Roll the pod whenever the config changes — Prometheus only reads its config at startup (no reloader sidecar in
      # the Core stack).
      annotations:
        checksum/config: {{ include "observability.prometheus.config" . | sha256sum }}
    spec:
      # `restricted` (ADR-0200).
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: prometheus
          securityContext: {{- include "observability.containerSecurityContext" . | nindent 12 }}
          image: {{ $p.image }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/data
            - --storage.tsdb.retention.time={{ $p.retention }}
            - --web.enable-otlp-receiver
            - --web.listen-address=0.0.0.0:{{ $p.httpPort }}
          ports:
            - { name: http, containerPort: {{ $p.httpPort }} }
          readinessProbe: { httpGet: { path: /-/ready,   port: http }, initialDelaySeconds: 15 }
          livenessProbe:  { httpGet: { path: /-/healthy, port: http }, initialDelaySeconds: 30, periodSeconds: 30 }
          resources: {{- toYaml $p.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: rules,  mountPath: /etc/prometheus/rules }
            - { name: data,   mountPath: /data }
      volumes:
        - name: config
          configMap: { name: prometheus }
        # Alert rules from infra/observability/alerts/ (prometheus-alerts Argo app). Mounted read-only under the config
        # dir; rule_files (above) globs it.
        - name: rules
          configMap: { name: prometheus-alerts }
  # The TSDB.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with $p.storage.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $p.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels: { app.kubernetes.io/name: prometheus, app.kubernetes.io/part-of: observability }
spec:
  selector: { app.kubernetes.io/name: prometheus }
  ports:
    - { name: http, port: {{ $p.httpPort }}, targetPort: http }
