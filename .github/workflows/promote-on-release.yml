# Tag-driven prod promotion (ADR-0201, ADR-0103), triggered by the CalVer tag `mise run release` cuts.
# It pins every prod service to the release commit by digest, labels the images, opens the pin as a PR that merges on green, and gates on the rollout.
name: promote-on-release

on:
  push:
    tags: ["v[0-9][0-9][0-9][0-9].[0-9][0-9].*"]

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  promote:
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          # Same three settings as publish.yml, for the same reason: the registry
          # is configuration, and a deployment that runs its own (ADR-0105) sets
          # them as forge variables rather than editing this file.
          registry: ${{ vars.IMAGE_REGISTRY || 'ghcr.io' }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Resolve release
        id: rel
        run: mise run ci:release-info >> "$GITHUB_OUTPUT"

      - name: Pin prod to digests + label images with the CalVer
        env:
          SHA: ${{ steps.rel.outputs.sha }}
          VER: ${{ steps.rel.outputs.version }}
        run: mise run promote:prod

      - name: Open the prod pin and merge it on green
        env:
          VER: ${{ steps.rel.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run ci:release-pr

      # "Argo Healthy" already means the new ReplicaSet is available, but a release must not report success until prod has converged on the release commit (ADR-0201, ADR-0103).
      - name: Verify prod rollout
        env:
          SHA: ${{ steps.rel.outputs.sha }}
        run: mise run promote:verify

      - name: Publish the release
        env:
          VER: ${{ steps.rel.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run ci:release-publish
