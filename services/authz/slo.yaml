# Service level objectives for authz (ADR-0500). The mechanics and why the objective ships unset are in services/_template/slo.yaml.

window: 30d # rolling (ADR-0500)

availability:
  # Good event: a response that is not 5xx.
  objective: null # set per project — docs/reference/detection-latency.md bounds it

latency:
  # Every check sits inside another service's request, so its budget is the tightest.
  threshold: 0.5 # seconds, and an `le` bucket boundary the histogram has
  objective: null # set per project

exclude:
  - /livez
  - /readyz
  - admin-port
