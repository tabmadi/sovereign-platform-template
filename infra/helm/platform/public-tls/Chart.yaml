apiVersion: v2
name: public-tls
description: |
  The public ACME issuer and the wildcard certificates that the edge serves, per
  ADR-0205.

  It is separate from the cert-manager chart because of WHEN it can work, not
  what it does. cert-manager is a base-tier component: the webhook must exist
  before anything can create a cert-manager object. Its ACME issuer cannot be in
  the base tier, for these reasons:
  - A DNS-01 solver needs an API token, and tokens arrive with the secrets tier.
  - An Application is Progressing while an issuer that it owns is not Ready.
  - So an ACME issuer in the base tier keeps that tier open. It waits for a
    secret that a later tier delivers, and no later tier ever runs.
type: application
version: "2026.9.3"
