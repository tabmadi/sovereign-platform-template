# The committed inventory of pre-provided Talos nodes (ADR-0200).
nodes:
  example-staging-cp-1: { address: 203.0.113.21, role: controlplane }
  example-staging-cp-2: { address: 203.0.113.22, role: controlplane }
  example-staging-cp-3: { address: 203.0.113.23, role: controlplane }

# The address `talosctl` and the Kubernetes clients dial. A load balancer over all
# three, or DNS round-robin; never one member's address, which turns that member
# into a single point of failure for a cluster that has none.
endpoint: https://kube.staging.example.com:6443
