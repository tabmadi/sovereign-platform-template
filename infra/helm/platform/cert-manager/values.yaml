cert-manager:
  installCRDs: true
  prometheus: { enabled: false }

# Whether this chart's own ClusterIssuers and Certificates render.
issuers:
  enabled: true

# The wildcard host that the issued certs cover, such as `dev.example.com` or `dev.localtest.me`.
# Set it per environment in `infra/gitops/platform/<env>/values.yaml`.
envHost: ""

# Local and non-public TLS. When true, issue the wildcard secrets from a SelfSigned
# ClusterIssuer in the platform namespace, and not from `Let's Encrypt`, per ADR-0205.
selfSigned:
  enabled: false
