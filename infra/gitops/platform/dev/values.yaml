# Per-environment platform overrides, per ADR-0201.
cluster:
  instances: 3
  storage: { size: 50Gi }
  backup:
    retentionPolicy: "7d"
    s3: { endpointURL: "http://seaweedfs.platform.svc.cluster.local:8333", destinationPath: "s3://platform-backups/postgres" }

# Non-prod object storage is in-cluster SeaweedFS, not the off-cluster store,
# per ADR-0205. Override the S3 endpoint of each backend. Prod keeps the chart
# defaults, which point at the off-cluster bucket, and disables this chart.
loki:
  loki:
    storage:
      s3:
        endpoint: seaweedfs.platform.svc.cluster.local:8333
        s3ForcePathStyle: true
        insecure: true
tempo:
  tempo:
    storage:
      trace:
        s3:
          endpoint: seaweedfs.platform.svc.cluster.local:8333
          insecure: true

# Lowdefy admin console, per ADR-0401. It is the one platform image built in this repo. `publish.yml` promotes
# it like the services and the frontend. Local uses the local registry.
lowdefy:
  # The registry that this environment pulls from authenticates every pull, per ADR-0105.
  imagePullSecrets:
    - name: registry-pull
  image:
    repository: ghcr.io/tabmadi/sovereign-platform-template/admin
    tag: "0000000000000000000000000000000000000000"
    digest: ""

# Talos ships no storage provisioner, and nothing else claims the default
# StorageClass here, per ADR-0200. So an unannotated PVC resolves to this one.
# The laptop tier leaves it off, because kind brings its own.
localPath:
  enabled: true

# The wildcard host that this environment serves, and the ACME account that certifies it, per ADR-0205.
envHost: dev.example.com
publicTls:
  enabled: true
  envHost: dev.example.com
  acme:
    email: ops@example.com

# Identity, at this environment's host.
kratos:
  kratos:
    config:
      serve:
        public:
          base_url: "https://dev.example.com/auth/"
      selfservice:
        default_browser_return_url: https://dev.example.com/
        # The apex, and every ops origin. The ops entry lets a denied panel request
        # return to that panel after login. Oathkeeper puts the origin in `return_to`,
        # and Kratos follows it only if it is listed here.
        allowed_return_urls:
          - https://dev.example.com/
          - https://*.ops.dev.example.com/
        flows:
          error:        { ui_url: https://dev.example.com/auth/error }
          login:        { ui_url: https://dev.example.com/auth/login }
          registration: { ui_url: https://dev.example.com/auth/register }
          recovery:     { ui_url: https://dev.example.com/auth/recovery }
          verification: { ui_url: https://dev.example.com/auth/verification }
          settings:     { ui_url: https://dev.example.com/auth/settings }
        methods:
          totp:
            config:
              issuer: dev.example.com
          webauthn:
            config:
              rp:
                id: dev.example.com
                display_name: Platform
                origins: ["https://dev.example.com"]
      # Each ops tool has its own origin under `ops.<host>`, per ADR-0306. So the
      # session cookie must cover the whole host and not only the apex.
      session:
        cookie:
          domain: dev.example.com

# Where Oathkeeper sends an unauthenticated browser request, per ADR-0305.
oathkeeper:
  oathkeeper:
    config:
      errors:
        handlers:
          redirect:
            config:
              to: https://dev.example.com/auth/login

# Admission control, per ADR-0104. A first-party image comes from this prefix, pinned by digest and signed with the platform key.
policies:
  imagePrefix: "ghcr.io/tabmadi/sovereign-platform-template/*"
  registrySecret: registry-pull
