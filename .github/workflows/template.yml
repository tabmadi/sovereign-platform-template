name: template

# The gates of the template itself, per TPL-0000. Each job runs only in the template repository, so a copy that keeps
# this file runs nothing. `just init` removes it. Acceptance is the nightly e2e of this repository.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "0 5 * * *" # after perf at 04:00
  workflow_dispatch:

permissions:
  contents: read

env:
  # The binary cache of ADR-0101, read by the setup action. Without the variables both are empty.
  NIX_CACHE_URL: ${{ vars.NIX_CACHE_URL }}
  NIX_CACHE_PUBLIC_KEY: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
  # Every checkout runs `git init`, which prints a hint on each job while git has no default branch name.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: master

jobs:
  generation:
    if: >-
      github.repository == 'tabmadi/sovereign-platform-template' &&
      (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'labeled'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Make a project from every fixture and compare the two ways
        run: nix develop --command just test-template

  acceptance:
    if: >-
      github.repository == 'tabmadi/sovereign-platform-template' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'template-acceptance'))
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      group: acceptance-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # On this repository, e2e.yml's full job never runs on its schedule, so this job writes the mirror cache.
      - name: Restore the registry mirror
        id: registry-cache
        # A self-hosted runner keeps the store in its home between jobs. Only a fresh hosted machine needs the cache.
        if: runner.environment == 'github-hosted'
        uses: actions/cache/restore@v6
        with:
          # A literal path: this string versions the cache, and runner.temp differs for each job on a self-hosted runner.
          path: ~/.cache/zot/registry.localhost
          key: zot-all-${{ runner.os }}-${{ hashFiles('infra/local/image-refs.txt') }}
      - name: Generate a project and prove it serves
        run: nix develop --command just acceptance
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      # Saved on a miss and on `always()`. The warm fails when upstream throttles, and a partial store still helps the next run.
      - name: Save the registry mirror
        if: always() && runner.environment == 'github-hosted' && steps.registry-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          # A literal path: this string versions the cache, and runner.temp differs for each job on a self-hosted runner.
          path: ~/.cache/zot/registry.localhost
          key: ${{ steps.registry-cache.outputs.cache-primary-key }}
