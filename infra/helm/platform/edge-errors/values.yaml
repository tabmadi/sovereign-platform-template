# Values namespaced under `edgeErrors:` so this chart shares the platform ApplicationSet's single per-env values
# overlay without key collisions.
edgeErrors:
  enabled: true

  # busybox httpd, which serves static files and maps an extension to a MIME type. That is the whole requirement: no
  # templating, no request handling, no state.
  image:
    repository: docker.io/library/busybox
    tag: "1.37.0"
    digest: sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
    pullPolicy: IfNotPresent

  # Two replicas. Every intercepted response makes a subrequest here, so this is in
  # the path of every denial the edge issues — a single replica makes an ordinary
  # rollout a window where denials fall back to Oathkeeper's dialect.
  replicas: 2

  port: 8080

  resources:
    requests: { cpu: 5m, memory: 16Mi }
    limits: { memory: 32Mi }

  # The statuses Traefik intercepts, and the title each one carries. `title` is stable and does not vary with the
  # instance, which is what RFC 9457 asks of it.
  problems:
    - status: 401
      title: Unauthorized
    - status: 403
      title: Forbidden
    - status: 429
      title: Too Many Requests
    - status: 502
      title: Bad Gateway
    - status: 503
      title: Service Unavailable
    - status: 504
      title: Gateway Timeout
