{{- if and .Values.cluster.create .Values.cluster.backup.enabled }}
# The base backup that PITR replays WAL onto, per ADR-0207. Archived WAL alone restores nothing.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ .Values.cluster.name }}-daily
  namespace: platform
spec:
  cluster:
    name: {{ .Values.cluster.name }}
  schedule: {{ .Values.cluster.backup.schedule | quote }}
  immediate: true
  backupOwnerReference: self
{{- end }}
