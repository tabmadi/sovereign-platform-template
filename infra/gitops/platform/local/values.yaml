# Local overrides for `cluster:up full`. They are consumed the same way the Argo CD ApplicationSet consumes the
# dev, staging, and prod values, per ADR-0205. Local differs from prod only through this overlay, which sits on
# top of each platform chart's own values.

# Cilium, the CNI: kind declines kube-proxy at create time. So the chart default `kubeProxyReplacement=true`
# applies with no override.
cilium:
  operator:
    replicas: 1

# TLS with cert-manager: a self-signed wildcard for `*.dev.localtest.me` and ops, in
# the platform namespace, where the edge IngressRoutes resolve the secrets. It is the
# same cert-manager mechanism as deployed environments. Only the issuer differs, per ADR-0205.
envHost: dev.localtest.me
selfSigned:
  enabled: true

# Data tier: `instances=1` and small storage, sized for a laptop.
# Top-level `cluster:`. The postgres chart's own values schema has no
# `postgres:` namespace wrapper, unlike the dependency subcharts below.
cluster:
  instances: 1
  storage: { size: 2Gi }
  # Backups are ON locally, to the in-cluster SeaweedFS that the non-prod environments use,
  # per ADR-0205. The backup path is code, and no laptop runs a path that is off locally.
  # The data is throwaway. The assertion is that a backup completes.
  backup:
    enabled: true
    retentionPolicy: "7d"
    s3:
      destinationPath: "s3://platform-backups/postgres"
      endpointURL: "http://seaweedfs.platform.svc.cluster.local:8333"

# Top-level `replicas:`. The openfga chart's own values schema has no
# `openfga:` namespace wrapper.
replicas: 1

kratos:
  kratos:
    config:
      dsn: "postgres://dev:dev@postgres-rw.platform.svc.cluster.local:5432/kratos?sslmode=disable"
      serve:
        public:
          base_url: "https://dev.localtest.me:8443/auth/"
      # Prod values point these at `dev.example.com`. Locally, the edge is on :8443,
      # so the unauthenticated browser redirect must come back to `localtest.me`.
      selfservice:
        default_browser_return_url: https://dev.localtest.me:8443/
        # Allow a post-login `return_to` back to any gated app route on the local
        # edge. The chart baseline lists `dev.example.com`. Without this, a visit to
        # `/panel` or `/devportal` with no session gets a 400 in the error flow.
        allowed_return_urls:
          - https://dev.localtest.me:8443/
          # The ops origins too, so a denied panel request returns to that panel after
          # login. The redirect handler in `infra/auth/oathkeeper` carries it.
          - https://*.ops.dev.localtest.me:8443/
        flows:
          error:        { ui_url: https://dev.localtest.me:8443/auth/error }
          login:        { ui_url: https://dev.localtest.me:8443/auth/login }
          registration: { ui_url: https://dev.localtest.me:8443/auth/register }
          recovery:     { ui_url: https://dev.localtest.me:8443/auth/recovery }
          verification: { ui_url: https://dev.localtest.me:8443/auth/verification }
          settings:     { ui_url: https://dev.localtest.me:8443/auth/settings }
        # WebAuthn and TOTP are bound to a domain. The relying-party id and origins must
        # match the local edge host. The chart base uses `dev.example.com`.
        methods:
          totp:
            config:
              issuer: dev.localtest.me
          webauthn:
            config:
              rp:
                id: dev.localtest.me
                display_name: Platform (local)
                origins: ["https://dev.localtest.me:8443"]
      # Share the session cookie with subdomains, because `hubble.ops.dev.localtest.me`
      # has its own origin. This overrides the chart's `dev.example.com` default.
      session:
        cookie:
          domain: dev.localtest.me
      # The sink, per ADR-0307.
      courier:
        smtp:
          connection_uri: "smtp://mailpit.platform.svc.cluster.local:1025/?disable_starttls=true"
    # The cookie, cipher, and system secrets and the dsn come from the SOPS-managed `kratos-secrets` Secret in
    # `infra/gitops/platform/local/secrets/platform.enc.yaml`. `infra/auth/kratos/values.yaml` references it with
    # `secret.enabled=false` and `nameOverride`. They are never inline here, per ADR-0202, Phase 5.

# Oathkeeper sends unauthenticated browser `text/html` requests to a login page.
# Override the prod placeholder host, so gated routes redirect to the local edge.
oathkeeper:
  oathkeeper:
    config:
      errors:
        handlers:
          redirect:
            config:
              to: https://dev.localtest.me:8443/auth/login

# Observability: point Loki and Tempo at in-cluster SeaweedFS, with a single replica. Only the endpoint and
# insecure http differ from prod. The S3 credentials come from the observability-bucket Secret through `extraEnvFrom`,
# set in the chart values for every environment. So there are no inline keys here, as in dev, staging, and prod.
loki:
  singleBinary:
    resources: { requests: { cpu: "25m" } }
  loki:
    storage:
      s3:
        endpoint: "seaweedfs.platform.svc.cluster.local:8333"
        s3ForcePathStyle: true
        insecure: true

tempo:
  tempo:
    resources: { requests: { cpu: "25m" } }
    storage:
      trace:
        s3:
          endpoint: "seaweedfs.platform.svc.cluster.local:8333"
          insecure: true

# Prometheus' TSDB on a laptop.
prometheus:
  resources: { requests: { cpu: "25m" } }
  storage:
    size: 5Gi

# Keep every healthy trace locally.
opentelemetry-collector:
  config:
    processors:
      probabilistic_sampler:
        sampling_percentage: 100

# Grafana: a known local admin password. Prod supplies one through a Secret.
# It serves at the root of its ops origin, per ADR-0306. `root_url` carries the local
# edge's :8443 port, so post-login redirects land on the same origin.
grafana:
  resources: { requests: { cpu: "25m" } }
  adminPassword: "admin"
  grafana.ini:
    server:
      root_url: "https://grafana.ops.dev.localtest.me:8443/"

# Lowdefy admin console, per ADR-0401. The image is built in this repo and pulled from the local registry, the CI
# stand-in, at the stable `local` tag. `Always` makes a `cluster:up full` run pick up a
# rebuild.
lowdefy:
  replicas: 1
  image:
    repository: registry.localhost:5000/admin
    tag: local
    pullPolicy: Always

# Core ops tools, local wiring. Headlamp at `headlamp.ops`, per ADR-0501, and pgweb at `pgweb.ops`, per ADR-0401,
# are Core. Their chart defaults turn them on in every environment.
pgweb:
  # The read-only role, not `dev`, per ADR-0401.
  databaseUrl: "postgres://readonly:readonly@postgres-rw.platform.svc.cluster.local:5432/orders?sslmode=disable"

# Admission control, per ADR-0104. The local tier publishes no images and holds no signing key. So both policies
# are always absent: `imagePrefix` is empty, and that renders neither.
policies:
  imagePrefix: ""
  # Audit, not Enforce. This setting is required, and it is not leniency.
  validationFailureAction: Audit

# OFF locally. This is the one component whose local source differs from the deployed one, per ADR-0600.
localPath:
  enabled: false

# CPU requests on one node, sized down to a 4-core CI runner, per ADR-0204. Every request below is a reservation,
# not a cap. The measured requests of the deployed tiers push the services out of scheduling here. Every container
# that declares nothing pays the LimitRange default. A busy container still takes the idle CPU.
pyroscope:
  resources: { requests: { cpu: "25m" } }
alloy:
  resources: { requests: { cpu: "25m" } }
limitRanges:
  platform: { defaultCPURequest: "10m" }
  argocd: { defaultCPURequest: "10m" }
  kube-system: { defaultCPURequest: "10m" }
temporal:
  server:
    history:
      resources:
        requests: { cpu: "100m", memory: "768Mi" }
