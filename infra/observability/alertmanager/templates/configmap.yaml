{{/*
The committed silences, as JSON. Converted at render time because the sync job runs in the Alertmanager
image, which carries amtool and no YAML parser.
`fromYamlArray` on an empty file yields an empty list, which means "no silences" rather than an error.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-silences
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/component: observability
data:
  silences.json: |
    {{ .Files.Get "silences.yaml" | fromYamlArray | toJson }}
