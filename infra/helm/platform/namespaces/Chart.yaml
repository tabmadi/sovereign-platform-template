apiVersion: v2
name: namespaces
description: |
  Every namespace that this platform owns, and the Pod Security Standards profile
  that each one enforces, per ADR-0200.

  This is a chart and not Argo CD's `managedNamespaceMetadata`, because PSA's
  exception unit is the namespace. So the profile of a namespace, and the REASON
  it is not `restricted`, is a decision about that namespace. It is not a
  property of the Application that created the namespace first. ADR-0200 requires
  the manifest of the namespace to record that reason, and this is that manifest.
  With it, a namespace exists with its labels before anything is admitted into it.
  `CreateNamespace=true` cannot promise that. It creates the namespace with no
  labels, and a label added later governs only the NEXT admission.

  The profile is not the same everywhere, on purpose. `restricted` is the target.
  A namespace below it states why. Every namespace warns and audits at
  `restricted` in all cases. So the gap shows in `kubectl` output and in the audit
  log, and not only in this file.
type: application
version: "2026.9.3"
appVersion: "1.0.0"
