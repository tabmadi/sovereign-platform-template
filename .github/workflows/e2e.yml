# End-to-end and visual acceptance (ADR-0601). Every full-platform e2e needs a `cluster:up full`, so cadence is
# per environment and these jobs are not part of ci:affected. The nightly is activity-gated.
# cluster:up full is ~16GB, the whole of a standard runner: a larger one buys margin, not capability.
name: e2e

on:
  schedule:
    - cron: "0 3 * * *" # nightly full suite
  push:
    tags: ["v*", "services/*/v*"] # pre-release (ADR-0103)
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:
    inputs:
      suite:
        description: "full or smoke"
        default: "full"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Is tonight's run worth a cluster bring-up? Only the cron asks — an explicit
  # trigger (tag, dispatch) always means yes.
  gate:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_nightly-gate.yml
    with:
      workflow_file: e2e.yml

  full:
    # Nightly, pre-release tags, and manual full runs — never on a PR.
    needs: gate
    if: >-
      needs.gate.outputs.run == 'true' && (
      github.event_name == 'schedule' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.suite == 'full'))
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Provision the local SOPS age key
        run: mise run secrets:age
      # Authenticated Docker Hub pulls for zot's sync: anonymous pulls are limited per source IP, which this runner
      # shares with the whole forge. Unset on a fork, where the secrets do not resolve.
      # Restore-only: the lighthouse job is the single writer, and a full-tier bring-up would cache first-party images.
      - name: Restore the registry mirror
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/zot
          key: zot-${{ runner.os }}-${{ hashFiles('infra/local/image-refs.txt') }}

      - name: Bring up cluster:up full
        run: mise run cluster:up -- full
        env:
          ZOT_DATA: ${{ runner.temp }}/zot
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Install Playwright (Node island)
        run: mise run e2e:install
      - name: Run full e2e + visual suite
        run: mise run e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-full
          path: |
            test/e2e/playwright-report/
            test/e2e/test-results/
          retention-days: 7
      - name: Tear down
        if: always()
        run: mise run cluster:down

  # A change spanning more than one service is the class no test below the e2e level can see (ADR-0601). A task, not an expression, because it reads the affected manifest (ADR-0102).
  pr-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      # Full history: the affected manifest is a diff against the merge base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - id: check
        env:
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'e2e-smoke') }}
          BASE_REF: ${{ github.base_ref }}
        run: mise run ci:e2e-gate >> "$GITHUB_OUTPUT"

  smoke:
    # A golden path + a key dashboard render, on the PRs that need it.
    needs: pr-gate
    if: needs.pr-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Provision the local SOPS age key
        run: mise run secrets:age
      - name: Restore the registry mirror
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/zot
          key: zot-${{ runner.os }}-${{ hashFiles('infra/local/image-refs.txt') }}

      - name: Bring up cluster:up full
        run: mise run cluster:up -- full
        env:
          ZOT_DATA: ${{ runner.temp }}/zot
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Install Playwright (Node island)
        run: mise run e2e:install
      - name: Run smoke suite
        run: mise run e2e:smoke
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: |
            test/e2e/playwright-report/
            test/e2e/test-results/
          retention-days: 7
      - name: Tear down
        if: always()
        run: mise run cluster:down
