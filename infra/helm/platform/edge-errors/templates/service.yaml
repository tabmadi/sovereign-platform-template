{{- if .Values.edgeErrors.enabled }}
{{- /*
A stable `edge-errors` name for any release name. The Traefik Middleware in
infra/gateway/middlewares.yaml addresses this Service by name. Under Argo CD, the
release is `<env>-platform-edge-errors`.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: edge-errors
  namespace: platform
  labels:
    app.kubernetes.io/name: edge-errors
    app.kubernetes.io/part-of: platform
spec:
  selector:
    app.kubernetes.io/name: edge-errors
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
