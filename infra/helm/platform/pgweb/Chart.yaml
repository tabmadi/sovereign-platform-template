apiVersion: v2
name: pgweb
description: |
  pgweb read-only database inspector, per ADR-0401. It is one more ops-tier origin,
  at pgweb.ops.<host>. It is a single stateless Go binary. Core: it is on in every
  environment. Set pgweb.enabled=false in an environment overlay to drop it. It
  runs with pgweb's own --readonly flag. Read-only is the documented break-glass
  intent.
type: application
version: "2026.9.3"
appVersion: "0.16.2"
