{{/*
PodDisruptionBudgets (ADR-0204) for the multi-replica and stateful Core. A PDB constrains only voluntary
disruption, so it is a drain-safety device rather than an availability guarantee.
`minAvailable: 1` in front of a single replica permits zero disruptions, so each entry is explicitly enabled.
*/}}
{{- range $name, $cfg := .Values.podDisruptionBudgets }}
{{- if $cfg.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  namespace: {{ $cfg.namespace | default "platform" }}
  labels:
    app.kubernetes.io/name: resource-governance
    app.kubernetes.io/part-of: platform
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
    resource-governance/rationale: {{ $cfg.rationale | quote }}
spec:
  minAvailable: {{ $cfg.minAvailable | default 1 }}
  selector:
    matchLabels: {{- toYaml $cfg.selector | nindent 6 }}
{{- end }}
{{- end }}
