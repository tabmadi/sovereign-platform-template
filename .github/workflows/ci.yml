# The merge gates, per ADR-0102. Each job is a thin caller of one `mise run ci:*` task.
# The job names are the required checks in infra/forge/branch-protection.yaml.
name: ci

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          go-cache: "true"
      - name: Compile everything
        run: mise run ci:build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          go-cache: "true"
      - name: Run tests
        run: mise run ci:test

  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Regenerate, reformat, fail on drift
        run: mise run ci:gen

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Run linters
        # The base of the commit range for `lint:commits`. It is empty on a push, and then master is the base.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: mise run ci:lint

  # A service that affected-detection misses gets no checks, and the pull request still passes, per ADR-0101.
  # This job breaks each service in a scratch worktree. A failure here means CI's selection is wrong.
  affected-detection:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Adversarially test affected-detection
        run: mise run ci:affected-adversarial

  # Separate from lint, because it fails for a different reason, per ADR-0104.
  # A dependency that gets a published fix turns a green PR red with no code change.
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Scan dependencies
        run: mise run ci:scan
