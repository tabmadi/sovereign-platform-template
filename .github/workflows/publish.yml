# Build and push container images on every merge to master, then pin dev and staging to them, per ADR-0111 and ADR-0201.
# Images are tagged <service>:<git-sha>. promote-on-release.yml pins prod.
name: publish

on:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

# ghcr.io and the forge's own path are the defaults, because a generated project has a GitHub origin and no cluster yet, per ADR-0116.
# A deployment with its own registry sets these as forge variables.
env:
  # The binary cache of ADR-0101, read by the setup action. Without the variables both are empty.
  NIX_CACHE_URL: ${{ vars.NIX_CACHE_URL }}
  NIX_CACHE_PUBLIC_KEY: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
  IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY || 'ghcr.io' }}
  IMAGE_REPOSITORY: ${{ vars.IMAGE_REPOSITORY || github.repository }}
  # Every checkout runs `git init`, which prints a hint on each job while git has no default branch name.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: master

jobs:
  affected:
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-26.04
    outputs:
      services: ${{ steps.affected.outputs.services }}
      apps: ${{ steps.affected.outputs.apps }}
      images: ${{ steps.affected.outputs.images }}
    steps:
      - uses: actions/checkout@v7.0.1
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
      - id: affected
        env:
          BEFORE: ${{ github.event.before }}
        run: nix develop --command just ci-affected-matrix >> "$GITHUB_OUTPUT"

  images:
    needs: affected
    # An affected set of `[]` is normal. The job is skipped, and promote reads the skip as no failure.
    if: ${{ needs.affected.outputs.images != '[]' }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      # The toolchain for the signing step. cosign, syft, sops, and yq are pinned in flake.nix, per ADR-0100.
      # So CI signs with the same binaries that a developer verifies with.
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/registry-login
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          # The forge's own token works for the forge's own registry, which is the default.
          # A separate registry component such as zot has its own push identity, per ADR-0114. These two secrets hold it.
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
      - name: Build, push, and sign the service images
        env:
          # Explicit {service, cmd} pairs, not a cross product. Not every service has a worker.
          ITEMS: ${{ needs.affected.outputs.images }}
          IMAGE_PREFIX: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          # The commit SHA that the pod reports through /version and the X-App-Version header, per ADR-0112.
          GIT_SHA: ${{ github.sha }}
          BUILD_TIME: ${{ github.event.head_commit.timestamp }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY_CI }}
          # ci-sign records the supply chain, where the signature and both attestations exist.
          # Unset until a project has a Loki to push to. The build is signed in both cases.
          LOKI_PUSH_URL: ${{ vars.LOKI_PUSH_URL }}
          LOKI_PUSH_AUTH: ${{ secrets.LOKI_PUSH_AUTH }}
          LOKI_PUSH_TENANT: ${{ vars.LOKI_PUSH_TENANT }}
        run: nix develop --command just ci-build-images services

  # Apps come from the same ci-affected manifest. Each app has its own Dockerfile and build context, per ADR-0112.
  apps:
    needs: affected
    if: ${{ needs.affected.outputs.apps != '[]' }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/registry-login
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
      - name: Build, push, and sign the app images
        env:
          ITEMS: ${{ needs.affected.outputs.apps }}
          IMAGE_PREFIX: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          GIT_SHA: ${{ github.sha }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY_CI }}
          LOKI_PUSH_URL: ${{ vars.LOKI_PUSH_URL }}
          LOKI_PUSH_AUTH: ${{ secrets.LOKI_PUSH_AUTH }}
          LOKI_PUSH_TENANT: ${{ vars.LOKI_PUSH_TENANT }}
        run: nix develop --command just ci-build-images apps

  # One job after every image, not a workflow that this one triggers. The forge of ADR-0116 does not raise a completed-run event.
  promote:
    needs: [affected, images, apps]
    # A skipped matrix is empty. A failed cell means a values file would name an image that the registry does not hold.
    if: ${{ !failure() && !cancelled() && (needs.affected.outputs.services != '[]' || needs.affected.outputs.apps != '[]') }}
    runs-on: ubuntu-26.04
    concurrency: { group: promote, cancel-in-progress: false }
    permissions:
      contents: write
    steps:
      # The machine user that branch protection lets push, in infra/forge/branch-protection.yaml.
      - uses: actions/checkout@v7.0.1
        with: {
          ref: "${{ github.ref_name }}",
          fetch-depth: 0,
          token: "${{ secrets.PROMOTE_TOKEN || secrets.GITHUB_TOKEN }}",
        }
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/registry-login
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
      - name: Pin dev and staging by digest
        env:
          SHA: ${{ github.sha }}
          SERVICES: ${{ needs.affected.outputs.services }}
          APPS: ${{ needs.affected.outputs.apps }}
        run: nix develop --command just promote-dev-staging
      - name: Push the promotion
        env:
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY_CI }}
        run: nix develop --command just ci-push-promotion
      # After the push, because the values just committed decide what is kept.
      - name: Prune the registry
        env:
          IMAGE_PREFIX: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
        run: nix develop --command just ci-prune-registry

  # The master run of lighthouse.yml, after the promotion. It gates nothing on master, so a change reaches dev first.
  # The image build finds the apps job's build in the cache, because both use the same builder and arguments.
  lighthouse:
    needs: [affected, promote]
    if: ${{ !cancelled() && contains(needs.affected.outputs.apps, '"frontend"') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      # The stack pulls Traefik and Prism from Docker Hub. Unset on a fork, where the secrets do not resolve.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: ./.github/actions/registry-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Start the Lighthouse stack
        run: nix develop --command just lighthouse-up
        env:
          GIT_SHA: ${{ github.sha }}
      - name: Install the e2e workspace
        run: nix develop --command just e2e-install
      # Advisory, as in lighthouse.yml.
      - name: Web vitals and bundle budgets
        continue-on-error: true
        run: nix develop --command just lighthouse
      - name: Tear down
        if: always()
        run: nix develop --command just lighthouse-down
