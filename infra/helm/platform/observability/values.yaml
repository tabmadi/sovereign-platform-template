# Observability backend (ADR-0500): Grafana + Loki/Tempo (monolithic single-binary mode) + Prometheus (Core
# metrics, local TSDB) + the cluster-state collector. Log/trace durability is the off-cluster bucket (ADR-0207);
# access keys come from the SOPS-decrypted `observability-bucket` Secret (ADR-0202).

grafana:
  fullnameOverride: grafana
  adminPassword: ""                # supplied via SOPS-decrypted Secret in prod
  # Dashboard rendering is bursty per page load, hence no CPU limit (ADR-0204).
  resources:
    requests: { cpu: "100m", memory: "192Mi" }
    limits:   { memory: "512Mi" }
  # Served at the ROOT of its own ops origin grafana.ops.<host> (ADR-0306), not
  # under a /grafana path — so serve_from_sub_path is off. Each env overrides
  # root_url with its external origin (the local overlay sets the :8443 edge).
  grafana.ini:
    server:
      serve_from_sub_path: false
      root_url: "%(protocol)s://%(domain)s/"
    # The ops edge is the authentication gate (Oathkeeper: an AAL2 operator holding dashboard:grafana#view, ADR-0306).
    auth:
      disable_login_form: true
    "auth.anonymous":
      enabled: true
      org_role: Admin
    # Land operators on a dashboard rather than the Grafana home page.
    dashboards:
      default_home_dashboard_path: /var/lib/grafana/dashboards/default/overview.json
    # No phone-home: version/plugin update checks and usage analytics are the only
    # reason Grafana reaches the internet (seen in Hubble as grafana -> <gcp-ip>:443).
    analytics:
      reporting_enabled: false
      check_for_updates: false
      check_for_plugin_updates: false
    # Grafana 11.4+ ships the drilldown apps (Explore Logs/Traces/Metrics, Pyroscope) as *preinstalled* plugins and
    # fetches them from grafana.com on startup — which fails on an air-gapped/proxied cluster ("Failed to install
    # plugin … context deadline exceeded").
    plugins:
      preinstall_disabled: true
      public_key_retrieval_disabled: true
  datasources:
    datasources.yaml:
      apiVersion: 1
      # Fixed uids: a provisioned datasource without an explicit uid gets a random one, and dashboard data-links
      # reference datasources by uid — so pin them all.
      datasources:
        - { name: Prometheus, uid: prometheus, type: prometheus, url: http://prometheus.platform.svc.cluster.local:9090 }
        - { name: Loki,       uid: loki,       type: loki,       url: http://loki.platform.svc.cluster.local:3100 }
        - { name: Tempo,      uid: tempo,      type: tempo,      url: http://tempo.platform.svc.cluster.local:3200 }
        # Pyroscope (ADR-0501 POC — continuous profiling). Backs the flame-graph
        # panel on the service-detail dashboard; profiles are pushed here by the
        # Alloy agent (templates/alloy.yaml).
        - { name: Pyroscope, uid: pyroscope, type: grafana-pyroscope-datasource, url: http://pyroscope.platform.svc.cluster.local:4040 }
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          orgId: 1
          folder: ""
          type: file
          disableDeletion: false
          editable: false      # dashboards are git artifacts (ADR-0500): PRs, not UI edits
          options:
            path: /var/lib/grafana/dashboards/default
  dashboardsConfigMaps:
    default: grafana-dashboards     # populated from infra/observability/dashboards/

# Loki — single-binary monolithic (-target=all), bucket-backed (ADR-0500).
loki:
  # Pin the service name to `loki` (not the release-prefixed `observability-loki`)
  # so the OTel exporter and Grafana datasource below — and prod — reach it at
  # loki.<ns>.svc:3100. Mirrors tempo/prometheus, which also fix their names.
  fullnameOverride: loki
  deploymentMode: SingleBinary
  loki:
    # The one field of `restricted` the loki chart leaves unset (ADR-0200).
    podSecurityContext:
      seccompProfile: { type: RuntimeDefault }
    # Single-tenant (ADR-0500): no X-Scope-OrgID required. Without this the chart
    # defaults to multi-tenant and every header-less query (incl. Grafana's
    # datasource health check) 401s with "no org id".
    auth_enabled: false
    # Don't phone home usage stats to stats.grafana.org — the only reason loki
    # makes an external egress connection (seen in Hubble as loki -> <gcp-ip>:443).
    analytics: { reporting_enabled: false }
    commonConfig: { replication_factor: 1 }
    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: s3
          schema: v13
          index: { prefix: loki_index_, period: 24h }
    storage:
      type: s3
      bucketNames: { chunks: loki-chunks, ruler: loki-ruler, admin: loki-admin }
      s3:
        endpoint: s3.eu-central-1.amazonaws.com
        region: eu-central-1
        s3ForcePathStyle: true
        # access_key_id / secret_access_key are left empty so Loki's S3 client uses
        # the AWS SDK env credentials injected below from the observability-bucket Secret.
  singleBinary:
    replicas: 1
    extraEnvFrom:
      - secretRef: { name: observability-bucket }
    # Explicit rather than the namespace LimitRange default, which log ingest sits
    # close enough to that a busier day would OOM it (ADR-0204).
    resources:
      requests: { cpu: "100m", memory: "512Mi" }
      limits:   { memory: "1Gi" }
  read: { replicas: 0 }
  write: { replicas: 0 }
  backend: { replicas: 0 }
  chunksCache: { enabled: false }
  resultsCache: { enabled: false }
  # The nginx gateway fronts the distributed read/write/backend split; in SingleBinary mode the OTel collector
  # pushes and Grafana queries the loki service directly, so it is dead weight.
  gateway: { enabled: false }
  # loki-canary is a synthetic log-probe DaemonSet (+ its helm test) used to
  # measure ingest latency; not something this template needs to run. These two
  # toggles are the loki chart's own templates, so a values override works.
  lokiCanary: { enabled: false }
  test: { enabled: false }
  # NOTE: the loki chart also bundles minio, rollout-operator and grafana-agent-operator as *grandchild* subcharts,
  # which Helm renders even when their conditions are set false (nested-condition limitation).

# Tempo — single-binary monolithic chart, bucket-backed.
tempo:
  # Pin the service name to `tempo` so the OTel exporter (tempo:4318) and Grafana
  # datasource (tempo:3200) resolve it, instead of the release-prefixed default.
  fullnameOverride: tempo
  replicas: 1
  # `restricted` (ADR-0200).
  securityContext:
    seccompProfile: { type: RuntimeDefault }
  tempo:
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
    # THE HEAVIEST POD IN THE CLUSTER, and the reason this chart cannot rely on the namespace LimitRange default.
    resources:
      requests: { cpu: "100m", memory: "1Gi" }
      limits:   { memory: "3Gi" }
    reportingEnabled: false
    # Metrics-generator stays OFF (chart default).
    extraEnvFrom:
      - secretRef: { name: observability-bucket }
    storage:
      trace:
        backend: s3
        s3:
          bucket: tempo-traces
          endpoint: s3.eu-central-1.amazonaws.com
          region: eu-central-1
          # access_key / secret_key come from the observability-bucket Secret.

# Prometheus — the Core-tier metrics store: one Deployment, local TSDB, native OTLP ingest, no object storage.
# Rendered by templates/prometheus.yaml (ConfigMap + Deployment + Service), not a subchart.
prometheus:
  image: prom/prometheus:v3.1.0
  replicas: 1
  httpPort: 9090
  # Local-TSDB retention.
  retention: 31d
  # Where evaluated alerts are sent for routing (ADR-0502). Named here rather
  # than read from the alertmanager chart's values: a chart renders from its own
  # values alone, so a cross-chart address is a value this chart owns.
  alertmanagerTarget: alertmanager.platform.svc.cluster.local:9093
  # The TSDB volume.
  storage:
    size: 20Gi
    # Unset means the cluster's default StorageClass.
    storageClassName: ""
  # No CPU limit (ADR-0204): a TSDB compaction is the bursty, latency-sensitive
  # work CFS throttling ruins.
  resources:
    requests: { cpu: "100m", memory: "384Mi" }
    limits:   { memory: "1Gi" }

# Pyroscope (ADR-0501 POC — continuous profiling, the fourth signal). Rendered by templates/pyroscope.yaml as a
# single-binary monolith (-target=all) with filesystem storage on an emptyDir — the POC minimum.
pyroscope:
  image: grafana/pyroscope:1.14.0
  # The request tracks the working set because memory is not compressible; the
  # limit leaves room for ingest spikes.
  resources:
    requests: { cpu: "100m", memory: "384Mi" }
    limits:   { memory: "1Gi" }

# Grafana Alloy (ADR-0501 POC) — the pprof-scraping agent the withdrawn profiling flag always implied. Rendered by
# templates/alloy.yaml.
alloy:
  image: grafana/alloy:v1.11.0
  # The request matches the real working set: under-requesting here lets the
  # scheduler overcommit a node and then evict the agent (ADR-0204).
  resources:
    requests: { cpu: "100m", memory: "320Mi" }
    limits:   { memory: "768Mi" }

# Cluster-state metrics singleton (templates/otel-cluster.yaml): k8s_cluster receiver → desired/available
# replicas, restart counts, resource limits as series.
otelCluster:
  image: otel/opentelemetry-collector-contrib:0.154.0
  resources:
    requests: { cpu: "50m", memory: "192Mi" }
    limits:   { memory: "512Mi" }

# Mirrors the gate in the maddy chart (infra/helm/platform/maddy). Both read the same per-env overlay, so the
# scrape job appears exactly where the agent does.
maddy:
  enabled: false
