[env]
# The registered local port for this service, from scripts/lib/ports.sh.
PORT = "8086"
_.file = ".env"

[tasks.env]
description = "Create .env from .env.example on a fresh clone. It then stops and does not continue, and scripts/env-ensure.sh states why."
hide = true
run = "bash ../../scripts/env-ensure.sh"

[tasks.server]
description = "Run the HTTP server. It needs no OpenFGA and no Temporal."
depends = ["env", "dep:postgres"]
run = "go run ./cmd/server"

[tasks.test]
run = "go test ./..."

[tasks.lint]
run = "golangci-lint run ./..."

[tasks.migrate]
depends = ["env", "dep:postgres"]
run = "dbmate --no-dump-schema up"

[tasks.generate]
run = "sqlc generate && bash ../../scripts/gen-openapi.sh"

[tasks.build]
run = "go build ./..."
