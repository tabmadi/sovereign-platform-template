# The OpenFGA store test, per ADR-0304. `mise run lint:authz` runs it with `fga model test --tests fga.yaml`. It
# holds sample tuples and check assertions that pin the model's behaviour.
name: platform-authz
model_file: ./model.fga

tuples:
  # Business sample: the acme org and two orders.
  - { user: user:alice, relation: member, object: org:acme }
  - { user: org:acme,   relation: org,    object: order:o1 }
  - { user: user:alice, relation: owner,  object: order:o1 }
  - { user: org:acme,   relation: org,    object: order:o2 }
  - { user: user:bob,   relation: owner,  object: order:o2 }
  - { user: order:o1,   relation: order,  object: charge:c1 }
  # Ops tier, per ADR-0306: alice is an operator. The admin console is a direct
  # grant. Every other dashboard is granted to the operator group.
  - { user: user:alice,            relation: member, object: group:operator }
  - { user: user:alice,            relation: viewer, object: dashboard:lowdefy }
  - { user: group:operator#member, relation: viewer, object: dashboard:hubble }
  - { user: group:operator#member, relation: viewer, object: dashboard:grafana }
  - { user: group:operator#member, relation: viewer, object: dashboard:argocd }
  - { user: group:operator#member, relation: viewer, object: dashboard:temporal }
  - { user: group:operator#member, relation: viewer, object: dashboard:seaweedfs }
  - { user: group:operator#member, relation: viewer, object: dashboard:headlamp }
  - { user: group:operator#member, relation: viewer, object: dashboard:pgweb }
  - { user: group:operator#member, relation: viewer, object: dashboard:mailpit }
  # The analytics panel is granted to the MARKETING group, not to operators, per ADR-0700.
  - { user: group:marketing#member, relation: viewer, object: analytics_panel:funnels }

tests:
  - name: business-and-ops-authz
    check:
      # alice: org membership and the derived read. Not admin and not write.
      - user: user:alice
        object: org:acme
        assertions: { member: true, read: true, admin: false, write: false }
      # alice owns o1, so she can read it. o2 is bob's, so alice cannot write it.
      - user: user:alice
        object: order:o1
        assertions: { read: true }
      - user: user:alice
        object: order:o2
        assertions: { write: false }
      # A charge inherits its order's readers: alice owns o1, bob does not.
      - user: user:alice
        object: charge:c1
        assertions: { read: true }
      - user: user:bob
        object: charge:c1
        assertions: { read: false }
      # alice is an operator, so she views the admin console and every group-granted dashboard.
      - user: user:alice
        object: group:operator
        assertions: { member: true }
      - user: user:alice
        object: dashboard:lowdefy
        assertions: { view: true }
      - user: user:alice
        object: dashboard:grafana
        assertions: { view: true }
      - user: user:alice
        object: dashboard:hubble
        assertions: { view: true }
      - user: user:alice
        object: dashboard:temporal
        assertions: { view: true }
      - user: user:alice
        object: dashboard:seaweedfs
        assertions: { view: true }
      - user: user:alice
        object: dashboard:argocd
        assertions: { view: true }
      - user: user:alice
        object: dashboard:headlamp
        assertions: { view: true }
      - user: user:alice
        object: dashboard:pgweb
        assertions: { view: true }
      - user: user:alice
        object: dashboard:mailpit
        assertions: { view: true }
      # bob is not an operator, so he reaches no ops dashboard.
      - user: user:bob
        object: group:operator
        assertions: { member: false }
      - user: user:bob
        object: dashboard:lowdefy
        assertions: { view: false }
      - user: user:bob
        object: dashboard:grafana
        assertions: { view: false }
