apiVersion: v2
name: postgres
description: The CloudNativePG operator, its Barman Cloud plugin, and a shared cluster CR, per ADR-0300 and ADR-0207.
type: application
version: "2026.11.0"
appVersion: "1.30.2"
annotations:
  app-version-from: "dependency:cloudnative-pg"

dependencies:
  - name: cloudnative-pg
    version: "0.29.2"
    repository: https://cloudnative-pg.github.io/charts
  # Backups and WAL archiving, per ADR-0207. The plugin runs in the namespace of the operator, so it is a subchart here.
  - name: plugin-barman-cloud
    version: "0.9.0"
    repository: https://cloudnative-pg.github.io/charts
