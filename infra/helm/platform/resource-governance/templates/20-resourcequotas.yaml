{{/*
ResourceQuota per namespace, per ADR-0204: the total cap. It evicts nothing. It rejects new pods when the
sum of requests would go over the cap. The reason shows on the owning ReplicaSet, and not on a pod.
It depends on the LimitRange at wave -4, which gives a default to every resource that the quota tracks.
*/}}
{{- range $ns, $cfg := .Values.resourceQuotas }}
{{- if $cfg.enabled }}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: namespace-cap
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: resource-governance
    app.kubernetes.io/part-of: platform
  annotations:
    # Wave -3: always after the LimitRange that makes its tracked resources
    # declarable. If the two are in the other order, a bring-up hangs.
    argocd.argoproj.io/sync-wave: "-3"
spec:
  hard:
    requests.cpu: {{ $cfg.requestsCPU | quote }}
    requests.memory: {{ $cfg.requestsMemory | quote }}
    # No `limits.cpu` key. Nothing in this platform sets a CPU limit, per ADR-0204. So a quota on it would be a cap on
    # zero. Also, it would force every new container to declare a cpu limit to be admitted. That would bring back
    # the throttling policy that we rejected.
    limits.memory: {{ $cfg.limitsMemory | quote }}
{{- end }}
{{- end }}
