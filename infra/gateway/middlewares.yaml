# Traefik middlewares, per ADR-0305. They replace the deleted Tyk SecurityPolicies in `infra/gateway/policies/`.
# The edge validates identity with Oathkeeper ForwardAuth, and throttles auth-sensitive routes. It also adds static
# browser-security headers to every response.
---
# ForwardAuth to the Oathkeeper decisions API.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oathkeeper-forward-auth
  namespace: platform
spec:
  forwardAuth:
    address: http://ory-oathkeeper-api.platform.svc.cluster.local:4456/decisions
    authResponseHeaders:
      - X-User-Id
      - X-Org-Id
      - X-Roles
      - X-User-Email
---
# Anti-spoofing, per ADR-0305 and ADR-0306.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-identity-headers
  namespace: platform
spec:
  headers:
    customRequestHeaders:
      X-User-Id: ""
      X-Org-Id: ""
      X-Roles: ""
      X-User-Email: ""
---
# Rate limit per source IP for auth-sensitive routes: login, signup, and recovery.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: auth-ratelimit
  namespace: platform
spec:
  rateLimit:
    average: 10
    burst: 20
    period: 1m
    sourceCriterion:
      ipStrategy:
        depth: 1
---
# Static browser-security headers on all responses, per ADR-0305 and ADR-0400.
# The frontend sets the per-request CSP nonce for `script-src`. Here we set
# only the directives that never change per request.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: platform
spec:
  headers:
    contentTypeNosniff: true
    referrerPolicy: strict-origin-when-cross-origin
    stsSeconds: 63072000
    stsIncludeSubdomains: true
    stsPreload: true
    customResponseHeaders:
      Content-Security-Policy: "frame-ancestors 'none'"
---
# RFC 9457 problem details for the edge's own errors, per ADR-0305. A generated client has ONE error branch. That
# holds only if a denial from the edge looks like a denial from a service.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: problem-json-errors
  namespace: platform
spec:
  errors:
    status:
      - "401"
      - "403"
      - "429"
      - "502"
      - "503"
      - "504"
    service:
      name: edge-errors
      port: 80
    # Traefik replaces `{status}` with the intercepted status code. So one rule
    # serves every document, with no middleware per status.
    query: "/{status}.json"
---
# Strips `/auth` before the request reaches Kratos. Kratos paths start at the root: `/self-service/...`.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-auth
  namespace: platform
spec:
  stripPrefix:
    prefixes:
      - /auth
