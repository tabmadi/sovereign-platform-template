# Local Alertmanager silences Application (ADR-0502, ADR-0205).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-alertmanager-silences
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: platform
    env: local
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: local
  source:
    repoURL: https://github.com/tabmadi/sovereign-platform-template.git
    targetRevision: master
    path: infra/observability/alertmanager
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry:
      limit: 20
      backoff: { duration: 10s, maxDuration: 2m, factor: 2 }
