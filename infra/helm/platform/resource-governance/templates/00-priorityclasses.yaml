{{/*
PriorityClass tiers (ADR-0204): platform-critical > product > batch. These are what make "CPU requests, no CPU
limits" safe — requests govern shares, and these priorities decide who dies when the node is out of memory.
Sync-wave -5: a pod naming a PriorityClass that does not exist yet is rejected outright.
*/}}
{{- range $name, $tier := .Values.priorityClasses }}
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: resource-governance
    app.kubernetes.io/part-of: platform
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
value: {{ $tier.value }}
globalDefault: {{ $tier.globalDefault | default false }}
preemptionPolicy: {{ $tier.preemptionPolicy | default "PreemptLowerPriority" }}
description: {{ $tier.description | quote }}
{{- end }}
