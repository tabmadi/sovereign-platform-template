# Shared Traefik IngressRoutes, per ADR-0305 and ADR-0306. The service Helm chart emits the per-service
# `/api/<svc>` routes on the product apex, in `infra/helm/service/templates/ingressroute.yaml`.
---
# Hubble UI, per ADR-0206 and ADR-0501: Cilium network-flow visibility and the service map. The service is in
# `kube-system`, so this is a cross-namespace reference, like the Argo CD route.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ops-hubble
  namespace: platform
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: HostRegexp(`^hubble\.ops\..+`)
      middlewares:
        # First in the chain. A middleware wraps the ones after it. So only a middleware
        # listed above forward-auth can see a denial that forward-auth raises, per
        # ADR-0305.
        - name: problem-json-errors
        - name: strip-identity-headers
        - name: oathkeeper-forward-auth
        - name: security-headers
      services:
        - name: hubble-ui
          namespace: kube-system
          port: 80
  tls:
    secretName: wildcard-ops-tls
---
# Grafana, per ADR-0500. It serves at the root. The chart drops `serve_from_sub_path`.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
