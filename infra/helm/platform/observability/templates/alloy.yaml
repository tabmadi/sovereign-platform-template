# Grafana Alloy, the ADR-0501 POC: the pprof-scraping agent that feeds Pyroscope.
{{- $al := .Values.alloy }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  labels: { app.kubernetes.io/name: alloy, app.kubernetes.io/part-of: observability }
---
# Cluster-scoped, because pod discovery watches across the API. The name has a prefix,
# so it does not collide with any other Alloy install in the cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: observability-alloy
  labels: { app.kubernetes.io/name: alloy, app.kubernetes.io/part-of: observability }
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: observability-alloy
  labels: { app.kubernetes.io/name: alloy, app.kubernetes.io/part-of: observability }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: observability-alloy
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy
  labels: { app.kubernetes.io/name: alloy, app.kubernetes.io/part-of: observability }
data:
  config.alloy: |
    {{- include "observability.alloy.config" . | nindent 4 }}
{{/* Config in a define, so the Deployment stamps checksum/config and rolls on config edits. Without it, the
     ConfigMap updates, but the running process keeps the config that it parsed at startup. The new config is
     on disk but not in use, and that looks like a fix that did not work. */}}
{{- define "observability.alloy.config" }}
// Discover every pod. Then keep only the platform-namespace pods that expose the
// `admin` container port 9090. That is the pprof endpoint of the Go services.
discovery.kubernetes "pods" {
  role = "pod"
}

discovery.relabel "pprof" {
  targets = discovery.kubernetes.pods.targets

  rule {
    source_labels = ["__meta_kubernetes_namespace"]
    regex         = "platform"
    action        = "keep"
  }
  // The pprof target is the port named `admin` AND numbered 9090, from the service
  // chart's `values.yaml` `server.adminPort`. Both rules are required, because
  // other things that are not pprof endpoints use each name and each number:
  //
  //   - SeaweedFS names its admin UI port `admin`, at 23646. It serves no
  //     /debug/pprof, and its policy admits only the edge. See
  //     network-policies 15-object-storage.yaml.
  //   - Prometheus, as `http`, and the four Temporal roles, as `metrics`, use 9090
  //     for other purposes. Their policies do not admit Alloy either.
  //
  // One condition alone selects those. Every scrape of them is then a permanent
  // netpol drop that fills PolicyDropsDetected.
  rule {
    source_labels = ["__meta_kubernetes_pod_container_port_name"]
    regex         = "admin"
    action        = "keep"
  }
  rule {
    source_labels = ["__meta_kubernetes_pod_container_port_number"]
    regex         = "9090"
    action        = "keep"
  }
  // Label profiles so that Grafana can filter by service and pod. service_name
  // matches the RED, log, and trace label that the other dashboards use.
  rule {
    source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
    target_label  = "service_name"
  }
  rule {
    source_labels = ["__meta_kubernetes_pod_name"]
    target_label  = "pod"
  }
}

// Scrape the standard Go pprof profiles from /debug/pprof, and send them to
// Pyroscope. CPU, heap, and goroutine are on by default.
pyroscope.scrape "pprof" {
  targets    = discovery.relabel.pprof.output
  forward_to = [pyroscope.write.local.receiver]
}

pyroscope.write "local" {
  endpoint {
    url = "http://pyroscope.platform.svc.cluster.local:4040"
  }
}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  labels: { app.kubernetes.io/name: alloy, app.kubernetes.io/part-of: observability }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: alloy }
  template:
    metadata:
      labels: { app.kubernetes.io/name: alloy }
      # Roll the pod when the config changes. Alloy parses its config at startup
      # and does not read the mounted file again.
      annotations:
        checksum/config: {{ include "observability.alloy.config" . | sha256sum }}
    spec:
      serviceAccountName: alloy
      # `restricted`, per ADR-0200. The alloy image ships USER root. With runAsNonRoot alone, the kubelet would refuse to
      # start the pod, after admission accepted it. So the UID must be named.
      securityContext:
        runAsNonRoot: true
        runAsUser: 473
        runAsGroup: 473
        fsGroup: 473
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: alloy
          securityContext: {{- include "observability.containerSecurityContext" . | nindent 12 }}
          image: {{ $al.image }}
          args:
            - run
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy/data
            # No phone-home, as in grafana.ini analytics. Without this, Alloy dials the
            # usage-stats endpoint of Grafana Labs on 443. The default-deny egress drops it
            # correctly, and that only adds noise to PolicyDropsDetected.
            - --disable-reporting
            - /etc/alloy/config.alloy
          ports:
            - { name: http, containerPort: 12345 }
          readinessProbe: { httpGet: { path: /-/ready, port: http }, initialDelaySeconds: 10 }
          livenessProbe:  { httpGet: { path: /-/ready, port: http }, initialDelaySeconds: 30, periodSeconds: 30 }
          resources: {{- toYaml $al.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/alloy }
            - { name: data,   mountPath: /var/lib/alloy/data }
      volumes:
        - name: config
          configMap: { name: alloy }
        - name: data
          emptyDir: {}
