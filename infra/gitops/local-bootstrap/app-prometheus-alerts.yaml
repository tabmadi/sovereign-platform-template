# Local Prometheus alerts Application, per ADR-0500 and ADR-0205. It is the local copy of
# `bootstrap/app-prometheus-alerts.yaml`. The chart at `infra/observability/alerts` generates the `prometheus-alerts`
# ConfigMap from the `*.yaml` files next to it. The observability chart mounts it into Prometheus as `rule_files`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-prometheus-alerts
  namespace: argocd
  labels:
    env: local
    app.kubernetes.io/part-of: platform
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: local
  source:
    repoURL: https://github.com/tabmadi/sovereign-platform-template.git
    targetRevision: master
    path: infra/observability/alerts
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry:
      limit: 20
      backoff: { duration: 10s, maxDuration: 2m, factor: 2 }
