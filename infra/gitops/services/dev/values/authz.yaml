# Dev values for the authz edge authorizer (ADR-0306).
name: authz
image:
  repository: ghcr.io/tabmadi/sovereign-platform-template/authz-server
  tag: "0000000000000000000000000000000000000000"   # bumped by promote-on-merge
worker:
  enabled: true            # RegisterOperator dual write (ADR-0302, ADR-0304)
  image:
    repository: ghcr.io/tabmadi/sovereign-platform-template/authz-worker
    tag: "0000000000000000000000000000000000000000"
server:
  replicas: 1
ingress:
  enabled: false     # internal authorizer — no edge route
migrations:
  enabled: false     # no database
# Not edge-exposed, so the chart's Traefik→server-port default must be off.
networkPolicy:
  allowFromGateway: false
  allowFrom: [oathkeeper, lowdefy, frontend]
secrets:
  envFrom: [openfga-creds]
env:
  OPENFGA_API_URL: "http://openfga.platform.svc.cluster.local:8080"
  # Blank so libs/go/authz falls back to openfga-creds.preshared_key (envFrom).
  OPENFGA_PRESHARED_KEY: ""
