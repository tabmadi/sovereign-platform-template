{{- /* cluster.create lets the operator and CRDs install in a first pass, before the
   Cluster and Pooler CRs exist. The helm-direct local path needs that order.
   Prod gets it from Argo CD sync-waves. The default is true, so the GitOps path
   does not change. */ -}}
{{- if .Values.cluster.create }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.cluster.name }}
  namespace: platform
spec:
  instances: {{ .Values.cluster.instances }}
  imageName: {{ .Values.cluster.imageName }}
  # Per ADR-0204.
  resources: {{- toYaml .Values.cluster.resources | nindent 4 }}
  priorityClassName: {{ .Values.cluster.priorityClassName }}
  storage:
    size: {{ .Values.cluster.storage.size }}
    {{- with .Values.cluster.storage.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  bootstrap:
    {{- if .Values.cluster.recovery.fromServer }}
    # A rebuild restores the archive that a lost cluster left, per ADR-0207 and `docs/guide/disaster-recovery.md`.
    # Bootstrap is read once, at creation, so the value has no effect on a running cluster.
    recovery:
      source: archive
    {{- else }}
    initdb:
      database: {{ .Values.cluster.initdb.database }}
      owner: {{ .Values.cluster.initdb.owner }}
      secret:
        name: {{ .Values.cluster.initdb.secretName }}
      {{- with .Values.cluster.initdb.postInitSQL }}
      postInitSQL:
        {{- range . }}
        - {{ . | quote }}
        {{- end }}
      {{- end }}
      # The owner is named ONCE, in `initdb.owner`, and every statement below is rendered from it.
      postInitApplicationSQL:
        {{- $owner := .Values.cluster.initdb.owner }}
        {{- range .Values.cluster.initdb.databases }}
        - {{ printf "CREATE DATABASE %s OWNER %s" . $owner | quote }}
        {{- end }}
        {{- range .Values.cluster.initdb.postInitApplicationSQL }}
        - {{ . | quote }}
        {{- end }}
    {{- end }}
  {{- if .Values.cluster.recovery.fromServer }}
  externalClusters:
    - name: archive
      barmanObjectStore:
        destinationPath: {{ .Values.cluster.backup.s3.destinationPath | quote }}
        {{- with .Values.cluster.backup.s3.endpointURL }}
        endpointURL: {{ . | quote }}
        {{- end }}
        serverName: {{ .Values.cluster.recovery.fromServer | quote }}
        s3Credentials:
          accessKeyId:     { name: postgres-backup-creds, key: ACCESS_KEY_ID }
          secretAccessKey: { name: postgres-backup-creds, key: SECRET_ACCESS_KEY }
        wal: { compression: gzip }
  {{- end }}
  {{- with .Values.cluster.managedRoles }}
  managed:
    roles:
      {{- range . }}
      - name: {{ .name }}
        ensure: {{ .ensure }}
        login: {{ .login }}
        passwordSecret:
          name: {{ .passwordSecretName }}
      {{- end }}
  {{- end }}
  {{- if .Values.cluster.backup.enabled }}
  backup:
    barmanObjectStore:
      destinationPath: {{ .Values.cluster.backup.s3.destinationPath | quote }}
      {{- with .Values.cluster.backup.s3.endpointURL }}
      endpointURL: {{ . | quote }}
      {{- end }}
      # CNPG refuses to archive into a non-empty path of a server. So a restored cluster writes under a new name.
      serverName: {{ .Values.cluster.backup.serverName | default .Values.cluster.name | quote }}
      s3Credentials:
        accessKeyId:     { name: postgres-backup-creds, key: ACCESS_KEY_ID }
        secretAccessKey: { name: postgres-backup-creds, key: SECRET_ACCESS_KEY }
      wal: { compression: gzip }
      data: { compression: gzip }
    retentionPolicy: {{ .Values.cluster.backup.retentionPolicy | quote }}
  {{- end }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  # Must NOT collide with the Cluster's own auto-managed Services,
  # `<name>-rw`, `-ro`, and `-r`. CNPG's ownership check rejects a Pooler whose Service
  # name the Cluster controller already owns.
  name: {{ .Values.cluster.name }}-pgbouncer-rw
  namespace: platform
spec:
  cluster:
    name: {{ .Values.cluster.name }}
  instances: {{ .Values.cluster.pooler.instances }}
  type: rw
  # The Pooler CR takes a full pod template override. `containers` is matched by
  # name, so `pgbouncer` here patches the operator's own container, and does not
  # add a second one.
  template:
    spec:
      priorityClassName: {{ .Values.cluster.priorityClassName }}
      containers:
        - name: pgbouncer
          resources: {{- toYaml .Values.cluster.pooler.resources | nindent 12 }}
  pgbouncer:
    poolMode: {{ .Values.cluster.pooler.poolMode }}
    parameters:
      max_client_conn: {{ .Values.cluster.pooler.maxClientConn | quote }}
      default_pool_size: {{ .Values.cluster.pooler.defaultPoolSize | quote }}
{{- end }}
