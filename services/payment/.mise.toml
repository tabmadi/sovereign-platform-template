[env]
# The registered local port (scripts/lib/ports.sh), committed so a sibling's <SVC>_URL default can rely on it. The chart sets no PORT, so pods still bind :8080.
PORT = "8084"
_.file = ".env"

[tasks.env]
description = "Seed .env from .env.example on a fresh clone (see scripts/env-ensure.sh for why it stops rather than continuing)."
hide = true
run = "bash ../../scripts/env-ensure.sh"

[tasks.server]
description = "Dependency components this service needs in the cluster (ADR-0205, ADR-0600)."
depends = ["env", "dep:postgres", "dep:openfga", "dep:temporal"]
run = "go run ./cmd/server"

[tasks.worker]
depends = ["env", "dep:postgres", "dep:openfga", "dep:temporal"]
run = "go run ./cmd/worker"

[tasks.test]
run = "go test ./..."

[tasks.lint]
run = "golangci-lint run ./..."

[tasks.migrate]
depends = ["env", "dep:postgres"]
run = "dbmate --no-dump-schema up"

[tasks.generate]
run = "sqlc generate && bash ../../scripts/gen-openapi.sh"

[tasks.build]
run = "go build ./..."
