# Watchdog: the dead man's switch for the alerting pipeline itself, per ADR-0502.
groups:
  - name: alerting.watchdog
    rules:
      - alert: Watchdog
        expr: vector(1)
        labels: { severity: ticket }
        annotations:
          summary: "Alerting pipeline is alive"
          description: >-
            This alert always fires. Its absence means that Prometheus does not
            evaluate alerts, or Alertmanager does not route them. Nothing else in
            this cluster can tell you that. A silence on it turns off the only
            check on the check.
