# Dev values for the platform worker (ADR-0302, ADR-0301).
name: platform
image:
  repository: ghcr.io/tabmadi/sovereign-platform-template/platform-worker
  tag: "0000000000000000000000000000000000000000"
server:
  enabled: false
worker:
  enabled: true
  image:
    repository: ghcr.io/tabmadi/sovereign-platform-template/platform-worker
    tag: "0000000000000000000000000000000000000000"
env:
  # The analytics service, east-west (ADR-0303).
  ANALYTICS_API_URL: "http://analytics.platform.svc.cluster.local:8080"
ingress:    { enabled: false }
migrations: { enabled: false }   # owns no schema
otel:       { deployEnv: dev }
networkPolicy:
  allowFromGateway: false
