# The merge gates (ADR-0102): each job is a thin caller of one `mise run ci:*` task. The job names are the required
# checks in infra/forge/branch-protection.yaml.
name: ci

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          go-cache: "true"
      - name: Compile everything
        run: mise run ci:build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          go-cache: "true"
      - name: Run tests
        run: mise run ci:test

  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Regenerate, reformat, fail on drift
        run: mise run ci:gen

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Run linters
        # What `lint:commits` measures the commit range against; empty on a push, where it falls back to master.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: mise run ci:lint

  # A service affected-detection fails to name is a service nothing ran against, on a pull request that goes green
  # (ADR-0101): this perturbs each service in a scratch worktree, and a red here means CI's selection is wrong.
  affected-detection:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Adversarially test affected-detection
        run: mise run ci:affected-adversarial

  # Apart from lint because it fails for a different reason: a dependency gaining a published fix turns a green PR red
  # with no code change (ADR-0104).
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Scan dependencies
        run: mise run ci:scan
