# Workload-health alerts, an ADR-0501 follow-up. The otel-cluster singleton feeds them, from
# `templates/otel-cluster.yaml` in the observability chart. It is the k8s_cluster receiver's view of desired and observed state.
groups:
  - name: workload.health
    rules:
      # Fewer pods available than the Deployment wants, for a sustained time. This catches what
      # the kubelet-derived dashboards cannot see: pods that SHOULD exist but do not, such as
      # Pending on quota or scheduling, or CrashLoop past readiness.
      - alert: DeploymentReplicasUnavailable
        expr: |
          k8s_deployment_available < k8s_deployment_desired
        for: 10m
        labels: { severity: page }
        annotations:
          summary: "{{ $labels.service_name }}: only {{ $value }} of desired replicas available for 10m. Check the pods in Headlamp"

      # A container restarts again and again: the CrashLoopBackOff signal. The
      # restart count is a monotonic gauge, so delta(), and not increase(), reads
      # the growth over the window.
      - alert: ContainerRestartsSpiking
        expr: |
          delta(k8s_container_restarts[30m]) > 3
        for: 0m
        labels: { severity: ticket }
        annotations:
          summary: "{{ $labels.service_name }} restarted {{ $value }} times in 30m, so it is probably crash-looping"

      # The otel-cluster singleton is a 1-replica watcher. If it is down, the
      # two rules above go silent while everything LOOKS healthy. This guards the
      # guard: absent() fires when the desired-replicas series disappears.
      - alert: ClusterStateMetricsAbsent
        expr: |
          absent(k8s_deployment_desired)
        for: 15m
        labels: { severity: ticket }
        annotations:
          summary: "k8s_deployment_desired has no series for 15m. The otel-cluster collector is probably down, and workload-health alerts cannot see"
