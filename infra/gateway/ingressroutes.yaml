---
# Mailpit viewer, per ADR-0307 and ADR-0306. Non-prod only: the sink's UI at the root
# on :8025. Production sets `mailpit.enabled=false`, so the Service is absent there.
# The route then resolves to no endpoints, like the SeaweedFS admin route in prod.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ops-mailpit
  namespace: platform
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: HostRegexp(`^mailpit\.ops\..+`)
      middlewares:
        - name: problem-json-errors
        - name: strip-identity-headers
        - name: oathkeeper-forward-auth
        - name: security-headers
      services:
        - name: mailpit
          port: 8025
  tls:
    secretName: wildcard-ops-tls
---
# zot's console, per ADR-0105 and ADR-0306. It is the SAME pod as the `registry` route below, on a second origin
# with a different gate. That different gate is the reason to separate them.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ops-zot
  namespace: platform
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: HostRegexp(`^zot\.ops\..+`)
      middlewares:
        - name: problem-json-errors
        - name: strip-identity-headers
        - name: oathkeeper-forward-auth
        - name: security-headers
      services:
        - name: zot
          port: 5001
  tls:
    secretName: wildcard-ops-tls
---
# The registry, per ADR-0105. It is the one origin at the edge that is NOT gated on an operator session. Every
# other route here is a browser tool, so forward-auth to Oathkeeper is the right gate.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: registry
  namespace: platform
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: HostRegexp(`^registry\..+`)
      middlewares:
        - name: security-headers
      services:
        - name: zot
          port: 5000
  tls:
    secretName: wildcard-tls
---
# The identity API, per ADR-0304 and ADR-0305: Kratos's self-service endpoints. They are on the PRODUCT origin
# under `/auth`, because the session cookie belongs to the product origin.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kratos-public
  namespace: platform
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: PathPrefix(`/auth/self-service`) || PathPrefix(`/auth/.well-known`) || PathPrefix(`/auth/sessions`)
      middlewares:
        # Rate-limited, because a credential-stuffing attempt aims at this surface.
        - name: strip-auth
        - name: auth-ratelimit
        - name: security-headers
      services:
        - name: ory-kratos-public
          port: 80
  tls:
    secretName: wildcard-tls
