openapi: 3.1.0
info: { title: orders, version: 0.1.0, description: Order checkout and saga orchestration service., x-audience: public }
servers: [{ url: /api }]   # flat resource namespace, per ADR-0306. Paths are globally unique
# `x-admin: crud` marks the resource group for the admin generator in tools/admin-gen, per
# ADR-0401. The saga creates orders, and they are immutable. So the generator makes only
# the list and detail read pages and the `cancel` action below, with no edit or delete.
tags: [{ name: orders, x-admin: crud }, { name: cluster }]
paths:
  /orders:
    get:
      operationId: listOrders
      # Listing every order is a back-office view. The public docs leave it out, per ADR-0303.
      x-audience: internal
      description: List all orders.
      tags: [orders]
      responses:
        "200":
          description: The order list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
                # The API mock serves this exactly as written, per ADR-0600. The statuses
                # vary on purpose. With one status in a list example, a UI ships with an
                # unstyled badge for every other status.
                example:
                  - { id: order_01kztnj6c8e0jt7vzw0cn1wxvd, product_id: product_01kztmx9e0fq1r13w5d1aerqw6, quantity: 2, total: {amount: "2598.00", currency: EUR}, status: confirmed }
                  - { id: order_01kztnpc5gfx2a9kkhxe1h4ar3, product_id: product_01kztn1f78evjtsk2gbgjk5hs3, quantity: 1, total: {amount: "899.00", currency: EUR}, status: pending }
                  - { id: order_01kztnthyrfsj8a9pjx1md2pqs, product_id: product_01kztn5n0gfphac1fsep3b64nj, quantity: 4, total: {amount: "596.00", currency: EUR}, status: cancelled }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: checkout
      tags: [orders]
      description: |
        Starts the Checkout Temporal saga, per ADR-0302. It is idempotent on the
        Idempotency-Key header: a retry of the same request returns the order that the
        first one created and does not place a second order.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, description: Client-generated key that makes the checkout idempotent., schema: { type: string, minLength: 1 } }
      requestBody:
        required: true
        description: The checkout to start.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutInput" }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowHandle" }
        default: { $ref: "#/components/responses/Error" }
  /orders/{id}:
    get:
      operationId: getOrder
      description: Fetch an order by id.
      tags: [orders]
      parameters: [{ name: id, in: path, required: true, description: Order id., schema: { $ref: "#/components/schemas/OrderId" } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } } }
        default: { $ref: "#/components/responses/Error" }
  /orders/{id}/cancel:
    post:
      operationId: cancelOrder
      # Operator action, per ADR-0401: admin-gen emits an action button, not CRUD.
      # The edge can reach it as first-party, and the public docs leave it out, per the ADR-0303 audience ladder.
      x-admin: action
      x-audience: internal
      description: Cancel an order. Starts the CancelOrder workflow, per ADR-0302.
      tags: [orders]
      parameters: [{ name: id, in: path, required: true, description: Id of the order to cancel., schema: { $ref: "#/components/schemas/OrderId" } }]
      responses:
        "202":
          description: Cancellation accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowHandle" }
        default: { $ref: "#/components/responses/Error" }
  /subject-data/orders:
    get:
      operationId: listOrderSubjects
      # East-west, from the platform worker's retention sweep, per ADR-0301. The edge routes only `/api/orders`,
      # so this path has no edge route, and a NetworkPolicy gates it. `x-audience: cluster` keeps it off both portals.
      x-audience: cluster
      tags: [cluster]
      description: One page of the identities that own orders, in identity order.
      parameters:
        - { name: after, in: query, required: false, description: The last identity of the previous page., schema: { type: string } }
        - { name: limit, in: query, required: false, description: The page size., schema: { type: integer, minimum: 1, maximum: 1000, default: 500 } }
      responses:
        "200":
          description: The page.
          content: { application/json: { schema: { $ref: "#/components/schemas/SubjectPage" } } }
        default: { $ref: "#/components/responses/Error" }
  /subject-data/orders/{identity_id}:
    get:
      operationId: exportOrdersSubject
      # East-west, from the platform worker's ExportSubject, per ADR-0301 and GDPR Art. 15 and 20.
      x-audience: cluster
      tags: [cluster]
      description: Every order that the subject placed.
      parameters:
        - { name: identity_id, in: path, required: true, description: The Kratos identity., schema: { type: string, minLength: 1 } }
      responses:
        "200":
          description: The subject's orders.
          content: { application/json: { schema: { $ref: "#/components/schemas/SubjectOrders" } } }
        default: { $ref: "#/components/responses/Error" }
  /subject-data/orders/{identity_id}/erase:
    post:
      operationId: eraseOrdersSubject
      # East-west, from the platform worker's EraseSubject, per ADR-0301 and GDPR Art. 17.
      x-audience: cluster
      tags: [cluster]
      description: |
        Anonymise the owner of the subject's orders. The orders stay, because they
        carry a bookkeeping obligation. Safe to run again.
      parameters:
        - { name: identity_id, in: path, required: true, description: The Kratos identity., schema: { type: string, minLength: 1 } }
      requestBody:
        required: true
        description: The replacement for the identity.
        content: { application/json: { schema: { $ref: "#/components/schemas/ErasureRequest" } } }
      responses:
        "200":
          description: The rows that changed.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErasureResult" } } }
        default: { $ref: "#/components/responses/Error" }
components:
  responses:
    # >>> shared-components: responses. Generated from tools/codegen/shared-components.yaml. Do not edit
    Error:
      description: An error, as RFC 9457 problem details.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    # <<< shared-components
  schemas:
    # >>> shared-components: schemas. Generated from tools/codegen/shared-components.yaml. Do not edit
    # RFC 9457 problem details. `instance` is absent on purpose: `trace_id` identifies the occurrence and leads to the trace.
    # An instance URL leads nowhere.
    Problem:
      type: object
      description: |
        RFC 9457 problem details. Services and the edge both serve it as
        `application/problem+json`, so a generated client has one error branch, not two.
      required: [type, title, status]
      properties:
        type:
          type: string
          description: |
            `about:blank`, except where two errors share a status code and a client
            handles them differently. That case uses a `urn:problem-type:<service>:<slug>`
            URN. It is never a dereferenceable URL, which would put an error taxonomy into
            the flat public URL namespace.
          default: "about:blank"
          example: "about:blank"
        title:
          type: string
          description: A stable, human-readable summary. It does not change with the instance.
          example: Not Found
        status:
          type: integer
          description: The HTTP status, repeated in the body.
          minimum: 100
          maximum: 599
          example: 404
        detail:
          type: string
          description: |
            Specific to the instance and safe to show a user. Never a stack trace, a query,
            or an internal hostname.
          example: No product with that identifier.
        trace_id:
          type: string
          description: |
            The W3C Trace Context trace-id of the failing request, so an error that a user
            reports leads to its trace. The active span supplies it, not the handler.
          pattern: "^[0-9a-f]{32}$"
          example: 4bf92f3577b34da6a3ce929d0e0e4736
        errors:
          type: array
          description: |
            Field-level validation failures, filled from the generated validator.
            Absent when the failure is not a validation failure.
          items:
            type: object
            required: [pointer, message]
            properties:
              pointer:
                type: string
                description: RFC 6901 JSON Pointer to the member that failed.
                example: /price/amount
              message:
                type: string
                example: must be a decimal amount
      example:
        type: "about:blank"
        title: Not Found
        status: 404
        detail: No product with that identifier.
        trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
    # A monetary amount. `string`, never `number`: every TypeScript client parses a JSON number as an IEEE-754 double.
    # A double cannot hold a decimal amount exactly. A `type: number` monetary field is a contract defect.
    Money:
      type: object
      description: |
        A monetary amount. The amount is a decimal string, because a JSON number becomes
        a double in the TypeScript client, and a double cannot hold a decimal amount
        exactly. The currency goes with the amount, because an amount without one is
        not a quantity of anything.
      required: [amount, currency]
      properties:
        amount:
          type: string
          description: Decimal amount, with a leading sign when negative. No thousands separators.
          pattern: '^-?[0-9]+(\.[0-9]+)?$'
          example: "1299.00"
        currency:
          type: string
          description: ISO 4217 alphabetic code, uppercase.
          pattern: "^[A-Z]{3}$"
          example: EUR
      example:
        amount: "1299.00"
        currency: EUR
    # <<< shared-components
    # Wire identifiers, per ADR-0003. The stored columns stay bare `uuid`. This form
    # exists so that a value in a log line, a ticket, or a URL names its type.
    OrderId:
      type: string
      description: |
        An order identifier: `order_` and the UUIDv7 in 26 characters of Crockford
        base32. The first character is at most 7, because 26 characters hold 130 bits and
        a UUID has 128. It is opaque to a consumer: nothing parses, orders, or builds one.
      pattern: '^order_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$'
      example: order_01kztnj6c8e0jt7vzw0cn1wxvd
    # catalog mints it and this service carries it. So the prefix names the owning
    # service's resource, not a resource of this service.
    ProductId:
      type: string
      description: |
        A product identifier: `product_` and the UUIDv7 in 26 characters of Crockford
        base32. It is opaque to a consumer: nothing parses, orders, or builds one.
      pattern: '^product_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$'
      example: product_01kztmx9e0fq1r13w5d1aerqw6
    WorkflowHandle:
      type: object
      description: Handle to an async Temporal workflow run.
      required: [id, run_id, status]
      properties:
        id:     { type: string }
        run_id: { type: string }
        status: { type: string, enum: [running, completed, failed, cancelled] }
        # uri-reference, not uri. The value is a path on this origin, and `format: uri` means an absolute URI. Then the committed example would fail its own schema.
        result_url: { type: string, format: uri-reference, description: "GET it to fetch the terminal status and result" }
      # `running` is the accurate example, because the real 202 returns it. Against the
      # API mock, the poll never moves on, per ADR-0600. Tests of workflow progress use
      # real services, so build the pending state and stop there.
      example: { id: checkout-order_01kztnj6c8e0jt7vzw0cn1wxvd, run_id: 019a3f8c-6d21-7c4b-8e55-0f27f7f0e001, status: running, result_url: /api/orders/order_01kztnj6c8e0jt7vzw0cn1wxvd }
    CheckoutInput:
      type: object
      description: Request body to start a checkout.
      required: [product_id, quantity]
      properties:
        product_id: { $ref: "#/components/schemas/ProductId" }
        quantity:   { type: integer, minimum: 1 }
    SubjectPage:
      type: object
      description: One page of subjects. `next` is absent on the last page.
      required: [subjects]
      properties:
        subjects: { type: array, items: { type: string } }
        next: { type: string, description: The cursor for the next page. }
      example: { subjects: [0b6f6f2e-5d3b-4f39-9a5e-3c7a1d1e2f40], next: 0b6f6f2e-5d3b-4f39-9a5e-3c7a1d1e2f40 }
    ErasureRequest:
      type: object
      description: The value that replaces the identity in every row. The workflow chooses one per erasure.
      required: [pseudonym]
      properties:
        pseudonym: { type: string, pattern: "^erased-[0-9a-f-]{36}$" }
    ErasureResult:
      type: object
      description: The rows that the erasure changed.
      required: [rows]
      properties:
        rows: { type: integer }
      example: { rows: 3 }
    SubjectOrders:
      type: object
      description: A subject's orders.
      required: [orders]
      properties:
        orders: { type: array, items: { $ref: "#/components/schemas/Order" } }
      example:
        orders:
          - { id: order_01kztnj6c8e0jt7vzw0cn1wxvd, product_id: product_01kztmx9e0fq1r13w5d1aerqw6, quantity: 2, total: {amount: "2598.00", currency: EUR}, status: confirmed }
    Order:
      type: object
      description: A customer order.
      required: [id, product_id, quantity, total, status]
      properties:
        id:          { $ref: "#/components/schemas/OrderId" }
        product_id:  { $ref: "#/components/schemas/ProductId" }
        quantity:    { type: integer }
        # The shared money type, per ADR-0300. It is zero until the saga prices the order.
        total:       { $ref: "#/components/schemas/Money" }
        status:      { type: string, enum: [pending, confirmed, failed, cancelled] }
      example: { id: order_01kztnj6c8e0jt7vzw0cn1wxvd, product_id: product_01kztmx9e0fq1r13w5d1aerqw6, quantity: 2, total: {amount: "2598.00", currency: EUR}, status: confirmed }
