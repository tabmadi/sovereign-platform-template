# Observability backend, per ADR-0500: Grafana, Loki and Tempo in monolithic single-binary mode, Prometheus for Core
# metrics with a local TSDB, and the cluster-state collector. The off-cluster bucket makes logs and traces durable,
# per ADR-0207. The access keys come from the SOPS-decrypted `observability-bucket` Secret, per ADR-0202.

grafana:
  fullnameOverride: grafana
  adminPassword: ""                # supplied through a SOPS-decrypted Secret in prod
  # Dashboard rendering comes in bursts on each page load, so there is no CPU limit, per ADR-0204.
  resources:
    requests: { cpu: "100m", memory: "192Mi" }
    limits:   { memory: "512Mi" }
  # Served at the ROOT of its own ops origin `grafana.ops.<host>`, per ADR-0306, and not
  # under a `/grafana` path. So `serve_from_sub_path` is off. Each environment overrides
  # `root_url` with its external origin. The local overlay sets the :8443 edge.
  grafana.ini:
    server:
      serve_from_sub_path: false
      root_url: "%(protocol)s://%(domain)s/"
    # The ops edge is the authentication gate. Oathkeeper requires an AAL2 operator with `dashboard:grafana#view`, per ADR-0306.
    auth:
      disable_login_form: true
    "auth.anonymous":
      enabled: true
      org_role: Admin
    # Operators land on a dashboard, and not on the Grafana home page.
    dashboards:
      default_home_dashboard_path: /var/lib/grafana/dashboards/default/overview.json
    # No phone-home. Version and plugin update checks and usage analytics are the only
    # reasons Grafana reaches the internet. Hubble shows this as grafana to <gcp-ip>:443.
    analytics:
      reporting_enabled: false
      check_for_updates: false
      check_for_plugin_updates: false
    # Grafana 11.4+ ships the drilldown apps, Explore Logs, Traces, Metrics, and Pyroscope, as *preinstalled* plugins. It
    # fetches them from grafana.com at startup. That fails on an air-gapped or proxied cluster with `Failed to install
    # plugin` and `context deadline exceeded`.
    plugins:
      preinstall_disabled: true
      public_key_retrieval_disabled: true
  datasources:
    datasources.yaml:
      apiVersion: 1
      # Fixed uids. A provisioned datasource without an explicit uid gets a random one. Dashboard data-links reference
      # datasources by uid, so pin them all.
      datasources:
        - { name: Prometheus, uid: prometheus, type: prometheus, url: http://prometheus.platform.svc.cluster.local:9090 }
        - { name: Loki,       uid: loki,       type: loki,       url: http://loki.platform.svc.cluster.local:3100 }
        - { name: Tempo,      uid: tempo,      type: tempo,      url: http://tempo.platform.svc.cluster.local:3200 }
        # Pyroscope, the ADR-0501 POC for continuous profiling. It backs the flame-graph
        # panel on the service-detail dashboard. The Alloy agent in `templates/alloy.yaml`
        # pushes profiles here.
        - { name: Pyroscope, uid: pyroscope, type: grafana-pyroscope-datasource, url: http://pyroscope.platform.svc.cluster.local:4040 }
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          orgId: 1
          folder: ""
          type: file
          disableDeletion: false
          editable: false      # dashboards are git artifacts, per ADR-0500: change them with PRs, not in the UI
          options:
            path: /var/lib/grafana/dashboards/default
  dashboardsConfigMaps:
    default: grafana-dashboards     # filled from infra/observability/dashboards/

# Loki: single-binary monolithic mode with `-target=all`, backed by the bucket, per ADR-0500.
loki:
  # Pin the service name to `loki`, not the release-prefixed `observability-loki`.
  # So the OTel exporter, the Grafana datasource below, and prod reach it at
  # `loki.<ns>.svc:3100`. Tempo and Prometheus also fix their names in the same way.
  fullnameOverride: loki
  deploymentMode: SingleBinary
  loki:
    # The one field of `restricted` that the loki chart leaves unset, per ADR-0200.
    podSecurityContext:
      seccompProfile: { type: RuntimeDefault }
    # Single-tenant, per ADR-0500: no X-Scope-OrgID is required. Without this, the chart
    # defaults to multi-tenant. Every query without the header then gets a 401 with
    # `no org id`, and so does Grafana's datasource health check.
    auth_enabled: false
    # Do not send usage stats to stats.grafana.org. That is the only reason loki
    # makes an external egress connection. Hubble shows this as loki to <gcp-ip>:443.
    analytics: { reporting_enabled: false }
    commonConfig: { replication_factor: 1 }
    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: s3
          schema: v13
          index: { prefix: loki_index_, period: 24h }
    storage:
      type: s3
      bucketNames: { chunks: loki-chunks, ruler: loki-ruler, admin: loki-admin }
      s3:
        endpoint: s3.eu-central-1.amazonaws.com
        region: eu-central-1
        s3ForcePathStyle: true
        # `access_key_id` and `secret_access_key` are empty, so Loki's S3 client uses the AWS SDK
        # env credentials. They come below from the observability-bucket Secret.
  singleBinary:
    replicas: 1
    extraEnvFrom:
      - secretRef: { name: observability-bucket }
    # Set explicitly, and not left to the namespace LimitRange default. Log ingest is so
    # close to that default that a busier day would OOM it, per ADR-0204.
    resources:
      requests: { cpu: "100m", memory: "512Mi" }
      limits:   { memory: "1Gi" }
  read: { replicas: 0 }
  write: { replicas: 0 }
  backend: { replicas: 0 }
  chunksCache: { enabled: false }
  resultsCache: { enabled: false }
  # The nginx gateway fronts the distributed read, write, and backend split. In SingleBinary mode, the OTel collector
  # pushes to the loki service and Grafana queries it directly. So the gateway does nothing useful.
  gateway: { enabled: false }
  # loki-canary is a synthetic log-probe DaemonSet, with its helm test. It measures
  # ingest latency, and this template does not need it. These two toggles are the
  # loki chart's own templates, so a values override works.
  lokiCanary: { enabled: false }
  test: { enabled: false }
  # NOTE: the loki chart also bundles minio, rollout-operator, and grafana-agent-operator as *grandchild* subcharts.
  # Helm renders them even when their conditions are false, because of a limit on nested conditions.

# Tempo: the single-binary monolithic chart, backed by the bucket.
tempo:
  # Pin the service name to `tempo`, so the OTel exporter at tempo:4318 and the Grafana
  # datasource at tempo:3200 resolve it, and not the release-prefixed default.
  fullnameOverride: tempo
  replicas: 1
  # `restricted`, per ADR-0200.
  securityContext:
    seccompProfile: { type: RuntimeDefault }
  tempo:
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
    # THE HEAVIEST POD IN THE CLUSTER. So this chart cannot rely on the namespace LimitRange default.
    resources:
      requests: { cpu: "100m", memory: "1Gi" }
      limits:   { memory: "3Gi" }
    reportingEnabled: false
    # The metrics-generator stays OFF, as in the chart default.
    extraEnvFrom:
      - secretRef: { name: observability-bucket }
    storage:
      trace:
        backend: s3
        s3:
          bucket: tempo-traces
          endpoint: s3.eu-central-1.amazonaws.com
          region: eu-central-1
          # `access_key` and `secret_key` come from the observability-bucket Secret.

# Prometheus, the Core-tier metrics store: one Deployment, a local TSDB, native OTLP ingest, and no object storage.
# `templates/prometheus.yaml` renders it as a ConfigMap, a Deployment, and a Service. It is not a subchart.
prometheus:
  image: prom/prometheus:v3.1.0
  replicas: 1
  httpPort: 9090
  # Local-TSDB retention.
  retention: 31d
  # Where evaluated alerts go for routing, per ADR-0502. It is set here, and not read
  # from the values of the alertmanager chart. A chart renders from its own values
  # only, so a cross-chart address is a value that this chart owns.
  alertmanagerTarget: alertmanager.platform.svc.cluster.local:9093
  # The TSDB volume.
  storage:
    size: 20Gi
    # Unset means the cluster's default StorageClass.
    storageClassName: ""
  # No CPU limit, per ADR-0204. A TSDB compaction is bursty, latency-sensitive
  # work, and CFS throttling ruins it.
  resources:
    requests: { cpu: "100m", memory: "384Mi" }
    limits:   { memory: "1Gi" }

# Pyroscope, the ADR-0501 POC for continuous profiling, the fourth signal. `templates/pyroscope.yaml` renders it as a
# single-binary monolith with `-target=all` and filesystem storage on an emptyDir. That is the POC minimum.
pyroscope:
  image: grafana/pyroscope:1.14.0
  # The request follows the working set, because memory cannot be compressed. The
  # limit leaves room for ingest spikes.
  resources:
    requests: { cpu: "100m", memory: "384Mi" }
    limits:   { memory: "1Gi" }

# Grafana Alloy, the ADR-0501 POC. It is the pprof-scraping agent that the withdrawn profiling flag always implied.
# `templates/alloy.yaml` renders it.
alloy:
  image: grafana/alloy:v1.11.0
  # The request matches the real working set. If it asks for less, the scheduler
  # overcommits a node and then evicts the agent, per ADR-0204.
  resources:
    requests: { cpu: "100m", memory: "320Mi" }
    limits:   { memory: "768Mi" }

# The cluster-state metrics singleton in `templates/otel-cluster.yaml`. Its k8s_cluster receiver gives desired and
# available replicas, restart counts, and resource limits as series.
otelCluster:
  image: otel/opentelemetry-collector-contrib:0.154.0
  resources:
    requests: { cpu: "50m", memory: "192Mi" }
    limits:   { memory: "512Mi" }

# The same gate as in the maddy chart, `infra/helm/platform/maddy`. Both read the same per-environment overlay. So
# the scrape job appears only where the agent does.
maddy:
  enabled: false
