{{- if .Values.maddy.enabled }}
{{- /*
A StatefulSet, because the queue is the purpose. An outbound agent holds messages
that a receiver asked it to retry, sometimes for days. A queue on an emptyDir
loses the messages that were hardest to deliver. The MTA-STS policy cache is on
the same volume. If the cache is lost, it costs a new fetch, and not a message.

One replica, and not a value. Two maddy instances that share one submission
Service would deliver from one egress IP. They would have two queues and two DKIM
signers that read one key. The reputation argument in ADR-0307 assumes one
sender. Scale-out is a different decision from this chart's.
*/}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: maddy
  labels: &labels
    app: maddy
    app.kubernetes.io/name: maddy
    app.kubernetes.io/part-of: platform
spec:
  serviceName: maddy
  replicas: 1
  selector:
    matchLabels:
      app: maddy
  template:
    metadata:
      labels: *labels
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: maddy
          image: "{{ .Values.maddy.image.repository }}:{{ .Values.maddy.image.tag }}"
          imagePullPolicy: {{ .Values.maddy.image.pullPolicy }}
          args: ["-config", "/etc/maddy/maddy.conf", "run"]
          env:
            # The submission password, as the hash that maddy's pass_table compares
            # against. A hash and not the password, because this value reaches the
            # config file, and a config file is not a secret store.
            - name: MADDY_SUBMISSION_HASH
              valueFrom:
                secretKeyRef: { name: {{ .Values.maddy.submission.secretName }}, key: password_hash }
          ports:
            - { name: submission, containerPort: {{ .Values.maddy.submission.port }} }
            - { name: metrics, containerPort: {{ .Values.maddy.metrics.port }} }
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: config, mountPath: /etc/maddy, readOnly: true }
            # The DKIM key, read-only and REQUIRED.
            - { name: dkim, mountPath: /run/secrets/dkim, readOnly: true }
            - { name: tls, mountPath: /run/secrets/tls, readOnly: true }
            - { name: state, mountPath: /data }
            # maddy checks at startup that /tmp is writable, and exits when it is not.
            - { name: tmp, mountPath: /tmp }
          livenessProbe:
            tcpSocket: { port: submission }
            initialDelaySeconds: 10
            periodSeconds: 30
          # A response on the submission port IS readiness here. An SMTP agent has no
          # health endpoint. A socket that accepts is one that a sender can give a
          # message to.
          readinessProbe:
            tcpSocket: { port: submission }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources: {{ toYaml .Values.maddy.resources | nindent 12 }}
      volumes:
        - name: config
          configMap: { name: maddy }
        - name: dkim
          secret:
            secretName: {{ .Values.maddy.dkim.secretName }}
            items:
              - { key: private.key, path: private.key }
        - name: tls
          secret: { secretName: maddy-tls }
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: state
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.maddy.persistence.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.maddy.persistence.size }}
{{- end }}
