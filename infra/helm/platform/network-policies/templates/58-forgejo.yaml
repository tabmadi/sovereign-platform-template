{{- if .Values.forgejo.enabled }}
## The forge, per ADR-0102. The same flag gates it as the chart. Ingress comes from the edge and the Actions runners.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: forgejo
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: forgejo
  ingress:
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system }
      toPorts:
        - ports: [{ port: "3000", protocol: TCP }]
  egress:
    # Its database, on the shared CNPG cluster, through the pooler, per ADR-0300.
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: platform, cnpg.io/poolerName: postgres-pooler }
      toPorts:
        - ports: [{ port: "5432", protocol: TCP }]
    - toEntities: [world]
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]
{{- end }}
