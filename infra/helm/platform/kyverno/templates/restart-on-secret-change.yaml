# A Secret's consumers read it once, at start, per ADR-0202. A changed value reaches them only through a new pod. This
# rolls every Deployment, StatefulSet, and Temporal WorkerDeployment in `platform` that references a changed Secret.
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: restart-on-secret-change
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    policies.kyverno.io/title: A changed Secret rolls its consumers
    policies.kyverno.io/category: Secrets
    policies.kyverno.io/severity: medium
spec:
  evaluation:
    mutateExisting:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [UPDATE]
        resources: [secrets]
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: platform
  # The sops-operator applies every Secret again on each reconcile. Only a change of data is a rotation.
  matchConditions:
    - name: data-changed
      expression: "object.?data.orValue({}) != oldObject.?data.orValue({})"
  variables:
    - name: secret
      expression: request.object.metadata.name
    - name: version
      expression: request.object.metadata.resourceVersion
  targetMatchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: platform
    resourceRules:
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, statefulsets]
      - apiGroups: [temporal.io]
        apiVersions: [v1alpha1]
        operations: [CREATE, UPDATE]
        resources: [workerdeployments]
  targetMatchConditions:
    - name: references-the-secret
      expression: >-
        (object.spec.template.spec.containers + object.spec.template.spec.?initContainers.orValue([])).exists(c,
          c.?envFrom.orValue([]).exists(e, e.?secretRef.?name.orValue("") == variables.secret) ||
          c.?env.orValue([]).exists(e, e.?valueFrom.?secretKeyRef.?name.orValue("") == variables.secret)) ||
        object.spec.template.spec.?volumes.orValue([]).exists(v, v.?secret.?secretName.orValue("") == variables.secret)
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{spec: Object.spec{template: Object.spec.template{metadata: Object.spec.template.metadata{
            annotations: {"secret.platform/" + variables.secret: variables.version}}}}}
