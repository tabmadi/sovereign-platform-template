{{- if .Values.ingress.enabled }}
{{- if .Values.ingress.resources }}
# Flat-API routing, per ADR-0306. The edge routes each `/api/<resource>` that the service owns and strips the shared
# `/api` prefix. So the service mounts its resources at the root.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "service.fullname" . }}-stripprefix
  labels: {{- include "service.labels" . | nindent 4 }}
spec:
  stripPrefix:
    prefixes:
      - /api
---
{{- end }}
# Traefik IngressRoute, per ADR-0305 and ADR-0306.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "service.fullname" . }}
  labels: {{- include "service.labels" . | nindent 4 }}
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: {{ include "service.ingressMatch" . }}
      middlewares:
        # Anti-spoofing, per ADR-0305: strip any identity headers from the client BEFORE anything downstream. So a client
        # cannot inject `X-User-*` on an anonymous route.
        - name: strip-identity-headers
          namespace: platform
{{- if .Values.ingress.resources }}
        # Forward-auth belongs only to the API surface.
        - name: oathkeeper-forward-auth
          namespace: platform
{{- end }}
        - name: security-headers
          namespace: platform
{{- if .Values.ingress.resources }}
        - name: {{ include "service.fullname" . }}-stripprefix
{{- end }}
      services:
        - name: {{ include "service.fullname" . }}-server
          port: 80
  tls:
    secretName: wildcard-tls
{{- end }}
