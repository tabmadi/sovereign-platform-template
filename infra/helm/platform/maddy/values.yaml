# Values are under `maddy:`, so this chart shares the single per-environment values overlay of the platform
# ApplicationSet with no key collisions.
maddy:
  # maddy, the outbound mail submission endpoint, per ADR-0307.
  enabled: false

  image:
    repository: foxcpp/maddy
    tag: "0.9.5"
    pullPolicy: IfNotPresent

  # The identity that platform mail authenticates as.
  hostname: mail.example.com

  dkim:
    # The selector published at `<selector>._domainkey.<hostname>`.
    selector: default
    # The Secret that holds the DKIM private key, per ADR-0202. Its `private.key` entry is mounted read-only at the
    # path that maddy signs with.
    secretName: maddy-dkim

  # The OpenMetrics listener. It is internal to the cluster. The network policy
  # admits the node-local collector and nothing else. The Service does not publish
  # it outside the pod network.
  metrics:
    port: 9749

  submission:
    port: 587
    # The credential that Kratos and the services authenticate with. There is one
    # account, because every sender is first-party. The sender identity that matters
    # is the envelope's, not the SMTP user's.
    secretName: maddy-submission
    username: platform

  persistence:
    # Undelivered mail lives here, and so does the MTA-STS policy cache. A queue on
    # an emptyDir loses the messages that a receiver asked us to retry.
    size: 2Gi
    storageClassName: ""

  # Per ADR-0204. Not measured, because no environment runs this yet. These numbers
  # come from maddy's own documented footprint for a small deployment. They are the
  # first numbers to derive again when an environment runs it.
  resources:
    requests: { cpu: "25m", memory: "64Mi" }
    limits: { memory: "256Mi" }
