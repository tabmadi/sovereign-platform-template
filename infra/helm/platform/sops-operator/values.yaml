sops-secrets-operator:
  # `restricted`, per ADR-0200. The chart ships a complete, correct security context and leaves it OFF. Both
  # halves are turned on here, and not written by hand.
  securityContext:
    enabled: true
    container:
      enabled: true
      customContainerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
  secretsAsFiles:
    - name: sops-age-key
      mountPath: /etc/sops/age
      secretName: sops-age-key       # holds keys.txt, provisioned by Ansible at cluster bootstrap
  extraEnv:
    - { name: SOPS_AGE_KEY_FILE, value: /etc/sops/age/keys.txt }
