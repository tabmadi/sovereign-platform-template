# Mail delivery, watched from both ends (ADR-0307, routed by ADR-0502).
groups:
  - name: mail.submission
    rules:
      # maddy refusing or failing submissions. The senders are Kratos, the services
      # and Alertmanager; a submission failure means the message never entered the
      # queue, so no retry is pending and nothing will deliver it later.
      - alert: MailSubmissionFailing
        expr: |
          sum(rate(errors_total{kind="dependency", service_name="kratos"}[10m])) > 0
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: "Mail submission is failing"
          description: >-
            The courier cannot hand messages to the submission endpoint. Verification
            and recovery mail is not being sent at all — this is upstream of
            deliverability, so DNS and DKIM are not the place to look first.
      # Transactions that start and do not finish. maddy exposes no queue-depth
      # series, so this counts the gap between accepted and delivered instead.
      - alert: MailTransactionsAborting
        expr: |
          sum(rate(maddy_smtp_aborted_transactions[30m]))
            / clamp_min(sum(rate(maddy_smtp_started_transactions[30m])), 0.001)
            > 0.1
        for: 30m
        labels: { severity: ticket }
        annotations:
          summary: "Outbound mail transactions are aborting"
          description: >-
            More than a tenth of submission transactions are not completing. A
            receiver is deferring or refusing: check the DMARC aggregate reports and
            whether the egress IP is listed anywhere before changing configuration.
      # Permanent rejections, which are the ones no retry will fix.
      - alert: MailPermanentlyRejected
        expr: |
          sum(rate(maddy_smtp_failed_commands{smtp_code=~"5.."}[30m])) > 0
        for: 30m
        labels: { severity: ticket }
        annotations:
          summary: "Outbound mail is being permanently rejected"
          description: >-
            A receiver is refusing messages outright rather than deferring them.
            Check the `smtp_enchcode` label: `5.7.x` is a policy rejection, which
            points at DKIM, SPF or the egress IP's reputation.

  - name: mail.identity-flow
    rules:
      # ADR-0307's named signal, and the one that survives a correctly configured agent.
      - alert: IdentityVerificationCompletionDropped
        expr: |
          (
            sum(increase(http_server_request_duration_seconds_count{http_route="/self-service/verification", http_response_status_code=~"2.."}[6h]))
            / (sum(increase(http_server_request_duration_seconds_count{http_route="/self-service/registration", http_response_status_code=~"2.."}[6h])) > 10)
          ) < 0.5
        for: 1h
        labels: { severity: ticket }
        annotations:
          summary: "Fewer than half of new identities are completing verification"
          description: >-
            The signal ADR-0307 names for a dropped verification mail. The mail path
            can be entirely healthy from this side — accepted, signed, queued, sent —
            and still land nowhere, so check the receiver's authentication results
            and the DMARC reports rather than the agent's logs. The denominator guard
            keeps a quiet period from firing this.
