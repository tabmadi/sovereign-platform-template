{{- if .Values.alertmanager.enabled }}
## Check that the Watchdog still arrives, per ADR-0502 and `docs/reference/detection-latency.md`. The Watchdog alert
## always fires. So its ABSENCE is the only signal that it carries, and nothing acts on an absence alone.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: alertmanager-watchdog-check
  namespace: platform
  labels: { app.kubernetes.io/name: alertmanager-watchdog-check }
spec:
  schedule: {{ .Values.alertmanager.watchdogCheck.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # No retries. A retry would hide the exact case that a heartbeat check exists
      # to record: a short failure that then recovered.
      backoffLimit: 0
      template:
        metadata:
          labels: { app.kubernetes.io/name: alertmanager-watchdog-check }
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: check
              image: "{{ .Values.alertmanager.image.repository }}:{{ .Values.alertmanager.image.tag }}"
              imagePullPolicy: {{ .Values.alertmanager.image.pullPolicy }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  AM="http://alertmanager.platform.svc.cluster.local:{{ .Values.alertmanager.httpPort }}"
                  echo "→ checking that Alertmanager holds a firing Watchdog"
                  # Keep amtool's own exit status. Two faults are different, with different first suspects: amtool cannot reach
                  # Alertmanager, or Alertmanager holds no Watchdog. Only the second one means that alerting is broken.
                  if ! found=$(amtool --alertmanager.url="$AM" \
                                 alert query alertname=Watchdog 2>&1); then
                    echo "✗ cannot reach Alertmanager at $AM. This check has no" >&2
                    echo "  verdict, so it tells nothing about alert routing." >&2
                    echo "  Alertmanager is down, starting, or unreachable from" >&2
                    echo "  this namespace. Check the Deployment and the" >&2
                    echo "  NetworkPolicy before you draw any other conclusion." >&2
                    echo "  amtool said: $found" >&2
                    exit 2
                  fi
                  if printf '%s' "$found" | grep -q Watchdog; then
                    echo "✓ Watchdog present: alerts are evaluating and routing"
                  else
                    echo "✗ no Watchdog in Alertmanager: Prometheus does not evaluate" >&2
                    echo "  alerts, or Alertmanager does not route them. No other" >&2
                    echo "  alert is reliable. Check Prometheus rule loading and the" >&2
                    echo "  Alertmanager Deployment before you trust any alert." >&2
                    exit 1
                  fi
              resources:
                requests: { cpu: "10m", memory: "32Mi" }
                limits:   { memory: "64Mi" }
{{- end }}
