# OAuth2 client registrations, per ADR-0304. A Helm post-sync hook applies them
# with `hydra create client`. Each internal service gets one s2s client. Each
# third-party developer gets one client when they arrive.
clients:
  # Service-to-service clients use `client_credentials`.
  - client_id:     orgs
    client_name:   "orgs (s2s)"
    grant_types:   [client_credentials]
    response_types: []
    scope:         "orgs.read orgs.write"
    token_endpoint_auth_method: client_secret_post

  - client_id:     catalog
    client_name:   "catalog (s2s)"
    grant_types:   [client_credentials]
    scope:         "catalog.read"

  - client_id:     orders
    client_name:   "orders (s2s)"
    grant_types:   [client_credentials]
    scope:         "catalog.read payment.charge orgs.read"

  - client_id:     payment
    client_name:   "payment (s2s)"
    grant_types:   [client_credentials]
    scope:         "payment.charge"
