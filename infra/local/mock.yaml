# The API mock for the UI development loop (ADR-0600). Local-only, like the rest of infra/local/: it appears in no
# chart, no deployed environment, and no tier in docs/operational-surface.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock
  namespace: platform
  labels:
    app.kubernetes.io/name: mock
    local.platform/component: mock
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: mock }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mock
        local.platform/component: mock
      annotations:
        # Roll the pod whenever the stamped spec changes. Prism reads the document
        # once at startup, so without this a re-stamped ConfigMap would leave the
        # old contract being served until someone noticed.
        local.platform/spec-hash: "stamped-by-mock-start"
    spec:
      # `restricted` (ADR-0200) — this lands in `platform`, which enforces it. uid
      # 1000 is the `node` user the Prism image inherits from its node base.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: prism
          # A vendored container: no package.json, no lockfile, no node_modules
          # anywhere in the repo (ADR-0600, enforced by lint:node-scope).
          image: stoplight/prism:5.15.10
          # `-h 0.0.0.0` because the container's default binding is loopback, which a Service cannot reach.
          args:
            - mock
            - -h
            - 0.0.0.0
            - -p
            - "4010"
            - --multiprocess
            - "false"
            - --errors
            - "true"
            - /spec/internal.json
          ports:
            - { name: http, containerPort: 4010 }
          readinessProbe:
            httpGet: { path: /products, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { memory: "256Mi" }
          # Prism reads the document at startup and serves it from memory; the only
          # writes are Node's scratch under /tmp, which is the emptyDir below.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: spec, mountPath: /spec, readOnly: true }
            - { name: tmp,  mountPath: /tmp }
      volumes:
        - name: spec
          configMap: { name: mock-spec }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: mock
  namespace: platform
  labels:
    app.kubernetes.io/name: mock
    local.platform/component: mock
spec:
  selector: { app.kubernetes.io/name: mock }
  ports:
    - { name: http, port: 80, targetPort: http }
---
# The /api takeover.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mock
  namespace: platform
  labels:
    app.kubernetes.io/name: mock
    local.platform/component: mock
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: mock
  ingress:
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system }
      toPorts:
        - ports: [{ port: "4010", protocol: TCP }]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: mock-stripprefix
  namespace: platform
  labels:
    app.kubernetes.io/name: mock
    local.platform/component: mock
spec:
  stripPrefix:
    prefixes: ["/api"]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mock
  namespace: platform
  labels:
    app.kubernetes.io/name: mock
    local.platform/component: mock
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`dev.localtest.me`) && PathPrefix(`/api`)
      priority: 1000
      middlewares:
        - { name: strip-identity-headers, namespace: platform }
        - { name: oathkeeper-forward-auth, namespace: platform }
        - { name: security-headers, namespace: platform }
        - { name: mock-stripprefix, namespace: platform }
      services:
        - { name: mock, port: 80 }
  tls:
    secretName: wildcard-tls
