# The k6 island, per ADR-0601. It is pinned next to the only code that uses it, so a developer who runs `lint` or `test` never installs a load generator.
# k6 is a single static Go binary with its own JS engine: no Node, no package.json, no node_modules. scripts/lint-node-scope.sh asserts that.
# The tasks are here because mise tools pass down a config tree and never up. The root keeps small `perf*` tasks that call these.
[tools]
"aqua:grafana/k6" = "2.1.0"

# The run must reach the edge, *.localtest.me, directly and never through a dev HTTPS_PROXY. Otherwise the run measures the proxy.
# The in-cluster OTLP forward is loopback. This setting covers both cases, the same as test/e2e/.mise.toml.
[env]
NO_PROXY = "localhost,127.0.0.1,.localtest.me"
no_proxy = "localhost,127.0.0.1,.localtest.me"

[tasks.smoke]
# Proves that the scenarios and the target are connected. About 30s in total. This is the lane for each PR.
description = "Both scenarios, 1 VU, a few seconds: checks that the load suite itself is healthy"
run = """
bash run.sh browse smoke
bash run.sh checkout smoke
"""

[tasks.load]
# The steady baseline. Nightly runs track this number over time. A change to the shape of the `load` profile breaks that history, per test/perf/lib/config.js.
description = "Steady-state baseline against cluster:up full, about 3min per scenario"
run = """
bash run.sh browse load
bash run.sh checkout load
"""

[tasks.stress]
# Ramp past the knee. The thresholds are EXPECTED to break, and the finding is the step where they broke. Run it before a sizing or HPA decision, per ADR-0204.
description = "Ramp to saturation to find the knee. Thresholds are expected to fail."
run = """
bash run.sh browse stress
bash run.sh checkout stress
"""

[tasks.soak]
# About 30min, one scenario. Flat throughput with rising memory is the leak signal.
description = "Sustained load for leak detection, about 30min"
run = "bash run.sh browse soak"

[tasks.seed]
# Bulk catalog rows, so the read path is measured against a realistic table.
#   mise run perf:seed -- 50000     |     mise run perf:seed -- --clean
description = "Seed bulk products, 5000 by default. --clean removes them"
run = "bash seed/seed.sh"
