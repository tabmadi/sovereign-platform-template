# Capacity and saturation alerts, per ADR-0500. Native Prometheus rule-file format, mounted into Prometheus through
# the `prometheus-alerts` ConfigMap. See `service-availability.yaml` for the delivery path.
groups:
  - name: capacity.disk
    rules:
      # Threshold: the condition that has hit this project, a full host disk.
      - alert: NodeDiskSpaceLow
        expr: |
          100 * k8s_node_filesystem_available_bytes / k8s_node_filesystem_capacity_bytes < 15
        for: 15m
        labels: { severity: page }
        annotations:
          summary: "Node filesystem below 15% free"
          description: >-
            The node disk is filling. kubelet evicts pods when free space drops
            below its eviction-hard floor. The floor is 10% on the Talos nodes,
            in infra/talos/patches/common.yaml, and 2% on the local kind node.
            Free space with `docker builder prune -af`, `docker image prune -a`,
            and `crictl rmi --prune` inside the node. A local registry never
            garbage-collects on its own: run `registry garbage-collect`.
      # Predictive: it catches steady growth that a threshold reports only when it is already an incident.
      - alert: NodeDiskSpaceFillingUp
        expr: |
          predict_linear(k8s_node_filesystem_available_bytes[6h], 24 * 3600) < 0
        for: 1h
        labels: { severity: ticket }
        annotations:
          summary: "Node filesystem predicted to fill within 24h"
          description: >-
            Based on the last 6h of free space, this filesystem runs out within a
            day. The cause is usually retention or image churn, and not a leak.
            Check the retention of Prometheus, Loki, and Tempo, and image GC,
            before you add disk.

  - name: capacity.saturation
    rules:
      - alert: NodeMemoryPressure
        expr: |
          100 * (1 - k8s_node_memory_available_bytes / (k8s_node_memory_available_bytes + k8s_node_memory_usage_bytes)) > 90
        for: 15m
        labels: { severity: page }
        annotations:
          summary: "Node memory above 90% used"
          description: >-
            Real memory saturation, not a requests problem. The next allocation
            spike OOM-kills a container that is over its request. Check the
            Applications dashboard for a workload whose usage has moved away
            from its limit.

  - name: capacity.scheduler
    rules:
      # Requests above allocatable mean that the NEXT pod cannot be scheduled, however
      # idle the hardware looks. It is separate from saturation, because the fix is
      # different: lower the requests or add a node, and do not tune the app.
      - alert: ClusterCPURequestsCommitted
        expr: |
          100 * sum(k8s_container_cpu_request) / sum(k8s_node_allocatable_cpu) > 85
        for: 30m
        labels: { severity: ticket }
        annotations:
          summary: "CPU requests at {{ $value | printf \"%.0f\" }}% of cluster allocatable"
          description: >-
            The scheduler is close to refusing new pods, even when real CPU use
            is low. A new replica or service cannot be placed before anything
            looks busy.
      - alert: ClusterMemoryRequestsCommitted
        expr: |
          100 * sum(k8s_container_memory_request_bytes) / sum(k8s_node_allocatable_memory_bytes) > 85
        for: 30m
        labels: { severity: ticket }
        annotations:
          summary: "Memory requests at {{ $value | printf \"%.0f\" }}% of cluster allocatable"
          description: >-
            As above, for memory. Size the next node against this number, and
            not against current usage. Current usage is lower than what the
            scheduler has already promised.
