name: frontend
image:
  repository: ghcr.io/tabmadi/sovereign-platform-template/frontend
  tag: "0000000000000000000000000000000000000000"
  digest: ""
worker: { enabled: false }
server:
  port: 3000
  # No admin port. A Next standalone server serves one port, so the chart's
  # default probes on `/readyz` and `/livez` must not point at a second port.
  adminPort: null
  replicas: 1
  probes:
    readiness: { httpGet: { path: /api/healthz, port: http }, initialDelaySeconds: 2, timeoutSeconds: 4 }
    liveness:  { httpGet: { path: /api/healthz, port: http }, periodSeconds: 30 }
ingress: { enabled: true, host: staging.example.com, pathPrefix: "/" }
migrations: { enabled: false }
# Server components call the edge, not a service directly. The `/api` routes match on
# `Host(<env host>)`, and Oathkeeper injects identity there, per ADR-0305. It is the same
# origin as `ingress.host`, so the browser and the server call the same URLs.
env:
  # East-west targets for the cluster-audience services that the analytics panel reads,
  # per ADR-0700. They have no `/api` route, so the edge origin above cannot reach
  # them. The panel dials the Services directly.
  ANALYTICS_URL: http://analytics-server.platform.svc.cluster.local
  AUTHZ_URL: http://authz-server.platform.svc.cluster.local
  # Kratos public, to resolve the session cookie to an identity on a page
  # render. A page carries no injected identity header. The note in the
  # shared chart's ingressroute template gives the reason.
  KRATOS_PUBLIC_URL: http://ory-kratos-public.platform.svc.cluster.local
  EDGE_PUBLIC_ORIGIN: https://staging.example.com
  # In the cluster, the pod dials the edge directly. It uses the same host, because the
  # IngressRoutes match on it and the cert is for it. It uses no browser-facing port.
  EDGE_INTERNAL_ORIGIN: https://staging.example.com
