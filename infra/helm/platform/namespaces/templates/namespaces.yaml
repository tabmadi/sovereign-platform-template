{{- /*
One Namespace per entry, with the Pod Security Standards labels, per ADR-0200.

Sync-wave -1 puts these before everything else in their tier. PSA is an
admission check. A namespace that appears after its pods gets its labels too
late to govern them, because admission has already happened.

A namespace below `restricted` MUST say why. `required` enforces that here, and
review does not have to. Six months later, an exception with no reason looks
the same as a mistake. This file is where the reason belongs.
*/}}
{{- range .Values.namespaces }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    {{- if ne .enforce "restricted" }}
    # Rendered from values, so the reason goes with the namespace into the
    # cluster. `kubectl get ns <name> -o yaml` shows why it is not
    # restricted, and nobody needs to find this repository first.
    psa.platform/exception-reason: {{ required (printf "namespaces: %s enforces %s and must record a reason" .name .enforce) .reason | quote }}
    {{- end }}
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    app.kubernetes.io/part-of: platform
    pod-security.kubernetes.io/enforce: {{ .enforce }}
    pod-security.kubernetes.io/enforce-version: {{ $.Values.enforceVersion }}
    # Always `restricted`, whatever is enforced. The warning keeps the distance
    # between the two visible on every apply. The audit annotation keeps it
    # visible in the audit log.
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: {{ $.Values.enforceVersion }}
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: {{ $.Values.enforceVersion }}
{{- end }}
