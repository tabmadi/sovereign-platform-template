## The Kubernetes API server calls admission and conversion webhooks. So a namespace-wide default-deny
## blocks them without these allows.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cert-manager-webhook
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: webhook
      app.kubernetes.io/instance: cert-manager
  ingress:
    - fromEntities: [kube-apiserver, host, remote-node]
      toPorts:
        - ports: [{ port: "10250", protocol: TCP }]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cnpg-webhook
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: cloudnative-pg
  ingress:
    - fromEntities: [kube-apiserver, host, remote-node]
      toPorts:
        - ports: [{ port: "9443", protocol: TCP }]
---
## Temporal Worker Controller, per ADR-0302. Its WorkerResourceTemplate validating webhook is always on. It is not
## optional like the WorkerDeployment one. So the apiserver must reach 9443, or every WorkerResourceTemplate write hangs.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: temporal-worker-controller-webhook
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: temporal-worker-controller
  ingress:
    - fromEntities: [kube-apiserver, host, remote-node]
      toPorts:
        - ports: [{ port: "9443", protocol: TCP }]
