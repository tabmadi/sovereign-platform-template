{{/*
ResourceQuota per namespace (ADR-0204): the aggregate cap. It evicts nothing — it rejects new pods once the
summed requests would exceed the cap, and the reason lands on the owning ReplicaSet rather than on a pod.
It depends on the LimitRange at wave -4 defaulting every resource the quota tracks.
*/}}
{{- range $ns, $cfg := .Values.resourceQuotas }}
{{- if $cfg.enabled }}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: namespace-cap
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: resource-governance
    app.kubernetes.io/part-of: platform
  annotations:
    # Wave -3: strictly after the LimitRange that makes its tracked resources
    # declarable. Reversing these two is the classic way to wedge a bring-up.
    argocd.argoproj.io/sync-wave: "-3"
spec:
  hard:
    requests.cpu: {{ $cfg.requestsCPU | quote }}
    requests.memory: {{ $cfg.requestsMemory | quote }}
    # No `limits.cpu` key: nothing in this platform sets a CPU limit (ADR-0204), so a quota on it would be a cap on
    # zero — and worse, it would force every future container to declare a cpu limit just to be admitted, quietly
    # reintroducing the throttling policy we rejected.
    limits.memory: {{ $cfg.limitsMemory | quote }}
{{- end }}
{{- end }}
