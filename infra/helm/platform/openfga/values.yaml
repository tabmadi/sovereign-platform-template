# Direct OpenFGA deployment (ADR-0304): a plain Deployment + Service, with an `openfga migrate` initContainer that
# runs before serve. No operator/CRD — the rare phased datastore migration is handled manually per OpenFGA release
# notes.
image:
  repository: openfga/openfga
  tag: "v1.14.2"

replicas: 2
logLevel: info

# Secret holding the API preshared key + Postgres connection URI (SOPS-managed in
# prod). Expected keys: preshared_key, datastore_uri
existingSecret: openfga-creds

migrate:
  enabled: true              # run `openfga migrate` as an initContainer

# Model + ops-policy seed (ADR-0300, ADR-0306).
seed:
  enabled: true
  # curl + jq for the HTTP-API seed (no fga CLI at runtime — its image is
  # distroless and can't script a find-or-create flow).
  image: alpine/k8s:1.31.1
  # Each ops dashboard (ADR-0306) granted to group:operator members.
  dashboards: [lowdefy, hubble, grafana, argocd, temporal, seaweedfs, headlamp, pgweb, mailpit, zot]
  # Service-account identities granted group:operator#member. The Lowdefy admin
  # console (ADR-0401) calls services east-west asserting X-User-Id: admin-console;
  # this grant lets that identity pass the services' operator write-gate.
  serviceOperators: [admin-console]
  # Canonical authorization model, injected by the platform ApplicationSet fileParameter `seed.model` from
  # infra/auth/openfga/model.json (generated from the model.fga DSL — the one source of truth).
  model: ""

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits:   { memory: 256Mi }
