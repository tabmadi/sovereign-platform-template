# A Secret's consumers read it once, at start, per ADR-0202. A changed value reaches them only through a new pod. This
# rolls every Deployment, StatefulSet, and Temporal WorkerDeployment in `platform` that references a changed Secret.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restart-on-secret-change
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    policies.kyverno.io/title: A changed Secret rolls its consumers
    policies.kyverno.io/category: Secrets
    policies.kyverno.io/severity: medium
spec:
  mutateExistingOnPolicyUpdate: false
  rules:
    - name: roll-consumers
      match:
        any:
          - resources:
              kinds: [Secret]
              namespaces: [platform]
              operations: [UPDATE]
      # The sops-operator applies every Secret again on each reconcile. Only a change of data is a rotation.
      preconditions:
        all:
          - key: {{ "{{ to_string(request.object.data) }}" | quote }}
            operator: NotEquals
            value: {{ "{{ to_string(request.oldObject.data) }}" | quote }}
      mutate:
        targets:
          {{- range list (list "apps/v1" "Deployment") (list "apps/v1" "StatefulSet") (list "temporal.io/v1alpha1" "WorkerDeployment") }}
          - apiVersion: {{ index . 0 }}
            kind: {{ index . 1 }}
            namespace: platform
            preconditions:
              any:
                {{- range list "containers[].envFrom[].secretRef.name" "containers[].env[].valueFrom.secretKeyRef.name" "initContainers[].envFrom[].secretRef.name" "initContainers[].env[].valueFrom.secretKeyRef.name" "volumes[].secret.secretName" }}
                - key: {{ "{{ request.object.metadata.name }}" | quote }}
                  operator: AnyIn
                  value: {{ printf "{{ target.spec.template.spec.%s || `[]` }}" . | quote }}
                {{- end }}
          {{- end }}
        patchStrategicMerge:
          spec:
            template:
              metadata:
                annotations:
                  {{ "secret.platform/{{ request.object.metadata.name }}" | quote }}: {{ "{{ request.object.metadata.resourceVersion }}" | quote }}
