{{/*
PriorityClass tiers, per ADR-0204: platform-critical, then product, then batch. They make the rule of CPU
requests with no CPU limits safe. Requests govern shares, and these priorities decide which pod is evicted when
the node is out of memory. Sync-wave -5: a pod that names a PriorityClass that does not exist yet is rejected.
*/}}
{{- range $name, $tier := .Values.priorityClasses }}
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: resource-governance
    app.kubernetes.io/part-of: platform
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
value: {{ $tier.value }}
globalDefault: {{ $tier.globalDefault | default false }}
preemptionPolicy: {{ $tier.preemptionPolicy | default "PreemptLowerPriority" }}
description: {{ $tier.description | quote }}
{{- end }}
