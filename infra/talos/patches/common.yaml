# Machine config for every node, whatever its role, per ADR-0200.
machine:
  install:
    # The disk that Talos installs itself to. `/dev/sda` is the common case on plain
    # compute. A node whose root device is an NVMe names it here. This is the one
    # value in this file that changes per fleet.
    disk: /dev/sda
    # The custom installer built from `infra/talos/schematic.yaml`, pinned by digest,
    # per ADR-0104, and not by tag. A tag can change. The installer image is the one
    # artefact that decides what the node IS.
    image: factory.talos.dev/metal-installer/<schematic-id>@sha256:<digest>
    # An upgrade keeps the machine's data partition. Only a reprovision wipes it.
    wipe: false

  features:
    rbac: true
    # KubePrism, per ADR-0206: a per-node load balancer over every control-plane
    # endpoint, served on loopback. Cilium's agent points here, and not at one API
    # server. So when a control plane is lost, the CNI keeps working.
    kubePrism:
      enabled: true
      port: 7445

  # KubeSpan is OFF. This is the third of ADR-0200's Cilium invariants. KubeSpan builds a WireGuard mesh between nodes
  # at the OS layer, and Cilium already encrypts all east-west pod traffic with WireGuard, per ADR-0206.
  network:
    kubespan:
      enabled: false

  # The sysctls that the platform depends on.
  sysctls:
    net.ipv4.ip_forward: "1"
    net.bridge.bridge-nf-call-iptables: "1"
    fs.inotify.max_user_watches: "524288"
    fs.inotify.max_user_instances: "8192"

  kubelet:
    extraArgs:
      # Evict before the node hangs, not after. The default hard limit leaves no
      # room between a disk that fills and a kubelet that cannot write.
      eviction-hard: "memory.available<256Mi,nodefs.available<10%"
    # local-path-provisioner keeps its data under /var, the only writable path on
    # a Talos node. The kubelet must see the same tree that the pods bind-mount.
    extraMounts:
      - destination: /var/mnt/local-path
        type: bind
        source: /var/mnt/local-path
        options: [bind, rshared, rw]

  # Time is needed for correctness. etcd leases, certificate
  # validity, and every audit record depend on it for order.
  time:
    disabled: false
    servers: [time.cloudflare.com]
