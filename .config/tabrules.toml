"0207" = "Durable data and recovery"
"0301" = "Data lifecycle and privacy"
"0304" = "Identity and authorization"
"0305" = "Edge authentication and traffic policy"
"0306" = "Trust tiers and origins"
"0307" = "Outbound mail"
"0700" = "Analytics and consent"

[rules."kube/resource-governance".namespaces]
argocd = "argocd"
cilium = "kube-system"
traefik = "kube-system"

[rules."kube/resource-governance".chart-set]
lowdefy = "lowdefy.image.repository=r lowdefy.image.tag=v"
openfga = "image.repository=r image.tag=v"

# Each CPU limit that stays has its reason, per ADR-0204.
[rules."kube/resource-governance".cpu-limit-allow]
"kyverno/kyverno-migrate-resources/kyverno-cli" = "An upstream hook Job with an undeletable default, which runs once"
"cilium/cilium/install-cni-binaries" = "An upstream init container that runs once at pod start"
