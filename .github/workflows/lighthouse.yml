# Web vitals and bundle budgets (ADR-0400): merge gates, so this runs unconditionally rather than behind a label.
# The origin is the inner-loop floor plus the API mock (ADR-0600), serving the production bundle.
# `/devportal` is unmeasured: proxy.ts redirects it to login when unauthenticated, so the slot measured login twice.
name: lighthouse

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # A cold warm pulls every third-party image from upstream and is the dominant cost of this job. The key is the generated warm list, so it changes when the image set changes and at no other time.
      - name: Restore the registry mirror
        id: registry-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/zot
          key: zot-${{ runner.os }}-${{ hashFiles('infra/local/image-refs.txt') }}

      # The floor: real Traefik, cert-manager, Kratos and Oathkeeper, because `/auth/login` is a measured URL.
      # Authenticated Docker Hub pulls for zot's sync, unset on a fork where the secrets do not resolve.
      - name: Bring up cluster:up
        run: mise run cluster:up
        env:
          ZOT_DATA: ${{ runner.temp }}/zot
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      # Saved before the frontend is pushed: later steps push first-party images that change every commit.
      # On a miss and on `always()`: the warm is what fails when upstream throttles, and a partial store leaves the next run less to fetch.
      - name: Save the registry mirror
        if: always() && steps.registry-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/zot
          key: ${{ steps.registry-cache.outputs.cache-primary-key }}

      # The production container, not `next dev`. A bundle budget measured against a
      # development server measures unminified output and means nothing.
      - name: Deploy the frontend as its production image
        run: mise run cluster:add -- frontend

      # `/api` from the committed OpenAPI projection. The panel pages render server
      # components that fetch through the edge; without it they render an error
      # state and the measurement is of the wrong page.
      - name: Start the API mock
        run: mise run mock:start

      - name: Install the Node island
        run: mise run e2e:install

      # Advisory until B6a1 lands: the app misses the LCP budget by ~340ms on every page, which is a finding with an owner rather than something a PR author can fix. Delete this line when it passes.
      - name: Web vitals + bundle budgets
        continue-on-error: true
        run: mise run lighthouse

      - name: Upload the Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: test/e2e/.lighthouseci/
          retention-days: 7

      - name: Tear down
        if: always()
        run: mise run cluster:down
