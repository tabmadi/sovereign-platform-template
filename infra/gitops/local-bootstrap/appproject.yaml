# Local AppProject, per ADR-0201. The AppProject is Argo CD's real tenancy and grouping primitive. Every local
# Application is grouped by it with `spec.project: local`, so grouping does not parse the `local-` name prefix.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: local
  namespace: argocd
  labels:
    env: local
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: Local kind environment, with platform, services, gateway, and secrets.
  sourceRepos:
    - https://github.com/tabmadi/sovereign-platform-template.git
    - docker.io/temporalio
  destinations:
    - { server: https://kubernetes.default.svc, namespace: "*" }
  clusterResourceWhitelist:
    - { group: "*", kind: "*" }
  namespaceResourceWhitelist:
    - { group: "*", kind: "*" }
