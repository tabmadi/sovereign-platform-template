# Lowdefy's CLI aborts without pnpm and shells out to `next start`, so these host tasks run under Node — the second Node exception ADR-0100 sanctions.
# Optional: nothing depends on them, and both paths that matter build the image instead.
# The version resolves from the root [env] NODE_VERSION; do not repeat the number.
[tools]
node = "{{env.NODE_VERSION}}"

[env]
LOWDEFY_VERSION = "5.4.0"

[tasks.setup]
run = "corepack enable && pnpm config set dangerously-allow-all-builds true"

[tasks.build]
depends = ["setup"]
run = "npx lowdefy@{{env.LOWDEFY_VERSION}} build"

[tasks.run]
depends = ["setup"]
run = "npx lowdefy@{{env.LOWDEFY_VERSION}} dev"

[tasks.lint]
depends = ["setup"]
run = "npx lowdefy@{{env.LOWDEFY_VERSION}} validate"

[tasks.test]
run = "echo 'no tests yet'"
