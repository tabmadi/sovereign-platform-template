{{- if .Values.ingress.enabled }}
{{- if .Values.ingress.resources }}
# Flat-API routing (ADR-0306): the edge routes each /api/<resource> the service owns and strips the shared /api
# prefix, so the service mounts its resources at root (e.g.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "service.fullname" . }}-stripprefix
  labels: {{- include "service.labels" . | nindent 4 }}
spec:
  stripPrefix:
    prefixes:
      - /api
---
{{- end }}
# Traefik IngressRoute (ADR-0305, ADR-0306).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "service.fullname" . }}
  labels: {{- include "service.labels" . | nindent 4 }}
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: {{ include "service.ingressMatch" . }}
      middlewares:
        # Anti-spoofing (ADR-0305): strip any client-supplied identity headers BEFORE anything downstream, so a client
        # cannot inject X-User-* on an anonymous route.
        - name: strip-identity-headers
          namespace: platform
{{- if .Values.ingress.resources }}
        # Forward-auth belongs to the API surface only.
        - name: oathkeeper-forward-auth
          namespace: platform
{{- end }}
        - name: security-headers
          namespace: platform
{{- if .Values.ingress.resources }}
        - name: {{ include "service.fullname" . }}-stripprefix
{{- end }}
      services:
        - name: {{ include "service.fullname" . }}-server
          port: 80
  tls:
    secretName: wildcard-tls
{{- end }}
