{{- if .Values.alertmanager.enabled }}
## Reconcile Alertmanager's silences to the committed file (ADR-0502).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: alertmanager-silence-sync
  namespace: platform
  labels: { app.kubernetes.io/name: alertmanager-silence-sync }
spec:
  schedule: {{ .Values.alertmanager.silenceSync.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels: { app.kubernetes.io/name: alertmanager-silence-sync }
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: sync
              image: "{{ .Values.alertmanager.image.repository }}:{{ .Values.alertmanager.image.tag }}"
              imagePullPolicy: {{ .Values.alertmanager.image.pullPolicy }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  AM="http://alertmanager.platform.svc.cluster.local:{{ .Values.alertmanager.httpPort }}"
                  echo "→ reconciling silences against the committed file"
                  active="$(amtool --alertmanager.url="$AM" silence query -q || true)"
                  if [ -n "$active" ]; then
                    # shellcheck disable=SC2086
                    amtool --alertmanager.url="$AM" silence expire $active
                    echo "  expired $(echo "$active" | wc -l | tr -d ' ') existing silence(s)"
                  fi
                  if [ "$(tr -d ' \n' < /etc/silences/silences.json)" = "[]" ]; then
                    echo "✓ no committed silences — nothing is suppressed"
                  else
                    amtool --alertmanager.url="$AM" silence import /etc/silences/silences.json
                    echo "✓ imported the committed silences"
                  fi
              volumeMounts:
                - { name: silences, mountPath: /etc/silences, readOnly: true }
              resources:
                requests: { cpu: "10m", memory: "32Mi" }
                limits:   { memory: "64Mi" }
          volumes:
            - name: silences
              configMap: { name: alertmanager-silences }
{{- end }}
