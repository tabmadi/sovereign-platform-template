name: payment
image:
  repository: ghcr.io/tabmadi/sovereign-platform-template/payment-server
  tag: "0000000000000000000000000000000000000000"
  digest: ""   # promote-on-release pins prod by digest, per ADR-0103
worker:
  enabled: true
  image:
    repository: ghcr.io/tabmadi/sovereign-platform-template/payment-worker
    tag: "0000000000000000000000000000000000000000"
    digest: ""   # promote-on-release pins prod by digest, per ADR-0103
server:  { replicas: 1 }
ingress: { enabled: true, host: prod.example.com, resources: [charges] }
# The Lowdefy admin console in `apps/admin` calls payment from its server, east-west on
# the server port, not through the `/api` edge, per ADR-0401. `orders` covers the checkout
# saga: the orders worker's ChargeActivity dials payment east-west, per ADR-0302.
networkPolicy: { allowFrom: [lowdefy, orders] }
secrets: { envFrom: [payment-db, openfga-creds] }
env:
  # Write authz, per ADR-0304: the server gates the operator-only refund through the shared
  # Checker. A blank preshared key falls back to `openfga-creds.preshared_key` from `envFrom`,
  # as in catalog and the authz service.
  OPENFGA_API_URL: "http://openfga.platform.svc.cluster.local:8080"
  OPENFGA_PRESHARED_KEY: ""
