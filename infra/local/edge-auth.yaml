# Local-only edge wiring for the Kratos login flow (ADR-0305/0010/0014). Unlike prod, the frontend is NOT deployed
# in-cluster locally — it runs on the host via `next dev`.
---
# Selector-less Service for the host `next dev`. There is no host-alias record for
# the host, so scripts/cluster.sh attaches an EndpointSlice pointing at the docker
# bridge gateway (the host) on :3000 — the only host IP routable from pods.
apiVersion: v1
kind: Service
metadata:
  name: frontend-dev
  namespace: platform
spec:
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
# Catch-all → host `next dev`. This is the LAST RESORT: an explicit low priority, not Traefik's default
# rule-length ordering, is what guarantees it.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: frontend
  namespace: platform
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: PathPrefix(`/`)
      priority: 1
      services:
        - name: frontend-dev
          port: 3000
  tls:
    secretName: wildcard-tls
