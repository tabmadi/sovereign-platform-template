# Web vitals and bundle budgets (ADR-0400): Lighthouse CI on every PR, gating on
# LCP < 2.5s, INP < 200ms and CLS < 0.1 on the mobile profile. The ADR makes these
# merge gates, so this runs unconditionally rather than behind a label or a path
# filter — a change to a shared library moves the bundle as surely as a change to a
# page does.
#
# It used to live in the nightly e2e job for one reason: Lighthouse measures a
# RENDERED page, the frontend's server components fetch through the edge at render
# time, and the only origin that existed was `cluster:up full`. Two things changed.
# The API mock (ADR-0600) serves `/api` from the committed contract, and the
# frontend is deployable as its production container, so the origin is now the
# inner-loop floor plus two additions — a fraction of the full tier's cost, and the
# production bundle rather than a dev server's.
#
# WHICH ROUTES ARE MEASURED, and why `/devportal` is not among them. That slot was
# measuring the login page a second time: `proxy.ts` redirects `/devportal` to
# `/auth/login` when unauthenticated, and Lighthouse always is. So the budget had
# never seen the heaviest route in the app — the Scalar spec renderer, 4.3 MiB of
# JavaScript — while appearing to.
#
# The fix is a public route that renders rather than a session for Lighthouse. A
# session would mean provisioning and refreshing credentials inside the gate,
# making a performance budget depend on the identity stack; when that broke, the
# symptom would be a red performance gate. `/auth/registration` is the other half
# of the entry funnel and renders anonymously, so the three slots now measure three
# distinct pages.
#
# `/devportal` is therefore UNMEASURED, and that is a smaller gap than it looks: it
# is an internal documentation surface behind a session, not a page a user's first
# impression rests on. Measuring it needs a session, and that is the decision to
# revisit if it is ever served publicly.
name: lighthouse

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # The mirror's blob store, carried between runs. A cold warm pulls every
      # third-party image from upstream and is the dominant cost of this job —
      # measured at 5.6 of 11 minutes, and 19 minutes when Docker Hub throttled the
      # runner's shared IP. The key is the generated warm list, so it changes when
      # the image set changes and at no other time.
      - name: Restore the registry mirror
        id: registry-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/zot
          key: zot-${{ runner.os }}-${{ hashFiles('infra/local/image-refs.txt') }}

      # The floor: real Traefik, real cert-manager, real Kratos and Oathkeeper.
      # `/auth/login` is one of the measured URLs, so the identity stack has to be
      # the real one — there is no page to measure without it.
      # Authenticated Docker Hub pulls for zot's on-demand sync. Anonymous pulls are
      # limited per source IP and this runner shares one with the whole forge, so the
      # warm stage fails on images it never pulled itself. Unset on a fork, where the
      # secrets do not resolve and the sync falls back to anonymous.
      - name: Bring up cluster:up
        run: mise run cluster:up
        env:
          ZOT_DATA: ${{ runner.temp }}/zot
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      # Saved here, BEFORE the frontend is built and pushed, and not at the end of
      # the job. The mirror holds only third-party images at this point; every later
      # step pushes first-party images that change on every commit, and caching those
      # would miss the key on every run while growing the entry without bound.
      #
      # Saved only on a miss: a hit restored this exact key, so re-saving it is a few
      # gigabytes of upload to replace a byte-identical entry.
      #
      # `always()`, because the warm is what fails when the upstream throttles, and a
      # cache that only saves after a clean run cannot recover from that: throttled
      # warm → no save → next run cold → throttled again. A partial store is worth
      # keeping. The run that cached 44 of 51 images leaves the next one 7 to fetch,
      # and the set converges over a few runs instead of deadlocking.
      - name: Save the registry mirror
        if: always() && steps.registry-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/zot
          key: ${{ steps.registry-cache.outputs.cache-primary-key }}

      # The production container, not `next dev`. A bundle budget measured against a
      # development server measures unminified output and means nothing.
      - name: Deploy the frontend as its production image
        run: mise run cluster:add -- frontend

      # `/api` from the committed OpenAPI projection. The panel pages render server
      # components that fetch through the edge; without it they render an error
      # state and the measurement is of the wrong page.
      - name: Start the API mock
        run: mise run mock:start

      - name: Install the Node island
        run: mise run e2e:install

      # Advisory until B6a1 lands, and only until then. The job runs the real
      # assertions and reports them; it does not block a merge, because the app
      # currently misses the LCP budget by ~340 ms on every page — a finding with a
      # diagnosis and an owner, not something a PR author can fix on the way past.
      # Blocking on it today would teach everyone to ignore this job, which is worse
      # than the gap it is reporting. Delete this line when the budget passes.
      - name: Web vitals + bundle budgets
        continue-on-error: true
        run: mise run lighthouse

      - name: Upload the Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: test/e2e/.lighthouseci/
          retention-days: 7

      - name: Tear down
        if: always()
        run: mise run cluster:down
