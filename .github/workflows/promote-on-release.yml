# Prod promotion from a tag, per ADR-0201 and ADR-0103. The CalVer tag that `mise run release` cuts starts it.
# It pins every prod service to the release commit by digest and labels the images.
# It opens the pin as a PR that merges on green, and it gates on the rollout.
name: promote-on-release

on:
  push:
    tags: ["v[0-9][0-9][0-9][0-9].[0-9][0-9].*"]

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  promote:
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          # The same three settings as publish.yml. The registry is configuration.
          # A deployment with its own registry, per ADR-0105, sets them as forge variables and does not edit this file.
          registry: ${{ vars.IMAGE_REGISTRY || 'ghcr.io' }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Resolve release
        id: rel
        run: mise run ci:release-info >> "$GITHUB_OUTPUT"

      - name: Pin prod to digests and label images with the CalVer
        env:
          SHA: ${{ steps.rel.outputs.sha }}
          VER: ${{ steps.rel.outputs.version }}
        run: mise run promote:prod

      - name: Open the prod pin and merge it on green
        env:
          VER: ${{ steps.rel.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run ci:release-pr

      # Argo `Healthy` already means the new ReplicaSet is available.
      # A release still reports success only after prod converges on the release commit, per ADR-0201 and ADR-0103.
      - name: Verify prod rollout
        env:
          SHA: ${{ steps.rel.outputs.sha }}
        run: mise run promote:verify

      - name: Publish the release
        env:
          VER: ${{ steps.rel.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run ci:release-publish
