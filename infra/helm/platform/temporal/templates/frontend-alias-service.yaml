# The Temporal subchart names its frontend service `<release>-frontend`. But the service contract is
# TEMPORAL_HOST_PORT=temporal:7233, per ADR-0205. The inner-loop `deps.yaml` stand-in uses the same name.
apiVersion: v1
kind: Service
metadata:
  name: temporal
spec:
  type: ExternalName
  externalName: {{ .Release.Name }}-frontend.{{ .Release.Namespace }}.svc.cluster.local
