# The node-level OTel Collector, per ADR-0500, alone in its own namespace, per ADR-0200.

# The namespace for every resource that this chart renders.
namespace: otel-agent

# The namespace that holds the telemetry backends and the workloads that emit to this
# agent. The network policies below use it.
backendNamespace: platform

opentelemetry-collector:
  namespaceOverride: otel-agent
  # One tier: a DaemonSet on every node. Services send OTLP to the ClusterIP Service. The agent batches, adds k8s
  # attributes, head-samples, and exports directly to Loki, Prometheus, and Tempo.
  mode: daemonset
  fullnameOverride: otel-collector
  # One of the heaviest pods in the cluster. Every service's OTLP, the Faro browser beacons, the Hubble scrape,
  # and the kubeletstats receiver all land in this one
  # process.
  resources:
    requests: { cpu: "100m", memory: "384Mi" }
    limits:   { memory: "768Mi" }
  # The contrib distro. The kubernetesAttributes preset, with the k8sattributes processor, and the `faro` receiver
  # below need it. faroreceiver arrived in contrib 0.128.0.
  image: { repository: otel/opentelemetry-collector-contrib, tag: "0.154.0" }
  # logsCollection is the ADR-0500 filelog path. The agent tails `/var/log/pods` with the chart's filelog receiver,
  # using the container parser and excluding the collector's own logs. So PLATFORM workloads that write only to
  # stdout also land in Loki. Examples are postgres, temporal, grafana, and lowdefy.
  presets:
    kubernetesAttributes: { enabled: true }
    logsCollection: { enabled: true }
  # RBAC for the kubeletstats receiver in the metrics pipeline below. The kubelet's `/stats/summary` endpoint
  # authorizes against the `nodes/stats` subresource.
  clusterRole:
    # Named for the RELEASE, not for the workload. This is the one place where the split needs a rename.
    name: otel-agent
    clusterRoleBinding:
      name: otel-agent
    rules:
      - apiGroups: [""]
        resources: ["nodes/stats", "nodes/proxy"]
        verbs: ["get", "list", "watch"]
      # The kubelet's own `/metrics` endpoint authorizes against a THIRD subresource,
      # separate from the two above. Without it, the scrape below gets a 403, and
      # the collector reports a target down, and not a permission problem.
      - apiGroups: [""]
        resources: ["nodes/metrics"]
        verbs: ["get"]
      # PVC and PV reads for the k8s_api_config of the kubeletstats `volume` metric group.
      # It changes per-volume series keyed by the in-pod name, such as `data`, which every
      # StatefulSet shares, into series keyed by the actual claim.
      - apiGroups: [""]
        resources: ["persistentvolumeclaims", "persistentvolumes"]
        verbs: ["get", "list", "watch"]
  # Browser beacons reach the collector through a ClusterIP Service: Traefik to
  # `otel-collector.otel-agent:8027`. Services also emit to this Service, at 4317.
  # In daemonset mode, the chart omits the Service unless it is explicitly on.
  service: { enabled: true }
  # Expose the Faro receiver port on that Service, so Traefik can route to it.
  # See `infra/gateway/frontend-observability.yaml` and ADR-0400.
  ports:
    faro: { enabled: true, containerPort: 8027, servicePort: 8027, protocol: TCP }
    # The chart declares Jaeger and Zipkin receiver ports by default. This collector runs none of them: no `jaeger` or
    # `zipkin` receiver appears in the config below.
    jaeger-compact: { enabled: false }
    jaeger-thrift:  { enabled: false }
    jaeger-grpc:    { enabled: false }
    zipkin:         { enabled: false }
  config:
    receivers:
      otlp: { protocols: { grpc: { endpoint: 0.0.0.0:4317 }, http: { endpoint: 0.0.0.0:4318 } } }
      # Browser RUM from the frontend's Grafana Faro agent, per ADR-0400. It emits
      # web traces and RUM logs and events. They go into the traces and logs pipelines
      # below, so browser signals land in the same Tempo and Loki as services.
      faro: { endpoint: 0.0.0.0:8027 }
      # Hubble flow metrics from the cilium-agent, per ADR-0500. This is the ONE scrape in this repo.
      prometheus/hubble:
        config:
          scrape_configs:
            - job_name: hubble
              scrape_interval: 30s
              static_configs:
                - targets: ["${env:K8S_NODE_IP}:9965"]
      # Image-pull outcomes from the local kubelet's own `/metrics` endpoint.
      prometheus/kubelet:
        config:
          scrape_configs:
            - job_name: kubelet
              scrape_interval: 60s
              scheme: https
              tls_config:
                insecure_skip_verify: true
              authorization:
                type: Bearer
                credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              static_configs:
                - targets: ["${env:K8S_NODE_IP}:10250"]
              metric_relabel_configs:
                - source_labels: [__name__]
                  regex: "kubelet_image_pull_duration_seconds.*|kubelet_runtime_operations_errors_total"
                  action: keep
      # Per-pod, per-container, and per-node CPU and memory from the local kubelet's Summary API. This is the ADR-0501 POC
      # for the resource panels on the service-detail dashboard.
      kubeletstats:
        collection_interval: 20s
        auth_type: serviceAccount
        endpoint: "https://${env:K8S_NODE_IP}:10250"
        insecure_skip_verify: true
        # `volume` is the group that protects the data tier. Postgres, Loki, Tempo, Prometheus, and the object store all
        # write to PVCs. A full PVC does not evict a pod or fail a probe. Postgres just starts to refuse writes.
        metric_groups: [pod, container, node, volume]
        # Resolve volumes to their PersistentVolumeClaim and PV names.
        k8s_api_config:
          auth_type: serviceAccount
        # Usage-to-limit ratios, off by default. They come from the pod spec, which the receiver reads through the kubelet's
        # `/pods` endpoint, with `nodes/proxy` granted above.
        metrics:
          k8s.pod.memory_limit_utilization: { enabled: true }
          k8s.pod.cpu_limit_utilization: { enabled: true }
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
      # A batch small enough that the request that carries it fits the receiver's frame.
      batch:
        send_batch_size: 1000
        send_batch_max_size: 1000
      # Head sampling at the agent, per ADR-0500. The services' parentbased SDK sampler keeps 100% of error traces, through
      # OTEL_TRACES_SAMPLER_ARG. This limits the volume of healthy traces.
      probabilistic_sampler:
        sampling_percentage: 5
    connectors:
      # The marketing split, per ADR-0700. `marketing.*` events arrive on the Faro receiver like every other browser
      # signal. This moves them out of the logs pipeline before they reach Loki.
      routing:
        default_pipelines: [logs/ops]
        error_mode: ignore
        table:
          - context: log
            condition: 'IsMatch(attributes["faro.name"], "^marketing[.]")'
            pipelines: [logs/marketing]
    exporters:
      otlphttp/tempo:      { endpoint: http://tempo.platform.svc.cluster.local:4318 }
      # The analytics service, per ADR-0700. It is a first-party service, not a
      # platform component, so this is an ordinary in-cluster endpoint.
      otlphttp/analytics:  { endpoint: http://analytics-server.platform.svc.cluster.local/api/analytics/events }
      # The Prometheus native OTLP receiver, `--web.enable-otlp-receiver`. The otlphttp
      # exporter adds `/v1/metrics` to this base path.
      otlphttp/prometheus: { endpoint: http://prometheus.platform.svc.cluster.local:9090/api/v1/otlp }
      # Loki's native OTLP endpoint. The Collector removed the standalone `loki` exporter
      # by v0.112, so logs go over OTLP.
      otlphttp/loki:       { endpoint: http://loki.platform.svc.cluster.local:3100/otlp }
    service:
      pipelines:
        traces:  { receivers: [otlp, faro], processors: [memory_limiter, probabilistic_sampler, batch], exporters: [otlphttp/tempo] }
        metrics: { receivers: [otlp, prometheus/hubble, prometheus/kubelet, kubeletstats], processors: [memory_limiter, batch], exporters: [otlphttp/prometheus] }
        # Every log and browser signal enters here, and the routing connector below
        # splits it. Nothing else changes in the ops path.
        logs:            { receivers: [otlp, faro], processors: [memory_limiter, batch], exporters: [routing] }
        logs/ops:        { receivers: [routing], exporters: [otlphttp/loki] }
        logs/marketing:  { receivers: [routing], exporters: [otlphttp/analytics] }
