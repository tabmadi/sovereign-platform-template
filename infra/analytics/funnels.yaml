# Funnel definitions, per ADR-0700.
funnels:
  - id: checkout
    name: Browse to purchase
    # The platform's one first-party funnel. The panel opens on it.
    steps:
      - product_viewed
      - cart_item_added
      - checkout_started
      - order_placed

  - id: registration
    name: Visit to verified identity
    # The identity flow. ADR-0307 names it as the signal for mail that is accepted
    # and never delivered. The same drop shows here as a step that stops
    # converting. This is the panel's view of the alert.
    steps:
      - signup_started
      - signup_submitted
      - identity_verified
