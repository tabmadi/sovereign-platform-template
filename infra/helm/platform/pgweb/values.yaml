# Values are under `pgweb:`, so this chart shares the single per-environment values overlay of the platform
# ApplicationSet with no key collisions.
pgweb:
  # Core, per ADR-0401: deployed in every environment. The gate stays here, so a
  # project can drop pgweb with `enabled: false` in an environment overlay, like
  # any Core component removed under its ADR.
  enabled: true

  image:
    repository: sosedoff/pgweb
    tag: "0.17.0"
    pullPolicy: IfNotPresent

  replicas: 1
  service:
    port: 80

  # The Postgres DSN that pgweb connects to. Empty by default. Each environment's overlay supplies it, and it MUST
  # name the `readonly` role, and not a schema owner, per ADR-0401.
  databaseUrl: ""

  # The deployed shape: the parts of the DSN that are not secret, and the Secret
  # that the password comes from. Used when `databaseUrl` above is empty.
  database:
    host: postgres-rw.platform.svc.cluster.local
    port: 5432
    # The database that the inspector opens on. Any of them shows the same cluster.
    # This is the one it starts in.
    name: orders
    user: readonly
    sslMode: disable
    passwordSecret: postgres-readonly
    passwordKey: password
