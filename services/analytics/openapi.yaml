openapi: 3.1.0
info: { title: analytics, version: 0.1.0, description: Marketing event store and consent record., x-audience: cluster }
servers: [{ url: /api }]   # flat resource namespace, per ADR-0306. Paths are globally unique
# `x-audience: cluster` means east-west only, with no /api edge route, per ADR-0303. A public write path to the
# event store would let anyone fill the table without authentication.
# No `x-admin` marker, because ADR-0700 puts the panel on the product origin, not in the operator console.
tags: [{ name: analytics }, { name: consent }]
paths:
  /analytics/events:
    post:
      operationId: recordEvents
      # The collector's routing connector writes this, never a browser, per ADR-0700. This keeps marketing events out of Loki.
      description: Record a batch of marketing events.
      tags: [analytics]
      requestBody:
        required: true
        description: The events to record.
        content: { application/json: { schema: { $ref: "#/components/schemas/EventBatch" } } }
      responses:
        "202":
          description: |
            Accepted. The count that was STORED, which can differ from the count that
            was sent. An event whose session has no recorded consent is dropped here.
            This is the second enforcement point of ADR-0700, because the first runs on
            a client that this platform does not control.
          content: { application/json: { schema: { $ref: "#/components/schemas/RecordResult" } } }
        default: { $ref: "#/components/responses/Error" }
  /analytics/summary:
    get:
      operationId: summariseEvents
      description: Event counts over a window. Every funnel question starts from this aggregate.
      tags: [analytics]
      parameters:
        - name: since
          in: query
          required: true
          description: The start of the window.
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: One row per event name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EventSummary" }
                # The API mock serves this exactly as written, per ADR-0600.
                example:
                  - { name: signup.started, occurrences: 128, sessions: 96 }
                  - { name: signup.completed, occurrences: 71, sessions: 68 }
        default: { $ref: "#/components/responses/Error" }
  /analytics/funnels/{funnel}/rollup:
    post:
      operationId: computeFunnelRollup
      # A Temporal Schedule calls this, per ADR-0302. It belongs here, because the events are this service's store and no other service reads it directly.
      description: |
        Recompute a funnel's rollup over a window, one bucket per day.

        Idempotent by design: a bucket is replaced and not added to. So a new run
        over a window that is still filling is normal and safe. The most recent
        bucket is always incomplete.
      tags: [analytics]
      parameters:
        - name: funnel
          in: path
          required: true
          description: The funnel's id, from infra/analytics/funnels.yaml.
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        description: The window to recompute.
        content: { application/json: { schema: { $ref: "#/components/schemas/RollupWindow" } } }
      responses:
        "200":
          description: The buckets that were written.
          content: { application/json: { schema: { $ref: "#/components/schemas/RollupResult" } } }
        default: { $ref: "#/components/responses/Error" }
    get:
      operationId: getFunnelRollup
      description: Read a funnel's computed rollup, in bucket and then step order.
      tags: [analytics]
      parameters:
        - { name: funnel, in: path, required: true, description: The funnel's id., schema: { type: string, minLength: 1 } }
        - { name: from, in: query, required: true, description: The first bucket to return., schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, description: Exclusive end of the range., schema: { type: string, format: date-time } }
      responses:
        "200":
          description: One row per bucket and step.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FunnelRollupRow" }
                example:
                  - { funnel: checkout, step_index: 0, step_name: product_viewed, bucket_start: "2026-08-19T00:00:00Z", bucket_end: "2026-08-20T00:00:00Z", sessions: 412 }
                  - { funnel: checkout, step_index: 1, step_name: cart_item_added, bucket_start: "2026-08-19T00:00:00Z", bucket_end: "2026-08-20T00:00:00Z", sessions: 178 }
        default: { $ref: "#/components/responses/Error" }
  /analytics/consent:
    put:
      operationId: recordConsent
      description: Record or withdraw consent for a session.
      tags: [consent]
      requestBody:
        required: true
        description: The consent decision.
        content: { application/json: { schema: { $ref: "#/components/schemas/ConsentInput" } } }
      responses:
        "200":
          description: The decision as recorded.
          content: { application/json: { schema: { $ref: "#/components/schemas/Consent" } } }
        default: { $ref: "#/components/responses/Error" }
    get:
      operationId: getConsent
      description: Read the recorded decision for a session.
      tags: [consent]
      parameters:
        - { name: session_id, in: query, required: true, description: The session to read., schema: { type: string, minLength: 1 } }
      responses:
        "200":
          description: The decision on file for that session.
          content: { application/json: { schema: { $ref: "#/components/schemas/Consent" } } }
        default: { $ref: "#/components/responses/Error" }
components:
  responses:
    # >>> shared-components: responses. Generated from tools/codegen/shared-components.yaml. Do not edit
    Error:
      description: An error, as RFC 9457 problem details.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    # <<< shared-components
  schemas:
    # >>> shared-components: schemas. Generated from tools/codegen/shared-components.yaml. Do not edit
    # RFC 9457 problem details. `instance` is absent on purpose: `trace_id` identifies the occurrence and leads to the trace.
    # An instance URL leads nowhere.
    Problem:
      type: object
      description: |
        RFC 9457 problem details. Services and the edge both serve it as
        `application/problem+json`, so a generated client has one error branch, not two.
      required: [type, title, status]
      properties:
        type:
          type: string
          description: |
            `about:blank`, except where two errors share a status code and a client
            handles them differently. That case uses a `urn:problem-type:<service>:<slug>`
            URN. It is never a dereferenceable URL, which would put an error taxonomy into
            the flat public URL namespace.
          default: "about:blank"
          example: "about:blank"
        title:
          type: string
          description: A stable, human-readable summary. It does not change with the instance.
          example: Not Found
        status:
          type: integer
          description: The HTTP status, repeated in the body.
          minimum: 100
          maximum: 599
          example: 404
        detail:
          type: string
          description: |
            Specific to the instance and safe to show a user. Never a stack trace, a query,
            or an internal hostname.
          example: No product with that identifier.
        trace_id:
          type: string
          description: |
            The W3C Trace Context trace-id of the failing request, so an error that a user
            reports leads to its trace. The active span supplies it, not the handler.
          pattern: "^[0-9a-f]{32}$"
          example: 4bf92f3577b34da6a3ce929d0e0e4736
        errors:
          type: array
          description: |
            Field-level validation failures, filled from the generated validator.
            Absent when the failure is not a validation failure.
          items:
            type: object
            required: [pointer, message]
            properties:
              pointer:
                type: string
                description: RFC 6901 JSON Pointer to the member that failed.
                example: /price/amount
              message:
                type: string
                example: must be a decimal amount
      example:
        type: "about:blank"
        title: Not Found
        status: 404
        detail: No product with that identifier.
        trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
    # <<< shared-components
    EventBatch:
      type: object
      description: A batch of marketing events from one session.
      required: [session_id, events]
      properties:
        session_id: { type: string, minLength: 1 }
        identity_id: { type: string }
        device_class: { type: string, enum: [mobile, tablet, desktop, unknown] }
        events:
          type: array
          items: { $ref: "#/components/schemas/Event" }
    Event:
      type: object
      description: One marketing event. The name has no `marketing.` prefix. The collector uses the prefix to route the event, and it is not part of the name.
      required: [name, occurred_at]
      properties:
        name: { type: string, minLength: 1 }
        occurred_at: { type: string, format: date-time }
        properties: { type: object, additionalProperties: true }
    RecordResult:
      type: object
      description: How many events of the batch were stored.
      required: [stored, dropped]
      properties:
        stored: { type: integer }
        dropped:
          type: integer
          description: Events dropped because no grant is recorded. A non-zero value shows a client that emits without consent.
      example: { stored: 3, dropped: 0 }
    EventSummary:
      type: object
      description: One event name's volume over the window.
      required: [name, occurrences, sessions]
      properties:
        name: { type: string }
        occurrences: { type: integer }
        sessions:
          type: integer
          description: Distinct sessions. This number counts people, not times.
      example: { name: signup.started, occurrences: 128, sessions: 96 }
    RollupWindow:
      type: object
      description: |
        The window to recompute, half-open. Buckets are one day, the only bucket
        size that the panel uses. An hourly funnel is noise at this platform's
        volume, and a weekly one hides the day when a release broke a step.
      required: [from, to]
      properties:
        from: { type: string, format: date-time, description: Inclusive start. }
        to: { type: string, format: date-time, description: Exclusive end. }
      example: { from: "2026-08-13T00:00:00Z", to: "2026-08-20T00:00:00Z" }
    RollupResult:
      type: object
      description: What the pass wrote.
      required: [funnel, buckets, rows]
      properties:
        funnel: { type: string }
        buckets: { type: integer, description: Day buckets covered by the window. }
        rows: { type: integer, description: Rows written, which is buckets times steps. }
      example: { funnel: checkout, buckets: 7, rows: 28 }
    FunnelRollupRow:
      type: object
      description: One funnel step's session count in one bucket.
      required: [funnel, step_index, step_name, bucket_start, bucket_end, sessions]
      properties:
        funnel: { type: string }
        step_index: { type: integer, description: Zero-based position in the funnel. }
        step_name: { type: string }
        bucket_start: { type: string, format: date-time }
        bucket_end: { type: string, format: date-time }
        sessions:
          type: integer
          description: |
            Sessions that reached this step IN ORDER, after every earlier step. A
            session that arrives at a later step directly is not counted, because it
            did not traverse the funnel.
      example: { funnel: checkout, step_index: 0, step_name: product_viewed, bucket_start: "2026-08-19T00:00:00Z", bucket_end: "2026-08-20T00:00:00Z", sessions: 412 }
    ConsentInput:
      type: object
      description: A consent decision, recorded so that it can be proved later, per GDPR Art. 7(1).
      required: [session_id, state, purpose_version, source]
      properties:
        session_id: { type: string, minLength: 1 }
        identity_id: { type: string }
        state: { type: string, enum: [granted, withdrawn, refused] }
        purpose_version:
          type: string
          minLength: 1
          description: The version of the purpose text shown. Consent is to a stated purpose, so a changed purpose is a new consent and not a continuing one.
        source:
          type: string
          enum: [control, gpc]
          description: "`gpc` is a Global Privacy Control signal: a refusal with no prompt."
    Consent:
      type: object
      description: A recorded consent decision.
      required: [session_id, state, purpose_version, source, decided_at]
      properties:
        session_id: { type: string }
        identity_id: { type: string }
        state: { type: string, enum: [granted, withdrawn, refused] }
        purpose_version: { type: string }
        source: { type: string, enum: [control, gpc] }
        decided_at: { type: string, format: date-time }
      # A `gpc` refusal is the accurate example. The visitor never saw a prompt, and
      # that is the purpose of honouring the signal, per ADR-0700.
      example:
        { session_id: 4f3b9c22, state: refused, purpose_version: "2026-08-01", source: gpc, decided_at: "2026-08-19T10:00:00Z" }
