name: lint

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      # No affected-scoping: every linter behind `ci:lint` is a whole-repo analyser over one Go module, so there is no per-service subset to hand it. `ci:affected` scopes what is built and promoted.
      - name: Run linters
        # BASE_REF is what `lint:commits` measures the commit range against. On a
        # push it is empty and the task falls back to master.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: mise run ci:lint

  # A service affected-detection fails to name is a service nothing ran against, on a pull request that goes
  # green (ADR-0101). Its unit tests check the classifier against the paths it was written from; this perturbs
  # each service in a scratch worktree. Its own job, because a red here means CI's selection is wrong.
  affected-detection:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: the probe commits onto a scratch worktree and diffs against it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Adversarially test affected-detection
        run: mise run ci:affected-adversarial

  # A separate job because it fails for a different reason: the linters answer whether the change is well-formed,
  # and this answers whether a dependency has a published fix today, which can turn a green PR red with no code change.
  # A registry-side scanner would run after the push, which is after the merge this gates (ADR-0104).
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Scan dependencies
        run: mise run ci:scan
