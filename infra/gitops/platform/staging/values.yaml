# Top-level `cluster:` — the postgres chart's own values schema has no `postgres:` namespace wrapper (unlike the
# dependency subcharts below).
cluster:
  instances: 3
  storage: { size: 100Gi }
  backup:
    retentionPolicy: "7d"
    s3: { endpointURL: "http://seaweedfs.platform.svc.cluster.local:8333", destinationPath: "s3://platform-backups/postgres" }

# Non-prod object storage is in-cluster SeaweedFS (ADR-0205); prod keeps the
# chart defaults (the off-cluster bucket) and disables this chart entirely.
loki:
  loki:
    storage:
      s3:
        endpoint: seaweedfs.platform.svc.cluster.local:8333
        s3ForcePathStyle: true
        insecure: true
tempo:
  tempo:
    storage:
      trace:
        s3:
          endpoint: seaweedfs.platform.svc.cluster.local:8333
          insecure: true

# Lowdefy admin console (ADR-0401): the one repo-built platform image, promoted by
# publish.yml like the services and the frontend.
lowdefy:
  # The registry this environment pulls from authenticates every pull (ADR-0105).
  imagePullSecrets:
    - name: registry-pull
  image:
    repository: ghcr.io/tabmadi/sovereign-platform-template/admin
    tag: "0000000000000000000000000000000000000000"
    digest: ""

# Talos ships no storage provisioner and nothing else claims the default
# StorageClass here (ADR-0200), so this is what an unannotated PVC resolves to.
# The laptop tier leaves it off — kind brings its own.
localPath:
  enabled: true

# The wildcard host this environment serves, and the ACME account that certifies it (ADR-0205).
envHost: staging.example.com
publicTls:
  enabled: true
  envHost: staging.example.com
  acme:
    email: ops@example.com

# Identity, at this environment's host.
kratos:
  kratos:
    config:
      serve:
        public:
          base_url: "https://staging.example.com/auth/"
      selfservice:
        default_browser_return_url: https://staging.example.com/
        # The apex, and every ops origin. The ops entry is what makes a denied
        # panel request return to that panel after login: Oathkeeper puts the
        # origin in `return_to`, and Kratos follows it only if it is listed here.
        allowed_return_urls:
          - https://staging.example.com/
          - https://*.ops.staging.example.com/
        flows:
          error:        { ui_url: https://staging.example.com/auth/error }
          login:        { ui_url: https://staging.example.com/auth/login }
          registration: { ui_url: https://staging.example.com/auth/register }
          recovery:     { ui_url: https://staging.example.com/auth/recovery }
          verification: { ui_url: https://staging.example.com/auth/verification }
          settings:     { ui_url: https://staging.example.com/auth/settings }
        methods:
          totp:
            config:
              issuer: staging.example.com
          webauthn:
            config:
              rp:
                id: staging.example.com
                display_name: Platform
                origins: ["https://staging.example.com"]
      # The ops tools are served at their own origins under `ops.<host>`
      # (ADR-0306), so the session cookie has to cover the whole host rather than
      # the apex alone.
      session:
        cookie:
          domain: staging.example.com

# Where Oathkeeper sends an unauthenticated browser request (ADR-0305).
oathkeeper:
  oathkeeper:
    config:
      errors:
        handlers:
          redirect:
            config:
              to: https://staging.example.com/auth/login

# Admission control (ADR-0104): a first-party image comes from this prefix, pinned by digest and signed with the platform key.
policies:
  imagePrefix: "ghcr.io/tabmadi/sovereign-platform-template/*"
  registrySecret: registry-pull
