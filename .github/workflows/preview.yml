# The pull-request preview environment (ADR-0205). Label-gated, because a preview is a full-platform bring-up,
# and the label is applied by a maintainer, which keeps a fork's code off the runner until someone has read it.
# It is the full local tier at this PR's images, destroyed with the run: nothing is promoted or released from it.
name: preview

on:
  pull_request:
    types: [labeled, synchronize, reopened]

# One preview per pull request. A new push replaces the environment rather than
# racing a second bring-up against it on the same runner.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    if: contains(github.event.pull_request.labels.*.name, 'preview')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PREVIEW_PR: ${{ github.event.pull_request.number }}
      PREVIEW_REVISION: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Provision the local SOPS age key
        run: mise run secrets:age
      - name: Bring up the preview
        run: mise run ci:preview -- up
      - name: Install Playwright (Node island)
        run: mise run e2e:install
      - name: Smoke the preview
        run: mise run e2e:smoke
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-preview
          path: |
            test/e2e/playwright-report/
            test/e2e/test-results/
          retention-days: 7
      - name: Destroy the preview
        if: always()
        run: mise run ci:preview -- down
