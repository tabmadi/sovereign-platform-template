# End-to-end and visual acceptance, per ADR-0601. Every full-platform e2e needs a `cluster:up full`, so these jobs are not part of ci:affected.
# The nightly run has an activity gate. cluster:up full uses about 16GB, all of a standard runner. A larger runner adds margin only.
name: e2e

on:
  schedule:
    - cron: "0 3 * * *" # nightly full suite
  push:
    tags: ["v*", "services/*/v*"] # pre-release, per ADR-0103
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:
    inputs:
      suite:
        description: "full or smoke"
        default: "full"

concurrency:
  group: e2e-${{ github.ref }}
  # A cancelled job skips its teardown and leaves its cluster on a self-hosted runner. So a newer run waits in the queue.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Decides whether tonight's run needs a cluster. Only the cron run checks. A tag or a dispatch always runs.
  gate:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_nightly-gate.yml
    with:
      workflow_file: e2e.yml

  full:
    # Nightly, pre-release tags, and manual full runs. Never on a PR.
    needs: gate
    if: >-
      needs.gate.outputs.run == 'true' && (
      (github.event_name == 'schedule' && !github.event.repository.is_template) ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.suite == 'full'))
    runs-on: ubuntu-latest
    # Up to an hour of this can be a wait for another job's cluster on a shared runner, per ADR-0102.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Provision the local SOPS age key
        run: mise run secrets:age
      # Authenticated Docker Hub pulls for zot's sync. Anonymous pulls have a limit for each source IP, and the whole forge shares this IP.
      # Unset on a fork, where the secrets do not resolve. Restore only: the lighthouse job is the one writer.
      # A full-tier start would also cache first-party images.
      - name: Restore the registry mirror
        # A self-hosted runner keeps the store in its home between jobs. Only a fresh hosted machine needs the cache.
        if: runner.environment == 'github-hosted'
        uses: actions/cache/restore@v4
        with:
          # A literal path: this string versions the cache, and runner.temp differs for each job on a self-hosted runner.
          path: ~/.cache/zot/registry.localhost
          key: zot-all-${{ runner.os }}-${{ hashFiles('infra/local/image-refs.txt') }}

      - name: Bring up cluster:up full
        run: mise run cluster:up -- full
        env:
          # The job's token clones a private repository for the full tier's Argo CD.
          ARGOCD_REPO_USERNAME: ${{ github.actor }}
          ARGOCD_REPO_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Install Playwright in the Node island
        run: mise run e2e:install
      - name: Run the full e2e and visual suite
        run: mise run e2e
      - name: Upload Playwright report
        if: always()
        # A report is a diagnostic. Forgejo's artifact service refuses v4, and that must not fail a passing run.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-full
          path: |
            test/e2e/playwright-report/
            test/e2e/test-results/
          retention-days: 7
      - name: Tear down
        if: always()
        run: mise run cluster:down -- full

  # Only an e2e test sees a change across more than one service, per ADR-0601.
  # This is a task, not an expression, because it reads the affected manifest, per ADR-0102.
  pr-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      # Full history: the affected manifest is a diff against the merge base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - id: check
        env:
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'e2e-smoke') }}
          BASE_REF: ${{ github.base_ref }}
        run: mise run ci:e2e-gate >> "$GITHUB_OUTPUT"

  smoke:
    # A golden path and a key dashboard render, on the PRs that need them.
    needs: pr-gate
    if: needs.pr-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Up to an hour of this can be a wait for another job's cluster on a shared runner, per ADR-0102.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Provision the local SOPS age key
        run: mise run secrets:age
      - name: Restore the registry mirror
        # A self-hosted runner keeps the store in its home between jobs. Only a fresh hosted machine needs the cache.
        if: runner.environment == 'github-hosted'
        uses: actions/cache/restore@v4
        with:
          # A literal path: this string versions the cache, and runner.temp differs for each job on a self-hosted runner.
          path: ~/.cache/zot/registry.localhost
          key: zot-all-${{ runner.os }}-${{ hashFiles('infra/local/image-refs.txt') }}

      - name: Bring up cluster:up full
        run: mise run cluster:up -- full
        env:
          # The job's token clones a private repository for the full tier's Argo CD.
          ARGOCD_REPO_USERNAME: ${{ github.actor }}
          ARGOCD_REPO_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Install Playwright in the Node island
        run: mise run e2e:install
      - name: Run smoke suite
        run: mise run e2e:smoke
      - name: Upload Playwright report
        if: always()
        # A report is a diagnostic. Forgejo's artifact service refuses v4, and that must not fail a passing run.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: |
            test/e2e/playwright-report/
            test/e2e/test-results/
          retention-days: 7
      - name: Tear down
        if: always()
        run: mise run cluster:down -- full
