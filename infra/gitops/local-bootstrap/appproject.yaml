# Local AppProject (ADR-0201). ArgoCD's real tenancy/grouping primitive — the thing every local Application is
# grouped *by* (spec.project: local), so grouping no longer relies on parsing the `local-` name prefix.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: local
  namespace: argocd
  labels:
    env: local
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: Local (kind) environment — platform, services, gateway, secrets.
  sourceRepos:
    - https://github.com/tabmadi/sovereign-platform-template.git
      # Argo resolves a chart's `dependencies:` under the project's own permissions, so a repo a chart pulls from is a
      # source of this project even though no Application names it.
    - docker.io/temporalio
  destinations:
    - { server: https://kubernetes.default.svc, namespace: "*" }
  clusterResourceWhitelist:
    - { group: "*", kind: "*" }
  namespaceResourceWhitelist:
    - { group: "*", kind: "*" }
