{{- /*
SeaweedFS, the platform's object store, per ADR-0207. It has its own file, and is
not a block inside 40-observability.yaml. Logs and traces are two of its
consumers, not the reason it exists. Postgres backups are the consumer whose
silent failure cannot be recovered.

Selecting an endpoint puts it in default-deny for that direction. So this list is
the complete set of callers. A new consumer that is not added here fails. The
store is reachable from every place that was tested, and from no other place.
*/}}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: seaweedfs
spec:
  endpointSelector:
    matchLabels:
      app: seaweedfs
  ingress:
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: platform, app.kubernetes.io/name: loki }
        - matchLabels: { k8s:io.kubernetes.pod.namespace: platform, app.kubernetes.io/name: tempo }
        # CNPG archives WAL and runs base backups from the instance pods themselves,
        # with barman-cloud inside the instance manager. So the allow belongs on the
        # database endpoints, and not on a backup Job that does not exist.
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: platform
            app.kubernetes.io/name: postgresql
            app.kubernetes.io/component: database
        # zot keeps every image, and every signature and SBOM attached to one, in this store, per ADR-0105. It reads the
        # bucket before it can serve any pull.
        - matchLabels: { k8s:io.kubernetes.pod.namespace: platform, app: zot }
      toPorts:
        - ports: [{ port: "8333", protocol: TCP }]
    # The admin UI, reached only through the edge, per ADR-0306. Traefik terminates
    # the `seaweedfs.ops.<host>` origin, and Oathkeeper decides. The UI does not
    # authenticate on its own, so this rule makes the edge the only way in.
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system }
      toPorts:
        - ports: [{ port: "23646", protocol: TCP }]
---
{{- /*
zot, the image registry, per ADR-0105. It is in this file, because its whole
storage layer is the object store above. Everything it serves is a read from that
bucket, and the baseline's intra-namespace allow already covers that.

Ingress is the important half. The KUBELET makes a pull, not a pod. So the pull
comes from the node, and not from an endpoint that the selector can name.
`host` and `remote-node` admit it. Without them, the cluster denies every image
pull, while every in-cluster probe of the registry succeeds.
*/}}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: zot
spec:
  endpointSelector:
    matchLabels:
      app: zot
  ingress:
    - fromEntities: [host, remote-node]
      toPorts:
        - ports: [{ port: "5000", protocol: TCP }]
    # The gateway: 5000 for the push route that an environment exposes to its pipeline, and 5001 for the console
    # origin. The console's login-free proxy runs in the zot pod on that port, per zot chart `consoleAuth` and ADR-0306.
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system }
      toPorts:
        - ports: [{ port: "5000", protocol: TCP }, { port: "5001", protocol: TCP }]
  {{- if .Values.registryMirror }}
  # Egress to the upstream registries. This is the MIRROR itself, per ADR-0105. A pull-through cache that cannot reach
  # upstream can serve only what was pushed to it directly.
  egress:
    - toEntities: [world]
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]
  {{- end }}
