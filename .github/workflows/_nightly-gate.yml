# The shared activity gate for the nightly full-tier suites. A new run on a commit that already passed adds nothing.
# A red is flake or upstream drift, and a green is a result the forge already has.
# A reusable `workflow_call`, not a composite action: it is a whole job with an output that two workflows gate on.
name: nightly-gate

on:
  workflow_call:
    inputs:
      workflow_file:
        description: "The caller's own workflow file, whose run history decides the skip."
        required: true
        type: string
    outputs:
      run:
        description: "`true` when the nightly suite runs."
        value: ${{ jobs.gate.outputs.run }}

permissions:
  contents: read
  # It reads the caller's run history: a skip is safe only when the last run passed, and the forge holds that fact.
  # A caller grants this on the calling job. Otherwise the forge rejects the workflow before it starts.
  actions: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      # Full history: --since needs commits, and a shallow clone has only one.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - id: check
        env:
          EVENT: ${{ github.event_name }}
          WORKFLOW_FILE: ${{ inputs.workflow_file }}
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run ci:nightly-gate >> "$GITHUB_OUTPUT"
