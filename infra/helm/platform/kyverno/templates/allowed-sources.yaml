{{- if .Values.policies.allowedImageSources }}
# The only places an image can come from, per ADR-0104. The other two policies check OUR images.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: allowed-image-sources
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    policies.kyverno.io/title: Images come from known registries
    policies.kyverno.io/category: Supply chain
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Every image must come from a repository this platform has declared it pulls
      from (ADR-0104). The list is generated from the platform's own charts, so a
      new entry is a registry that has never been used here before.
spec:
  validationFailureAction: {{ .Values.policies.validationFailureAction }}
  background: true
  rules:
    - name: known-registry
      match:
        any:
          - resources:
              kinds: [Pod]
      # The Talos release pins the control plane's own images, per ADR-0200, not this list. Kyverno's resource filters
      # already keep kube-system out of admission. This keeps its background scan consistent.
      exclude:
        any:
          - resources:
              namespaces: [kube-system]
      validate:
        message: >-
          This image comes from a repository that is not in the allow-list,
          per ADR-0104. If the repository is valid, add it. To do this, run
          `mise run gen:image-allowlist`.
        foreach:
          - list: "request.object.spec.[containers || `[]`, initContainers || `[]`, ephemeralContainers || `[]`][]"
            deny:
              conditions:
                all:
                  - key: "{{ `{{ element.image }}` }}"
                    # AllNotIn, not NotEquals. The value is a LIST, and NotEquals compares with the whole list. Every image is not equal
                    # to the list. So the rule would reject everything, also what it allows.
                    operator: AllNotIn
                    # Wildcards, not a regex. The entries are repositories. What follows
                    # one is a tag or a digest. Both start with a character that no
                    # repository contains.
                    value:
                      {{- with .Values.policies.imagePrefix }}
                      # First-party images are built after the list is generated, so the prefix admits them. The other two policies still require a digest and a signature.
                      - {{ . | quote }}
                      {{- end }}
                      {{- range .Values.policies.allowedImageSources }}
                      - {{ printf "%s:*" . | quote }}
                      - {{ printf "%s@*" . | quote }}
                      {{- end }}
{{- end }}
