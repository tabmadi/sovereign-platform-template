# The namespace is a resource of the Application, so Argo CD deletes it with the Application, per ADR-0701.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "design-preview.namespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/part-of: design-previews
    # The labels of the namespaces chart, per ADR-0200.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.35
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.35
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.35
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: design-preview
  namespace: {{ include "design-preview.namespace" . }}
spec:
  hard:
    pods: {{ .Values.quota.pods | quote }}
    requests.cpu: {{ .Values.quota.cpu | quote }}
    requests.memory: {{ .Values.quota.memory | quote }}
    limits.memory: {{ .Values.quota.memory | quote }}
