# Local Services ApplicationSet (ADR-0201, ADR-0205). Identical to bootstrap/appset-services.yaml except the list
# generator carries a single { env: local } element and the git-files generator reads the local service values
# (infra/gitops/services/local/values/*.yaml).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: local-services
  namespace: argocd
  labels:
    env: local
    app.kubernetes.io/part-of: services
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/syncPolicy
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - { env: local, server: "https://kubernetes.default.svc" }
          - git:
              repoURL: https://github.com/tabmadi/sovereign-platform-template.git
              revision: master
              files:
                - { path: "infra/gitops/services/{{ .env }}/values/*.yaml" }
  template:
    metadata:
      # The file extension is trimmed off deliberately: the app name is the handle every local script forms from the
      # service name (`local-service-orders`), and `filenameNormalized` alone leaves `orders.yaml` there — a name no
      # caller guesses, so the pause-auto-sync step in service-deploy.sh silently missed and Argo reverted every
      name: "{{ .env }}-service-{{ trimSuffix \".yaml\" .path.filename }}"
      labels:
        env: "{{ .env }}"
        app.kubernetes.io/part-of: services
        app.kubernetes.io/component: "{{ trimSuffix \".yaml\" .path.filename }}"
    spec:
      project: "{{ .env }}"
      source:
        repoURL: https://github.com/tabmadi/sovereign-platform-template.git
        targetRevision: master
        path: infra/helm/service
        helm:
          valueFiles:
            - "../../gitops/services/{{ .env }}/values/{{ .path.filename }}"
      destination: { server: "{{ .server }}", namespace: platform }
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
        retry:
          limit: 20
          backoff: { duration: 10s, maxDuration: 2m, factor: 2 }
