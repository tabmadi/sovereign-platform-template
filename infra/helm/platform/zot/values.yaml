# Values are under `zot:`, so this chart shares the single per-environment values overlay of the platform
# ApplicationSet with no key collisions.
zot:
  # zot, the image registry, per ADR-0105. `enabled` is the umbrella gate.
  enabled: true

  image:
    repository: ghcr.io/project-zot/zot-linux-amd64
    tag: "v2.1.20"
    pullPolicy: IfNotPresent

  # The S3 bucket where zot stores images and their referrers, on the platform's own
  # object store. Image data is never on a node volume, per ADR-0105.
  storage:
    bucket: zot-images
    endpoint: seaweedfs.platform.svc.cluster.local:8333
    region: us-east-1
    # http, not https: the store is in the cluster, and the hop does not leave it. The
    # off-cluster production store is reached over TLS. So this is a value and not a
    # constant.
    secure: false
    # Untagged manifests that no signature and no environment's values reference are collected on a schedule, per
    # ADR-0105.
    gc: true
    gcDelay: 1h
    gcInterval: 24h

  # PULL-THROUGH MIRRORING of the upstream registries, per ADR-0105.
  sync:
    enabled: true
    # Under `/var/lib/zot`, the emptyDir that the deployment already mounts. It is
    # a staging directory for syncs in progress, not a second cache to size.
    downloadDir: /var/lib/zot/sync
    # Kept in the local disk cache and also in the bucket. So a second node that
    # pulls the same image does not fetch it again from upstream.
    registries:
      - urls: ["https://registry-1.docker.io"]
        onDemand: true
        tlsVerify: true
      - urls: ["https://quay.io"]
        onDemand: true
        tlsVerify: true
      - urls: ["https://ghcr.io"]
        onDemand: true
        tlsVerify: true
      - urls: ["https://registry.k8s.io"]
        onDemand: true
        tlsVerify: true

  # Credentials for both halves come from one SOPS-encrypted Secret, per ADR-0105 and ADR-0202: htpasswd bcrypt lines
  # for the two identities below, and the store credential `AWS_ACCESS_KEY_ID` and `AWS_SECRET_ACCESS_KEY` that zot
  # uses for S3. It must be bcrypt: zot loads an apr1 file with no error, and then refuses every password.
  credentialsSecret: zot-credentials

  # The two identities that ADR-0105 names. Anonymous gets nothing: there is no policy. So a request
  # without credentials is refused before any repository rule is checked.
  auth:
    pushUser: ci
    pullUser: cluster

  # The web console, per ADR-0306. zot serves the UI and the search API that it reads on the SAME port as the
  # distribution API. So this adds a browser surface to an existing listener, and not a second listener.
  console:
    enabled: true

  # A login-free path to the console, on top of the ops gate, per ADR-0306.
  consoleAuth:
    enabled: true
    image:
      # Fully qualified. The allow-list generator collects only references that name
      # a registry path, and the local warm set pulls by the same reference.
      repository: docker.io/library/nginx
      tag: "1.27-alpine"
      pullPolicy: IfNotPresent
    # Per ADR-0204. It adds one static header and streams the response. The request
    # rate is an operator who clicks through a catalogue, not a pull.
    resources:
      requests: { cpu: "10m", memory: "32Mi" }
      limits: { memory: "64Mi" }

  service:
    port: 5000
    # The console proxy's port, the target of the `zot.ops` IngressRoute when
    # `consoleAuth` is on. It is different from `port`, so the registry origin and the
    # console origin reach different containers in the one pod.
    consolePort: 5001

  # The seconds that a single request can take. It is sized for the largest layer that
  # this platform pushes, and not for the API calls that are most of the count. The
  # configmap says what the default does to a push.
  http:
    readTimeout: 10m
    writeTimeout: 10m

  # Per ADR-0204. The registry is on the critical path for pod starts. So the limit
  # decides whether a scale-up succeeds. It is set for a concurrent multi-layer
  # pull, and not for the idle case.
  resources:
    requests: { cpu: "50m", memory: "256Mi" }
    limits: { memory: "1Gi" }
