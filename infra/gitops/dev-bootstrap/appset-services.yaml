# Services ApplicationSet (ADR-0201). Git-directory generator over per-env values files; one Application per
# service per environment, auto-onboarded when its values file lands in master.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: services
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: services
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  # A manual pause of auto-sync has to survive this ApplicationSet's own reconcile.
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/syncPolicy
  generators:
    - matrix:
        generators:
          - list:
              elements:
                # Sync windows (e.g. staging's 05:00 UTC gate) live on the
                # per-env AppProject, not here — see bootstrap/appproject.yaml.
                - { env: dev,     server: "https://kubernetes.default.svc" }
          - git:
              repoURL: https://github.com/tabmadi/sovereign-platform-template.git
              revision: master
              files:
                - { path: "infra/gitops/services/{{ .env }}/values/*.yaml" }
  template:
    metadata:
      # `filenameNormalized` keeps the extension, so it produces `dev-service-orders.yaml` — a resource whose name says
      # which FILE generated it rather than which service it deploys, against the `<env>-<tier>- <component>` naming
      # ADR-0201 fixes.
      name: '{{ .env }}-service-{{ trimSuffix ".yaml" .path.filename }}'
      labels:
        env: "{{ .env }}"
        app.kubernetes.io/part-of: services
        app.kubernetes.io/component: "{{ .path.filenameNormalized }}"
    spec:
      project: "{{ .env }}"
      source:
        repoURL: https://github.com/tabmadi/sovereign-platform-template.git
        targetRevision: master
        path: infra/helm/service
        helm:
          valueFiles:
            # Env-wide first, then the service's own, which therefore wins. What belongs in the shared file is anything true
            # of every service in the environment — the registry's pull credential, for one.
            - "../../gitops/services/{{ .env }}/shared.yaml"
            - "../../gitops/services/{{ .env }}/values/{{ .path.filename }}"
      destination: { server: "{{ .server }}", namespace: platform }
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
        # Retry on failure — automated+selfHeal won't re-run a sync that errored
        # on the same commit; without this a transient repo-server/network blip
        # parks the generated app until a manual sync. Caps at 2m (ADR-0201).
        retry:
          limit: 20
          backoff: { duration: 10s, maxDuration: 2m, factor: 2 }
