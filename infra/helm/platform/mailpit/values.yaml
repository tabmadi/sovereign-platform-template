# Values are under `mailpit:`, so this chart shares the single per-environment values overlay of the platform
# ApplicationSet with no key collisions. The network-policies chart reads the same key. So one flag drops both the
# sink and the policy that lets Kratos reach it.
mailpit:
  # On by default, because the Rule binds every NON-production environment, per ADR-0307.
  enabled: true

  image:
    repository: axllent/mailpit
    tag: "v1.30.7"
    pullPolicy: IfNotPresent

  replicas: 1

  service:
    # Kratos's courier dials this. 1025 is Mailpit's SMTP listener, not a Service port
    # chosen here. Cilium enforces on the containerPort, so the two match on purpose.
    # See network-policies `35-mailpit.yaml`.
    smtpPort: 1025
    # The message viewer. It is not routed at an ops origin, on purpose. ADR-0306's table of routed origins does not
    # name Mailpit. Adding one is a decision for that ADR, not for this chart.
    httpPort: 8025
