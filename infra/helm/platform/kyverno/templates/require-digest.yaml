{{- if .Values.policies.imagePrefix }}
# Every first-party image reference is a digest, per ADR-0101 and ADR-0104.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-image-digest
  annotations:
    # After the CRDs. They are TEMPLATES of the subchart, not files in a `crds/` directory. So a single Helm
    # pass renders this CR against an API server that does not know `kyverno.io/v1`.
    argocd.argoproj.io/sync-wave: "1"
    policies.kyverno.io/title: First-party images are pinned by digest
    policies.kyverno.io/category: Supply chain
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      An image reference from this platform's own registry must name a digest. A
      tag is a mutable pointer, so a tagged reference means the bytes that ran
      yesterday and the bytes that run today are the same only by convention
      (ADR-0101).
spec:
  validationFailureAction: {{ .Values.policies.validationFailureAction }}
  # Background scanning is ON, unlike the signature policy. This check needs no registry round trip, so it is cheap to
  # run again against everything that already runs. So a workload admitted before the policy existed shows in a
  # report. It does not stay invisible until its next reschedule.
  background: true
  rules:
    - name: digest-not-tag
      match:
        any:
          - resources:
              kinds: [Pod]
      preconditions:
        all:
          - key: "{{ `{{ request.operation || 'BACKGROUND' }}` }}"
            operator: NotEquals
            value: DELETE
      validate:
        message: >-
          A first-party image must use a digest, not a tag, per ADR-0101.
          Promotion writes the digest into the values file. A tag there is the
          defect that lint:floating-tags catches before it reaches a cluster.
        foreach:
          # Every container type, as one flat list. Each has `|| []`: a pod with no
          # initContainers gives null. A null inside the multiselect makes the whole
          # expression null, and not the shorter list that you want.
          - list: "request.object.spec.[containers || `[]`, initContainers || `[]`, ephemeralContainers || `[]`][]"
            deny:
              conditions:
                all:
                  # BOTH conditions are in one `all`. The registry check is not a foreach precondition. A precondition that does not
                  # match skips the element with no sign. A rule that skips everything with no sign looks the same as a rule that
                  # passes.
                  - key: "{{ `{{ element.image }}` }}"
                    operator: Equals
                    value: {{ .Values.policies.imagePrefix | quote }}
                  - key: "{{ `{{ element.image }}` }}"
                    operator: NotEquals
                    value: "*@sha256:*"
{{- end }}
