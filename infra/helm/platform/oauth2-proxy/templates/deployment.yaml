{{- if .Values.oauth2Proxy.enabled }}
{{- $v := .Values.oauth2Proxy }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: platform
  labels: { app.kubernetes.io/name: oauth2-proxy }
spec:
  replicas: {{ $v.replicas }}
  selector: { matchLabels: { app.kubernetes.io/name: oauth2-proxy } }
  template:
    metadata: { labels: { app.kubernetes.io/name: oauth2-proxy } }
    spec:
      # `restricted`, per ADR-0200.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: oauth2-proxy
          image: "{{ $v.image.repository }}:{{ $v.image.tag }}"
          imagePullPolicy: {{ $v.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Traefik asks the gate on every preview request. The static upstream answers 202 for a signed-in member, and
          # oauth2-proxy answers a redirect to the forge for anyone else. Traefik passes that redirect to the browser.
          args:
            - --http-address=0.0.0.0:4180
            {{- if eq $v.provider "github" }}
            - --provider=github
            - --github-org={{ required "org is required" $v.org }}
            {{- else }}
            - --provider=oidc
            - --oidc-issuer-url={{ required "forgeUrl is required" $v.forgeUrl }}
            - --scope=openid email profile groups
            - --oidc-groups-claim=groups
            - --allowed-group={{ required "org is required" $v.org }}
            {{- end }}
            - --email-domain=*
            - --redirect-url=https://design-auth.ops.{{ required "host is required" $v.host }}/oauth2/callback
            - --cookie-domain=.ops.{{ $v.host }}
            - --whitelist-domain=.ops.{{ $v.host }}
            - --cookie-name=_hatra_design
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --upstream=static://202
            - --reverse-proxy=true
            - --skip-provider-button=true
            # Forgejo asks a reviewer to approve the gate once, not on every sign-in.
            - --approval-prompt=auto
            - --set-xauthrequest=true
          envFrom:
            - secretRef: { name: {{ $v.credentialsSecret }} }
          ports: [{ name: http, containerPort: 4180 }]
          readinessProbe: { httpGet: { path: /ready, port: http } }
          livenessProbe: { httpGet: { path: /ping, port: http }, periodSeconds: 30 }
          resources: {{- toYaml $v.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata: { name: oauth2-proxy, namespace: platform }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: oauth2-proxy }
  ports: [{ name: http, port: 80, targetPort: http }]
{{- end }}
