# Service level objectives for authz, per ADR-0500. services/_template/slo.yaml states the mechanics and why the objective ships unset.

window: 30d # rolling, per ADR-0500

availability:
  # Good event: a response that is not 5xx.
  objective: null # set per project, within the bound in docs/reference/detection-latency.md

latency:
  # Every check runs inside another service's request, so its budget is the tightest.
  threshold: 0.5 # seconds, and an `le` bucket boundary of the histogram
  objective: null # set per project

exclude:
  - /livez
  - /readyz
  - admin-port
