# Values are under `headlamp:`, so this chart shares the single per-environment
# values overlay of the platform ApplicationSet with no key collisions.
headlamp:
  # Core, per ADR-0501: deployed in every environment. The gate stays here, so a
  # project can drop Headlamp with `enabled: false` in an environment overlay,
  # like any Core component removed under its ADR.
  enabled: true

  image:
    repository: ghcr.io/headlamp-k8s/headlamp
    tag: v0.43.0
    pullPolicy: IfNotPresent

  replicas: 1
  service:
    port: 80

  # Bound to the built-in `view` ClusterRole: list, get, and watch across the cluster,
  # with no writes. Read-only is the documented intent, per ADR-0501. Use a
  # narrower custom role if a project needs tighter access.
  clusterRole: view
