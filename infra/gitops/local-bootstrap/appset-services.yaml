# Local Services ApplicationSet, per ADR-0201 and ADR-0205. It is the same as `bootstrap/appset-services.yaml`,
# with two differences. The list generator has a single `{ env: local }` element. The git-files generator reads
# the local service values in `infra/gitops/services/local/values/*.yaml`.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: local-services
  namespace: argocd
  labels:
    env: local
    app.kubernetes.io/part-of: services
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/syncPolicy
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - { env: local, server: "https://kubernetes.default.svc" }
          - git:
              repoURL: https://github.com/tabmadi/sovereign-platform-template.git
              revision: master
              files:
                - { path: "infra/gitops/services/{{ .env }}/values/*.yaml" }
  template:
    metadata:
      # The file extension is trimmed on purpose. Every local script forms the app name from the service name, such as
      # `local-service-orders`. `filenameNormalized` alone leaves `orders.yaml` there, and no caller guesses that name.
      # The pause-auto-sync step in `service-deploy.sh` then missed it without an error, and Argo CD reverted the deploy.
      name: "{{ .env }}-service-{{ trimSuffix \".yaml\" .path.filename }}"
      labels:
        env: "{{ .env }}"
        app.kubernetes.io/part-of: services
        app.kubernetes.io/component: "{{ trimSuffix \".yaml\" .path.filename }}"
    spec:
      project: "{{ .env }}"
      source:
        repoURL: https://github.com/tabmadi/sovereign-platform-template.git
        targetRevision: master
        path: infra/helm/service
        helm:
          valueFiles:
            - "../../gitops/services/{{ .env }}/shared.yaml"
            - "../../gitops/services/{{ .env }}/values/{{ .path.filename }}"
      destination: { server: "{{ .server }}", namespace: platform }
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
        retry:
          limit: 20
          backoff: { duration: 10s, maxDuration: 2m, factor: 2 }
