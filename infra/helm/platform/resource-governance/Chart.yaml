apiVersion: v2
name: resource-governance
description: |
  The ADR-0204 guardrails: PriorityClass tiers, per-namespace LimitRange and
  ResourceQuota, and PodDisruptionBudgets for the stateful and multi-replica Core.

  They are in one chart in the BASE tier, next to network-policies, because every
  object here must exist *before* the workloads it governs. A LimitRange supplies
  defaults only at admission. So a pod created before it keeps what it declared,
  which is nothing. A ResourceQuota created before its LimitRange rejects pods
  that the LimitRange would have given defaults. Sync-waves inside this chart
  order the three objects.

  This chart is the ONLY place for cluster-wide resource policy, on purpose. The
  requests and limits of each workload stay in that component's own values. The
  split is: policy and defaults here, and right-sized measurements there.
type: application
version: "2026.9.3"
appVersion: "1.0.0"
