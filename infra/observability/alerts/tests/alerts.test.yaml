# Alert tests with simulated time, per ADR-0500. scripts/test-alerts.sh runs them against a copy of the rules without annotations.
rule_files:
  - rules/*.yaml
evaluation_interval: 1m
tests:
  - name: KyvernoAdmissionControllerAbsent fires after its wait
    interval: 1m
    input_series:
      - series: up{job="other"}
        values: 1x20
    alert_rule_test:
      - eval_time: 9m
        alertname: KyvernoAdmissionControllerAbsent
        exp_alerts: []
      - eval_time: 15m
        alertname: KyvernoAdmissionControllerAbsent
        exp_alerts:
          - exp_labels:
              severity: page
              service_name: kyverno
  - name: KyvernoAdmissionControllerAbsent stays quiet on healthy input
    interval: 1m
    input_series:
      - series: kyverno_controller_reconcile_total{service_name="kyverno"}
        values: 1x20
    alert_rule_test:
      - eval_time: 15m
        alertname: KyvernoAdmissionControllerAbsent
        exp_alerts: []
  - name: KyvernoAdmissionSlow fires after its wait
    interval: 1m
    input_series:
      - series: kyverno_admission_review_duration_seconds_bucket{le="1"}
        values: "0x35"
      - series: kyverno_admission_review_duration_seconds_bucket{le="20"}
        values: 0+60x35
      - series: kyverno_admission_review_duration_seconds_bucket{le="+Inf"}
        values: 0+60x35
    alert_rule_test:
      - eval_time: 14m
        alertname: KyvernoAdmissionSlow
        exp_alerts: []
      - eval_time: 30m
        alertname: KyvernoAdmissionSlow
        exp_alerts:
          - exp_labels:
              severity: ticket
  - name: KyvernoAdmissionSlow stays quiet on healthy input
    interval: 1m
    input_series:
      - series: kyverno_admission_review_duration_seconds_bucket{le="1"}
        values: 0+60x35
      - series: kyverno_admission_review_duration_seconds_bucket{le="20"}
        values: 0+60x35
      - series: kyverno_admission_review_duration_seconds_bucket{le="+Inf"}
        values: 0+60x35
    alert_rule_test:
      - eval_time: 30m
        alertname: KyvernoAdmissionSlow
        exp_alerts: []
