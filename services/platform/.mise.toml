# The platform worker answers no requests, so it has no `server` task and no registered port.
# platform/not-deployed: local
# Not on the inner-loop tier: it deploys to dev and above, where a Schedule has something to remind someone about.

[env]
_.file = ".env"

[tasks.env]
hide = true
run = "bash ../../scripts/env-ensure.sh"

[tasks.worker]
description = "Temporal only."
depends = ["env", "dep:temporal"]
run = "go run ./cmd/worker"

[tasks.test]
run = "go test ./..."

[tasks.lint]
run = "golangci-lint run ./..."

[tasks.build]
run = "go build ./..."
