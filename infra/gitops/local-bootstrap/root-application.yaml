# Local root App-of-Apps, per ADR-0201 and ADR-0205. `mise run cluster:up -- full` applies it ONCE by hand.
# That task replaces `scripts/cluster.sh`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-root
  namespace: argocd
  labels:
    env: local
    app.kubernetes.io/part-of: bootstrap
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  # The hand-applied bootstrap seed stays in `default`. It creates the per-environment
  # AppProject in `appproject.yaml`, so it cannot live in one of them.
  project: default
  source:
    repoURL: https://github.com/tabmadi/sovereign-platform-template.git
    targetRevision: master
    path: infra/gitops/local-bootstrap
    directory:
      recurse: true
      exclude: root-application.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
    retry:
      limit: 20
      backoff: { duration: 10s, maxDuration: 2m, factor: 2 }
