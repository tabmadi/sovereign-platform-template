apiVersion: v2
name: ory
description: Ory Kratos for identity, Oathkeeper for the edge, and Hydra for OAuth2 and OIDC, backed by Postgres, per ADR-0305 and ADR-0304.
type: application
version: "2026.9.3"
appVersion: "26.2.0"

dependencies:
  - name: kratos
    version: "0.62.1"
    repository: https://k8s.ory.sh/helm/charts
  # Edge identity and access proxy, per ADR-0305. Always on: Kratos, Oathkeeper, and OpenFGA
  # are the internal-only default stack.
  - name: oathkeeper
    version: "0.62.1"
    repository: https://k8s.ory.sh/helm/charts
    condition: oathkeeper.enabled
  # Hydra is a public-API add-on, per ADR-0305. It is deployed only when `hydra_thirdparty`
  # is on. It is off by default for internal-only projects.
  - name: hydra
    version: "0.62.1"
    repository: https://k8s.ory.sh/helm/charts
    condition: hydra.enabled
