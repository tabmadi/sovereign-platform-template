{{- if .Values.policies.allowedImageSources }}
# Where an image may come from at all (ADR-0104). The other two policies answer questions about OUR images.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: allowed-image-sources
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    policies.kyverno.io/title: Images come from known registries
    policies.kyverno.io/category: Supply chain
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Every image must come from a repository this platform has declared it pulls
      from (ADR-0104). The list is generated from the platform's own charts, so a
      new entry is a registry that has never been used here before.
spec:
  validationFailureAction: {{ .Values.policies.validationFailureAction }}
  background: true
  rules:
    - name: known-registry
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        message: >-
          This image comes from a repository that is not in the allow-list
          (ADR-0104). If the repository is legitimate, add it by regenerating:
          `mise run gen:image-allowlist`.
        foreach:
          - list: "request.object.spec.[containers || `[]`, initContainers || `[]`, ephemeralContainers || `[]`][]"
            deny:
              conditions:
                all:
                  - key: "{{ `{{ element.image }}` }}"
                    # AllNotIn, not NotEquals: the value is a LIST, and NotEquals compares against it as a whole — every image is "not
                    # equal to the list", so the rule rejects everything, including what it allows.
                    operator: AllNotIn
                    # Wildcards rather than a regex: the entries are repositories,
                    # and what follows one is a tag or a digest — both of which start
                    # with a character no repository contains.
                    value:
                      {{- range .Values.policies.allowedImageSources }}
                      - {{ printf "%s:*" . | quote }}
                      - {{ printf "%s@*" . | quote }}
                      {{- end }}
{{- end }}
