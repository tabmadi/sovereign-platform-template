# Service-local tasks. These are the standard task names (ADR-0101) that
# every service exposes.

# Inner-loop config comes from .env (copy .env.example). Absent, tasks still run —
# the service just falls back to its in-cluster defaults.
[env]
# The port this service binds natively. Register it in scripts/lib/ports.sh first and copy the number here; `mise run lint:ports` fails if the two disagree.
PORT = "80XX"
_.file = ".env"

[tasks.env]
description = "Seed .env from .env.example on a fresh clone (see scripts/env-ensure.sh for why it stops rather than continuing)."
hide = true
run = "bash ../../scripts/env-ensure.sh"

# Dependency components this service needs in the cluster (ADR-0205, ADR-0600). Trim to what the service reads.
# Add `svc:<other>` for every other service this one calls over HTTP, which is what makes the callee answer on the local port <OTHER>_URL defaults to.
[tasks.server]
description = "Run the HTTP server against the locally port-forwarded deps"
depends = ["env", "dep:postgres", "dep:openfga", "dep:temporal"]
run = "go run ./cmd/server"

[tasks.worker]
description = "Run the Temporal worker"
depends = ["env", "dep:postgres", "dep:openfga", "dep:temporal"]
run = "go run ./cmd/worker"

[tasks.test]
run = "go test ./..."

[tasks.lint]
run = "golangci-lint run ./..."

[tasks.migrate]
description = "Run dbmate up against $DATABASE_URL"
depends = ["env", "dep:postgres"]
run = "dbmate --no-dump-schema up"

[tasks.generate]
description = "Regenerate sqlc + OpenAPI server/client for this service"
run = "sqlc generate && bash ../../scripts/gen-openapi.sh"

[tasks.build]
run = "go build ./..."
