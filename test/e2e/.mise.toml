# The Node island, per ADR-0100 and ADR-0601. Bun cannot drive the Playwright runner: Bun lacks the extra-fd pipe transport and worker IPC parts of `child_process`.
# The version comes from the root [env] NODE_VERSION. The root `e2e*` tasks call these with `mise run -C test/e2e`, which installs node on first use.
[tools]
node = "{{env.NODE_VERSION}}"

# The tasks are here and not at the root, because mise tools pass DOWN a config tree, never up. A root task cannot see this node.
# The root keeps small `e2e*` tasks that call these, so `mise run e2e` and the CI workflow stay the same.
[tasks.install]
# Workspace deps and the Chromium binary. `--with-deps` is left out: it calls apt-get and breaks on Arch, Fedora, and macOS.
run = """
npm ci || npm install
npm run install:browsers
"""

# The test must reach the edge, *.localtest.me, directly and never through a dev HTTPS_PROXY. The in-cluster port-forwards are loopback.
# This setting covers both cases.
[tasks.test]
# The full browser acceptance and visual suite against a running `cluster:up full`, per ADR-0601.
# It runs nightly and before a release in CI, and never in ci:affected.
env = { NO_PROXY = "localhost,127.0.0.1,.localtest.me", no_proxy = "localhost,127.0.0.1,.localtest.me" }
run = "npm run test"

[tasks."test:smoke"]
# Label-gated subset for each PR: one product golden path and one key dashboard render.
env = { NO_PROXY = "localhost,127.0.0.1,.localtest.me", no_proxy = "localhost,127.0.0.1,.localtest.me" }
run = "npm run test:smoke"

[tasks."test:visual"]
# The screenshot baselines alone, to update one after a UI change that you intend.
# Add `-- --update-snapshots`, and commit the result with the change that caused it.
env = { NO_PROXY = "localhost,127.0.0.1,.localtest.me", no_proxy = "localhost,127.0.0.1,.localtest.me" }
run = "npm run test:visual"

[tasks.lighthouse]
# Web vitals and bundle budgets against the running edge, per ADR-0400.
# The NO_PROXY reason is the same as for the suites above: the test reaches the edge directly, never through a proxy.
env = { NO_PROXY = "localhost,127.0.0.1,.localtest.me", no_proxy = "localhost,127.0.0.1,.localtest.me" }
run = "npm run lighthouse"

[tasks."test:a11y"]
# The axe scan alone, to work on an accessibility fix without the full suite.
env = { NO_PROXY = "localhost,127.0.0.1,.localtest.me", no_proxy = "localhost,127.0.0.1,.localtest.me" }
run = "npm run test:a11y"
