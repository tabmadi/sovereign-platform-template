openapi: 3.1.0
info: { title: payment, version: 0.1.0, description: Payment charge and settlement service., x-audience: public }
servers: [{ url: /api }]   # flat resource namespace, per ADR-0306. Paths are globally unique
# `x-admin: crud` marks the resource group for the admin generator in tools/admin-gen, per
# ADR-0401. A workflow creates charges, and they are immutable. So the generator makes only
# the list and detail read pages and the `refund` action below, with no edit or delete.
tags: [{ name: charges, x-admin: crud }]
paths:
  /charges:
    get:
      operationId: listCharges
      # Listing every charge is a back-office view. The public docs leave it out, per ADR-0303.
      x-audience: internal
      description: List all charges.
      tags: [charges]
      responses:
        "200":
          description: The charge list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Charge" }
                # The API mock serves this exactly as written, per ADR-0600. The statuses
                # vary, so the UI must render every one of them.
                example:
                  - { id: charge_01kztnyqr0f13shqqnx8028xx5, order_id: order_01kztnj6c8e0jt7vzw0cn1wxvd, amount: { amount: "2598.00", currency: EUR }, status: settled }
                  - { id: charge_01kztp2xh8e6nr9gh2xr7ryye5, order_id: order_01kztnpc5gfx2a9kkhxe1h4ar3, amount: { amount: "899.00", currency: EUR }, status: pending }
                  - { id: charge_01kztp73agejgvn558snqmna6f, order_id: order_01kztnthyrfsj8a9pjx1md2pqs, amount: { amount: "596.00", currency: EUR }, status: refunded }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createCharge
      tags: [charges]
      description: |
        Starts the Charge Temporal workflow. It is idempotent on the Idempotency-Key header.
        Returns a workflow handle, per ADR-0302.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, description: Client-generated key that makes the charge request idempotent., schema: { type: string } }
      requestBody:
        required: true
        description: The charge to create.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChargeInput" }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowHandle" }
        default: { $ref: "#/components/responses/Error" }
  /charges/{id}:
    get:
      operationId: getCharge
      description: Fetch a charge by id.
      tags: [charges]
      parameters: [{ name: id, in: path, required: true, description: Charge id., schema: { $ref: "#/components/schemas/ChargeId" } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Charge" } } } }
        default: { $ref: "#/components/responses/Error" }
  /charges/{id}/refund:
    post:
      operationId: refundCharge
      # An operator action, emitted as a button and not a CRUD page, per ADR-0401. As `internal`, it stays out of the public docs, per ADR-0303.
      x-admin: action
      x-audience: internal
      description: Refund a settled charge. Starts the Refund workflow, per ADR-0302.
      tags: [charges]
      parameters: [{ name: id, in: path, required: true, description: Id of the charge to refund., schema: { $ref: "#/components/schemas/ChargeId" } }]
      requestBody:
        required: true
        description: The refund request.
        content: { application/json: { schema: { $ref: "#/components/schemas/RefundInput" } } }
      responses:
        "202":
          description: Refund accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowHandle" }
        default: { $ref: "#/components/responses/Error" }
components:
  responses:
    # >>> shared-components: responses. Generated from tools/codegen/shared-components.yaml. Do not edit
    Error:
      description: An error, as RFC 9457 problem details.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    # <<< shared-components
  schemas:
    # >>> shared-components: schemas. Generated from tools/codegen/shared-components.yaml. Do not edit
    # RFC 9457 problem details. `instance` is absent on purpose: `trace_id` identifies the occurrence and leads to the trace.
    # An instance URL leads nowhere.
    Problem:
      type: object
      description: |
        RFC 9457 problem details. Services and the edge both serve it as
        `application/problem+json`, so a generated client has one error branch, not two.
      required: [type, title, status]
      properties:
        type:
          type: string
          description: |
            `about:blank`, except where two errors share a status code and a client
            handles them differently. That case uses a `urn:problem-type:<service>:<slug>`
            URN. It is never a dereferenceable URL, which would put an error taxonomy into
            the flat public URL namespace.
          default: "about:blank"
          example: "about:blank"
        title:
          type: string
          description: A stable, human-readable summary. It does not change with the instance.
          example: Not Found
        status:
          type: integer
          description: The HTTP status, repeated in the body.
          minimum: 100
          maximum: 599
          example: 404
        detail:
          type: string
          description: |
            Specific to the instance and safe to show a user. Never a stack trace, a query,
            or an internal hostname.
          example: No product with that identifier.
        trace_id:
          type: string
          description: |
            The W3C Trace Context trace-id of the failing request, so an error that a user
            reports leads to its trace. The active span supplies it, not the handler.
          pattern: "^[0-9a-f]{32}$"
          example: 4bf92f3577b34da6a3ce929d0e0e4736
        errors:
          type: array
          description: |
            Field-level validation failures, filled from the generated validator.
            Absent when the failure is not a validation failure.
          items:
            type: object
            required: [pointer, message]
            properties:
              pointer:
                type: string
                description: RFC 6901 JSON Pointer to the member that failed.
                example: /price/amount
              message:
                type: string
                example: must be a decimal amount
      example:
        type: "about:blank"
        title: Not Found
        status: 404
        detail: No product with that identifier.
        trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
    # A monetary amount. `string`, never `number`: every TypeScript client parses a JSON number as an IEEE-754 double.
    # A double cannot hold a decimal amount exactly. A `type: number` monetary field is a contract defect.
    Money:
      type: object
      description: |
        A monetary amount. The amount is a decimal string, because a JSON number becomes
        a double in the TypeScript client, and a double cannot hold a decimal amount
        exactly. The currency goes with the amount, because an amount without one is
        not a quantity of anything.
      required: [amount, currency]
      properties:
        amount:
          type: string
          description: Decimal amount, with a leading sign when negative. No thousands separators.
          pattern: '^-?[0-9]+(\.[0-9]+)?$'
          example: "1299.00"
        currency:
          type: string
          description: ISO 4217 alphabetic code, uppercase.
          pattern: "^[A-Z]{3}$"
          example: EUR
      example:
        amount: "1299.00"
        currency: EUR
    # <<< shared-components
    # Wire identifiers, per ADR-0003. The stored columns stay bare `uuid`. This form
    # exists so that a value in a log line, a ticket, or a URL names its type.
    ChargeId:
      type: string
      description: |
        A charge identifier: `charge_` and the UUIDv7 in 26 characters of Crockford
        base32. The first character is at most 7, because 26 characters hold 130 bits and
        a UUID has 128. It is opaque to a consumer: nothing parses, orders, or builds one.
      pattern: '^charge_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$'
      example: charge_01kztnyqr0f13shqqnx8028xx5
    # orders mints it and this service carries it. So the prefix names the owning
    # service's resource, not a resource of this service.
    OrderId:
      type: string
      description: |
        An order identifier: `order_` and the UUIDv7 in 26 characters of Crockford
        base32. It is opaque to a consumer: nothing parses, orders, or builds one.
      pattern: '^order_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$'
      example: order_01kztnj6c8e0jt7vzw0cn1wxvd
    WorkflowHandle:
      type: object
      description: Handle to an async Temporal workflow run.
      required: [id, run_id, status]
      properties:
        id:     { type: string }
        run_id: { type: string }
        status: { type: string, enum: [running, completed, failed, cancelled] }
        # uri-reference, not uri. The value is a path on this origin, and `format: uri` means an absolute URI. Then the committed example would fail its own schema.
        result_url: { type: string, format: uri-reference, description: "GET it to fetch the terminal status and result" }
      # As in orders, the real 202 returns `running`, and the mock's poll never moves
      # past it, per ADR-0600.
      example: { id: charge-charge_01kztnyqr0f13shqqnx8028xx5, run_id: 019a3f8c-6d21-7c4b-8e55-0f27f7f0e002, status: running, result_url: /api/charges/charge_01kztnyqr0f13shqqnx8028xx5 }
    ChargeInput:
      type: object
      description: Request body to create a charge.
      required: [order_id, amount]
      properties:
        order_id: { $ref: "#/components/schemas/OrderId" }
        amount:   { $ref: "#/components/schemas/Money" }
    RefundInput:
      type: object
      description: Request body to refund a charge.
      required: [reason]
      properties:
        reason: { type: string, minLength: 1 }
    Charge:
      type: object
      description: A payment charge against an order.
      required: [id, order_id, amount, status]
      properties:
        id:       { $ref: "#/components/schemas/ChargeId" }
        order_id: { $ref: "#/components/schemas/OrderId" }
        amount:   { $ref: "#/components/schemas/Money" }
        status:   { type: string, enum: [pending, settled, failed, refunded] }
      example: { id: charge_01kztnyqr0f13shqqnx8028xx5, order_id: order_01kztnj6c8e0jt7vzw0cn1wxvd, amount: { amount: "2598.00", currency: EUR }, status: settled }
