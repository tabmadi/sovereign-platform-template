[env]
# The registered local port from scripts/lib/ports.sh. It is committed, so a sibling's <SVC>_URL default can depend on it. The chart sets no PORT, so pods still bind :8080.
PORT = "8082"
_.file = ".env"

[tasks.env]
description = "Create .env from .env.example on a fresh clone. It then stops and does not continue, and scripts/env-ensure.sh states why."
hide = true
run = "bash ../../scripts/env-ensure.sh"

[tasks.server]
description = "Run the HTTP server with the dependency components it needs in the cluster, per ADR-0205 and ADR-0600."
depends = ["env", "dep:postgres", "dep:openfga", "dep:temporal"]
run = "go run ./cmd/server"

[tasks.worker]
description = "Run the Temporal worker. It also depends on catalog and payment, because the checkout saga's activities call them, per ADR-0302."
depends = [
  "env",
  "dep:postgres",
  "dep:openfga",
  "dep:temporal",
  "svc:catalog",
  "svc:payment",
]
run = "go run ./cmd/worker"

[tasks.test]
run = "go test ./..."

[tasks.lint]
run = "golangci-lint run ./..."

[tasks.migrate]
depends = ["env", "dep:postgres"]
run = "dbmate --no-dump-schema up"

[tasks.generate]
run = "sqlc generate && bash ../../scripts/gen-openapi.sh"

[tasks.build]
run = "go build ./..."
