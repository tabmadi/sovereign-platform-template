# Load and performance (ADR-0601): shares the e2e workflow's full-tier prerequisite, is not part of ci:affected,
# and never gates a merge. A threshold breach is a regression to triage, not a broken build — k6 shares the
# runner with the platform, so CI numbers are a series to diff rather than capacity figures.
name: perf

on:
  schedule:
    - cron: "0 4 * * *" # nightly, after the e2e suite's 03:00
  push:
    tags: ["v*", "services/*/v*"] # pre-release (ADR-0103)
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:
    inputs:
      profile:
        description: "smoke, load, or stress"
        default: "load"

concurrency:
  # Never two load runs against one cluster: they would measure each other.
  group: perf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Same activity gate as the e2e nightly: no commits, no bring-up. A perf number
  # for an unchanged commit is yesterday's number plus runner noise.
  gate:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/_nightly-gate.yml
    with:
      workflow_file: perf.yml

  load:
    needs: gate
    if: >-
      needs.gate.outputs.run == 'true' && (
      github.event_name == 'schedule' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Provision the local SOPS age key
        run: mise run secrets:age
      # Authenticated Docker Hub pulls for zot's sync: anonymous pulls are limited per source IP, which this runner
      # shares with the whole forge. Unset on a fork, where the secrets do not resolve.
      # Restore-only: the lighthouse job is the single writer, and a full-tier bring-up would cache first-party images.
      - name: Restore the registry mirror
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/zot
          key: zot-${{ runner.os }}-${{ hashFiles('infra/local/image-refs.txt') }}

      - name: Bring up cluster:up full
        run: mise run cluster:up -- full
        env:
          ZOT_DATA: ${{ runner.temp }}/zot
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      # Seed before measuring: an empty catalog makes the read scenario a test of
      # nothing (test/perf/seed/seed.sh).
      - name: Seed bulk test data
        run: mise run perf:seed
      - name: Run the load suite
        run: mise run perf${{ (github.event_name == 'workflow_dispatch' && inputs.profile != 'load') && format(':{0}', inputs.profile) || '' }}
      - name: Upload k6 summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-summary-load
          path: test/perf/results/
          retention-days: 30
      - name: Tear down
        if: always()
        run: mise run cluster:down

  smoke:
    # Label-gated per-PR, same opt-in shape as e2e-smoke: an unlabeled PR never
    # pays a full bring-up.
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'perf-smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Provision the local SOPS age key
        run: mise run secrets:age
      # Authenticated Docker Hub pulls for zot's sync: anonymous pulls are limited per source IP, which this runner
      # shares with the whole forge. Unset on a fork, where the secrets do not resolve.
      # Restore-only: the lighthouse job is the single writer, and a full-tier bring-up would cache first-party images.
      - name: Restore the registry mirror
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/zot
          key: zot-${{ runner.os }}-${{ hashFiles('infra/local/image-refs.txt') }}

      - name: Bring up cluster:up full
        run: mise run cluster:up -- full
        env:
          ZOT_DATA: ${{ runner.temp }}/zot
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Seed bulk test data
        run: mise run perf:seed
      - name: Run the smoke profile
        run: mise run perf:smoke
      - name: Upload k6 summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-summary-smoke
          path: test/perf/results/
          retention-days: 7
      - name: Tear down
        if: always()
        run: mise run cluster:down
