# Per-environment AppProjects (ADR-0201). ArgoCD's real tenancy/grouping primitive — the platform/service
# Applications the appsets fan out are grouped *by* these (spec.project: <env>), not by parsing the `<env>-` name
# prefix.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: dev
  namespace: argocd
  labels:
    env: dev
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: Dev environment — platform + services.
  sourceRepos:
    - https://github.com/tabmadi/sovereign-platform-template.git
      # Argo resolves a chart's `dependencies:` under the project's own permissions, so a repo a chart pulls from is a
      # source of this project even though no Application names it.
    - docker.io/temporalio
  destinations:
    - { server: https://kubernetes.default.svc, namespace: "*" }
  clusterResourceWhitelist:
    - { group: "*", kind: "*" }
  namespaceResourceWhitelist:
    - { group: "*", kind: "*" }