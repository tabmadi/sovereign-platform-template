{{- if .Values.maddy.enabled }}
{{- /* Senders' Go SMTP clients refuse to send a password without TLS (ADR-0307). Self-signed, as senders are in-cluster
and skip verification; ten years, because maddy reads the file only at startup and would serve a renewal's expiry. */}}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: maddy-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: maddy-tls
spec:
  secretName: maddy-tls
  duration: 87600h
  commonName: maddy.{{ .Release.Namespace }}.svc.cluster.local
  dnsNames:
    - maddy
    - maddy.{{ .Release.Namespace }}.svc
    - maddy.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef: { name: maddy-selfsigned, kind: Issuer }
{{- end }}
