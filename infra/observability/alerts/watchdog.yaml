# Watchdog — the dead man's switch for the alerting pipeline itself (ADR-0502).
groups:
  - name: alerting.watchdog
    rules:
      - alert: Watchdog
        expr: vector(1)
        labels: { severity: ticket }
        annotations:
          summary: "Alerting pipeline is alive"
          description: >-
            This alert always fires. Its absence means alerts are not being
            evaluated or not being routed, and nothing else in this cluster can
            tell you that. Silencing it disables the only check on the check.
