{{- if .Values.edgeErrors.enabled }}
{{- $ee := .Values.edgeErrors }}
{{- /*
One document per status, plus the MIME mapping that makes them problem details
and not plain JSON. A client branches on the Content-Type, and busybox httpd
does not send it without this file.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: edge-errors
  namespace: platform
  labels:
    app.kubernetes.io/name: edge-errors
    app.kubernetes.io/part-of: platform
data:
  # Every document here is `.json`, and there is nothing else to serve. So a mapping
  # for the whole extension is exact, not broad.
  httpd.conf: |
    .json:application/problem+json
  {{- range $ee.problems }}
  {{ .status }}.json: |
    {"type":"about:blank","title":{{ .title | quote }},"status":{{ .status }}}
  {{- end }}
{{- end }}
