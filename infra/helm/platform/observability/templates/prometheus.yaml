# Prometheus, per ADR-0500: the Core-tier metrics store. It is a single prom/prometheus process with a local TSDB,
# native OTLP ingest, and no object-storage dependency. One Deployment, like Loki in SingleBinary mode and Tempo.
{{- $p := .Values.prometheus }}
{{/* The config lives in a define, so the Deployment can stamp its sha256 as a pod-template annotation.
     Without that checksum, a config edit updates the ConfigMap but never rolls the pod. Prometheus then keeps
     the old config with no end. */}}
{{- define "observability.prometheus.config" }}
    global:
      scrape_interval: 30s
    # OTLP metrics arrive from the OTel collector, through `--web.enable-otlp-receiver`.
    otlp:
      translation_strategy: UnderscoreEscapingWithSuffixes
      # Without this, resource attributes are dropped from series.
      promote_resource_attributes:
        [
          "service.name",
          "service.namespace",
          "k8s.deployment.name",
          "k8s.statefulset.name",
          "k8s.node.name",
          "k8s.persistentvolumeclaim.name",
          "k8s.volume.name",
          "k8s.volume.type",
        ]
    # OTLP pushes can arrive a little out of order across collector batches.
    storage:
      tsdb:
        out_of_order_time_window: 30m
    # Services push through OTLP. By default, nothing is scraped.
    scrape_configs: []
    # Alerts-as-code, per ADR-0500: rule files from `infra/observability/alerts/`. The prometheus-alerts Argo CD
    # Application delivers them as the `prometheus-alerts` ConfigMap, like the Grafana dashboards ConfigMap. They are
    # mounted below.
    rule_files:
      - /etc/prometheus/rules/*.yaml
    # Alertmanager routes every alert, per ADR-0502. Evaluation stays here, and routing happens there: one primitive for
    # each concern.
    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - {{ .Values.prometheus.alertmanagerTarget }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus
  labels: { app.kubernetes.io/name: prometheus, app.kubernetes.io/part-of: observability }
data:
  prometheus.yml: |
    {{- include "observability.prometheus.config" . }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  labels: { app.kubernetes.io/name: prometheus, app.kubernetes.io/part-of: observability }
spec:
  # A StatefulSet, because the TSDB below is a ReadWriteOnce volume. A Deployment
  # with one deadlocks its own rolling update. The new pod waits for a volume that
  # the old pod still holds, and the rollout never completes.
  serviceName: prometheus
  replicas: {{ $p.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: prometheus }
  template:
    metadata:
      labels: { app.kubernetes.io/name: prometheus }
      # Roll the pod when the config changes. Prometheus reads its config only at startup. The Core stack has no reloader
      # sidecar.
      annotations:
        checksum/config: {{ include "observability.prometheus.config" . | sha256sum }}
    spec:
      # `restricted`, per ADR-0200.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: prometheus
          securityContext: {{- include "observability.containerSecurityContext" . | nindent 12 }}
          image: {{ $p.image }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/data
            - --storage.tsdb.retention.time={{ $p.retention }}
            - --web.enable-otlp-receiver
            - --web.listen-address=0.0.0.0:{{ $p.httpPort }}
          ports:
            - { name: http, containerPort: {{ $p.httpPort }} }
          readinessProbe: { httpGet: { path: /-/ready,   port: http }, initialDelaySeconds: 15 }
          livenessProbe:  { httpGet: { path: /-/healthy, port: http }, initialDelaySeconds: 30, periodSeconds: 30 }
          resources: {{- toYaml $p.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: rules,  mountPath: /etc/prometheus/rules }
            - { name: data,   mountPath: /data }
      volumes:
        - name: config
          configMap: { name: prometheus }
        # Alert rules from `infra/observability/alerts/`, from the prometheus-alerts Argo CD app. They are mounted read-only
        # under the config dir, and `rule_files` above globs it.
        - name: rules
          configMap: { name: prometheus-alerts }
  # The TSDB.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with $p.storage.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $p.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels: { app.kubernetes.io/name: prometheus, app.kubernetes.io/part-of: observability }
spec:
  selector: { app.kubernetes.io/name: prometheus }
  ports:
    - { name: http, port: {{ $p.httpPort }}, targetPort: http }
