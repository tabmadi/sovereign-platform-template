# Platform ApplicationSets, per ADR-0201. There is one per dependency layer, so Argo CD can order them.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-admission
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/component: admission
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  # A manual pause of auto-sync must survive this ApplicationSet's own reconcile.
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/syncPolicy
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - { env: dev,     server: "https://kubernetes.default.svc" }
          - git:
              repoURL: https://github.com/tabmadi/sovereign-platform-template.git
              revision: master
              directories:
                  # Namespaces and their Pod Security Admission profile, per ADR-0200. First in the base tier, at sync-wave -1 in it.
                  # PSA is an admission check, so a namespace labelled after its pods are admitted governs nothing.
                - { path: "infra/helm/platform/namespaces" }
                  # The default StorageClass, per ADR-0200. It is in the base tier, so it always comes before the data tier. A PVC
                  # created before a default StorageClass exists stays Pending. Nothing binds it again when the class appears.
                - { path: "infra/helm/platform/local-path" }
                  # Admission control, per ADR-0104. It is in the BASE tier, because admission
                  # runs once, at creation. A policy that arrives after the workloads it gates
                  # has already missed them.
                - { path: "infra/helm/platform/kyverno" }
                - { path: "infra/helm/platform/sops-operator" }
                - { path: "infra/helm/platform/cert-manager" }
                - { path: "infra/helm/platform/network-policies" }
                - { path: "infra/helm/platform/resource-governance" }
                - { path: "infra/helm/platform/temporal-worker-controller-crds" }
                # CILIUM AND ARGO CD ARE NOT HERE, in any tier, on purpose. Neither can be installed by the thing that needs it
                # first. No pod schedules before the CNI exists, and Argo CD cannot apply its own first install.
  template:
    metadata:
      name: "{{ .env }}-platform-{{ .path.basename }}"
      labels:
        env: "{{ .env }}"
        app.kubernetes.io/part-of: platform
        app.kubernetes.io/component: "{{ .path.basename }}"
    spec:
      project: "{{ .env }}"
      source:
        repoURL: https://github.com/tabmadi/sovereign-platform-template.git
        targetRevision: master
        path: "{{ .path.path }}"
        helm:
          # The Helm release name is the chart basename. So resources get the same names under Argo CD as under a direct
          # `helm install <chart>`. A bare release name puts the app name in front of every resource name. That breaks
          # in-cluster DNS and cross-component references.
          releaseName: "{{ .path.basename }}"
          valueFiles:
            # First, so every file below can still override it. It holds the deletions of
            # upstream defaults that a wrapper chart's own `values.yaml` cannot express.
            # See the file's header.
            - "../../../gitops/platform/shared-values.yaml"
            # Generated: the repositories that the platform's charts pull from. Kyverno's
            # allow-list policy reads it, per ADR-0104.
            - "../../../gitops/platform/image-allowlist.yaml"
            - "../../../auth/kratos/values.yaml"
            - "../../../auth/oathkeeper/values.yaml"
            - "../../../gitops/platform/{{ .env }}/values.yaml"
          fileParameters:
            - name: 'kratos.kratos.identitySchemas.user\.v1\.json'
              path: "../../../auth/kratos/identity-schemas/user.v1.json"
            - name: oathkeeper.oathkeeper.accessRules
              path: "../../../auth/oathkeeper/access-rules.json"
            - name: seed.model
              path: "../../../auth/openfga/model.json"
            # The platform's signing public key, per ADR-0104. See `infra/auth/cosign`.
            - name: policies.publicKey
              path: "../../../auth/cosign/cosign.pub"
      destination: { server: "{{ .server }}", namespace: platform }
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
        retry:
          limit: 20
          backoff: { duration: 10s, maxDuration: 2m, factor: 2 }
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-stores
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/component: stores
  annotations:
    # Wave 2: after base, with the operator up, and after the secrets tier at wave 1 locally. So Postgres
    # finds its superuser Secret and does not fail with CreateContainerConfigError.
    argocd.argoproj.io/sync-wave: "2"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/syncPolicy
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - { env: dev,     server: "https://kubernetes.default.svc" }
          - git:
              repoURL: https://github.com/tabmadi/sovereign-platform-template.git
              revision: master
              directories:
                - { path: "infra/helm/platform/postgres" }
                - { path: "infra/helm/platform/seaweedfs" }
  template:
    metadata:
      name: "{{ .env }}-platform-{{ .path.basename }}"
      labels:
        env: "{{ .env }}"
        app.kubernetes.io/part-of: platform
        app.kubernetes.io/component: "{{ .path.basename }}"
    spec:
      project: "{{ .env }}"
      source:
        repoURL: https://github.com/tabmadi/sovereign-platform-template.git
        targetRevision: master
        path: "{{ .path.path }}"
        helm:
          releaseName: "{{ .path.basename }}"
          valueFiles:
            - "../../../gitops/platform/shared-values.yaml"
            - "../../../gitops/platform/image-allowlist.yaml"
            - "../../../auth/kratos/values.yaml"
            - "../../../auth/oathkeeper/values.yaml"
            - "../../../gitops/platform/{{ .env }}/values.yaml"
          fileParameters:
            - name: 'kratos.kratos.identitySchemas.user\.v1\.json'
              path: "../../../auth/kratos/identity-schemas/user.v1.json"
            - name: oathkeeper.oathkeeper.accessRules
              path: "../../../auth/oathkeeper/access-rules.json"
            - name: seed.model
              path: "../../../auth/openfga/model.json"
            - name: policies.publicKey
              path: "../../../auth/cosign/cosign.pub"
      destination: { server: "{{ .server }}", namespace: platform }
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
        retry:
          limit: 20
          backoff: { duration: 10s, maxDuration: 2m, factor: 2 }
