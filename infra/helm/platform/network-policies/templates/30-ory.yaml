## Kratos identity APIs: Oathkeeper reaches public 4433 for session checks, and only authz reaches admin 4434.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ory-kratos
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kratos
  ingress:
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: platform, app.kubernetes.io/name: oathkeeper }
        # The frontend, for `/sessions/whoami` on a PAGE render, per ADR-0400.
        - matchLabels: { k8s:io.kubernetes.pod.namespace: platform, app.kubernetes.io/name: frontend }
      toPorts:
        - ports: [{ port: "4433", protocol: TCP }]
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system }
      toPorts:
        - ports: [{ port: "4433", protocol: TCP }]
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: platform, app.kubernetes.io/name: authz }
      toPorts:
        - ports: [{ port: "4434", protocol: TCP }]
    # The orgs WORKER only. The server never calls Kratos.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: platform
            app.kubernetes.io/name: orgs
            component: worker
      toPorts:
        - ports: [{ port: "4434", protocol: TCP }]
  # No egress rules. The baseline in `00-baseline.yaml` already grants Kratos everything it needs: DNS, reach inside
  # the namespace to Postgres and the orgs registration webhook, and the API server.
---
## Oathkeeper, the edge auth gate. Traefik forwards through the proxy on 4455, and
## queries the decision API on 4456.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ory-oathkeeper
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: oathkeeper
  ingress:
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system }
      toPorts:
        - ports:
            - { port: "4455", protocol: TCP }
            - { port: "4456", protocol: TCP }
