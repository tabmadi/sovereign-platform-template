# Local Gateway Application (ADR-0305). Same env-agnostic edge config (Traefik middlewares + cross-cutting
# IngressRoutes from infra/gateway) the prod app-gateway.yaml applies, synced locally by the local root-app.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-gateway
  namespace: argocd
  labels:
    env: local
    app.kubernetes.io/part-of: gateway
  annotations:
    # services (5). See infra/gitops/local-bootstrap/appset-platform.yaml.
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: local
  source:
    repoURL: https://github.com/tabmadi/sovereign-platform-template.git
    targetRevision: master
    path: infra/gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry:
      limit: 20
      backoff: { duration: 10s, maxDuration: 2m, factor: 2 }
