# Traefik middlewares (ADR-0305). These replace the deleted Tyk SecurityPolicies (infra/gateway/policies/): the
# edge validates identity via Oathkeeper ForwardAuth, throttles auth-sensitive routes, and stamps static
# browser-security headers on every response.
---
# ForwardAuth → Oathkeeper decisions API.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oathkeeper-forward-auth
  namespace: platform
spec:
  forwardAuth:
    address: http://ory-oathkeeper-api.platform.svc.cluster.local:4456/decisions
    authResponseHeaders:
      - X-User-Id
      - X-Org-Id
      - X-Roles
      - X-User-Email
---
# Anti-spoofing (ADR-0305, ADR-0306).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-identity-headers
  namespace: platform
spec:
  headers:
    customRequestHeaders:
      X-User-Id: ""
      X-Org-Id: ""
      X-Roles: ""
      X-User-Email: ""
---
# Rate limit for auth-sensitive routes (login, signup, recovery). Per source IP.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: auth-ratelimit
  namespace: platform
spec:
  rateLimit:
    average: 10
    burst: 20
    period: 1m
    sourceCriterion:
      ipStrategy:
        depth: 1
---
# Static browser-security headers applied to all responses (ADR-0305, ADR-0400).
# The per-request CSP nonce (script-src) is set by the frontend; here we set
# only the directives that never vary per request.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: platform
spec:
  headers:
    contentTypeNosniff: true
    referrerPolicy: strict-origin-when-cross-origin
    stsSeconds: 63072000
    stsIncludeSubdomains: true
    stsPreload: true
    customResponseHeaders:
      Content-Security-Policy: "frame-ancestors 'none'"
---
# RFC 9457 problem details for the edge's own errors (ADR-0305). A generated client has ONE error branch, and that
# only holds if a denial from the edge looks like a denial from a service.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: problem-json-errors
  namespace: platform
spec:
  errors:
    status:
      - "401"
      - "403"
      - "429"
      - "502"
      - "503"
      - "504"
    service:
      name: edge-errors
      port: 80
    # `{status}` is substituted by Traefik with the intercepted status code, so one
    # rule serves every document without a middleware per status.
    query: "/{status}.json"
---
# Strips `/auth` before the request reaches Kratos, whose own paths start at the root (`/self-service/...`).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-auth
  namespace: platform
spec:
  stripPrefix:
    prefixes:
      - /auth
