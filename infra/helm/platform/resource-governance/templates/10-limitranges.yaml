{{/*
LimitRange per namespace (ADR-0204): the safety net that makes "every container declares resources" true
without forking every third-party chart. `default` and `defaultRequest` apply only to containers that omit
them, at admission, so existing pods pick them up on their next rollout. `max` is deliberately not set.
*/}}
{{- range $ns, $cfg := .Values.limitRanges }}
{{- if $cfg.enabled }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: resource-defaults
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: resource-governance
    app.kubernetes.io/part-of: platform
  annotations:
    # Wave -4: after the PriorityClasses, before the ResourceQuota. A quota that
    # lands first rejects any pod the LimitRange would have defaulted.
    argocd.argoproj.io/sync-wave: "-4"
spec:
  limits:
    - type: Container
      # Memory limit only, no cpu limit — ADR-0204's decision, applied to the
      # default too so an undeclared container behaves like a declared one.
      default:
        memory: {{ $cfg.defaultMemoryLimit }}
      defaultRequest:
        cpu: {{ $cfg.defaultCPURequest }}
        memory: {{ $cfg.defaultMemoryRequest }}
      # NO `min`, and this was learned the expensive way rather than reasoned from first principles. An earlier revision
      # set min.memory: 16Mi as a cheap guard against typos.
{{- end }}
{{- end }}
