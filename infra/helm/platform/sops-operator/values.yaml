sops-secrets-operator:
  # `restricted` (ADR-0200). The chart ships a complete, correct security context and leaves it switched OFF; both
  # halves are turned on here rather than hand-written.
  securityContext:
    enabled: true
    container:
      enabled: true
      customContainerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
  secretsAsFiles:
    - name: sops-age-key
      mountPath: /etc/sops/age
      secretName: sops-age-key       # contains keys.txt provisioned by Ansible at cluster bootstrap
  extraEnv:
    - { name: SOPS_AGE_KEY_FILE, value: /etc/sops/age/keys.txt }
