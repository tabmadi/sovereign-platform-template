# Services ApplicationSet, per ADR-0201. A git-directory generator reads the per-environment values files. There is
# one Application per service per environment. A service onboards itself when its values file lands in master.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: services
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: services
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  # A manual pause of auto-sync must survive this ApplicationSet's own reconcile.
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/syncPolicy
  generators:
    - matrix:
        generators:
          - list:
              elements:
                # Sync windows, such as staging's 05:00 UTC gate, live on the
                # per-environment AppProject, not here. See `bootstrap/appproject.yaml`.
                - { env: dev,     server: "https://kubernetes.default.svc" }
          - git:
              repoURL: https://github.com/tabmadi/sovereign-platform-template.git
              revision: master
              files:
                - { path: "infra/gitops/services/{{ .env }}/values/*.yaml" }
  template:
    metadata:
      # `filenameNormalized` keeps the extension, so it produces `dev-service-orders.yaml`. That name says which FILE
      # generated the resource, not which service it deploys. It breaks the `<env>-<tier>-<component>` naming that
      # ADR-0201 fixes.
      name: '{{ .env }}-service-{{ trimSuffix ".yaml" .path.filename }}'
      labels:
        env: "{{ .env }}"
        app.kubernetes.io/part-of: services
        app.kubernetes.io/component: "{{ .path.filenameNormalized }}"
    spec:
      project: "{{ .env }}"
      source:
        repoURL: https://github.com/tabmadi/sovereign-platform-template.git
        targetRevision: master
        path: infra/helm/service
        helm:
          valueFiles:
            # The environment-wide file comes first, then the service's own file, so the service file wins. The shared file
            # holds anything true of every service in the environment. One example is the registry's pull credential.
            - "../../gitops/services/{{ .env }}/shared.yaml"
            - "../../gitops/services/{{ .env }}/values/{{ .path.filename }}"
      destination: { server: "{{ .server }}", namespace: platform }
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
        # Retry on failure. Automated sync with selfHeal does not run a sync again after it failed
        # on the same commit. Without this, a short repo-server or network outage parks the
        # generated app until a manual sync. Backoff stops growing at 2m, per ADR-0201.
        retry:
          limit: 20
          backoff: { duration: 10s, maxDuration: 2m, factor: 2 }
